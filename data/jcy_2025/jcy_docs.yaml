  文档内容正文: '热成像八段锦

    人的生机来自于哪里？气血。

    气血充盈，百病不生，气血虚弱，外邪乘虚而入，疾病，焦虑，压抑等由此产生。

    气血是什么，中国人最容易感悟，

    举个简单例子，气血就是大领导。大领导关注和指示的事情，才能办好，你指望地方是自动自发，很快就懈怠了。

    你手脚冰凉，就是因为大领导气血，没有深入基层去监督办事，没去送温暖。

    中医可视化技术是国家中医药管理局国家级科研课题，曾忆城引入红外热成像技术，将检测到的人体发出的红外线辐射转换成温度，并以八种颜色将温度分布图像显示出来，直接“看出了”人体的寒热温凉，气血搬运和变化。

    事实证明八段锦的导引效果非常显著，

    红外热成像显示，

    习练后，劳宫穴温度上升2.3±0.5℃，提示手厥阴心包经能量传导增强。

    太溪、关元等穴位微循环血流量提升40%，印证“以形导气，以气通经”理论。

    “攒拳怒目“通过肝主筋理论疏解郁结，临床测定可使唾液皮质醇浓度下降28%.

    “背后七颠“激活足少阴肾经，调节下丘脑-垂体-肾上腺轴，改善焦虑量表(GAD-7) 评分达34%.

    八段锦最早来自于1973年长沙出土的马王堆《导引图》，

    44个动作印证八段锦与先秦方仙道呼吸吐纳术的渊源。

    所以各位，如果你想长期稳定的改善身材的肥胖走型问题，身体的长期问题，心理的焦虑，紧张，

    尤其是很多人的失眠，早醒，睡不好等问题，

    习练八段锦是最佳方式之一，

    因为他让你回归的是自我和能量的本源。

    西游记第二回讲的长生大道，

    题目是，

    《悟彻菩提真妙理，断魔归本合元神》。

    你不慢下来，心情放空放松下来，怎么能去感受自己的心情，去合元神呢？

    为什么撸铁冠军没有长寿的，老了容易痴呆？伤了元神了。

    所以太极越打越慢。

    金刚功就是八段锦的延伸和变种，更适合中青年。

    我们都听过一句段子，

    “一粒金丹吞入腹，我命由我不由天”。

    金丹是啥？

    你练完八段锦金刚功后的口水。

    术语讲就是益生菌。

