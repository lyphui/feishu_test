    一线电池（如宁王）扩到二线电池（如亿纬，欣旺达，国轩，鹏辉），电池扩散到设备（如先导，杭可，赢合），设备扩散到正负极材料（如裕能，富临，当升，等），材料扩散到氟化工（如天赐，多氟多，巨化，璞泰来等）化工还有些反内卷属性。

    电池继续会带动光伏，核心是逆变器，阳光，德业，锦浪三家足够，其他的光伏配件设备太卷。

