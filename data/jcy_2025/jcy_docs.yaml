  文档内容正文: '分歧继续，机会继续

    大盘今天挑战10连阳难度很高，

    其实也不关结构牛的事，

    商业航天会继续大分歧，前期的游资量化股已经掉队，航天字头的也快跟不上了，

    机构开始接管这个领域。

    既然机构接管，那要么看你是股东，你真投了蓝箭，天兵，星河等，要么看你有业绩，这里就是SpaceX供应商。

    果链完了炒T链，T链完了炒达链，达链完了炒谷歌链，谷歌链之后炒X链。

    昨天把两个“要么”已经谈的很透彻，同学们可以自己研究和挖掘。

    然后有两个供会操作的同学们看的，产业二线交易价值，

    卫星必须减重，国内碳纤维玩家能上台面的就5家，中航高科，光威复材、中复神鹰、吉林化纤、中简科技。

    吉化东北公司pass，中复神鹰主要是民用，规格主要是T1000以下，光威比较均衡，它军工航天，风电一起做，

    乖离率不夸张，但已经上去了。

    还有个玩家是中简科技，它是国内极少数能量产ZT9H，也就是对标国际T1100级宇航级超高强度碳纤维的企业，它的毛利非常高，专业做航天材料。

    技术图形按照《三生万物》模型，你一对比即知。

    碳纤维材料的这轮龙头是光威，情绪看它就行。

    另一个是苏州高新，这个专门问过他们，周末晚上给忘了，苏高新自己没什么看头，旗下有一个东菱振动，给上太空的要提供振动台测试，航天科技的上海八院非常认可它们，东菱一年的利润能有几千万，结果一不留神它涨停了该是等等为好。

    今天较大概率，商业航天的分歧会带下来大盘，那会再看谁能抗资金往哪分流也来得及。

    meta最近动作频频，

    它的光模块供应商剑桥。

    评论区：

    牛魔王：大王同步，商业航天已经边打边撤退了，从11月底几乎满仓平铺再里面此起彼伏，获益颇丰，待退潮再来看裸泳的是哪些，真正的冲浪者也就清清楚楚了

    南院大王 回复 牛魔王：古老的套路再一次重复：缩圈，仅剩几家，分流，去别的领域'
