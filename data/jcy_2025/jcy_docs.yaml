    匿名用户提问：大王好，两年我从十八线城市的民办学校转到公办学校（体制内），现在机缘巧合，地级市市直学校的校长（市名校长，之前了解，接触过一两次！）找我说，一方面给我解决编制（国有民办，非正式编制，即报备员额制）；另一方面经济待遇保障有80W（是我现在公办的两倍多）。

    我自己的的思虑：

    一方面，现在两个孩子7、8岁，我觉得需要更多的陪伴和引领；夫妻关系也非常和睦（我从外地到本地），我珍惜当下的一切。

    另一方面，感觉自己又到了瓶颈，虽然市级名师有了（刚刚评上），三到五年内，可以有正高特级（评上必须在当地服务满八年）。而，现在邀约我的名校长（市名校长，所带学校脱胎换骨，且其本人理念先进！），非常有才情，有很多值得我学习的地方！

    现在的我，个人的专业研究能力有限（真正走学科特级，不见的能够有优势，也就是说职称评审可以有，但是影响力一般），但是执行力强，愿意思考总结，在现有的平台（县一中副校长，觉得没有发挥的空间），觉得瓶颈明显。

    老局长把我招录过来，但他因各种原因，刚刚退二线了！新局长，接触过几次，是乡镇书记出身，安全至上，不提革新！

    我很纠结！

    如果就在现在的公办单位，虽不喜欢体制内的内耗，但看到了各种问题的存在，只要有一把手的机会，我想为（也应该可以）地区的教育做点贡献（毕竟，现在拥有的一切都是本地区给我的）；但是，新局长，我没有一点把握可以走到一把手的位置。

    如果，走出去，我不担心自己的就业或者生存（有省优质课一等奖，教学有自信！），但是孩子在这个年龄段，特别需要陪伴，老婆是体制内（比我小八岁，比较黏我），我又很犹豫？

    各方的权衡利弊，还请大王指点迷津？

    我记得你，如果再年轻十岁，坚决支持你去，但现在战线太长，劳师远征。第一，算经济账，市里的80和县里的40到手差不多，甚至还低。市里的80能拿多久？第二，算感情账，孩子家人的情绪价值多少钱。第三，算前途账，你现在一中副手，有基本盘，到市里从零开始，马斯克帮特朗普你也看到了。

    你感觉发挥不出来：1，和新局长多走动，乡镇杀出来的都不简单，不要急于下结论。2，凭你的资源圈子，接触到副县长县领导不是难事，处起来，发挥价值，给上级印象。3，空余时间多去进修，拿奖，发C刊，党报，读个在职硕博士之类。总之，以自己基本盘和提升影响力为主，先往一把手校长运作，再往教育局领导方向去走。从专业干部，变成综合干部和正治干部。与其说是事业瓶颈，不如说是角色认知瓶颈。有县城婆罗门好做，就别去市里做牛马了。

