    反内卷和英伟达扩散研究

    之前的文章被和谐，调整后再发一下，

    第一，光伏调整的时候很多人怀疑，我们跟大家讲，这不是一日游，迟早会成为板块。

    主打是光伏，后面会延伸到电池，碳酸锂，风电，猪。

    光伏目前就看最卷的硅料和玻璃，硅料最卷是通威，大全，港股协鑫，玻璃最卷的福莱特，金晶科技，东日等。

    PCB如果没有早入胜宏生益景旺之类错过50%，踩空的主力现在搞电子布和铜箔。

    电子布代表作，宏和科技，国际复材，生益科技等，有几个反正也买不到，有点预期差，但弹性不够大，同时兼备电子布，军工，导弹，核电概念的，菲利华。

    菲利华最大的问题是里面的机构过多，有利有弊。

    铜箔是德福科技，广合科技，铜冠，金安国纪等，

    光模块照旧，易中天太辰光和后面那些，低市盈率的迟早上来，

    今天可能铜缆里继续会流入，

    位置低，就是王道。

    铜缆谈过，沃尔核材，瑞可达，兆龙互联等，我们熟悉的老朋友博创，之前主营的是铜缆，收购的长芯后进一步深化光模块/光引擎领域，

    还有一个开发出北美市场预期的，联特科技，

    弹性大风险也大，仅供超超高手品鉴。

    以上仅供学习，自己不够眼疾手快和分批次玩低吸的，如果是新手菜鸟，还是看确定性更好的游戏，创新药等，ETF更稳，如游戏etf,港股创新药ETF。

    更更稳是你在绿盘时吸保险做T，新华是投资本市场里最激进出钱最多的。

    当然，以上板块不是天天涨，机构的做法，总要调整，进退进进，所以不要追高和上头，跟着轮动走。

    要搞你擅长的，有手感的，能让你赚的总让你赚。

    反内卷只是刚开始，

    后面还会有。

    “取得一定成效”、

    “取得积极成效”、

    “取得成效”

    “取得显著成效”。

    最终，

    “获得圆满成功”。

