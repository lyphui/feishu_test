  文档内容正文: '提问与核心观点

    上善若水提问：晚上好，大王。这是上午问题的延伸，追涨杀跌太累了，我想定投两家公司，不少人应该也有这个想法，计划定投5-10年，甚至20年，希望能得到大王“上帝视角”的建议。以我对国内产业格局的分析，远远不够，也没有这个自信。麻烦之处，不胜感谢。祝大王及身边所有人安康吉祥。

    南院大王核心观点：之前老生常谈，这里总结一下。若中国成为世界第一，或站稳老牌第二的位置，以下公司必然绕不开：

