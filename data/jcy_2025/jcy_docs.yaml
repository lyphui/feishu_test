    语不惊人死不休

    一早上铺天盖地的新闻都是，

    马斯克说， fake假的。

    其是马一龙是对什么讲的，一个名不见经传的小公司，说要部署1万台马斯克的擎天柱。

    马斯克当然说主页假的，一个制造企业在自家农场搞这么多，你哪来的钱，企业说部署的是 Optimus V3，实际上马一龙连 v2.5都没造出来。

    但国内的媒体非要故意解读为，

    马斯克说T链机器人是假的。

    一下把市场情绪带崩，

    本来，券商+机器人+低位消费（旅游）。构成冲击3900的主力。

    现在是券商不让涨，机器人代表的科技高位被套，旅游也就西域旅游之类表现下，大盘当然乏力了。

    上午讲如果看到缩量和不强修复要减仓，如果没减，以下注意，

    1，机构仍然在扛，易中天胜之类的都属于逆势，天孚在20日线商反弹，资金在华为线和《光通讯》那章去更强的抱团。

    2，游资和量化溃散，高位的首开，金发，上海建工等大跌，它们扭头去买了马字辈。

    3，游资崩了后各种乱窜，就是不想去科技里抱团，因为那是接盘，但估计是迟早的事。

    4，机器人当然属于错杀，尤其是t链，大跌后站稳5日平台依然可以进，图形参考8月1日到10日的宁王，之前嫌机器人高，这不是给你砸下来了吗？不绿不买。

    5，有没发现搞来搞去，不如趁暴冰点低吸，扶一把校花跟着主力抱团，

    6，准备迎接一周左右，3个点上下的调整期吧，只是调整，牛市没完。

    后面可能有段时间，创业板指要跑不过恒生科技指数了。

    一再讲9月很多人是跑不过恒科的，不信的试试。

    这段时间，就看谁能扛，继续抱团不散，10月的大涨就指望他们了。

