    杠铃市场

    市场就是两端，

    一端的高科技和成长股我们不提了，涨的快，有体验，特点是起伏大，难度高，体验不好。

    一端是银行组成的高股息，主力高度控盘，涨的慢，没快感。

    昨天很多人投降买了银行，结果银行今天给你来个冲高回落。

    机构买银行看什么？股息率，4%的分红和回报太难找了，资产慌。

