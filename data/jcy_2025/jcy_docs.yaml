    三浪分析及各板块探讨（上）

    如果你是老投资者，应该知道当年“国泰君安”的合并，国泰君也安。

    结果合并完，境外势力联合内鬼，千骨跌停，2015骨灾。

    这一次再度放开，是要再出发，如果你了解双子座，就知道什么3600点根本不是目标，得照着4000去，时间而已。

    几个板块分析。

    1，稳定币（券商）。国君拿到了牌照，其他家拿不拿？谁还没个招呼？

    券商是旗手，但也是渣男，弹性更大的是券商IT和金融科技，尤其是带CIPs跨境支付概念的。

    稳定币用说了很久，如果没有前排跨境概念海联、四方等的先手，可以看后面的券商IT和金融科技，比如恒生电子、中科金财、金财互联、赢时胜等IT，或者先进数通、飞天诚信等服务商。

    这里有20cm的更好，以及选，只要券商涨，它们大概率会跟。

    2，半导体：如果券商撂挑子，大盘的任务就轮到这祖训板块，半导体看设备，尤其是盛合晶微概念的，SOC是业绩板块，MCU是替代板块，都有机会。MCU的核心就纳芯微，soc那几个都熟，小米眼睛可能催化一波，既有算力，又有Ai眼睛还带点游戏的，是协创数据。

    3，业绩板块，目前是游戏，风电。以及港股创新药。

    4，海外算力：在PCB，光模块/引擎，电源液冷间切换，英伟达历史新高了，供应链肯定上去。

    如果不会操作，趁绿盘分批次躺进新华保险，或者港股创新药ETF，游戏也可。

    不要追高，机会多的是，大A永远有你上车的机会。

