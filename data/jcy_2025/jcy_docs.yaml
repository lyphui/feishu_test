  文档内容正文: '万物生长

    上午一个冲高回落，

    商业航天的主力大举出货。

    这就是周一讲的，昨天，今天是重大分歧，等分歧完了你再看谁能扛。

    这个板块当然不会完，后面还有二波，三波，我们到时再从库里扒拉。

    主线当然是光，电，有色。

    有色里的钴，盛屯新高了，铝的云铝快涨停，神火快新高，今天早上哪个同学

    问的永太，也是短缺逻辑。

    光的冲高回落不改趋势，又没什么套牢盘，就是猛洗，校草也一度摸到了728的历史新高，大盘量能不够而已。

    剑桥也一样摸了144.

    ocs四小龙也是市盈率最低的，回踩20日线的赛微先拉起来。

    同样的还有液冷英皇，飞龙，在这种冲高回落下，算是能扛的了。

    后面，如果有一个业绩或者小作文就能至于国产芯片，你说为和看好寒王。

    你懂的，他跟甲方多喝过5年酒，多唱过5年歌。

    技术图形也是长短均线的收敛粘合。

    分流出来的资金去了哪？机器人。

    你会发现其中强的，是我们周一讲了回踩买点机构且放量上两家的tier1的浙江荣泰，三花智控，图形非常经典。

    机器人能看吗？别人可能还怀疑，我们说能的，当然略再往下调调，力度大点更好。

    原因何在？拥挤度的问题，

    商业航天已经占市场成交额

    20%-25%,机器人大约只有5%左右，机构补仓，一天也买不完的。

    机器人后面看谁？要么特斯拉链。

    要么长短均线粘合向上，且今天放了量的，一抓一大把。

    万物生长

    昨天下午的复盘和谐了吗？

    商业航天的分歧预期之中，

    因为它的成交占比已经20-25%，每天5000多亿。

    支线的极限是20%左右，主线的极限是40%左右，因为你吸血吸不动了。

    资金去了机器人，机器人能看吗？能。

    因为它的日成交占比，已经跌到了5%左右，这是历史低位，十分的不拥挤。

    昨天资金大幅进场，也不用担心，机构一天是买不完的。

    第一，先说机器人。

    今天市场如果低开，调整，好机会。

    1，确定性最强的头牌，是周一再次讲的几个tier1.

    浙江荣泰，三花智控，还有个当时未放量的拓普。

    气氛和情绪，就看这三个带动。●

    如果开的太高咋办？

    潜在的tier1恒立液压，也是机构偏爱品种，只是不一定有那么刺激。

    2，价格量比较大的，是减速器，绿的谐波，双环等，这在国内有大量企业做。

    3，高价值量的环节，是空心杯电机，灵巧手等，比如鸣志电气，震裕科技，兆威机电，这几个中还有其他的兼营业务的更好，安培龙，6维力矩传感器，34日线刚拉上来，恒帅股份正在做Optimus的手指关节电机。

    新三板有个骏创科技，强调一下普通人就别去了，普通高手也别去。

    简单粗暴是机器人etf159530，首席重仓正是前两天有同学问的双环传动。

    第二，科技。

    依然看英皇代表的液冷，对达链谷歌链的带动，主线体现了强大的韧性，起码商业航天那波也没吸动。

    第三，高手可以看传媒了，尤其是叠加字节和豆包概念的，今年春晚是抖音赞助，体现了互联网从阿里的支付，腾讯的社交，进化到抖音的自娱自乐。

    哦对了，国产芯片和设备是一直看好的，市面有传言要求50%的国产化率。

    25年收官

    上周末说，这个礼拜的意象，是火地晋。

    火是啥？科技，传媒。

    恰值蓝标等一大票人回踩34日买点结构。

    其他的什么易点天下值得买之类的我们也熟悉。

    至于商业航天，周一二大分歧后，剩下的只有利润垫最厚的游资和机构了，昨天其实瀚讯既然是扛着了，相对于中国卫星简直没涨，那当然有机会。

    昨天提的中简科技也差不多是机构看好，专门给航天科技集团供材料的，常州的公司，中科院背

    景，一个了解情况的老哥说，董事长像大王一样优秀，汗颜…

    至于金风科技，专门数次回复过大家，也在文章里讲了，

    它是在蓝箭航空里股份最多的，鲁信创投只有1%左右还连续拉板，何况金风呢？再说它的风电主业也不会差。

    后续呢？当年和而泰参股摩尔线程是怎么走法？金风体量太大没人家那么猛，起码也不会差吧。

    其实最好的时机是你昨天收盘进。

    再说说今天的机器人，大阳之后的回踩，很经典，很多34和55，60进一步粘合，能算是买点。

    其他的光电等主线，机构早早都下班了，留下有色交易员扛扛就行。

    为啥早早下班，今天是周末加元旦跨年，北上广2点钟路上就开始堵了。

    2026，主线依旧，支线精彩，明天会更好。

    2025年最大的收获是什么？

    你已经基本摸清了市场的风格和套路，对主要的玩家和流派有了基本掌握。

    有了这个，行稳致远。

    家人们来年再战！'
