    不用太担心        28号的上次发错了，补上

    本来的抵抗式消化，碰到突发的懂王要加税，大A被港股绑架只能跟风。

    之前主线累积的获利盘闻风而跑，踏空的资金也在港股拼命做空终于砸了下去。

    熊市多长阳，牛市多暴跌。

    今天的大跌极大释放了动能，后面的科技又会给出机会。

    我们就拿最近讲会砸出坑的算力租赁来说，谈一个技术。

    国资算力租赁公司，从1008开始，

    盘整到2.21日才突破（第一个箱体），

    刚刚三根大阳线涨20%，进入主升浪准备获利（第二个箱体），

    迎头碰到市场大调整，闷头砸下去19%.

    主力根本没赚到钱，它也跑不了，它只能用力砸盘，尽量多收集筹码。

    为什么说主力没跑得了，时间空间都不够，量也不够。

    看下面的成交量，上涨有量，下跌无量，砸下去12%，没什么筹码出来，说明跟着大力洗盘。

    这个仅为示例，类似这样的具体标的还有很多，大家下周可以慢慢研究。

    今天大跌之际，趁机用了中国人自己最古老的算法，算力耗费最小的大模型，易经，把最近6天，上证的阴线阳线输进去，测了一下走势。

    得出卦象，天雷无妄，

    今天的大跌，无妄之灾啊，懂王这小子，要趁两会开的第一天加税。

    变卦呢？水地比。

    卦辞说，

    “比。吉。原筮，元永贞，无咎。不宁方来，后夫凶”。

    翻译是，

    测算，吉利。

    再次测算中期，依然是大吉大利。

    再卜问长期的吉凶，也预示着无灾祸，吉利。

    那些不安定的邦国纷纷来朝，而迟迟不来归顺的则会有凶险。

    非常应景，如图四。

    比卦，现实中就象征着亲附与团结，兄弟们合伙干翻对手。

    下跌是为了更大的上涨，

    水火锻造，大器方成。

    比个心吧，周末快乐！'
