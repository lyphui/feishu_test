    同频共振

    现代人生活在钢筋水泥的世界中，被各种烦恼和压抑和PUA包围，

    很多人变的谨小慎微，顾虑重重，畏首畏尾，平日里胆气不壮，心气不畅，手心不热，心虚气短，惊慌失措，甚至晚上害怕，睡不好，不舒展。

    这时候，需要像豫卦一样，用雷声唤醒动力，激励自己。

    没有雷声怎么办？听鼓声。

    远古曾经有神兽“夔”，形似壮牛，吼声如雷，

    黄帝大战蚩尤时，为了鼓励大家的勇气，先去东海杀了夔牛，制作了八十面大鼓，杀的蚩尤大败。

    网上有很多敲鼓的视频，如果你感觉到怯懦，胆小，惶恐，疲惫，困乏，

    要多去听鼓声，每天来个10分钟，

    鼓声如雷，雷声是激活生命和击败软弱的最佳方式。

    在中医看来，鼓声入肝胆，健脾胃，升阳气，是“五音入药”，

    所以孩子小时，会有专门的玩具“拨浪鼓”，促进健脾消食升阳。

    李世民的“秦王破阵乐”，本身是鼓乐，碰到各种烦心事去打一通，什么焦虑都给你震散了。

    中国人赛龙舟，舞狮子，那必须敲鼓，

    民族和血脉深处的尚武和独立精神。

    有朋友买了个理想的大SUV，说后排放什么，买几根鱼竿，周末去钓鱼，

    大王说，你有没听过《中年男正走向慈祥》，中国那帮人写山水，都是生活不得意，

    你这种性格和事业周期，钓鱼是自欺欺人，坐那边思绪如麻，弄不好憋成内伤，

    你要的是CD时间，冷却技能，回去接着干，

    怎么办？

    买一面鼓放后排，周末开到没人的地方使劲敲，把情绪全发泄掉，能量全补起来。

    澎湃一番，你归来仍是少年。

