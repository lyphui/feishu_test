  文档内容正文: '双轮驱动的下一阶段

    第一，先说下双轮驱动的科技，

    科技是一个调整期，因为大家觉得AI泡沫很高，

    英伟达和openAi的连环套是骗子，

    但我们的看法呢？

    人工智能是东西大都下了重注的，没有办法走回头路，双方只能砸钱，谁都承受不起落后的代价。

    如果你拿着海外算力的核心品种，未能看技术在跌破箱体和5日平台走人，不妨耐心的等英伟

    达连续新高后，涨到大家相信为止。

    美国的光模块coherent，中文叫高意，走势如图，它能力不如易中天的。

    当然，你如果有自己的操作纪律，就是重要均线流或者平台流，那要坚持自己的，跌破就走，站稳再进。

    目前依然看好中芯系国产半导体设备和国产芯片，直到三季报海外算力爆业绩。

    第二，再说一下反内卷，

    昨天商务部海关连续发文，管控了一堆东西，

    在国际市场上也要建立护城河，不要自己打来打去。

    三个东西，金刚石，稀土，电池。

    金刚石不看了，都太贵。

    稀土，不是中国稀土那些矿，基本也买不到，设优势的是大地熊等那些产品，真正禁的是冶炼有备，中色股份干这个，市盈率也不高。

    风电是我们一直看好的，金风科技有金力永磁的股份。

    电池是重点，

    条文规定是，

    电池能量密度不得超过300Wh/kq（含电芯和模组）、磷酸铁锂压实密度≥2.5q/cm3.克容量不超过156mAh/g、富锂锰基材料（下一代正极）。

    通俗的说，锂电的“高端制程”不卖，又轻又快续航又久的电池不卖，卖给你短续航的，容易起火爆炸的。

    直接利好谁。电池头部玩家。宁王亿纬欣旺达。

    负极材料，璞泰来，中科电气，翔丰华（利润不好），新三板有个贝特瑞。

    负极上游材料：信德新材，负极包覆剂，（图形不好）。元力股份，多孔碳吨。

    下一代正极：当升，湖南裕能，尚太科技（市盈率不高），做铁锂的富临精工，还有机器人概念。

    普通人逢调整上昨天说的etf能跑赢大部分个股和同行，另一个159769也行。

    核心还是要有业绩，没业绩的公司，你进去被套了扛不住，有业绩的一个催化就起来了。

    多年前大王讲的，电新是中国特色优势产业，是印钞机，我们要学会卡老外脖子，甚至给上面上书写材料，终于实现了，不容易啊。

    评论：159769，搜不到，是不是代码打错了？

    评论：159796我买了

    等待下周的反弹

    本来市场是两轮驱动，

    一轮科技，主要是半导体装备。

    一轮新能源，主要是电池。

    现在科技不让涨，触发300倍pe的限制，

    电池不好涨，搞了出口管制，

    杠杆资金就会出逃了。

    出口管制，短线是乍一看不让卖了。

    中线呢？不是不让卖，是批文式发售。

    大厂可以涨价拿到文件，小厂彻底关上门。

    但国际资本害怕不确定性，港股先跌为敬，大A跟随。

    既然，新能源熄火，AI你们又觉得是泡沫，指数回调就难以避免。

    先说一下科技，

    当然没有走完，

    但总要洗的你难受，洗的你接受不了。

    今天有资金是进入海外算力的，比如xys，死扛了一天还是绿了。

    海外算力今天算是在硬挺。

    后面是要看别人带，

    比如英伟达突破200。

    科技就是，越是核心的越能扛。

    国产芯片当然也没走完，但得消化一下300倍市盈率这个事，既然不让两融，那就等跌穿300倍或者业绩起来降低pe，所以后面看业绩和消息催化。

