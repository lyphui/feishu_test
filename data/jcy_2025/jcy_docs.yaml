  文档内容正文: '机构的继续进场与下一阶段走势

    机构然仍在持续进场，上涨中避免不了要调整及牛市暴跌的客观规律，但我们之前谈过的逻辑，仍然在不断兑现，深化。

    结合现实情况跟大家复习并更新下。

    一、国产算力。

    1，寒王海光代表的AI芯片，会继续扩展到云天，芯原，翱捷等代表等代表的各种ASIC芯片，下一步扩展到SOC，如瑞王，恒玄（相对不高），炬芯等，以及MCU存储等，纳/思，代表的几家。

    轮到国产线必然是，各种GPU，CPU，NPU，DPU，FPGA等芯片全部炒一遍，芯片才是核心。不知道它们是什么，隔壁进阶课192课芯片课。

    （在芯片延伸中，会往打铁的装备领域进攻，这里先进封装有点寒王概念的是甬夕电子，588710全是打铁的，手里有光刻机的继续拿着，它的核心是光学零部件）。

    芯片继续，会到服务器的环节，我们熟悉的是紫禁之巅最后的曙光，以及浪潮等，并延伸到AIDC和国资云。

    目前，大家说的“弘狗”代表的等几个AIDC，单看位置都不算高，弘已经偷偷摸摸涨了20%，协创不低也不算高，还有端侧AI概念，你要追求刺激和前排，和而泰。

    同步的国资云，牛哥首都哥那几个我们都熟，也在启动，单看线也不算高。

    国产线极大可能是下一段市场的主线，且刚开始，

    之前为什么给大家反复讲配得感，这种市场你拿的东西，尤其前排的，图形没问题的，可以做t但不要轻易下车，你下去了就很难再上去。

    没仓位又风险偏好较高的，不要去追风口浪尖，会股票的可看后排Asic、AIDC和云，不会的有个大数据etf515400，但再次强调，它们大幅高开你别上。

    2,平行的，华为线依然沿着pcb光模块铜缆液冷电源交换机的价值量和轮动去看，都理论还有空间，

    之前有谁问过华丰，走势和技术上目前没看出毛病，当然给调整更好。

    生疼这块没有整机，整机的预期差高新发展(只建议超级高手看)。

    3,整个算力链，还有没可能倒车接人的机会？我们认为可能有的，

    比如液冷电源，之前的节奏被打乱了，周2晚PCB大哥胜宏，周4凌晨英伟达发财报，如果下杀，是建仓的机会。

    或者举例，液冷如果被它们带动，有20%左右的调整(很大概率不可能，有的不必慌)，那就是再给机会。

    到时候整个海外算力链都可能是机会。

    彼时AI应用如果砸了，几个核心也发完中报，也是机会。

    AI应用前文谈过。

    GB300的业绩和下一代的Rubin，还完全没有体现。

    所以新同学没仓位先学习或者轻仓试错的，可以等等看那时候的入手。

    很久前说科技板块四大低位领域，现在，

    -国产AI芯片及延伸，已上来不那么低了，硬说高也不是。

    -华为链，补涨中，

    -光刻机，创下新高，看催化继续，

    -AI应用，有机会，中报过了更好。

    （整个板块都有预期差）

    二，如果承受风险能力中间偏上，希望埋伏更低位，先轮动到一下的有个空间打底，是什么板块？机器人。

    安培龙不赘述，空心杯电机的龙溪，鸣志，兆威，雷利等还趴在地上，迟早轮动到，进入T链是重大方向，这里龙头是嵘泰，跟随是拓普。

    更稳健是机器人etf。

    另一条支线是金融科技的516860，其实是互联网券商，会给你绿盘甚至大跌机会，不用追。

    三，如果承受能力中间，你会在前文发现“绝对低位板块”，跌也不怎么会，但涨起来也不流畅，体验没那么好，收获和情绪价值不能都要。

    它们是外资喜欢买的领域，涨起来慢，但核心资产是它们最喜欢的。

    四，如果自认为中等，其实是中等偏弱，经验小于数年，新手又菜，不会股市，盘中一跌六七个点就要问，调整三天你就问逻辑结束了没有，严重建议恒生科技ETF作为超级基本盘，如513580，位置低公司好，美联储准备降息，海外资金会先进入港股，中报期都是你慢慢分几次进入的机会。

    不要总觉得消费不行、经济不行，那是你不行，你看看腾讯的优秀业绩，腾讯才是货真价实的大消费。

    五，接受力更弱的，每年有5%左右就可以，跌个2天就有点慌的，相当的仓位，-2%左右时看保险。

    以上仅供学习，不构成建议哈，

    你的风险偏好越高，可以看的越往前，偏好越低，看的越往后。

