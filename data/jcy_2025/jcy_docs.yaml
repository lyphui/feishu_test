  文档内容正文: '高标出货与主线行情

    第一，题材和概念股处于出货周期。

    之前反复跟大家讲，福建，海南，商超，商业航天等，都是游资量化打造的题材。

    游资量化，洪洞县里无好人，普通人是玩不过他们的，机构只有在分歧之后才慢慢进航天，分歧是什么时间？昨天的发射成功，回收失败。

    主力会慢慢低吸发射和卫星载荷，等它们跌到位，起码34日线企稳吧。

    短期有没机会？恐怕难，快过年了大家也不发卫星了，起码是周线级调整。

    第二，目前的市场你说好不好？主线很好，不在主线的体验很差。

    昨天起码跌了3500家吧？

    主线是什么？讲过好多次，机构买的就是主线，它有钱，它有趋势，它是产业，就这么简单，不然怎么叫主力？

    1是算力，女方的谷歌链和达链，男方的半导体设备。

    分别对应的etf是515880/159382和588710.

    2是电力，尤其是储能和北美电网，“主线就是电和光”。

    对应电网设备etf.

    3,有色，钴，铝，等。

    etf是159880等，有色里你买铜买金买锡都可以，不要买稀土，强调三遍。

    这几个是互相轮动，

    总体上1>2≈3，龙头当然是谷歌链和达链，险资爱买矿，有色不会差的。

    这两天在走强的是液冷，

    液冷因为没有达链的tier1，业绩也没兑现，在AI硬件链条中一向比较弱，仅比电源强点。

    现在谷歌验厂英皇，这个利润和价值量就开始提升了。

    英皇是全系列的强，搞液冷你绕不开，这个领域有点小宁王的感觉。

    龙2为什么提飞龙，它有业内比较罕见的电子液冷泵。

    其他的液冷，之前讲过很多硕贝德，思泉，强瑞之类的同学们自己搜索，图形参考《三生万物》。

    【请注意，主线也不是天天涨，它会有调整，这期间可看etf,市场在3887-3936之间震荡，如往3850就是较大倒车接人】。

    第三，谈点新同学们和业外没有的预期差。

    你要说最纯的谷歌概念？旭创。

    之前咱们讲过谷歌可是其的股东，

    旭创的主营业务卖光模块给它，

    还卖啥？存储，液冷，连接器，其他。

    -存储，是旭创把中天精装旗下远见智存的HBM存储拿去（当然存储概念股时机尚不成熟）。

    -连接器，是自己参股了瑞可达，前几个月拉上太辰光去投产业基金（目前这个领域不用看，mpo有博创在，它们只有轮动机会。）

    -主要说的是液冷，旭创打造的主要阵地是东阳光，刘圣在公司有5%股份。

    东阳光今年以来自己先后收购了大图热控，芯寒智能等液冷公司。

    大图给英伟达H200和GB200供货。

    芯寒智能是全浙大硕博团队，成立仅200天，主攻“全浸没式液冷”。

    东阳光自己主营的是氟化物和冷却液，还全资收购了秦淮数据。

    当然我们上述谈的是产业，市场不一定涨的好，要看它，你得有产业的视角和布局的耐心。

    广东深度智冷将成为业内没多少人知道的谷歌液冷，将来就是AI液冷，大家可以查查他的股东都是谁。

    赛道轮番上攻

    液冷的一致性太高，干脆今天涨涨电源，而我们 在麦米等侯多时了。

    真论稀缺，电还更强点。

    我们发明的“东大缺芯西大缺电”也被全网各种用。

    液冷的行情当然没有走完，今天的态势很健康， 咱们举例的硕贝德，思泉等，都是长短均线组交 叉向上的经典图形。

    至于光呢？大家在各种发掘后排的，比如同时能 做EML和CW的永鼎，还是那句话，哥们你能干 出一个来都很厉害，搞出两个是要lumument亲命啊。

    永鼎已经给剑桥供货了，这是现实，当时给它的 评价是“相对源杰没涨过”。

    昨天的公告咱们也解读了，是资本批量进入鼎芯 光电。

    至于真、CPO萝卜，它才是真正的共封装光 学，能看到2027的大后期品种。

    它起来了，光模块就没用了，之前大家认为光模块能做到3,2T，不那么着急， 现在发现谷歌和达子的进度并不慢。

    预期你预期的预期。

    你要说市场的主线，说难也难，说简单也简单， 就是光模块/pcb/连接器/液冷/电源交换机/机柜，涨完这个涨那个，涨下游涨上游，涨完高位 涨低位。

    产业的逻辑没有走完之前，要有配得感。

    商业航天今天真是出乎预料，游资是预期机构的 预期和预期啊。

    我们依然保持谨慎态度，能看的只看两家。

    感谢财经媒体的瞎看空，长飞给了很好的绿盘机 会，上一次它们看空是10月份说旭创xys估值严 重泡沫。

    希望美股今晚的光芯片，精神点，别丢份。'
