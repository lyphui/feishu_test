  文档内容正文: '牛市结束了吗

    市场现在的主要情况是什么？

    黑天鹅打乱了原本的节奏，周一本来认为的缓和，周二在加码制裁美国后，大家恐慌对方报复。

    因为东大挣钱的公司基本都有庞大的海外订单，东西大一互撕加码，叠加，

    1，放大情绪，2，新股民太多，3，量化横行，

    导致原本的调整放大，影响到两融，

    高位科技股的调整还远没有结束，周线级调整。

    因为它们已经绑架了大盘尤其是创业板，这就是上证强于创业和科创的原因。

    站稳到什么时候，要到月底，或者东西大密集释放善意扭转情绪。

    最简单的例子，pcb龙头胜宏，它就是本轮科技牛龙头，原本5日平台跌破就得走，你容忍它跌穿10日线，利润很厚再忍到20日线没动作就必须走了。

    它如今已经跌到了55日线，即将步入技术熊市，你看它能不能这个附近站稳5日平台或者一个小箱体，它就是义军领袖闯王，闯王都不行了，以下后排的各路小诸侯还行吗？

    但凡你拿的是要靠美国人吃饭或者涉及算力的品种，都会被波及。

    但是，就这么任由它们自由下落，把科技杀成狗吗？不会，毕竟是有护盘力量的，否则，周一是谁拉的？

    因此，创业，科创等科技板块的形势会是：基金砸盘，机构砸盘，两融砸盘，散户砸盘，生产队维稳。

    那么操作型选手的策略，就应该是，它拉升你卖出，它猛砸你抄底，目的是，降低仓位或者回一些本。

    20号有会议，30号要去开会，生产队不会让场面太难看的。

    抄底啥时候再抄，3800前后，也不一定非得完全准点，误差都能接受。

    它们不冰不抄，抄起来的一定要卖。

    拉长一点时间看，很多以前高不可攀的算力股已经有性价比，甚至很有性价比了，有些折合26年业绩已经不到20倍PE，但是情绪没有放完，你只能让他们放完。

    未来，现在挨打的科技有多惨，将来拉升的有多狠，突破4000，就看它们了。

    科技出来的资金往哪里切，就不赘述了。

    你要通过抄底去挣钱，

    就那些顺周期之类的，

    当然，你完全可以看不上那些护盘板块，大消费，傻大黑粗的，一身毛病，打死不买农商行，

    那你宁肯空出仓位，等到科技企稳后再杀进去。

    有一个决策学的基本原理是，

    你现在的操作跟之前是赚是亏没关系，

    你现在的操作跟之前什么成本也没关系。

    这跟谈恋爱也一样，

    沉没成本不参与决策，她不喜欢你坚决就走，跟你送了几个包，给她花过多少钱，没关系。

    到这里，问题又来了，有些人会觉得恐慌，牛市结束了吗？

    答案是确定无疑的，没有。

    宏观上，

    股市的主要使命，产业升级，存款搬家，金融强国之类，一个都没有完整实现。

    情绪上，

    牛市都是在疯狂中结束的，

    哪有在恐惧中结束的。

    哪有3800点结束的牛市？

    昨天又央行又搞出6000亿逆回购，而且险资，生产队，早在9月初就减仓了，它们手里是有子弹的。

    科技牛必然还会回来，

    赌性坚强，

    本质是信念的力量。

    既不会亡国也不会速胜

