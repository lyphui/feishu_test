  文档内容正文: '升值

    人民币汇率在不断升值，

    破7是迟早的事。

    汇率一升，外资被动流入。

    现在是金银铜铝涨价了，光纤涨价了，6F涨价了，中芯国际涨价了，Q布铜箔涨价了，

    等工业原料价格上去，工业品在反内卷的行情下会涨价，带动ppi上涨，最后传导到物价上涨，消费回升，摆脱通suo，完美。

