  文档内容正文: '五日平台，箱体概念，技术案例分析

    别名，答吴小二同学问。

    问，万华化学、安硕信息、东方财富，是否符合技术标准。

    我们仅以安硕为例，仅为教学，

    目前，它站稳住了5日平台

    如图一，你往今天回去倒数5天，平台底部价格，是4月2日的47.21,

    5天以来，盘中均不低于47.21，视为“站稳”，

    那么如果你参与或者做T，跌破这个价格，就得走。

    有人说，我耐心比较大一点，

    那么就看箱体，

    3月3日以来，它形成了一个箱体，这箱体的主要目的，

    是消化3月14日的20cm涨停，冲击1月17日的63.99，当天长上影线试盘，未果。

    如图二。

    箱体底部价格多少？3月7日的45.57,

    之后反复十字星，都在46元左右，如图三，

    你再有容忍度一点，

    跌破这个2周多以来构筑的新箱体，就得走了。

    如图四，

    你说你非常看好它的将来，2024年8月以来，它不跌破154超级均线，如图五

    这价格，是44.69。如果在此附近盘整，且放量大涨，则认为主力有想法。由此，你在中间无论怎么做T，折腾，你得出了三个随时可以跑路的位置

    低容忍47.21，(5日平台)

    中容忍45.57，(2周箱体)

    高容忍44.69，(154超级均线)

    这几个容忍度看什么?怎么怕被洗出去?

    看两个，

    一是大盘成交量，看恒生科技指数。1.5亿以上，行情大好，它不涨，大概率是洗，

    1.5亿以下甚至更低，它跌就是主力要跑路。

    二是氛围，它属于互金板块，互金，是比券商还要弹性大的板块

    大盘未跌它先跌，大盘情绪修复它会有表现

    容忍度，是根据大环境来的，不是根据你心里承受能力来的。

    当然，如果你才采用分批次建仓法，让自己的成本无限接近于44.69，你岂不是底气就足很多。

    咱们多次讲过，

    打仗，是先为不可胜，以待敌之可胜，

    最好的策略，是上面没有盖，下面要有底。

    这个属于现在的情况。

    安硕属于之前的强势股，更早之前应该什么时候走，24年12月23日，

    它丢掉了55日均线，如图六。

    我们讲过55日线属于进攻线，跌破且不收复直破60日线，转为萎靡。

    由此，给大家举个详尽的例子，

    5日平台是淞沪会战，主力都打输了，保安团就抓紧走。

    箱体是苏福国防工事，它们一般和20日线左右重合，苏锡常守不住，要转入地下。

    55日线是南京，南京都丢了就要迁都了。

    ps，今天拿着科技又没走的同学们，不要灰心，无需睡不着，

    早上我们讲过，反弹不会一天就结束，后面反弹会继续，尤其是今天尾盘翘板已说明一些问题。

    退一万步说，你等到懂王中期选举惨败不行吗？也就不远的事情。

    你看的更近一点，马斯克和懂王，三个月蜜月期，三个月矛盾期，三个月翻脸期，也就再最多五六个月的事。马斯克如果出走或者出局，MAGA 就死了一半。

