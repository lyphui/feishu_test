    昨天的判断，是未来的市场，

    是高低位的大小白马们，

    各自涨一下扩散一下轮动。

    昨天是低位白马，今天是高位白马，

    高位白马就是宴会主桌，分为，

    女方（海外算力）男方（国产芯片）。

    第一，

    海外算力分歧严重，涨幅也很高，再有大的拉升，得靠海外的刺激，

    比如谷歌或者谁又有超级订单，或者三季报前后了，或者东西大谈的很不错，目前看承接还可以。

    光模块上人们愿意去相信 cpo的叙事，尽管八字没一撇，cpo卖铲子的萝卜。

    第二，

    主桌男方的国产算力轮到表现的时候，

    1，一条是我们讲了好几年的紫禁之巅线，

    寒王太敏感，海光和曙光顶上，其实寒王干的是 Asic，类似谷歌，海光是GPU，类似英伟达，曙光是服务器，类似于工业富联那个角色，但自己有超算。

    谁是干cup的呢，龙芯中科，它类似英特尔，但cpu太远，算力时代拼gpu，所以当时没把龙芯放进来。

    紫禁之巅涨完会涨什么，设备。中芯国际和各种光刻机部件，尤其是大基金三期成立后也在投。

    整个的etf588200我们很熟悉了。

    再完了，就轮到资本开支的各种AIDC了，海外AIDC领头的是协创，协创有望拿到英伟达B30，国内AIDC就是润泽它们。

    AIDC一直没大轮到，是风口不好，且国产算力半天没涨完。

    2，另一条线是华为，华为的pcb光模块电源液冷等，因为这块很多也有英伟达概念，所以整体较高，走的是很达链的修复。

    华为那几个典型等我们都熟悉不赘述了，它们的特点是PE高且净利润率不如达链。

    做华为的生意确实没有海外赚钱，你还得防止被“借鉴”后一脚踢了（寒王一把眼泪）。

    高位板块的高位，整体就这么个情况，

    第三，

    高位板块的相对低位，一直给大家讲的是机器人为核心，还有创新药，附带一个游戏。游戏其实不低了，但抱团很紧。

