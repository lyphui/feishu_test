    730长老会解读与建议

    通稿一出，有些人认为没有突出的刺激，

    一顿猛砸盘，其实很有看头的。

    不在体质的同学可能不喜欢咂摸字眼，

    “认为”，我对情况的判断，

    “指出”，你们按我说的办，阶段性汇报。

    “强调”，我非常重视，你们那边出kpi.

    一，整体分析，

    1，会议认为：

    “主要经济指标表现良好，新质生产力积极发展，改革开放不断深化，重点领域风险有力有效防范化解，民生兜底保障进一步加强”。

    “要用好发展机遇、潜力和优势，巩固拓展经济回升向好势头”。

    -也就是说，上面对目前解决问题的现状比较满意，继续这么干就行了。

    -八个重点字，改革开放不断深化，这词多久没听到了。

    -调整结束了，进入新周期了亲。

    2，强调：强灵活性预见性，着力稳就业、稳企业、稳市场、稳预期。

    -要慢牛。

    3，强调：要有效释放内需潜力。深入实施提振消费专项行动，在扩大商品消费的同时，培育服务消费新的增长点。

    -消费肯定是长期目标，但白酒代表的老消费不行了，“服务消费”是啥？

    谷子经济，游戏传媒，医疗服务，演唱会等，大盘的“新消费板块”。

    3,指出，

    (1)坚持以科技创新引领新质生产力发展，加快培育具有国际竞争力的新兴支柱产业，推动科技创新和产业创新深度融合发展。

    -国产算力，创新药，光刻机。

    (2)依法依规治理企业无序竞争。推进重点行业产能治理。

    -反内卷。温柔一点，2015年是上去就干，这回是依法依规，先立法，给游戏规则。

    重点产业是什么？光伏、锂电、养猪、化工、钢铁水泥等。

    整体格局就是我们谈的，

    “高科技-反内卷“双轮驱动。

    看排头的先后顺序，双轮驱动中科技优先于反内卷，所以你科技的仓位要大于反内卷。

    二，我们的观感，

    1，这个市场有人护着，大跌不用担心。

    目前的护林员是银行保险，

    今天新华又创新历史新高，

    会玩的，-2%左右或绿盘买入，+3-4%T，不会的躺着。

    搞保险除了赚，没有情绪价值。

    2，要看今天谁在保持强势，

    a，谷子经济，里面一大堆游戏传媒，冰川，华通之类不赘述。

    内需板块搞它们就行了。

    b，海外算力，PCB和光模块拒绝调整，那么，它们的后排，补涨，零部件就依然可以看，具体是哪些详见《英伟达扩散研究》。

    海外算力里的相对低位铜缆今天依然能看，太辰光一早报复性反弹可惜大盘不配合。

    后排的中富电路，长飞光纤，有那么点补涨的意思。

    搞高低切和补涨的注意啊，前排不能撂倒。

    c，国产算力处于低位，算力芯片>系统芯片>光刻机>AlDC的资金流入顺序与重点依然没变。

    算力芯片目前的新锐是东芯，今天的上车机会错过就难了，系统芯片以SoC为主，光刻机主要看光学零部件。

    专门有文章谈过，不会的可以搞里面的ETF.

    d，创新药有分化的趋势，去弱留强，整体依然没有结束，尤其是CRO，今天讲暴跌有机会，有同学讲快跌停板挂进了昭衍新药，挺好。

    以上仅为学习哈，今天报告有一段，

    “保持战略定力，增强必胜信心，积极识变应变求变，集中力量办好自己的事”。

    于国，于家，于自己都是，共勉。

