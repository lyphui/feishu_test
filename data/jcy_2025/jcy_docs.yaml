    易经第23卦剥：终究是大梦一场（上）

    说起来也有意思，娃哈哈的瓜，和我们最近解读的卦简直完美契合。

    第22卦，是贲，是文饰，表演，包装，人为造出来的泡沫和景象，

    就像宗家把自己包装成爱国企业家， 一妻一女一布鞋，光环到达顶峰。

    而这几天他们的互相内斗， 一层层的揭开假象，把他们的真面目展示到大家面前，这正是第23卦，“剥”。

    宗的六七个子女都是美国人，几十亿美元早就转出了境外，而大小姐也早就用美国护照在HK置办了豪宅，她控股的宏胜饮 料，是一个维尔京群岛的离岸公司。

    “剥，不利有攸往”，

    “《象》曰，山附于地，剥；上以厚下安宅”。

    剥是，剥落，剥脱，它的景象，是高山颓落，委附在地面，整个是“塌方”的画面。

    上位者和领导者，看到这种意像，应当加强基础，使它更加厚实，只有这样，才能巩固其住所，而不至发生危险。

    从整个卦象，五阴在下， 一阳在上，高山被风雨侵蚀而剥落，阴盛阳衰，小人得势，君子困顿，事业败坏。

    世界的长期本质，是均值回归，你终究会匹配到你原来的样子，用力包装出来的东西，会层层剥落，理应不属于你的辉 煌，会风吹雨打去。

    所以普通人要有两个心态。

    第一，高位的时候，要思危，思退，思变，对潜在危机要有的敏锐洞察和前瞻预判。

    大家都是普通人，被时代的洪流携裹上去而已，不是自己就有多大的能耐。

    生活中，我们都是凡夫俗子，酒色财气谁不爱，孔子都还说愿意去当问界S800的驾驶员呢，

    那个灰色的时代，产权不清，赚了大钱，就低调找地方消化，何必非要既要又要，为了360度光鲜忽悠大家，还用起其打 击对手，乐此不疲。

    真正的贵族和上等人，不看功业，而是在日常和细小地方体现出的人性光辉。

    比如天很热，外卖员汗流浃背给你送了一份奶茶，你打赏三块，这就是王阳明心学中的“悲悯之心”。

    第二，低位的时候，要思源，思明，思进。

    如草木扎根大地，打磨自己的核心竞争力和方向，相信未来一定光明美好。

    高位看筹码，要每一步如履薄冰，

    低位看逻辑，要风物长宜放眼量。

    不宜过渡包装，硬要做爱国生意也会被爱国流量反噬，

    也不宜妄自菲薄，天生我材必有用，野百合也有春天。

    这个世界的规律，就是泰极否来，否极泰来，

    文过饰非，终究会大梦一场。

    中庸之道，人生稳步上扬。

    《康熙王朝》中，佟国维给隆科多说，

    小多子啊，你这碗水，还浅着呢。

    隆科多最大的问题是什么，

    追涨杀跌，忘了自己是谁。

    可惜啊，他没有回来退思的机会。

    后面，跟大家挨个分析由牛转熊的原因和高位摔落的技术具象。

    评论区：

    1987大灰免:每天一课，感恩

    无双小医:君子有九思十 三省

    和光同麈:下上厚浅本无意，低高进退凭时缘。

    张寅凤:单位要买一两箱矿泉水，我觉得太重，外卖小哥估计也赚不到几块钱，我就同时下单一小箱冰淇凌（私人买）。这样总金额就多些。

