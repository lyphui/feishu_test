    科技怎么看

    国队操盘厉害，这是历史上第一次。

    把风格切换玩的很丝滑。

    新消费和创新药仍然能基本稳住场面，没有造成指数的大幅下跌，

    科技还给同时拉了上去。

    以前哪次风格切换，不是腥风血雨。

    现在并不能完全确定，风格就从此立刻切换，科技也可能是久跌之后的反抽，  “熊市多长阳”。

    但是，你结合

    1,TMT 成交占比只有25%,

    高峰时它占比43%，现在是药和消费占43%.

    2，海光曙光复牌在即，会带来催化。

    3，英伟达深V已重夺全球市值第一。

    索性不如先信为敬。

    这轮科技究竟谁跑出来，目前还不知道，

    但排头是英伟达链，

    目前领跑的是PcB，因为业绩最好，

    而产业界认为，电源，液冷，光模块还有创新空间，应对传输速度和功耗控制。

    国资云也在启动，他们刚拉升的时候已是上一轮尾期，算力也蠢蠢欲动，题材最多的是老朋友协创。

