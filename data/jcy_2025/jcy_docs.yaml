    MR.Lu：516020化工ETF，彩蛋

    切换的风吹来

    辰是一个时间，指上午7点到9点，

    也指龙。

    下个月是乙酉月，酉在今年不算好。

    辰酉合，可以把酉合走。

    昨天说牟局要用辰，

    他似乎没有想起安培龙，哈哈。

    不谈玄学的，谈科学，

    上周五就说高位内部要高低切，今天早上再次讲，高位里的相对低位两个，

    机器人，创新药，

    减速器的龙溪，

    T链的嵘泰，拓普。

    早上还提了个20cm的震裕。

    基本猛的咱们一网打尽了。

    昨天的创新药很强，今天的cxo基本没跌甚至微涨。

    这两个看来趋势还会加强。

    算力有没结束？

    算力有没结束？

    当然没有，寒王几百亿的主力在里头厮杀，今天还涨2个点。

    那机会呢？不着急，需要时间，观察两天，看谁更扛跌，拉的更快，到时我们再讲。

    那么这些人，就是下一轮上涨的主力。

    评论区：

    阿伟：菜鸟我今天持仓跌四个点，跌得比我少的就不用纠结了

    闲闲巴巴：今天关灯吃面了

    尤优：大王怎么看游戏，，今天也是微红

    suvian：心理按摩完毕，感觉良好

    牟牟：其实有安培龙，但是昨天减仓了，剩了很少，傻呀，找过来找过去，手里的都没有把握住；手里重仓大家都知道是啥， 怎么一个惨字了得，关键是自己都知道得咸仓了，忙起来错过高点就没舍得减

    Jerry 回复 尤优：游戏多好，慢慢慢的就涨了

    牟牟：手里的soc一两天的功夫，就成了人见人嫌的

    向阳而生：这我不弄巧成拙了吗，早上看的是荣泰，也是汽配机器人今天还首板了。。和嵘泰有关系吗

    不要慌

    牛市的暴跌就像你和女朋友吵架一样正常，除非你不爱她。

    哪有只涨两个月的牛市，

    哪有一场跌就改变的趋势。

    不要一跌就恐慌，一涨就手抖。

    泰山崩于前而色不变，麋鹿兴于左而目不瞬，然后可以制利害，可以待敌。

    顺，不妄喜；逆，不惶馁；安，不奢逸；危，不惊惧；

    胸有惊雷而面如平湖者，

    可拜上将军也。

