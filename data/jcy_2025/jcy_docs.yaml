    大佬的顶级智慧

    黄仁勋能把公司干到4万亿美元，又是做游戏和人工智能的，

    而这个行当本身就玩的就是“建模”和“智慧”，教主必然有超出常人的感悟。

    他有个观点跟我们以前提过的一个观点很着类似：

    “不回看、不纠缠、不解释”。

    他没说为什么，

    想必是非常耗能。

    因为但凡是一个人要你不断的解释、证明，那就说明他没有真正认可你，所以才不断的挑刺，找茬，施压，玩各种套路。

    对于一个不识货的和认知较低的人，你是没法改变她的，

    1，你不断解释，就会入了她的“局”，被对方反复拿捏。

    你是拿破仑也没用，被约瑟芬折腾的死去活来。

    2，你解释不清，觉得我在其他地方很强，非要去赢回来，就回陷入“纠缠”，

    越缠你陷的越深，越深你的沉没成本越大，边际回报越低。

    3，等你略微清醒想抽身，又因为过去的深刻记忆而出现“情绪反复”，我反复就会回看，一回看又入了对方的局。

    所以，真正的次序应该是，

    不解释，不纠缠，不会看。

    解释，就是在泯灭自己的主体性，去满足对方的要求的工具性。

    纠缠，只会继续增加自己的沉没成本，亏的越来越大。

    回看，只会不断拉开自己的伤疤，无法继续前行。

    所以有一点大家要牢记，

    “不要回应负能量”。

    对于那些黑洞，空心人，辜负你的人，删除拉黑不往来，彻底翻篇，断掉供养，就是最大的报复。

    你是他的上限，她是你的下限。

    然后，你们都会均值回归，你能量回归，越来越好，步入历史长牛。

    我们很多人，把99%的能量，用来解释，证明，内耗，调整自己的心态。

    p,错了，要把99%的能量拿来筛选。

    要把投资做好，事业做好，心态不平和是不行的，那些不尊重你的人，就是坏人。那些对你不好的人，让她滚蛋。

    坏的人，一直让你输，

    好的人，一直让你赢。

    股票也是。

    在自己舒服的氛围和环境中高歌猛进。

    这就是“善护念”。

