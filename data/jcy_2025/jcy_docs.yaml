    多看评论和问答

    新来的同学们要注意和多看问答和评论区，基本都是大家的实战，

    每个人都有自己的方法和思路，手上的具体品种更不一样，

    但不管你拿没拿，同学们问的东西你看一眼，再结合自身，

    她做的好对我有什么启发？

    我怎么学习。

    他问的难题对我有什么反思？

    我怎么规避？

    我们在互动过程中谈的一些指引和建议等，很多是“普适性”的，适合你举一反三，不断的从心得中来，到操作中去，再从操作中来，到心得中去，往复循环。

    比如上周四彩蛋的指南针，不但多次对有些想买券商的同学怒其不争，讲券商IT 的弹性，而且专门把问答长期保留。

    3600之前，银行是调控的主要风向，

