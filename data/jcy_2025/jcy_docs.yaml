  文档内容正文: '震荡向上-11月策略提要（上）

    明天早上有安排，先把概要谈一下。

    按照投资日历效应，2月和11月，都是业绩预亏和散户喜欢的小票活跃和收益期。

    再加上周末的突发事件，村里非要指导市场，甚至讲出“羊群效应”。

    那么有几个情况我们要注意，

    1，2025年三季度公募基金前十大重仓股依次为：宁德、腾讯、新易盛、旭创、阿里巴、立讯、富联、紫金、中芯、茅台。

    那么谁有压力你应该知道了。

    2，对于科技股，尤其是主桌女方和前期上涨的科技大票，会迎来一轮震荡。

    -男方会相对好一点，也会受到波及，然而，是50%的美资限制取消后，很多设备又能进口了。

    再加上，中芯，长川等这些公司都是挣钱的，先进制程扩产供不应求。

    -周末各种直播间对科技喊打喊杀，我们认为，科技即使较大的调整，它也是上升趋势中的波动，因为长线的逻辑不但没有改变，反而在加强。

    长线看逻辑，短线看图形，同学都懂的。

    3，上述已经谈过多次，问题是，切出来的资金会去哪里？

    AI应用，创新药，机器人，锂电材料。

    -AI应用是科技板块里唯一的洼地，

    活跃资金打造的龙头是深信服，业绩大幅减亏，但作为业内人士告诉你，它没啥AI，看图的超级高手们自己玩。

    福昕，不光是做pdf的，有工业软件，业内认可度比深信服高，但图形就短期不友好，会玩的自己看。

    机构们可能去哪里，应用大票，比如，

    金山办公，它是挣钱的，1600亿市值，绕不开。

    360，虽然整体仍然亏，但矮子里拔将军，Q3收入22亿，单季利润扭亏，号称“迎来扭亏拐点”，机构反正先信为上。

    科大讯飞，老面孔了。

    那么弹性大的呢？

    之前谈过的鼎捷，和华为云确实有合作，灯塔工厂确实在探索，也有利润产生。

    易点天下，市盈率50多倍，AI广告和AI营销，天猫美妆广告排头。

    利欧股份，头条的广告代理商，自己还干液冷，去年亏，今年大幅扭转，46倍pe不能说贵，扭亏和受益的还有蓝标等，自己去看他们简易财报。

    还有一个是号称中国版Palantir能科科技，55日线和5日线粘合，50倍真按老美对标不贵，

    Ai应用的特点是，小，散，贵。

    能挑出这几个实属不易，其他几百倍的，负的，就没必要看了，

    有业绩的，被套了你还能等回暖，业绩垃圾的就不知道猴年马月了。

    AI应用简单粗暴的集合，是“软件龙头Etf”，这个板块大多数人跑不过它，不信你试试。

    -创新药，还是之前那几个，荣昌，迈威艾莉丝等，cxo的康龙较有性价比。

    艾莉丝以前讲过，它是最便宜的创新药，动/静态市盈率22倍，鹤立鸡群，况且这公司是真有东西。

    迪哲医药的核心产品舒沃哲，是唯一在中美两地均获特定肺癌突变的国产创新药，后续可能放量，但图走坏了，收复55日线站稳也不迟。

    简单的etf是港股创新药和科创创新药。

    港股的创新药就看好一家，信达生物，研发投入比太厉害。

    仅供学习啊，至于参与方式和策略，一堆祖训就不赘述了。

    机器人和锂电材料再说吧，之前零碎都谈过，这两天聊了一堆行业大佬，下午又找医药女博士谈了半天，没电了，同学们看完早点睡。

    总之一句话，

    高切低，大切小，硬切软，峰切谷，

    不要怕，上升途中的调整，

