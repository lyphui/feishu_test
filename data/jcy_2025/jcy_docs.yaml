    反内卷和双轮驱动（上）

    金融打底，题材唱戏，

    反内卷和高科技，双轮驱动，

    光伏刚开始涨时我们讲他不会一日游，因为反内卷会成气候。

    1，反内卷会沿着过剩产业挨个展开，光伏，电池，碳酸锂，水泥，钢铁，养猪，等等。

    总之那些之前狂亏钱的，都有机会。

    2，股市的反内卷板块上涨，根本原因还是位置低，雅江只是催化，低位就是王道。

    目前那些低位的都还有谁，

    光伏：硅料，大全，通威等，

    玻璃：福莱特，金晶等，

    逆变器：阳光电源，它现在才10倍pe啊，

    电池：代表是宁王，港股比A贵。

    碳酸锂：天齐，赣锋，中矿，永兴等，

    有机硅：硅宝科技等，开始有量。

    养猪：牧原妥妥龙头，鸡还在酝酿。

    钢铁：看核电钢，

    煤炭：看焦煤。

    其他的同学们自己挖掘，还有一些锂电设备，光伏设备等，pe或者位置要低，说三遍，

    如果，一季度已经环比增长，或者扭亏，自己减亏的，更好。

    3，反内卷板块你不要追，它内部也是轮动。比如光伏涨了，你别追，可以去看电池，电池涨了，你可以去看逆变器， 着等水位上来。

    前期，就看前排。

    4，隔壁讲过一个板块上涨的三段论，反内卷也不免俗，

    第一段是概念和预期，大家都不信，长老会开了，动作也做了，有些人不当回事。

    第二段是业绩开始有了，扭亏了，兑现了，市场热度上来了，板块也涨上去了，这时散户追进去了。

    第三段分歧出现，直到尾声，通常给你做个M型双头，这时去的人最多。

    之前有同学问过指数可以买什么，我们说创业板50ETF或者弹性大的指数可以买。

    创业板基本都是过剩产能啊。

    之前有同学讲的光伏龙头etf也能搞搞。

    如果你实在不知道买什么，还是那句话，买宁王。

    当然，方法是趁回调，分批次，别追高的。

    它不突破924，还谈什么牛市呢，它20倍pe，又是韩国人心头好。

    还还不知道看什么，保险。

    反内卷的酝酿是2022年，

    提上日程是去年10月，发布动员是今年4月，正式开始是今年7月，

    所以你说做点事容易么。

    ps，仅为学习哈，同学们可以继续群策群力，

    看看电池/锂电设备储能等，那些20倍PE左右或者以下的，还有谁，pe高点，但k线不高，中报扭亏的，还有谁。

    下一篇，我们谈反内卷对立面，科技的轮动。

