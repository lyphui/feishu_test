    如果跌破34，就是周一级调整了。

    3，更稳妥的大抄底是什么，收复34,55,60粘合向上，这时发现的，通常踩了一个w底（有的没有），或者在底部磨了几天，5日线上穿8日线后，短期均线的5813，上穿34，形成买

    点。

    涨上去再杀下来后，长短均线组相交，这个叫“回踩结构”。

    在此时介入，有没有买错的可能，当然有，跌破5日平台或者34日线，你跑了就行，损失也不会大，但相对前两者，概率高很多。

    这次的谷歌链会形成结构吗？会的，尤其是涨上去的那些。

    因为它们的逻辑没有变化，但短期又涨的高了。

