  文档内容正文: '延续前两天的观点

    几个重大不利消息都还没落地，昨天的美股依然很弱。

    因此继续前两天的观点，调整尚未企稳。

    今天可能再冰一下，最好是杀出恐慌盘。

    然后冰完有反弹，

    但是力度不会大。

    最多是护航一下今天沐曦的上市，给国产半导体打打气。

    昨天抄了国产设备的，今天如果真给你拉了，反而是T出去至少一部分拿利润的机会。

    昨天生产队没有任何护盘意愿，既不拉银行防守，也不拉券商进攻，就说明要释放情绪。

    大家都在等待C浪的调整，

    调整有两个方式，

    一是在这个3800位置附近形成箱体，不断缩量，磨出一阵十字星，企稳反弹。

    二是，今天稍微意思一下，继续下杀，参考之前的极端方案B.

    方案B的触发条件之一是什么？量能低点连上一次的1.55万亿都守不住。

    你留着5成仓就是应对这个的。

    这一轮越下探，将来的反弹才越强。

    总体上的形势明朗大概率要等到周五了。

    到时候你再看什么跑出来。

    -如何看机构主力有没买消费？

    看它们有没冲进中免和上海机场，这都他们的基本盘。

    -机构主力如何看商业航天？是当题材和概念看的。

    将来呢？要等到这轮分歧大面积下跌后再布局。

    商业航天最强的是两家公司，

    一个航天科技，一个航天科工。

    问科技的兄弟，你们哪个公司最强，答曰航天五院，五院负责总装嘛，且出了不了大领导。

    五院下面的上市公司是中国卫星。

    搞运载的。

    问科工的兄弟，你们哪个公司最强，答曰航天电器。

    搞卫星载荷的。

    卫星载荷和运载火箭确实是整个产业链中最有门槛的。

    这轮迎来分歧后，机构们会逐步布局。

    分歧落地的标志是什么？福建概念和他们一起跳一轮水。

    大盘越差，福建海南概念们越强，反之亦然。

    最后说下大科技，目前最大的问题是审美疲劳和缺乏利好刺激，不代表基本面有问题。

    你看昨天有小作文说谷歌去东南亚审厂英皇，液冷和pcb上游来了一小下。

    经济会好吗？会的。

    有钱小姐姐们又开始买包了，

    LV在快今年新高了。

    南院大王

