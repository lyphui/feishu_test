  文档内容正文: '呐，来了

    互联网平台反垄断合规指引，

    现在美国，韩国，甚至马来都在大建数据中心，硅谷诸侯每家出6000亿美元，

    我们的这帮大厂，

    竟然都跟不上时代的潮流，资本开支一个比一个小气，

    你哪怕签点框架协议呢？你哪怕先把故事讲出来呢？这都不。

    建数据中心也是为了你们好啊。

    既然你不体面，就有人要帮你体面。

    你们如果都变成硬科技了，砸了算力卡大模型，不就不是垄断了吗？

    大厂们经常很迟钝，这次不知道能不能听懂。

    市场监管总局公布《互联网平台反垄断合规指引（征求意见稿）》

    央视新闻客户端 9小时前 726评论

    为支持和引导平台经营者有效防范反垄断合规风险，健全反垄断合规管理机制，保护相关主体合法权益，维护市场公平竞争秩序，促进平台经济健康发展，根据《中华人民共和国反垄断法》等法律规定，市场监管总局起草了《互联网平台反垄断合规指引（征求意见稿）》，今天面向社会公开征求意见，意见反馈截止日期为2025年11月29日。

