    然后一轮凶猛杀跌，先后跌破了20，55日线，掉到了120日线盘整，

    出现2个月线级的大阴，两个月跌掉34%，然后呢，调整完又涨了3倍。

    大家都是富贵贤人，不要搞出一副没有见过世面的样子，更不需要给自己负反馈影响自信和心情。

    之前讲过金刚经，一时的涨跌都是虚妄，情绪也是假的，不要被它左右，反而你要驾驭它。

    用一个玩家心态你就会很放松，放松才能做好一切事情，“无心生大用”。

    跌了咋办？等它涨回来呗。就这么简单。

    远的不讲，

    4月7日，大盘直接跌停，你是不是觉得天都塌了，然后呢，不照样扛过去了，今天这个算得了什么？

    之前说，每周是周一红了让你好好上班，周第二三盘整，周四法定砸盘，

    没想到一语成谶啊。

    淡定，牛还在。

