    关税战受益及高开之后怎么走

    同学们有在讨论高开后的走法，

    大数据证明，大幅高开以后，80%都会低走，再加上现在量化横行。

    当然低走后再高走是别的事。

    大幅是什么意思？创板高开1.8%以上。

    所以如果非常高开，以及你关注的板块非常高，不是追的时候，反而10.10分前后和2.30左右再看，这两个时点我们都属熟。

    那几个板块的态势会如何？

    1，整体的科技，依然看恒生科技指数的引领，恒生科技涨业大A科技涨，恒生科技先一步在国际上得到估值修复。

    2，军工，已经不是冲突概念，而是中械装备的军贸概念，出海概念，营业额可能扩大，就会迎来资产重新估值。

    这块就看中航成飞的龙一引领，它继续军工就继续，它颓了军工回调。

    军贸领域能出头出业绩的，主要是“耗材”，如无人机，导弹，雷达等。

    无人机如中无人机，弹如雷电微力，广东宏大株洲宏达，雷达已经稍高了，14所前台是国睿科技，38所前台是四创电子。

    军工有持续，但短期成不了主线。

    3，关税战的声明是缓和态势，缓和短暂不利于自主可控，比如寒王代表的AI芯片和mcu，  华为910等。

    4，缓和利好加工和出海，就是果链，英伟达链，果链是机构抱团，如长盈，东山，英伟达链有修复需求，如胜宏等，稳健的是SOC,

    SOC 一是未来两年是出海主力，前段时间跟着果链被错杀，而且，接下来几个月，国内几个大厂，包括字节、阿里，魅族等，都要再出端侧新品。

    受益具体已经谈过很多次了不赘述。

    5，科技常青树是机器人，机器人目前的趋势就在设备，工控设备，整机设备，你拉开涨幅前排，都是干这个的。

    以上属于科技。

    消费么，最近消停了，不是市场主流，但也是布局时间。

    长期，不定期，或趁大跌定投狗粮和国产红牛仍可以等它们的业绩爆发。

    觉得是高手同学们可以关注一个上游卖铲子的，做牛磺酸的，永安药业，待它企稳再说。

    牛磺酸既能做兴奋剂添进提神饮料，供社畜去喝了加班提神，也能做必要的诱食剂等，保护动物肝“脏，促进动物生长发育。

    只要你吃过养殖的鱼，必然吃过牛磺酸，水产养殖按蛇皮袋放的。

    ps仅为教学研究，不构成建议，包括最后的图。

