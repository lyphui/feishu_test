    昨天英伟达涨2.14%，涨了多少呢？

    涨出来一整个胜宏+旭创+天孚，有机构喊出了看到200美元。

    然后Meta和微软业绩双双超预期，然后Meta暴涨11.5%、微软暴涨9%，

    也就是说，AI设施的投入还要加大，海外算力链还能看。

    会玩的同学，拿着前排的继续拿着，后排的二线pcb，二线光模块，整体零部件，最好去多趁一些调整后依然能看，具体品种之前谈过无数次，实在不熟你点开板块就知道后面是谁。

    当然铜链接和液冷/电源一直在蠢蠢欲动。

    你要问海外算力啥时候调整，胜宏或者旭创来一个放量大跌。

    算力链条里处于低位的当然是国产算力，问题是海外太好了，切的不顺畅。

    但趋势是必然的，逢调整搞ETF就行。除了588200，还有个589520，基本都是ASIC，还软硬兼有。

    再回到国内，宁王昨天的中报超预期，

    上半年营收1780亿，同比+7.27%,净利润305亿，同比+33%,

    机构一直不相信宁德能搞出高业绩，即使外资也只给出Q2净利152亿元的预测，今晚二季度数据165.6亿，超预期。

    到今年底宁王利润700亿-750亿左右，也就16-18倍pe，相比之下，LG电池50倍。

    大摩预测宁德还将占领30%左右的机器人电池。

    昨天董事长讲“破除反内卷”，低位大权重依然能看，这几天涨的不就是低位的万华化学。

    请理解这段牛市的核心，抱团牛，

    如果你拿的不是机构抱团概念，那就日子比较难受。

    抱团的除了上述当然还有创新药，尤其是港股创新药ETF，

    今天如果大幅低开或者暴跌，又上分批次上车的机会，如果你相对保守，调到20日均线是很好位置。

    创新药高吗，K线很高，但PE不高，中国那帮基金经理都是歇斯底里症患者，一年要把你十年的预期涨完。

    BD大单不停，创新药不死。

    当然搞不好的这个依然踩不对节奏的，可以拿着一定仓位去跟着国家队抱团保险。

    有时候吧，你赚钱和情绪价值能一起要，有时候你只能要一个。

