    戒急用忍

    康熙六十一年，公元1722年，农历十一月十三日戌时，

    康熙病入育育，知道自己很难熬过这个夜晚了，于是把四阿哥叫来后，确定传位，再是安排后事：

    【“不要哭，要明白，朕把这千斤重担交付于你，朕相信你一定能够刷新吏治，匡补朕的过失。”】

    【“戴着这串念珠，朕不放心的，是你常常过于急躁，待人有欠宽和，善待你的兄弟、善待你的臣民，不是万不得已，不要伤害他们。“】

    康熙知道自己的问题吗？知道。

    大家长作风，过于宽仁，整个组织运转靠个人恩义威望维护着。

    制度化，体系化，专业化的建设严重不足，核心竞争力已然落后。

    这些，

    都是下一任继任者要去解决的问题。

    但是解决这些，却不能靠推倒重来的方法，要斗争，但是得有底线。要办事，但是不能急于求成。

    康熙深知老四是个情绪化的人，把自己的念珠交给了雍正。

    雍正也深刻体会到这一条，

    写了个“戒急用忍”当成自己座右铭。

    某人有没有交代他闺女，不知道，大概率是谈过的，但可能没谈拢。

    雍正厉害的地方在于，他明明痛恨老八，但接任以后，竟然能出乎所有人意料的，

    让老八做了总理王大臣，完美弥补了自己缺乏基本盘的弱点，淘汰了一干老臣，度过了虚弱期。

    其实某公司的八爷党是现成的，小妈可是前财务总监的说。威贰捌壹捌叁陆叁捌肆伍

    雍正王朝第20集，堪称全剧最精彩的一集，不带之一，周末，值得一字一句，好好品一下。

    每一个人的站位，脸谱，心态，诉求，全都刻画的淋漓尽致。

