    再再论稳定币

    在此之前，你需要先理解RWA，实物资产代币化，即把一个资产切成很多份，RDA，数据资产代币化，数据确权可以来卖钱。

    如果还未深入了解稳定币和这两个概念，隔壁进阶课有详细的科普。

    稳定币一开始是牌照概念，随着深入，会进入到逐步实操阶段，看三个概念。

    一种是资产概念。继光伏RWA，充电桩RWA之后，比如协鑫，朗新等，地产必然也会RWA，比如上海国资委学了稳定币，它的光大家宝，市北高新等平台，但请注意，地产很难把握，纯看图形筹码。

    一种是RDA概念，你的数据确实值钱，比如，这几天上海钢联的大宗商品数据，中远海科的航运数据，

    一种是他们上游的服务/设备厂商，一开始是牌照概念，谁能发稳定币，然后就是销售概念，谁能把这东西卖老外，

    就我们讲过一定要有跨境支付概念的，如海联金汇，四方精创等，最终会延伸到工具概念，谁有平台，谁有设备，谁有人马，如我们提过的恒生，金证股份，中科金财等，你有没发现他们都是蚂蚁系居多，

    最后可能延伸到服务商，存储商，硬件，比如数据港，云赛智联，更后期的易华录等。

    叠加目前的牛市，我们认为券商IT+互联网金融or跨境支付+稳定币概念的，能走的更远。

    这篇，我们主要跟大家谈的是主力的思路，里面的一些公司仅为举例和学习，他们不一定就是最好的，但逻辑是确定的，具体的同学们自行发掘把握。

    还是那句话，不要追高，可等轮动，上峰要慢牛，人家把指数给你玩的炉火纯青，亢奋了就给你砸下去，冰点了就给你拉上来。

