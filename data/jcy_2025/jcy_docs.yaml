    先站出来的为什么是创新药？

    它先于科技调整，且基本都在55日线左右了。

    创新药也是科技，生物科技。

    抱团四大品种，

    算力，游戏，药，半导体。

    早上我们为什么说要看胜宏，最先启动，最先调整，最先到达55日牛熊分界线，

    今天它在顽强抵抗，闯王你挺住。

