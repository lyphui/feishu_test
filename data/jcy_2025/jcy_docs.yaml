    《哪吒》讲给我们的，成长，人生和启迪

    这电影已经在世界影史上有一号了，其实你剖开看，讲的是成长的故事。

    不光是哪吒，李靖，申公豹，包括太乙真人，都在成长。

    以下是我们一生都要面对的课题。

    1，接纳别人的不一样。

    每个人的心中有一个尺子，总认为，别人如果不这样做，就违背“标准”，不懂事，不识趣，然后你生气。

    其实，你认为的“标准”，只是你一厢情愿的产物，佛教这个叫“分别心”。

    这背后，其实是“我们希望对方按我们的标准来活”。

    你认为轻而易举的东西，别人做起来可能千难万难，你要真正的接纳他们，而不是容忍。

    就像大王可以一心多用，同时处理好几个事情，给有的部下布置工作，他必须很专心，没法多线程。

    不能认为人家不用心，他们做不到。

    容忍，就说明你认为自己是对的，处起来还不和谐。

    2，爱是成就，不是改造。

    我们很多人的，对孩子的教育，成长，安排工作，恨铁不成钢，望子成龙，

    本质是用自己认为的“精英模板”在套孩子。

    总觉得银行好，体质好，学金融好，而根本不考虑孩子的体验感受。

    爱和教育的本质，是成就他的独立人格与自我天赋，

    把上限拔的很高，把下限维护住就行。

    而一个人要拔高上限，靠的是他自己的热情主动，绝对不是逼他。

    你对孩子在心虚时候，困难时候，在考不好时候的鼓励，会成为他一生的资粮

    这就是“幸福的人用童年治愈一生”。

    给他一个安全型的良好性格，而不是焦虑性和回避型人格，是最宝贵的礼物。

    你如果还能在他小时候发现上限的闪光点又加以培养，那就奠定了一生的幸福。

    3、沟通不是讲道理。

    真正的沟通，是情感，是共情，我们很多人最大的问题，是肆无忌惮的在孩子跟前表现情绪。

    大学里和社会上很少教沟通技能，最重要的一条是，

    我们可以表达生气，

    但是不要生气的表达。

    敖丙就做的非常不错，这就是真正的情绪问到了。

    小孩叛逆，是为了“求关注”，

    你再生气的对待他，更加火上加油。

    4，人生的意义是自己定义的。

    不是功成名就才叫成功，成功是你有一颗清净心，按照你想做的方式做自己。

    申公豹就是随大流，削尖脑袋去苦读，去考编，去了“大家都想去”的阐教，

    其实他并不擅长那个，结果融不进人家的圈子，自己成了个纠结焦虑的反社会人格。

    在乡下当个教头，一定不好吗?

    申公豹，就是哪吒“按大家期望”长成的样子，也是我们很多人的缩影，

    等你后悔的时候，已经来不及了。

    不是去阐教，做神仙，才叫成功，才是幸福，这一点电影里的太乙真人都没做到。

    因为那些都是外界定义你的，人生本来没有意义，你定义了自己，就向内求了，幸福源源不断。

    和别人的相处，对孩子的培养，

    永远都不是单向的，而是双向的成长，把这个心态拿出来，双方的关系就有了良好的基础。

