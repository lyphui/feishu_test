    重温口诀，市场怎么走

    总结一下，

    一、高位：

    缩量上涨还要涨，放量下跌还要跌，

    这里主要指150亿以下的小微盘，已经涨了很久，半年报到来，丑媳妇见不了公婆，再加上私募和量化年中要轧账，所以图形走坏开始下跌的，不要侥幸。

    小微盘别看跌了，这么大跌还没开始。

    二、低位的：

    缩量下跌要企稳。

    目前的大盘，上涨是缩量的，下跌是放量的，就我们说的要深蹲。

    下跌放量是资金先出来，

    有没有进去是第二步。

    就像前两周，上涨时1w亿，下跌1.2w亿。

    只有当大盘的下跌开始缩量，说明基本调整完毕，卖也卖差不多了，买也买差不多了，那时你再加仓位搞动作。

    三、板块，

    相对弱势，跷跷板要踩下去，

    新消费、创新药、游资题材股（什么核聚变），即前段时间猛涨的？

    相对强势，跷跷板踩上来，

    海外算力（PCB，光模块、光引擎）、游戏Ai，机构重仓、风电，国产半导体等，前段时间猛跌的。

    尤其是业绩比较不错的。

    具体供学习的标的讲过多次不赘述了。

    但请注意，这两块是萌芽早期，只有前排受益，尚未扩散。

    相对强势的依然可能跌，只是因资金关照，跌的不那么猛。

    机会呢？情绪冰点和补缺口时，稳妥的看新华保险，指数总要拉上去，弹性就是光模块和游戏，但不要一把梭哈，整体上进二退一。

    创新药，整体行情并未走完，下跌到20日线企稳的可以试探在看，下跌到55日线企稳的可以看的相对乐观了。

    一些资质还优秀的公司，艾力斯，易方生物，三生药业，百济，康方，众生等。

    本周行情就是个磨，能看出啥，能看出7月端倪。

    ps，仅供学习哈。

