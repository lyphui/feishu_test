    迎接五月

    股市没什么好说的，基本冰点时刻，

    924以来，每次成交量到了1万亿以下，就会否极泰来。

    能看的题材就是之前说的创新药，当然其他药和中药也不错。

    有些同学说高了，之前跌了3年了。

    大A基本没有跌4年的品种。

    阴历五月有“毒五月”之称，主要是阴晴不定，忽寒忽热，阳气下沉，阴气蒸腾，湿热沉闷。

    因为湿度适宜，蚊虫毒物等开始活跃。

    所以《伤寒论》说，这个月应节制嗜欲，食物清淡，减少酸味，增加苦味，益肝补肾。

    因为空气沉闷，大家喜欢吃冷喝糖，不少人体内会有湿气？

    表现为，

    舌苔白腻，有齿痕，胖大，胃口不好，或者整个人昏昏沉沉，没有精神，睡觉早晨起来不解乏整个人像是披了件湿衣服。

    甚至有些人，感觉小腿沉重。

    此时可以网上买麸炒意米当茶泡水喝。

    如果还眼睛花，头发白，可以加桑葚干

    炒意米:桑葚干=2:1。

