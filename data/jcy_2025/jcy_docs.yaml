    配得感

    咱们小时候喜欢搞苦难教育，

    有些人吃苦是一把好手，

    享福就差点意思，

    跌的时候减一半坚韧不拔，

    涨的时候才20%吓的烫手。

    出去玩还要带个笔记本，好随时加班，

    好东西和涨起来不敢信自己何德何能。

    回到市场，

    一，海外算力，olt涨一天能叫涨？英伟达链只值一个涨停？

