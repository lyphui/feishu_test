  文档内容正文: '生产队在行动

    昨天的2点03分是风云突变的时刻，

    阻断了下跌的趋势，

    这时候能进场的只有生产队，

    因为他们守土有责，不能跌穿颈线位。

    问题是，它们的买的是什么?

    你点开创业板指和深成指，大概看一下就知道，

    红色的是锂矿，科技(谷歌与达链)，软件(AI应用)，中小盘。

    绿色的是前期涨幅较大的银行，电池，光伏设备，权重。

    即使指数不太好，同学们体感不会太差。

    这里我们得出的初步结论是，

    主线出现了回流和复苏的迹象

    因为只是迹象，一开始只扎堆最优秀的前排当然总体还不够稳，稳的标志是成交量2.5万亿。起码你得有2.3吧。

    今天如果继续把妖股往下打和退潮，复苏就会得到更坚实的支撑。

    反弹不会一蹴而就

    反弹会从最阻力最小，预期最优秀的品种展开。

    -阻力最小的是AI应用，应用是唯一没涨过的板块，筹码洗的很干净，巴菲特投谷歌，买的是AI应用，

    -预期最优秀的是那些校花校草，本轮预期会以光芯片，谷歌链领头。

    几个最前排的在不断拉高34日线的中枢。

    指数不好正常，早上讲了主力在卖权重，也不用过于悲观。

    科技的杀跌动能已经接近尾声。

    早则19号，晚则本月底，主线又会再度归来。

    蓝标，果然是丁亥小王子啊。

    看过《三生万物》那几篇技术，

    你就知道长短均线组相交位置为买点。'
