  文档内容正文: '二八分化：产业和发展的长线逻辑

    易经属于存稿，

    今天跟大家说点日常和新鲜的。

    有个朋友开个礼品公司，说生意很难，要不是几百万存货，真不想撑这么大摊子。

    大王给了个建议，员工辞退，办公室砍了，三折一键把货全卖了，什么扫地机器人，电动牙刷之类，全甩给同行。

    然后呢？然后你待着啊，谁规定人必须天天上班，时刻都得赚钱？

    人为啥不能待着？不上班犯法吗？

    不亏，少亏，也是一种赚，

    这一轮，同质化的中小企业是要出清的，

    一天不出清，增长就上不来，

    制造业为啥不赚钱？开工厂的太多了。

    有点反人性，但现实就是这样。

    回到我们的市场，

    昨天出了个反常识的黑天鹅，

    村里出台《公募业绩比较基准指引》，里面要求机构不能风格集中，不能抱团，

    这势必影响短期的公募预期，

    其实也不能怪机构，大A资产荒啊，一大堆不挣钱的坑蒙拐骗，你让它们买谁？

    美股的七仙女，贡献了整个31%的增幅，美国sec管吗？钱又不是你出的。

    能改变长线了，改不了，

    鹤公早就讲过，分化是必然的，地区，行业，甚至是二八分化，让他们看到教训，“我看也不是什么坏事”。

    我们今天主要谈k线上沿的部分。

    1，中国的AI和老美相比怎么样？

    某华为高管出身的知名投资人讲，

    差距更大了，deepseek时刻，我们的确缩短了差距，

    但老美随后奋起直追，几个互联网公司砸下3万亿美元的资本支出，

    咱们呢？除了阿里，字节，全部都慢了。

    2，你再看看国际上，黄仁勋自己以国家作为单位去扫街了，跟韩国建立国家级数据中心，要包圆三星的存储不给华为，马来西亚，更是举国之力要在柔佛建AIDC，“重建一代人的繁荣”。

    3，特朗普去韩国去日本，就一件事，搞钱，董事长去韩国，跟懂王互退一步，搞芯。

    4，再看几个具体的公司，

    -旭创，前三季度整体毛利率是40.74%，第三季度单季是42.79%，且管理费用增长率远低于净利润增长率，这说明公司降本增效和规模效益显著，越来越赚钱，

    同时，它正在投资一个总规模980亿的项目，花旗预计其毛利率将长期稳定在45%左右，

    -胜宏，目前我们了解的情况是，它2026甚至2027年，所有的产能都已经被包圆还不够，它已提前介入了英伟达下一代Rubin的开发。

    其董事长在电话会中明确讲，会大幅显著高于市场明年的普遍预期。

    这要搁在美股，那得一轮暴涨，搁大A，竟然是兑现预期。

    昨天21世纪经济报道说，易中天审美疲劳，估值泡沫，

    真是笑了，光模块40倍pe还在高速增长，如果它们贵了，A股的科技还有什么便宜？

    昨天涨停的360，800亿市值，-517倍市盈率。

    但也没办法，这就是大A和咱们的财经主流，充满了小农意识和小资产阶级软弱性。

    “竖子不足与谋也”，这下你知道为什么十五五不提金融强国。

    但情况就这样，我们能怎么办？

    了解自己的投资风格和风险偏好，

    -看日线的操作流，就要耳听八方眼观六路，重视均线和图形，需知大A的多空随时转换，

    要能够接受回撤是股市必然的规律，形成自己的纪律和规则，跌破走，站稳进，

    图形标准，我们讲过很多次。

    再不厌其烦的给心同学们普及下，

    【大多数散户亏钱，并不是因为止损主线，而是主线出来后没有空出仓位，而去玩了杂毛，等科技再起来后两头挨打】。

    大多数散户只能在主线核心的主升浪里挣钱，基本很难在切换里波段里赚钱。

    试图买在最低卖在最高是一个执念，要接受自己的不完美。

    学艺不精的有什么策略，右上角搜索“新手菜鸟”，保险已经冲出新高了。

    -如果你是产业投资流派，就把时间放到月线，季线，年线的角度看问题，既接受50%的暴涨，也接受30%的回撤，

    这是心力对极大的考验，所以etf定投成了较佳选择。

    如果你想兼顾呢？很难。真要搞，就拿得少，拿得精，重视重要均线，

    战略上藐视敌人，战术上重视敌人，

    做一个冰冷的买卖机器。

    3040以来，市场尚没有进行过什么像样的调整，如果这次给了调整，那就是给了2026年一个非常黄金的机会。

    前面的只是练手，后面的才是主升。

    2025年以后，

    房子，股票，工作，企业，成长，

    无一不是要二八分化。

    【现在四六分化而已，很多人已经受不了，后面告诉你要二八，岂不是得疯？】

    有些人的苦日子还没来呢，

    刚刚开始。

    有些人的好日子也没来呢，

    也才刚刚开始。

    K线上沿，我们在路上。

