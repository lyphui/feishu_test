    靠什么继续放量

    最近有些同学可能是不适应局面的，

    因为你要么熟悉了熊市，

    要么熟悉游资和量化的玩法，没定心。

    牛市是由机构主导，

    而机构的打法，是推土机式的，

    用军事学术语叫做”步坦协同弹幕徐进”，

    一路慢慢压上去，涨上去。

    因此科技这块，

    1，目前拿着海外算力链的，PCB光模块尤其是液冷电源的，

    拿着享受主升浪就行了，图没走坏就拿着，当然你得保证你的是正宗品种，不能是蹭概念的杂毛。

    今天液冷可能就要分歧，观察谁在抵抗谁护盘意愿更强。

    核心当然是进入英伟达链的。

    目前市场的核心主线板块，就是英伟达链，创业板指已由胜宏易中天等把持。

    2，如果没有，或者踏空了，要么就等待主线较大的暴跌，

    要么就去看相对低位的板块，目前两个，

    a，一个国产ASIC芯片的那些，虽然切的不流畅，但资金有，东伟达就不提了，芯原，炬芯等先后新高，东微半导在爆发，再往后的soc,AIDC 等也有机会。

    这里不会的，简单的是ETF588200，已经新高了。

    b，一个是华为链，哪一轮牛市少不了华为，9月一般都是华为月，没想到资金太热一下子给拉上去了。

    华为电源/变压器：科泰，良信，光模块：华工，光迅，PCB：生益科技，液冷：川润，申菱，科创新源，铜链接：华丰科技，沃尔核材。

    华为CANN:东方国信。

    目前看，科泰很有可能成为龙头。

    另外就是华为生态那些，润和软通之类，

    华为系大部分业绩不惊艳，没有那么流畅，走的是进二退一的模式。

    值得一提的是，华为机器人有个新锐，也可能进入特斯拉链，安培龙。

    3,大盘目前3700点，成交量能2.8万亿，

    后面还是要涨的，得4000,4200,量能得3万亿以上。

    后面一个很大的主力要靠反内卷和消费。

    反内卷目前看以阳光电源为代表的低PE和资源股为主，

    消费的三个板块不赘述，

    目前看好的还是游戏，巨人，冰川，华通前排，后面的神州泰岳，游族等补涨。

    最后谈谈券商，牛市必涨券商

