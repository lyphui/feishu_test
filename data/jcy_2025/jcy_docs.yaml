    继续给出更大的性价比呗。

    大王对胜宏不够精确了解，据说26年85亿净利润，那你估一下现在PE多少。

    相对了解的是易中天，我们讲过多次旭创，26年利润250亿，你按40倍pe算它是多少，按20倍算，它市值多少。

    你再按这个利润看它现在，多少倍pe。

    科技目前并没有解除风险，它什么时候企稳可以加大仓位？

    易中天胜在55日线附近站稳脚跟，来一波放量较大冲锋后再回踩。

    那时，科技将拉开新一轮反攻和疯狂上涨的序幕。

    之前4个月的上涨，都不能算涨，真正的大战和加速都还没有到来。

    日子不远了，静待！'
