    红八月结构分析与展望

    整体仍走高低切和补涨态势，复习&展望一下。

    一、高位：

    海外算力，尤其是pcb，光模块。

    高位中的相对低位，

    铜链接：即博创太辰光瑞可达等轮着涨，鼎通减持剔除，也涨够了。

    这里头二线，长光，兆龙互联，沃尔等。

    液冷：英维克，川环，依米康等。

    电源(hvdc)：欧陆通，麦格米特，中恒，科泰，禾望等。

    之前跟clan同学谈到川环给英伟达送样，今天开始大资金介入的趋势进一步加强)。英维克，麦格米特都是英伟达供应商。

    (注意啊，搞他们的方法不是追高，而是是涨别的板块时，趁调整吸他们等轮动)

    二、相对低位。

    A国产算力：

    算力芯片代表，东芯，寒王，海光等。

    东芯很可能是这一轮龙头。

    应用芯片代表，

    soc，炬芯科技，芯原，翱捷，瑞芯微等。

    mcu，纳芯微思瑞浦，偏汽车一点，这哥俩现在是低位啊，位置比soc还低。

    请注意，H20放开，中美缓和，涨海外算力，H20有问题，中美不合，涨国产芯片。

    B，国产AIDC (算力机房)

    虽然是国产算力，但受益于H20放开，其实和国产芯片是对冲的。

    润泽科技，奥飞数据等。

    弘信电子既有国产燧原和摩尔线程的芯片，又有H20，还是当国产算力看，最近在打压式吸筹。

    只有国产AIDC 大涨之后，才能轮到国资云，

    铜牛信息，云赛智联，首都在线等。

    C,Ai 应用。前文专门阐述。

    这里正好板块，新手和技术不好的看etf即可，比如我们提过的588200或159899。

    三、绝对低位：

    反内卷与消费。

    反内卷不赘述了。

    消费有什么好看的？

    首当其冲就是游戏，既踩AI，又踩消费，关键是有业绩，

    第二是我们提过长期趋势的两样，

    提神饮料与宠物食品。

    提神饮料东鹏，宠物食品，中宠，乖宝，一段消停后又能看了。

    第三是新消费。

    各种乱七八糟的谷子经济等，曼卡龙，水羊股份，元隆雅图等，多少看谁有点业绩吧。

    消费看谁？其实要看香港的老庙黄金，兼看ppmt，它稳了，大A的消费就开始跟了。

    请注意啊，这里因为过低，你得等资金流入站稳才行，不要一头扎。当然，你有耐心低吸两个礼拜也行。

    最后，不高不低，整体略高的是机器人，

    机器人，妖的是长胜，前排是福达，秦川，豪能，中大，等代表的摆线减速器，中间震裕科技，江苏雷利，绿的谐波等，

    这个主要是8月份几个事件催化，目前相对零散，搞机器人etf依然是最好的。

    目前，机构抱团仍是主流，

    在海外算力，国产芯片，游戏，军工，创新药，AI应用这几个领域抱团。

    如果没有港股/恒生创新药ETF,20 日线处建仓机会。

    八月，比七月难搞很多，

    七月时，高位就是高位，低位就是低位。

    八月时，高地位纠缠在一起很难搞。

    七月有七月和B宝啊，

    八月没有。

    恭喜上车东芯的同学们，首阴回马枪。

    这种杀进去的前提条件，

    1，它是龙头。2，趋势恰好切到。3，大环境和政策支持。

    游戏etf马上新高，被洗出去了吗？'
