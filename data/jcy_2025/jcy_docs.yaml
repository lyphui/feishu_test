  文档内容正文: '易经第34雷天大壮:投身时代洪流

    易经的下卦，是从第30咸卦，少男少女谈恋爱开始的。

    恋爱谈了，婚结了，婆媳关系处理了，男人又正值壮年，该图谋正事了。

    这就是34卦。

    大壮。利贞。

    《象》曰：雷在天上，大壮，君子以非礼弗履。

    大壮卦利于坚守正道，

    这卦的景象，下卦为天，上卦为震，天鸣雷，云雷滚，声势宏大，阳气盛壮，万物生长，大而且壮，故名“大壮”。

    君子看到这种意境，才明白要融入时代的洪流，不要做没有礼教的事情。

    很多人都觉得成事要靠勤奋辛苦，错了，第一件事是抬头看路，搞清楚主线在哪里。

    就像之前大王给一个朋友讲的，哪怕你卖盒饭，你要做头部企业的生意，后来他想办法成功打进一个电池龙头公司所在的大楼，那都是后话了。

    初九：壮于趾，征凶，有孚。

    象曰：壮于趾，其孚穷也。

    强壮在脚趾上，不宜急躁冒进，要诚信自守。

    时代的主线刚出来的时候，可以边观察边趁低点建仓，这时候你比较弱小，潮流也难免有反复

    就像秦末起义，一开始声势最大的是陈胜吴广，结果秦军主力就奔着他来，很快gg，

    而刘邦是怎么干的？他是看到项梁项羽等六国贵族代表的机构主力下场后，才右侧交易，趁市场调整，冲进咸阳抄底。

    九二：贞吉。

    象曰：九二贞吉，以中也。

    虽然形势很好，强壮到了小腿，你也要秉承中庸之道。

    有些人看到形势大好，潮流滚滚，就喜欢一把梭哈，全部压上，大干快上，猛加杠杆。

    潮流的热闹和自己头脑的清醒并不冲突，

    现在全国最优秀的房企是谁？杭州的滨江。什么恒大，万科，绿地等等，都风流被雨打风吹去。

    地产最热的时候，戚老板只专注杭州和华东，浙江都不愿意踏出，

    别人劝他多拿地，他挂在嘴上的是，

    “看得清形势，摆得正位置”，

    现在别的房企一文钱难倒英雄汉了，

    2024年底，滨江账上趴着324亿现金。

    九三：小人用壮，君子用罔，贞厉。羝羊触藩，赢其角。

    象曰：小人用壮，君子同也。

    小人依仗力量喜欢逞强，就像公羊去顶篱笆，角被卡住了。

    君子不会这样，会用网，会网开一面，会懂得克制使用力量。

    很多人人到中年之后，确实壮了，挣了钱，做了点事，觉得自己牛了，固执己见，觉得你们懂什么，拍脑袋上一堆项目或者胡乱做决策，结果架上自己不下来了，成了“老登”而君子不论贫富贵贱，都不忘谦和为本，从不蛮横。

    人开始犯错，往往是觉得自己nb开始的。

    所以你平时看到大领导都平易近人，小人物嚣张跋扈。

    九四，贞吉，悔亡（wáng）。藩决不羸（léi），壮于大舆（yú）之輹（fù）。

    象曰：藩决不赢，尚往也。

    经过之前的教训，你学会了怎么正确使用力量，悔恨消失了，篱笆破了，卡进去羊角拔出来了，此时你强壮得像大车的轮子一样。

    乔布斯就是这样老乔把苹果做起来后目中无人，被董事会赶出公司，期间他修身养性修禅，再回苹果，终成一代宗师。

    马斯克也如此，成为钢铁侠后自觉无所不能，要去玩政治，鼻青脸肿滚出白宫，重新回归主业，特斯拉历史新高，他也即将成为首位身价万亿美元的富豪。

    六五：丧羊于甚，无悔。

    象曰：丧羊于易，位不当也。

    易，通“埸”，为边界之意。在边界处丢失了羊，没有懊悔，因为位置不当。

    即使是主升浪和大趋势，也不是什么钱都能赚的，能力圈范围之外的，得不到也不要有想法，看开点，何必分光吃净呢？

    红星美凯龙本来抓住趋势，家居卖场做的好好的，非要去搞房地产，主副业一起玩玩，卖身求生。

    中南建设本来搞工程和建筑的，挣点辛苦钱挺好，非要去当甲方盖亚洲第一高楼，现在变成了不良资产。

    上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。

    象曰：不能退，不能遂，不详也。艰则吉，咎不长也。

    强求自己能力和认知范围之外的东西，就像公羊又去顶篱笆，角卡住了，退也退不回，进也进不去。

    咋办呢？只有在艰难中忍耐，等到周期反转的那一天。

    小目标老王同志就是这样，现在骑虎难下，怎么办？扛着呗。

    雷天大壮告诉的是普通人如何抓住机会，

    刚来的时候就要参与，要信早信，

    在趋势发展的过程中，逢调整推高仓位，

    在形势明朗和大局砥定的时刻买定离手，

    不要轻狂，时刻反省，当你强大的时候，最大的敌人往往不是别人，而是你自己的“傲气”和“蛮力”，

    坚信趋势，收敛锋芒，才是真正的“大壮”。

    下周，迎接一轮主线的归来和春季躁动。

    冬至福至，天地合德

    今天是2025年的冬至日，不仅是太阳直射南回归线的一天，更是“天地合德四喜日”，

    需要冬至日与四大吉辰，

    即天赦日、天愿日、天德合、月德合，同时重合。

    这种组合极为罕见，是难得一见的祥瑞，下一次要等到2105年。

    离火运，文化复兴，

    连官媒都在纷纷庆贺。

    在道观为按中国传统习俗，

    为大家祈福，“上表”。

    祝各位冬至福至，阖家团圆，

    得天地能量加持，有四方福缘汇聚，

    好运又一年。

    2105再见时，你依然是少年~'
