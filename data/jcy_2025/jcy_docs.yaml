  文档内容正文: "谈一谈股性 \n前两天讲俄乌停战，提到了工程机械，这是题材概念， \n昨天在隔壁讲了《工程机械新周期》我们用几个案例，来体验一下什么是股性。\
    \ \n1，提起机械你首先会想起三一重工，中国卷王，业绩确实可以， \n但你看它的走势，和工程机械板块相比，明显弱。 \n三一早就跌破60日线，板块强势横盘，如果你再切换到周线，更易理解。\
    \ \n2，我们再看徐工机械，走势还行，但三个月内，从无7%以上大涨。 \n缺乏大涨历练，也不行。 \n3，中联重科，有8%以上大涨，然而，没有涨停，跳空高开缺口只有一个。\
    \ \n相比的柳工，有涨停，有两个跳空高开缺口。 \n4，恒立液压，在11月21，大盘跌破60日线，跳空低开的时候，它逆势反而涨了2.69，关键时候有护盘。\
    \ \n5，工程机械属于周期行业，温吞吞慢涨，很少有一个礼拜飙升快30个点，哎，山推股份就能，搞出一波主升浪。 \n看到这里你已经对股性有了理解， \n-个股走势要强于板块走势，\
    \ \n-最近要有涨停经历， \n-关键时候能够抗跌， \n-跳空高开且不补，越多越好。 \n-最好玩过主升浪模型，一把爽起来。 \n-波动幅度越小越好，别搞得人心脏受不了。\
    \ \nok，柳工的国际化40%以上，尤其在一带一路发展不错，12倍pe，山推的AI智能化搞得不错，电动化领先，挖机细分龙头，13倍pe，恒立抗跌且有主力护盘，行业龙头。\
    \ \n工程机械etf=柳工+山推+恒立。 \n可以看起来，什么时候可能迎来较好的点？再消化消化，最好是趁大盘回调杀一杀，12月中上旬再看。 \n现在关心留意起来。\
    \ \n至于你说大盘怎么走？ \n重要结论忘了吗？ \n有中签摩尔同学么？ \n大涨拿着，砸了就先跑一部分。\n好了 \n先有地量，再有地价 \n当你学过量子物理，\
    \ \n就知道这个世界没有时间， \n时间只是空间的运动过程。 \n也没有价格， \n价格只是量能运动的结果体现。 \n就像你们小区的房子，卖的人量大，就便宜，买的人量大，就贵。\
    \ \n今天量能掉到了1.59万亿， \n基本就是底部区域， \n说明反复冲高回落也刷洗不动了， \n比如博创这种，这几天连续都是60多亿的成交额，超过了上一轮上涨时期。\
    \ \n在15号，我们再次讲科技要回来，会是新的东西，如今已确定是谷歌链。 \n“种桃道士何处去， \n前度刘郎今又来”。 \n这段时间，很多科技的累计换手率已经接近50%，相当于所有筹码重新洗了一遍。\
