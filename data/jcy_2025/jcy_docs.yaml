    蓬勃的发展和火属性行业，会在本期间达到高潮，火是科技，通信，游戏传媒，Ai应用等。

    在定性之后我们根据筹码结构和定量做出更细致的分析。

    1，年度最强板块，海外算力代表的女方，在三季报前后或者10月下旬11月初，可能有加速，冲刺，登顶的态势，之后就是阶段性减仓和止盈之时。

