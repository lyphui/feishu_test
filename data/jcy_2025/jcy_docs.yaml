    生理年龄与认知代差

    迪王昨天发布了天神之眼的智驾，东西很好，很卷，但没有超预期。

    不够刺激，今天也没带动大盘。

    就在2年前，老王根本看不上智驾，明确说那是骗子，忽悠，皇帝的新装。

    现在为什么全系要上?

    急了，看到趋势了。

    但说实话，迪王的智驾在圈内也就是三流，跟别人差远了。

    你根本就没储备，怎么会瞬间起来呢?

    如果你把车圈大佬们的年龄看一下，特别有意思。

    1.王传福: 1966年生, 60岁,

    2.李斌: 1974年生,52岁,

    4.何小鹏: 1977年生, 49岁

    5.李想: 1981年生, 45岁。

    王传福是60后，60岁的人了，他的“跨代际认知有问题”，

    年龄越大，越会自我封闭，不愿了解解年轻人的心态和拥抱新鲜事物，这是人性的普遍弱点。

    如果你再是功成名就的，更容易霸道固执，觉得自己是对的。

    60岁的王传福只是不愿意相信自动驾驶，

    70岁的丰田章男，他连电动车都不信，

    丰田在电动化上面举步迟缓。

    年龄大了就天然容易被时代抛弃，这是历史规律。

    所以怎样让自己心理永远年轻?

    第一，是永远要有赤子心态，对一切新生事物保持好学热情，当初学者不丢人。

    第二，要有开放式的认知架构，多听让年轻人说，构建知识网络和储备，终身学习，

    第三，敢于放权，敢于反省，敢于放下架子，给不同意见留足空间，而不是上来下结论。

    你看任正非老爷子，80多了，心态上就突破了心理年龄的限制，华为依然锐意进取，

    多跟00后吃饭，喝茶，看电影，一起玩，听他们讲故事，你的心态会非常年轻，

    连带着生理年龄也会年轻化，

    所以成功就那么一句话，

    阅尽千帆，归来仍是少年。

    你说你不认识00后，跟自己儿子闺女玩啊，问题是，你把人家当平等的朋友了吗?

