    大尺度看确定性(1)

    大人，时代变了，以前的大盘涨，

    是喝酒吃药开车，拉主线，

    信创和顺周期，拉底部。

    现在不一样了，

    1，以前的消费代表是白酒，现在是乳业，商超，喝酒的改喝奶了。

    商超肩负拉动内需的作用，股东厉害和带免税的高看一眼。

    乳业有表现的是区域性品种，弹性比较大的，比如贝因美、熊猫、燕塘。

    新三板有个骑士。

    奶酪会成新兴亮点，如妙可蓝多。

    不要觉得消费萎靡，乳业的利润是在回升的。

    结合日本的经验，烈性酒从餐饮超市中大面积消失，取而代之的是功能性饮料，主打提神醒脑，够社畜喝很多年。

    日本是力保健，

    大A典型代表是东鹏饮料。

    2，以前的自主创新，代表是信创，现在是MCU芯片，成熟制程，自主可控。

