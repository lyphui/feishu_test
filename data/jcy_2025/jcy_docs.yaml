  文档内容正文: '可以期待十月

    有些人总是怕涨，怕一涨就疯牛。

    各种拿券商和权重的压盘砸盘。

    也是服了这票人才，市场不行的时候你求着大家来买，大家来买了你又矫情了，

    昨天回落把20日线给击穿了。

    之前我们谈过20日线的收复和操作，

    如果今天是放量的修复，可以继续拿着，

    如果是缩量（量能2.5万亿以下，盘中可以看量比）的弱修复，甚至跌穿不回来呢，

    我们要看到，

    过去99次跌破20日线，大盘平均也就调整8天，再跌3%左右。

    考虑到这次生产队非要故意压盘，以及量化横行，如果你技术和抗压能力一般，有一个选择你是可以做的，

    那就是趁高减仓。

    减谁？高位看图形。

    去弱留强，昨天个股里抄了底，今天高开或者盘中涨不动的，其他好几天已经涨不动的、跌破5日平台的，不涨就是错。

    留下的大概仓位呢？5-7成比较科学，毕竟这是牛市。

    这个不能一概而论，如果你手里东西比较强势，人家趋势还在，图形好端端的，天天红，继续。

    我们估计点位不会有太大波动，3700点左右差不了，但个股和板块的波动可能非常剧烈。

    谁可以不用做太大动作呢？

    还是我们昨天说的恒生科技指数，倒车接人的观点不变，点位又不高，国际化的市场总不能天天在那边微操。

    九月历来是非常动荡的一个月，既然，万一跌破20不拉回反正修复要一个礼拜，倒不如空出胃口，等把那些好东西杀下来，正好也十一前后了。

    如果市场猛杀一下，牛没了的呼声再起来了，则又是一次腾笼换鸟，踏空和没跟住抱团的，新来同学的又一次好机会。

    届时，我是既希望，又不希望更一篇《被误伤的优质科技》。

    不要急，天天想买卖和收益成反比，

    要去搞“势能”，势如扩弩，节如发机。

    小群上次割了胜宏，一身轻松，这回想明白了要做AI的朋友，昨天去扫了富联。

    会不会又成反指？

    十月比9月好很多，

    之前我们说九月乙酉，有些人脚会受伤，哪里被割破，会被人辜负，

    十月是丁戌，火在库里，很旺。

    各个板块的观点保持不变，大盘波动，影响不了它们的长期价值，

    这是牛市。

