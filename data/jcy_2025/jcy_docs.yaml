    再创新高

    高低切的道理讲过N+1次，

    海外算力，必然是要往国产算力切的，

    中国牛，涨一堆英伟达链算什么？

    昨天说国产领域势必起来，

    一个是国产算力，一个华为链。

    1.国产算力，讲东伟达会扛旗，东芯过后寒王接棒。

    寒王就是ASIC，主打算力概念，紧跟东伟达的芯原，翱捷等，尤其芯原，今天再度长阳。

    寒王上1000简直是一定的事，轮到他了，不上也得上。

    就问大家，外面谁敢告诉你寒王没涨够。

    Asic的细分领域，还有端侧AI的soc等，不都慢慢起来了吗？

    赵子龙的云天励飞，让坚决拿住。

    瑞王，反复告诉大家主力在140吸筹，初步看到200，不好好学习上车低位的，我也没办法。

    2.你再看华为链，今天华为系的液冷电源pcb光模块等，科泰，生益，申菱，川润，华工等，表现明显好于n链。

    新来的同学可能不知道，

    单就算力领域的价值量，

    单就算力领域的价值量，

    pcb≈光模块>铜链接>液冷>电源>交换机。

    华为光模块光迅先涨停吧？

    题外话，华为的路线更侧重铜，今天铜光互补的几个，尤其是博创，表现非常不错。

    最早讲易中天，他们已经翻倍了，

    再给大家讲补涨的博创，基本每篇都提的团宠，多次20日线给机会，讲时50字头，现在100打头。

    3.再回到海外算力，高低切人是高度要挺住，国产涨不等于他们一定要狂跌，因为产业逻辑未变。

    英皇昨天“大跌”今天又跌，上午你怕不怕割不割。

    给大家说液冷电源没走完，

    还有敢10个点追高，回调到4个点不敢加的科泰，今天上午又跌-5%你敢不敢吸？

    给你冲到历史新高。

    你要庆幸碰到了牛市，牛市不会把你套死，

    你也要庆幸碰到了大王，因为把这个真理讲给你。

    普通人为啥容易在牛市亏钱，起伏太大了， 一波动你就割肉，割几次条件反射。

    把这套双轮驱动和高低切的模式学会了。

    干完了东王再切去干寒王，

    干不动寒王去干芯原，

    简直不要太爽死。

    就算买不了科创，588200，今天-+4.9%不爽吗？

    到了离火大运，更是有点阴盛阳衰啊，

    你看咱们这里的小姐姐们个个杀伐决断，坚韧不拔，听得进话，

    有些男同学们那个随波逐流，坐卧不安，你有啥怕的。

    所以多请身边那些出色的姑娘和女神们吃饭。

    我到现在还记得，寒王跌到500左右，明天幸福同学去健身房撸铁抵抗压力，回来说看到按摩贴坚定多了。

    你要坚信你明天幸福，你才能幸福。

    你要是不够幸福，就是不坚信。

