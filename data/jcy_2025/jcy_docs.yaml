    天心月圆：君子坦荡荡小人长戚戚，所有心术不正的人都走不远的。

    天心月圆：蠢的本质其实就是坏。

    黄贵华：最大的教训就是不汲取教训，是也！日省方能日进

    大丽出奇迹 回复 天心月圆：坏的本质也是蠢，只看眼前利益

