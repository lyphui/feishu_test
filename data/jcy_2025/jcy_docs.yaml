    如何去踩对节奏

    铲子核心博创今天继续新高，

    还在车上的同学举个手。

    技术流可能在豹子号的88.88或者90.99T一下，非技术的继续拿着观望也没错。

    海外算力链从6月以来走的是大牛市，

    此前多次跟大家讲过硬件的的几个环节，

    错过了PCB还有光模块，错过了光模块还有电源液冷，再错过了还有铜链接，交换机，

    博创本职是铜链接，收购的长芯给光模块卖铲子，又焉能不跟呢？

    它一打开，后排的瑞可达，鼎通甚至沃尔之类不就跟上了吗？

    一些同学为什么总是感觉踩不对节奏，

    1，光去看k线了，被波动吓到，对于确定性明显的产业逻辑信心不足。

    比如英伟达新高，他的业绩炸裂的中国供应商就算不新高，也得深V吧。

    2，操作上爱追涨，看什么涨了，后悔拍大腿，当天或次日一早追进去，买的还是后排，结果冲高回落一下给套了。

    正确做法是，如果你手并不快，就只能埋伏，不能跟电风扇，这个板块大热，你不要追，待它调整消停的期间，从容分几 次绿盘进龙头，等风口再转回来。

    易中天这么猛，之前盘中跌4%比比皆是，博创更是一度到了20日线。

    那么埋伏什么板块？好几天有资金进入，还没有猛拉的那些，总体低位比高位好。

    3，对短期收益看不上，总想一把来个20cm涨停，不愿意等，之前跟大家谈的PCB预期差，军工+核电+电子布的菲利华， 10号到现在，涨了20%多。

    你天天追涨杀跌有20%吗？

    即使ETF，港股创新药也新高了。

    4，喜欢频繁操作，本来追高了板块，套了就等它轮动回来，你一看几天不涨割了，结果它隔天涨了，两头挨打， 牛顿早已证明，操作和收益率成反比。

    所以，踩对节奏，本质是看着市场的主流方向，盯着龙头，埋伏在下一个轮动或低位板块的耐心行为。

    那么目前市场的主流方向在哪？如何传导，不厌其烦的讲了很多遍高低切，可以往前仔细翻翻，主体逻辑目前并无较大变 化。

    今天的冲高回落依然是主力驯化市场，消化180亿抽血和人寿清空杭州银行的利空，

    明天直接来一个低开或者高开后下探到3494附近，新的上涨又会继续开启。

    评论区：

    胡：我就是6月13号追高买的创新药etf，结果赶上伊朗战争跌了半个月，中间错过了其他机会，逢低加仓了一点创新药，还好 这几天终于涨回来几个点。反思下以后不能追高了，提前埋伏多好。

