  文档内容正文: '预期你预期的预期

    明天早上，英伟达将公布财报。

    在此之前，大家可能听到了很多清仓它的消息。

    原因大同小异。

    美帝的AI涨太多了，拥挤度太高了，都挤在七仙女。

    而我们拥挤度早在9.24就已到了40%,

    现在调整到了27%多，

    因此，必然会有资金去预期你的预期，

    提前进入科技。

    因为局势还不完全明朗，他们的步子不会太大，仓位不会过重，这就是大盘走的纠结的主要原因。

    市场反弹之两大方向的判断依然会持续。

    都这会了，该备战2026了。

    哪怕的是短线角度，

    也该重新看好科技了，

    会操作的同学，

    轻跌轻买，重叠重买，保留底仓，控制仓位，认量不认人。

    既要抄底，也做好抄错的准备。

    从细分上说，

    AI应用活跃，国产芯片和海外算力都有机会，

    昨天的588200逆势先红，

    有人先走一步？

    归来的先声

    丁亥概念和科技主线争夺主导权，

    市场缩量，当然题材占优点。

    下半个月，进入亥水时代，果然涨了水产，捕鱼，船舶，当时给会玩的讲了国联。

    当然难度很高，不是一般人能搞，

    其实它们你超级均线之前也走出来了。

    科技归来果然如我们期待的，

    新一轮就看谷歌链和光芯片，

    你发现今天涨的头排都是它们，

    更发现校花明显比后排强，

    有光的比pcb强，

    有些软件已经推出了“硅光概念”，

    值得关注。

    1.7万亿左右大概是成交量的底部。

    有预期了别人预期的同学吗'
