    反内卷的风，陆续吹到锂电、汽车、风电、猪。

    旧产能涨了不重要，谁是要涨的新能产能很重要。

    2015年，去的产能是煤炭，钢铁，水泥，但萌芽的是光伏，锂电，汽车。

    然后他们整整涨了8年。

    2025年，去的是光伏，锂电，汽车，那么，谁是新一轮的受益者和新的宁王，迪王们？

    看趋势是以下几个：

    人工智能、创新药、机器人、新消费、文娱传媒。

    上一轮，叫做”战略新兴产业”，

    这一轮，叫做“新发展格局”。

    你看最高层会议后，浙江的表态，

    《趋势性关键性重大问题》明牌了。

    2015年时，大家看新能车模模糊糊，就像现在现在人们看AI制药迷迷糊糊。

    其他几个产业也一样。

    不用在意一两天的电风扇，

    看住新的小甜甜。

    浙江的出海新三样：

    网文、网剧、网游。

    什么《霸道总裁爱上我》，《开局继承二十亿》《白宫精英爱上保洁大妈》《重生之之在纽约当大亨》之类，老美一样爱看。

