  文档内容正文: '引言

    如果让你带着现在知识技能和财富，

    穿越回2008年，

    你最想干的事是什么?

    很多人都会选择买房，各种借钱，各种上杠杆，打死也要买。

    为什么?因为你对未来的判断无比笃定。

    今天同样如此，

    如果你能预见到未来5-10年的态势，打开了战场的迷雾和地图，

    你还会焦虑彷徨么?

    在未来看现在，我们从宏观和微观两个角度展开，

    第一个，是宏观格局的角度。

    9月底以来，中国资产开启了一轮修复，

    央行、财政、发改、住建、金管等部门的接连召开了推动增长发展的大会，一把手亲自出席且全场直播，几乎史无前例。

    请问，这些会是给谁开的?这些政策是给谁用的?真为了几个散户?

    外资医院、电信业务、基因服务等口子，是开给了谁?

    主要的玩家是谁?风在哪，你怎么蹭车?

    方向都搞不明白，要么你上车太晚，要么你下车太早，或者干脆走反了，

    最后捶胸顿足。

    人一生巨大财富增值的机会有几次?

    第二个，是微观发展的角度。

    上学的时候，我们要借鉴班上尖子生的学习方法，

    工作以后，我们要从大佬们的身上看到转向灯的深刻寓意，

    河南的高考状元，曾经被誉为“东方巴菲特”的资本大佬张磊，为何在销声匿迹了一段时间之后，又成为了座上宾?

    学霸把卷子摊给你看了，你能其中抄出什么东西，如何给自己加分?

    这篇文章，是我们星球财经院的重磅底层代码系列，

    我们会告诉大家，

    ■现在牌桌上的玩家都是谁?

    ■顶层的庄家和大佬们，怎么布局，怎么赚钱，

    ■未来10年，中国财富架构的态势，什么样子，

    ■大佬们在一鱼三吃，你如何看懂信号喝口汤，

    个人上车的机会，下车的节点，

    即使你不炒股，不投资，只要你还在参与我们的商业循环，以下的深度内容就跟你息息相关。

    这些很大概率上，会颠覆你认知，却无比现实，即使你是科班出身的专业人士，也可能是第一次接触如此俯瞰视角的全图。

    不谋全局者，不足谋一域，

    不谋万世者，不足谋一时。

    在这个你的钱就是央行负债，你的存款就是别人贷款的年代，没有人可以在国际局势和周期的大轮动中独善其身。

    为了避免有些人搞破坏和发泄情绪，本文象征性的设置了1元的门槛，以使内容可以长期保留。

    这1元钱你所能学到的东西，超出绝大多数经济与金融教材。

    财经院的同学就不建议购买了，内容虽有升级延伸，但星球里已经谈了主体内容。

    01

    第一，玩家都有谁。

    待过职场和公司的都知道，经理人、高管、哪怕是副总们，喜欢把眼光放在内部，自己有什么不足，谁谁谁好不好，哪项制度是不是合理，等等。

    然而，你如果不站在董事长的角度看几遍问题，你就没法笃定自身的位置和心态。

    请问董事长们一般关心什么?他们的精力更多放在友商和竞争对手，没太多功夫管你内部的小事。

    为何?对手搞趴下了，市场让出来，巨大的利益空间覆盖你那点努力，毛毛雨。

    现在全世界，请问主要的玩家有谁?

    中、美、欧、俄，其他。

    那么今天还在坐在牌桌上，自身是和平稳定发展状态，能够推动科技革命的，还剩下谁?

    就中美。

    俄国和欧盟，先后错失了两次工业革命，以计算机、互联网为代表的第三次科技革命，以新能源、人工智能为代表的第四次工业革命。

    但这些人都还有老底子，欧盟有财富的老底子，俄国有军事的老底子，

    不管怎么样，俄乌开打了，消耗老底子的两家，被赶下牌桌了。

    你看看欧元的汇率，从成立以来对美元和人民币的一路下跌就知道，

    再看看俄国那些库存坦克的消耗和无力的军工产业就知道，

    从15世纪以来，从大航海时代、从拿破仑、彼得大帝以来，

    那些欧洲联盟、欧共体、东西欧联合的梦想，彻底破灭了。

    玩家就剩下G2。

    大佬们都是从百年的角度看问题的，以后你看G2的恩怨情仇就行了。

    可笑的是，天天闹着搞多极化的欧盟和俄国，一番折腾下来，

    把世界变的更单极了。

    单极，从资产的角度来说，G2就是一枚硬币正反面。

    在反面做T和通吃，有一个人体现的淋漓尽致。

    02

    第二，个人怎么看标杆。

    在中国当职业经理人，你能做到的极限是什么?

    大概就是唐骏那种，微软中国区总裁，终身荣誉总裁。

    在中国搞投资，你能做到的极限是什么?

    高瓴资本的张磊那种，

    河南高考状元出身，到美国耶鲁读书，结识全球最顶尖的资本大鳄，拿着最聪明的前，掌握最高级的逻辑和方法。

    回国之后，先后从腾讯、京东、宁王等身上大赚特赚，从一个标准的寒门子弟，到身价数百亿，变成胡润富豪榜的常客。

    张磊做对了什么?

    2005年，张磊成立高瓴资本，

    那时候美元兑人民币8.21，

    美元进来，一块可以兑8块2人民币，

    2008金融危机以后，美联储超级放水，高瓴把更多的美元兑回中国。

    随后，美元兑人民币持续下跌。

    2013年，美元兑人民币跌到6.0，张磊开始募人民币基金，首期规模300亿。

    如果这笔钱，接盘之前面美元进来的基金份额，还掉之前借的美元，

    相当于，大佬先是在8块钱的价格，把美元换成人民币，再用6块的价格买入美元，还掉美元，

    即使投资0收益，2块的汇率差价白赚。

    更大头的是买入资产价格的大涨。

    2014-2019人民币资产开启了一轮波澜壮阔的大涨，

    从2014开始，张磊就进入福布斯排行榜，14年身价是60亿。

    2015年，他是胡润百富第133名。

    2014-2019年，张磊完美抓住了中国所有赛道，

    2019、2020年，美元汇率升到6.8-7.0一线，高瓴大募美元基金，并买入了大量美元债，同年出版了《价值》。

    2021年，防范资本无序扩张，人民币兑美元跌到6.3，这一年开始高瓴就很少投资案例，传说他润的声音不绝于耳。

    此时，是美元加息前夜，如果换成美元出去，完美吃一波2022-2024年5%的美国国债和美股长牛。

    2024年，1美元对人民币，从6.2左右，涨到7.1，张磊又要回来了。

    就是这样的循环往复：

    高价外币进来--换成本币投资--本币开启牛市--本币资产升值--本币汇率上升--出去买入外币-外币开启牛市

    超级大佬就这样反复做T，一鱼三吃，

    外币汇率吃一道，资产升值吃一道，本币汇率再吃一道，

    两边牛市换着吃，

    一生二三轮足矣。

    看不懂复杂的张磊，看最简单的巴菲特一个案例，

    2008，2009年，巴菲特以6.8的汇率，在香港买入比亚迪，

    比亚迪股价增值20倍，老巴先吃一道中国牛，

    2021年巴菲特清仓比亚迪，此时，美元汇率是6.2，老巴吃一道汇率差，

    回国后，老巴靠美国的股债双牛，再吃一道美国牛。

    2024年8月以来，老巴大量减持美国的股票，手里的现金高达1300多亿美元，请问他下一个准备吃什么牛?

    本质再讲一遍：

    “超级大佬们在太平洋两岸做T，在两边的牛市中一鱼三吃，现在轮到吃大国这边的牛”。

    高考状元和学霸可以吃三道利润，你能喝到一道的利润甚至喝点汤，就够了。

    请不要带着有色眼镜和预设立场看任何人，在资本市场的角度，高瓴和张磊当然是优秀的学习对象，只要人家合法合规，就值得我们的尊敬和认可。

    那么，大佬们真的准备吃中国牛吗?他们怎么吃?

    答案是，先解决通道的问题。

    03

    第三，手法就是信号灯。

    搞金融在很多时候，通道很重要，

    甚至比本金都重要，不少同学应该很有体会。

    你的项目很好，他也有钱，

    但它就是没有办法给你，没通道。

    很多搞金融的同学都知道，国内的很多信托、资管、基金、AMC等等，本质都是通道，解决合规的问题，本身并不出钱。

    花大钱，不是父母给小孩手表充零花钱那么简单，牵一发而动全身。

    太平洋对岸的大佬们，没有太多办法直接把美元换成RMB，在全球汇市活跃的日元，就是重要通道。

    现在新闻出来了，中日继续展开货币互换，先搞2000亿，不够继续。

    看不懂的和地摊文学，会告诉你什么RMB国际化，一盘大棋之类。

    货币互换是什么?批条子开通道让大佬们的钱进来。

    钱进来了，RMB资产就要涨了。

    这个都搞不明白，就不懂金融的本质，没有看懂这一轮中国资产的底层逻辑。

    不明白底层逻辑，你就五行不定，心法和内功不踏实，啥也拿不住，

    即使知道几个代码和板块又如何。

    股市有板块轮动的概念，全世界也一样。

    大国牛完，美国牛，

    美国牛完，大国牛。

    下一步，你观察日元汇率就行了，

    但凡日元涨，大A基本就会涨。

    日元如果不配合，首相要么被打死，要么滚蛋换个人。

    现在美元还在高位，是因为美元要换更多的日元，

    日元汇率贬值，是因为美元要换更更多的日元，

    等日元升值，就能换回更多的RMB，

    所以你看到的是，

    日元兑人民币汇率从9月1日开始涨，大王9月2日在星球讲买入创业板指数，

    日元在8月底到10月1日前后维持强势，换回更多资金回流，大A迎来疯牛。

    现在是什么局势?美元还在换日元，没有换完，

    日元才刚刚开始换RMB，为期还早。

    所以你说，牛市才哪到哪?

    你真以为，散户能买出创业板科创板20CM涨停的指数?

    你真觉得，央行、发改、财政、住建部门的会，是开给散户看的吗?

    那些外资医院、电信开放、甚至基因治疗，是开给内资的口子吗?

    政策是为了匹配钱而使用的，

    政策不是为了涨而使用的，

    涨，是因为供需发生变化，抢的人多了。

    所以大王的财经院谈什么?

    是高屋建瓴的视角，是帝王学，是告诉你未来10年中国经济和社会发展的本质规则，如果你这个都搞不明白，就不懂金融的本质，没有看懂这一轮中国资产的根本原因。

    逻辑搞不明白，你就五行不定，即使知道几个代码和板块又如何，啥也拿也不住。

    谁都想赚大钱，谁都想学绝世武功，但你到少林寺里面，先让你劈柴挑水，进了投资公司里面，先让你做报表数据，根本不教招式，为什么?

    先学心法和定力和内功，好让你将来的财富匹配得上心力和认知。

    财富只是人生的一个侧面而已，

    我们星球跟其他圈子最不一样的地方，投资和股

    票的部分，占60%，把助你提升投资和资本市场的判断、认知、心力、技术。

    其余的部分，是国策的剖析、国学的解读、心性的修养、命理的探求，是帮助你成为一个更圆满自在的人。

    如果你是志在科技周期和时代红利中的卓越者，这个高能量的圈子尤其适合你。

    即使你不炒股，取势、明道、优术之后，加入后也能对人生事业职场有很大的帮助。

    有些同学不足的地方在于，因为过去几十年偏才式的流水线教育，导致在经济、财经、金融方面的不够专业和全面，

    我们的另一个星球进阶课，则是一个经济、金融、股市的实战型MBA课堂，深入浅出，通俗易懂。

    多本大师的语音读书会、170多节涉及到资产配置、财富管理等方面的专业课程，深入浅出，通俗易懂，助你快速精进，脱胎换骨。

    附赠的双会员群则大佬潜伏、能人辈出，资源富集，给大家附赠券商开户的优惠费率，更有内部研报及不定时的交流心得操作。

    04

    最后跟大家讲一个西游记的故事，

    这2000亿元的货币互换和更多的热钱通道，就是唐僧肉，

    潘行长就是那个神通广大的齐天大圣，

    西方的大雷音寺，就是美联储。

    东土大唐传经的项目，就是“大国牛”。

    唐僧们取回来的真经，就是美元热钱。

    反正是印的，因此是“无字真经”。

    这个过程中，天庭和大雷音寺，某种意义是一体两面。

    所以，大圣碰到有背景的妖怪，基本不会打，潘行长会去部委搬救兵。

    所以，懂事的小妖们要主动，不要做空天庭给添堵，省的被一棍打死。

    所以，你就更能理解，为何这轮股市的大涨，不是证监，而是潘行发动起来的，他是大师兄，其他都是工具人。

    大道相通。当一个组织内部，遇到系统性衰退、躺平，形成熵增时，为了避免螺旋失速和危机爆发，

    就必须从外部引进竞争和增量，打破内部的山头和利益集团，打通增长通道，形成熵减，带来有序。

    换句你能理解的，就是“以开放促改革”。

    整体大逻辑搞明白了，你再看看自己手里的资产和票，这才哪到哪?

    我们要看到，大国负责任的地方在于，任何一轮上涨，都是要求普惠的，要求民生的，

    比如说，上一次历史大潮的房地产带动城市化，

    大多数人，都是受益者，

    而这一轮大潮的资本带动产业化，也要求足够多的人成为受益者，

    我们的邮政，是人民邮政，我们的银行，是人民银行，

    虽然无工不稳，无商不富，但我们是不允许资本

    无序扩张的，

    站在历史大潮的起点上，

    潮平两岸阔，风正一帆悬，

    相信中国资产，坚定无限未来，

    祝君吉祥！'
- record_id: recur9rzHVlRH7
  文档标题: Vol.18 2020，静悄悄的屠杀
  文档链接: https://h160bxy8czl.feishu.cn/wiki/D1CawkDCZi4tMokoYvmcop9QnL4
  文档内容正文: '整个庚子年，很多人似乎什么也没干，上半年疫情激愤、下半年大选吃瓜，一年就这么要过去了。

    但这一年，富人和巨头们高歌猛进，趁动荡横盘，大举买进各种优质资产，圈下各种稀缺资源，再一次的，一年顶5年。

    特斯拉一年涨了5倍，蔚来从1块涨到40。2020年，北京2000万以上豪宅的成交额460亿，等于17.18.19年总和。

    全国豪宅的老牌标杆，北京龙湖颐和原著，均价1亿元，2019全年只卖掉一套，2020，仅上半年就卖掉6套。

    杭州，信达中心杭州壹号院，千万级改善小豪宅，中签率才6%，富豪们下沉去和中产抢房子，因为2000万以上的豪宅，杭州没存货。

    不提深圳的翻倍行情，仅广州前3季度，别墅网签就1653套大涨一倍，改善住宅全面进入8万+/平米时代。

    直播之王李佳琦，1.3亿买下上海云锦东方，780平，他还有点不满意，因为不够壕。

    豪宅，是稀缺的典型代表，配套、地段、做工、甚至自然资源都是独一无二的。龙湖颐和原著，三大皇家园林畅春园、颐和园、圆明园三园交汇，无从复制，你说这值多少钱？

    同样的，龙头科技企业也是稀缺资源，全中国那么多造电动车的，华尔街就只有理想小鹏等电动三傻，全国那么多企业家，出行教父李斌就一个。

    同样的还有流量，巨头们为什么要进入社区团购，因为资源稀缺，卖菜的毛利高达30%以上。

    最近的反垄断、舆论吹风拾掇巨头是政治行为，迫不得已。因为市场的力量和调控手段，已经压不住巨头了。

    要不是因为打不过，谁愿意亲自下场。

    美国100年，管住巨头了吗？官方其实只是希望，这个拉开的差距小一点、时间长一点，大家都喘口气。

    请记住，只有坦克才能击败坦克，只有奸商才能击败奸商，只有巨头才能克制巨头。

    上面觉得危险，是BATJM才五个巨头太少了，来100个巨头好不好？

    正府都后知后觉，全球吃瓜群众更是如此，到目前为止，很多人依然在看空甚至觉得要动荡，但你有没发现:

    所有的好东西，都很贵、很贵。

    豪宅很贵，东部2000万起;

    茅台很贵，永远供不应求;

    好企业很贵，美团市值万亿;

    好股票很贵，雅迪都涨了6倍;

    富豪们悄悄完成建仓了。

    没人敢公开大肆的说，毕竟和大环境风气不匹配。但事实就是事实，大家在用真金白银投票。

    另一个残酷的事实是，你觉得贵，因为咬牙还是买得起的。

    但是很快，他们贵的你连够都够不着了，如今股价1800的茅台，只买一手18万块，多少人根本买不起。

    就算茅台股价迟早涨的跟酒一样贵，2500/股，但他跟你有关系吗？

    今天大环境不好说“通货膨胀”，但很多现在你还能触及的东西，将狂飙而去。

    怎么办呢？

    第一，资产思维。

    能产生利息/回报/租金/信用的才是资产，其他都是消费品，买回来就亏。比如非要一步到位买个新车。李斌的蔚来一辆卖60万，自己坐个老别克。

    之前我们讲过《聚拢另一半浪费的家产》，把闲钱聚拢聚拢，可花可不花的买成资产，买成基金，买成你熟悉的龙头股。

    第二，只要龙头。

    好东西不是韭菜，其实没法批量生产，要学会发现身边的好资产、好龙头。

    如果要炒股，大家都身在不同的行业，肯定懂自己的门道，去看你本行业最有竞争力的公司的股票即可，只要第一第二。

    如果要买基金，只看1%最优秀的基金经理即可，99%的人都是陪衬。

    如果要买房，承受范围内只看最稀缺最有品质的即可。

    买资产要向上够，尽量一步到位，

    买消费品要向下探，满足需求就行。

    同时，尽量和你那个领域内的大佬、专家、龙头建立私人关系。

    这一点要学习巨头，学习大鳄，人家为什么能做那么大？愿意砸钱，愿意亏本，好东西扑上去咬住不松口。

    像高瓴资本的张磊，一开始在国内搞投资，不讲价、打钱快，产业链每个环节只买第一，不看时间不管多贵。大家以为他是傻子，后来发现大家是傻子。

    第三，强化心力。

    很多人是从400块看好茅台的，但一路看到1800都没下手，怕贵，怕亏。

    心力不够强大。

    贵的东西不一定好，但好的东西一定贵。你要把大量精力用在，研究他好在哪，而不是它贵在哪。

    既然是投资，炒股的一定会被套，买房的肯定遇到横盘，那些割了肉的，是因为缺乏信念。

    普通人建立信念太难，怎么办？一个是要学会自我解脱，投出去了，假设他不是自己的了，一个是要学会自我加强，没事多锻炼身体。华尔街为什么都是健身达人？亏损的压力太大，不是肌肉男，不靠剧烈运动，扛不住。

    悄然间已经是12月的下旬，如果说2020年的主题是“建仓”，那么2021年的主题，就是“拉升”。

    抓紧捋一遍身边的五好吧，他们是未来拉升的力量:

    好资产、好龙头、好证券、好房子、好人才。

    灯塔国，早已不是20%的人占有80%的财富，而是1%的人占有110%，而另外的99%的人负债30%。

    阶层固化，不存在的。岁月静好，不存在的，不经意间就是静悄悄的图屠杀。

    请早早的，屯到你力所能及范围内的“茅台”。'
- record_id: recur9rzyT4Ssr
  文档标题: Vol.17 留给互联网巨头的时间不多了
  文档链接: https://h160bxy8czl.feishu.cn/wiki/AGOtwOH6xirqJ4kw2k0cHzbXnwe
  文档内容正文: '在本星球5天前的文章里，我们提到，《搞社区团购的互联网巨头是引火烧身》，果然，一切未出我们所料。

    再往前追溯的话，我们提到节制资本也是未出所料的。

    风起于青萍之末，这届互联网大厂搞战略的、搞市场的，真心不行，这么明显的信号都看不出来，组织上一再点拨提醒都看不出来。

    也侧面反应了，任何行业和公司，一旦寡头化和垄断化，人才能力立刻指数级下降。

    就在昨天，人民日报批评社区团购，一号首长会议专门提到反垄断。

    这是趋势已经发动，要动手前最后的信号，留给他们的时间不多了，还犹犹豫豫甚至背道而驰的巨头，这次要被教做人了。

    摆在互联网巨头面前有且只有一条路:

    第一，马上旗帜鲜明的宣布拥护上面的决定，认错，讲话，找回企业家精神。

    参考许皮带讲话，你的成功是怎么来的？

    第二，马上宣布停止社区团购，立刻撤出与升斗小民争利的民生性领域，洗心革面，闭关，苦心去钻研硬科技。

    参考任正非北国之春，对科技要有深沉的爱。

    第三，马上宣布积极整改，分拆公司。把放款的平台和卖货的拆开，把既当教练又当运动员的领域让出来，把耗子洞一样横向打通完全自己说了算的洞口堵上。

    维持相关的主业即可，不是相关的，通通撤退、分拆、甩卖、甚至关停。

    参考当年的央企退出房地产领域。

    第四，马上进行深入灵魂的学习，大搞慈善和社会活动，真正去回归商业的伦理和回报社会的本质。

    参考小目标老王同志，

    然而，大王认为，能做到的第一条的可能都不多，更遑论后面的。

    组织上有一句很重的话，叫做“十八大之后仍不思悔改”。如今，是很多人，反垄断条例出台后仍不思悔改，还去搞社区团购？！

    这哪是两面人，这简直是和上面对着干。所以，在动手前，惩前毖后，治病救人一下，再给一个机会。

    机会给了，路也指明了，真以为你的创新人家到今天到看不明白吗？真以为你大到一定地步他们就不敢下手了吗？

    人家的目标就是让群众满意，嗓子都喊破了，你们就非得跟群众满意对着干？

    有人忘了上面是怎么起家的了，敢叫日月换新天的啊。

    Ps:再再次的精准预测，肉夹馍又赢了。下次，该看应验的是不是某团了。'
- record_id: recur9rzp1Ge2N
  文档标题: Vol.16 下一家被约谈的互联网巨头是谁？
  文档链接: https://h160bxy8czl.feishu.cn/wiki/FgntwL4SliCK4Vkd3u2csm0pnhc
  文档内容正文: '我们之前在本星球说过，外滩峰会是影响中国未来十年的大事，很多人当时没有看懂，到现在依然没有看懂。

    外滩峰会三大后续现象级事件，拜登当选、节制资本、中国股市大涨。我们讲过了不展开了。

    节制资本，是节制大资本，他们是三类:金融大鳄、地产商、互联网巨头。

    未来系、明天系等四大金融大鳄的覆灭为标志，金融大鳄收拾了。

    地产商，以恒大恳请函为标志，他们服服帖帖了。

    就剩互联网巨头了。

    上面本来为了他们创新，是给了大红利了，让他们适度垄断。

    结果蹬鼻子上脸，个个跑去放贷、收割流量、戕害年轻人。那就不行，影响国家软安全。

    在《财富100课》中，我们的文章叫做《坐等下一个互联网巨头被约谈》，但不能太深度，也没有答案。

    在财经院，我们可以小范围的大胆预测一下，下一家被约谈的巨头是谁。

    我们大胆预测，下一家是M团或者X米。

    和最近热议的社区团购直接有关。

    首先，M团本来是干外卖的，骑手资源强大，如果再豪赌社区团购，就变成了横向到边、纵向到底，打通了边界墙，不但掌握百万级小哥的就业，而且掌握千万级家庭的菜篮子。

    这种混业经营，类似于朝中大臣结交边关重将，很危险。

    再加上9月份起，舆论就在提《外卖骑手，困在系统里》，已能看到苗头了，后续再出台《反垄断条例》，很多人以为淘宝是垄断，其实某团才是最大的单一平台型经济体。

    组织上做事，一向很有章法，步步深入，联系群众，有理有据。

    其次，腾讯被人民日报批评过、东哥不提了、马已今服、百度死老虎，扒拉手指算下来，就是剩某团，对人民的国家体会不深。

    而另一个某米，不提了，本来让他做制造，特么跑去放贷了，进取心不强了。

    也有小概率是QQ，蛋壳搞得不好，影响稳定，但pony一向比较识大体，应该能过关。

    不管是谁，约谈的棒子总要下来的，三大波里就剩互联网巨头对国家责任比较淡薄。

    正文就此结束，当然，也可能不是约谈形式，私下、罚款等等都是可能方案。

    商业的本质是回馈社会，勿忘初心啊。'
- record_id: recur9rzgVLqQg
  文档标题: Vol.15 美国大选作弊，一个资本家的局中局
  文档链接: https://h160bxy8czl.feishu.cn/wiki/IsXBwN3mjiUTYekEqIOceQ6Knsb
  文档内容正文: '2020年3月以后，看着美国的疫情经济和全球局势，川普代表的那系人马，救市无力，防疫无力，割韭菜无力，全球又闹僵，大佬们幕后决定，抛弃川普。

    4月份开始，拜登看好的美国的新能源股逐步被拉到天上去。

    7月开始，因为拜登上台后要大放水，美国10年期通胀保值债券利率一路攀升。

    8月，拜登的月募资额3.6亿美元，超过所有总统。

    10月，拜登的募资总额是川普的3倍，全球大佬谈妥，外滩峰会召开。

    大选开幕前，人们说这次很动荡，可能会有冲突，唬的大家纷纷去买避险资产和日元。

    大选刚揭幕时，拜登虽然领先，但都觉得摇摆州是川普的，吓的黄金白银大涨，

    在拜登264票领先时故意捂盘，全球股市一片大涨，随后又放出辉瑞疫苗成功的消息，欧洲股市拉上了天。

    随后爆出说大选舞弊，川普要上纺，又是264页证据的，又是邮局工作人员的，很多人自我高潮，说美国总统还没定，A50中国指数大跌。

    搞的全球资本市场大涨大跌，起起伏伏，大玩家们在里头来回震荡，吸筹吸的不亦乐乎。

    川普闹得越凶，全球的资本市场、大宗商品和核心资产就动荡的越厉害，有些人抄底的资产就越便宜。

    川普得罪人太多，几乎性命难保，必须配合华尔街大佬们演戏，震荡洗盘，所以肯定会闹得不亦乐乎，也给自己的支持者一个交待。

    这会是未来国际国内的一个主流趋势，中国的很多公号自我加一高潮，美帝的黑箱正治，关你啥事，“美国陆军突袭德国，查获作弊软件”这种无脑的东西都出来了。

    就是为了震仓，吓唬人。

    最后给大家说几个典型拜登概念股，从中能看出拜登的优势和做局的起伏。仍然不建议炒股，买基金就行了。

    比亚迪，新能源车的龙头，中国的特斯拉，从拜登稳住后7月份的80元涨到11月的170，市值超过5000亿，拜登获胜后直飙190，川普说作弊后又大跌9.98%，谁让巴菲特也持股它。

    宁德时代，市值6000亿超过比亚迪，新能源的核心主力是动力电池，成本占到车的一半，没有电池，一切都是白搭，这股也是机构和大玩家的集中营，其中包括马云，耶鲁系的钱(克林顿、希拉里耶鲁校友)，日本大财阀三菱。

    立讯精密。老板是富士康出身，也是中国的富士康，苹果的核心代工厂，也替诸多美国企业代工，中M关系好，他股价涨，关系差，他股价跌，这才是中国制造的典型代表，能做到精密代工就不错了。

    其他几个都是在美国上市的中国概念股，蔚来汽车、阿里巴巴、理想汽车、拼多多、小鹏汽车。

    今天，他们的成交额排名美股前五。

    局中局，戏中戏，震荡洗盘吸筹码，资本家就那三板斧。'
- record_id: recur9rz3nICb0
  文档标题: Vol.14 叫停蚂蚁只是开始，限制巨头开始动手
  文档链接: https://h160bxy8czl.feishu.cn/wiki/YQimwY8yfin9pvkYxIScgZ7nnvg
  文档内容正文: '早在很多年前我们搞投资的时候，投互联网企业考虑就非常谨慎。因为大家会问一下问题:

    这个项目好是好，但如果，阿里腾讯做了怎么办？

    所以我们根本不敢投。在那些庞然大物前，我们先是烦，因为疼讯这些很爱抄袭，QQ游戏抄袭棋牌抄袭赛车抄袭出王者荣耀;

    再是怕，时至今日的BAT，依然掌握着互联网领域的主要流量和入口，不是他们的人或者融入不了这个体系，基本出不了头。

    大树底下不长草。

    一开始，消费互联网被BATJ基本霸占，吃喝玩乐买东西，只能在他们圈定的范围里玩。

    2010年，IBM咨询说，中国消费互联网格局已定。

    但很快，随着消费品的满足和电商平台的积累了大量客户，他们把手伸进了金融领域。

    发现来钱更快。比每年双11搭帐篷轻松多了，各家公司纷纷上马金融服务:

    钱不是问题，巨头们一轮一轮烧钱起家的;

    牌照不是问题，大公司，哪个都要卖面子;

    客户更不是问题，自己本身就有，产业链一捋全是;

    营销更不是问题，谁比他们更会砸钱做客户体验？

    一下编制了一个流量+数据+金融的完美商业模式，把入口和平台用于放贷，利润更加完美，

    为了放贷，更加全面深入的去挖掘数据，为了数据，更加快速高效的放贷。

    至于他们的主业电商，已变成一个庞大的集客工具和流量平台，本身还赚钱。

    苦的是小平台、小商家、小互联网公司，大家只能仰仗BATJ的鼻息，成为他们系统的螺丝钉。

    他们称为生态。

    阿里大力发展天猫，淘宝在今天开店没广告活不了，百度大力推动排名，就算你是莆田医院也排在前面，美团靠算法让你逆行送饭。

    至于你是不是合格贷款人，路上的车况能不能5分钟送到，不是他们关心的。

    中国的互联网具巨头，无一不走向金融化。

    就连那些传统的金融机构，银行、券商、保险、信托等，也被他们几乎颠覆。不存在什么个性化配置和具体测评，满地拉网就是。

    然而，金融这东西，是过犹不及的，宁肯不足也不能过剩，更不能人为的拔苗助长。

    百度阿里京东美团这些。包括要做发烧级产品的小米，把大王一个朋友挖去做小米金服CEO。金融的有诱惑太大了。

    打擦边球式的用数据，太容易了。互联网公司，给你一堆√，你能不点么？

    这些人走的太远了，都忘记自己是为什么出发的了。连退了的马云，都在外滩峰会忘了自己1999的梦想了。

    但另一个退了的人没忘。2020年9月下旬，已经退休的前财政部长楼继伟说：“互联网平台虽是私人部门运作，但有准公共性，垄断带来高用户成本甚至市场进入障碍”。

    甚至会造成“国内大循环的堵塞点”。

    楼总发言传递了强烈的信号，随后，副总L鹤公主持了国务院金融委会议，提出两条：

    第一，要健全公平竞争审查机制，加强反垄断和反不正当竞争执法立法，必须处理好金融发展、金融稳定和金融安全的关系”

    第一，金融监管领域的反垄断势在必行。

    这一条我们都知道了，外滩峰会我们已深入解读过了，蚂蚁被级成了典型，2万亿飞了。

    然而这只是开始。

    鹤公的第二条说，要建立数据资源产权、交易流通等基础制度和标准规范，加强个人信息保护。

    什么意思呢？据资源是公共的，不是某个平台的。你不能垄断，更不能拿去乱用。

    暂停上市都还是起步，马云们的命根子是这些数据，以后，这个很可能要交上去的，或者，你不能胡乱使用。

    你要使用也行，不能是一个公司的，不能横向打通。

    就像美国，当年的券商和银行是必须分开的，不能混业经营。你不能一手给老百姓贷款，一手让他去炒股。

    以后的阿里之类，淘宝要卖货只能卖货，数据不能拿去做风控模型，给客户放贷。

    要放贷只能放贷，只能用自己积累或者合法得来的数据，不能向公司同部门要。

    互联网公司们会振振有词，客户给我完整授权了，允许我使用他们一切数据啊。监管要求，以后不准客户一路点同意下去。你字那么小谁看的见？

    而且，为了避免你这种可能诱惑客户的冲动，不准公司混业，也就是说，要分拆。不能是一个法人实体。

    放贷的就是放贷的，卖货的就是卖货的，不能交叉，不能混。

    而且卖货的平台本身，也要限制规模，限制总量，把饭分给大家伙来吃。

    阿里和支付宝有可能拆分、淘宝和天猫有可能拆分、支付宝和芝麻信用也得拆分。

    这样好么？当然好，中国在大搞双循环，机会要让出来给大家去一同发财。经济界，需要的是联合舰队，而不是一条大航母。

    小企业竞争公平的环境，需要保护。连摆地摊进货都必须通过阿里，打工人还有活路么？

    我们之前讲过，就连资本主义国家，阿里这种都不会允许这种存在，大势所趋。

    更何况在中国，是人民群众创造历史，而不是巨头创造历史。

    上一个文章我们讲过了，外滩峰会奠定了未来10年的世界格局，

    回归理性、节制资本 成为全球主流的认知和操作。

    内外这么好的战略机遇期，谁错过，谁就是民族的罪人。

    顶层布局这些大佬们，赢了，也幸甚。'
- record_id: recur9ryUtTWPA
  文档标题: Vol.13 中国为何没发贺电 大戏背后还有戏
  文档链接: https://h160bxy8czl.feishu.cn/wiki/Rrk1weXU2ib0H5kbR2ecA8x7nTe
  文档内容正文: '现在是，媒体全部宣布拜登当选，中国也宣布了。

    蹊跷问题来了，英法德欧盟，日本，印度都发了贺电，唯独，中国俄国没发，为什么呢？

    今天跟大家从博弈论的角度分析这下大戏，对我们日常的工作生活说不定很有启发。

    在此之前，除了美国一小撮，国际上谁最希望川普当选呢？俄国。

    在川任上，北约东扩停止了，美国几乎撤出中东，俄罗斯狂缓一口气，再加上川普是普京的粉丝，一直闹着要联俄制华，俄国是最暗爽的。

    有了川普联俄，国际上毛子扩大腾挪空间，现实上可以找兔子敲竹杠，现实的、长远的好处，俄国太大了。

    人与人之间有情感，国与国之间唯利益。

    谁最不希望川普上？中国。川制裁打压还是小事，联俄会影响中国生命线，各种退群摆脱责任，直接影响世界局势的稳定。中国最需要世界稳定。

    阿塞拜疆大战亚美尼亚，土耳其这种都跳了出来，美国固然不地道的很多，但没有美国，几人称王几人称霸？全世界撑不住了冲突四起，我们受创最大。中国可一家占据全球货物贸易额12%啊，全球第一。

    也就是说，美帝要死，但不能马上死，得先顶着让我们做好准备。

    所以中国挺拜。川普的银行账单怎么泄露的？苏世民为何不撑川了？最煎熬的时候，大王也在煎熬，还不能说，以免真的影响大局，所以我们一再对外讲，对美国的大选，我们没有兴趣。

    好在尘埃落定了。在这个较量上，俄国人输了，不废话么，俄国人没钱啊，但也很险。

    拜登一胜，兔子和毛子的对立，立刻变成了联合。你得识实务嘛。我赢了。

    本来是毛子要从兔子身上拿好处，发现拿不上，那只能联合兔子，从美国的身上拿好处。

    美国咋样对中俄利益最大？乱起来。川普闹事，或者败选不交权。川普想闹吗？想啊，不闹，哪来的特赦，而且说不定有好处，大选期间，川普竞选团队是借了很多债的。

    但是川也怕，美帝可不讲理分分钟能捏死他啊？这也得有人支持。放心，肯定有。

    英法德日不是主力牌手，迷迷瞪瞪的无所谓，贺电发了，如今的兔子和毛子，正在互相通牌，而且不发贺电，要川普别轻易放弃，别认输，所以烟雾弹满天飞，俄国人又开始造谣了，说你看，作弊，作弊，一副川翻盘的架势。

    本来兔子不支持川普，是不想他继续当选，因为影响大利益。

    现在拜登当选没有悬念了，兔子又要暗挺川普，因为又有利用价值了。兔子打牌赢了，还想抠个底。双倍啊。

    川普想被利用吗，想啊，万一能成呢？不成，自己也没啥损失吧？反正那些人，早得罪死了。

    拜登希望兔子来抠底，美国乱一乱吗？不好说，这人是个爱国者，国家利益至上，但是，民主党内，有人是希望乱一乱的，不然，哪有这么好的由头把川普那一竿子人赶尽杀绝？至于你想弄点技术啥的，不怕，美国家大业大。

    兔子玩了半天后，很多人没看出来，大家那么傻，咋办？有人捂牌了，大家现在知道为什么264票以后不涨了吗？内华达州点票那么慢？开什么玩笑。

    笨啊，我都要赢了，捂牌等你，你们还不赶紧来下注？捂牌期间，中欧投资协定，全面加快，说今年必签。荷兰忽然说，我的光刻机又可以卖了。

    兔子吃的满嘴流油，今天的芯片股全面涨停，指数拉的全面大涨。

    想去发洋财的越来越多了，明贺拜登，暗挺川普，爽的一塌糊涂。

    所以大王说，好戏才刚刚开始。利益博弈，一是要看到随时变化，此一时彼一时，敌人和朋友时易事变;

    二是要看到屁股决定脑袋，对方永远是希望自己利益最大化，你就看自己如何把你的利益，嵌套进去。

    兜兜转转，门道就在这里。

    可笑外面的铁杆川粉，甚至很多国内的，还在那边假装高潮，力挺川能赢，根本看不到庄家在玩什么。

    学会了这个，市场营销和战略管理还是个事么？兵者，诡道也。'
- record_id: recur9ryK6YoZO
  文档标题: Vol.12 外滩峰会 决定了未来10年的走势
  文档链接: https://h160bxy8czl.feishu.cn/wiki/IrQ8wZquCiZk4lkl5XjcIzmSnfg
  文档内容正文: '任何一份赚到的大钱或者让我们有持续满足的成功，其实都是我们暗合、顺应了趋势，并且坚定的下注。

    很多人都会后悔为何2008年怎么就没有加杠杆重仓买房呢？因为你不敢那么坚定的判断未来中国和城市化进程啊，如果你敢判断，兜底最后一毛钱花掉都会去买房。

    但是，判断大势是一件极难的技术工作，再把他能跟发家致富结合起来，就更难了。你得说服自己信了才行，你得有充分的证明，甚至会判断那种历史级的信号，告诉自己怎么走。

    本号是谈趋势，谈代码的场合，今天就斗胆来讲一个决定全世界未来10年的历史级信号:外滩峰会。

    这个斗胆，不是没信心，而是不知发不发得出。对马云的看法和拜登的预测是检验中国知识付费平台的最重要指标，这两个点，我们都极其精确。

    我们在之前对局势的判断，已经有《川普必定要被牺牲》《买入中国《李云龙与中国股市》《两轮锂电》等系列文章，而外滩峰会，彻底让我们坚定了这个看法。

    峰会上一个极其重要的信号是，一位行长大先生的出现，他何许人也，如雷贯耳，当年的改革家、大才，抗疫英雄，各位一琢磨就知道。行长且是学历史出身的，对兴衰存亡，政治和金融的把握比我们何止高了万倍。

    诸位，行长先生已经淡出视野很多年了，他为什么要在外滩峰会出现？大会开完后，马上就有两个巨大的历史事件，一个是伍中荟，一个是美国大选，他如不笃定，出来做什么？

    这两个大事，本身是千丝万缕关联的，之前行长淡出视野，是年龄原因，也有部分，是他当年那些私交，保尔森，振华等，不在台上了。那么自己就难免有点说话不好使，内外的。

    振华，是官方认定的“China人民的老朋友”，这个称号有多难拿不展开了。

    行长露面本身，就代表拜登定了。他的一些想法，也是达成一致了。

    真内行的，看到行长就要知道振华稳了，网上一通乱分析美国的，幼稚的可笑，后面早就没有看头了。

    而行长在外滩峰会上说了什么了呢？金融不要乱来，不要走歪路斜路等等，其实很简单，就是要“节制资本”。结果小马就被怂恿了往枪口上撞，去炮轰“老年人俱乐部”，你以为他真说的是巴塞尔吗？老年人，你琢磨琢磨。而且你注意了没有，小马竟然破天荒的拿着一份稿子，你以前见他讲话拿过稿子吗？

    行长的讲话含义非常多，极小部分回应拜登《葛底斯堡演说，当然，官方是不会讲的，面上根本没有关联。

    拜登也要恢复传统，节制资本。所以他必胜。

    有人问拜登不是华尔街撑上去的吗？对啊，华尔街的资本，几百年玩下来，知道维护游戏规则。而支持川普的科赫兄弟等，挣钱靠实业，觉得自己就是无比厉害，谁来都得跪着，土豪的根本不讲规矩。

    2016年，华尔街一个疏忽，也是两级分化，金融资本被产业资本偷袭，失败，川普才上。

    华尔街再有钱，毕竟也都是乙方出身，不讲规矩，自己死的最快。

    而不讲规矩的大统领，最社会最大的伤害其实是破坏传统。人和人，种族和种族的差距极其大，但因为有传统的存在，大家才能维护在一起。

    就像中国，南北差异，风俗差异，互相看不起和鄙视的很多，分歧也很大大，但是中国有强大的传统，保证能互相认同，斗而不破。

    比如说，尊老爱幼、知耻后勇、仁者爱人、求真务实、精忠报国。世俗层面的冲突，碰到了传统，都得退让，大家还是兄弟。

    川普干了什么呢？做事上不讲规矩，后果是破坏力传统，他把美国类似的传统也给糟蹋遍了，共和党大佬麦凯恩，这人是个越战英雄，被俘后宁死不屈，老爸是战区司令都没救他，回来后就连民主党都很尊敬他，国家英雄，而且这人的确一心为国，很多时候为了国家利益宁肯投共和党的反对票。

    但就因为和川普政见不合，川普骂麦凯恩装什么逼，你是啥英雄，战俘一个。对麦凯恩来说，这是极大的侮辱了，他死时专门叮嘱，不准川普来参加葬礼，对亚利桑那州来说，你把他们的老乡，他们的骄傲污蔑成这样，你还是人么？

    这就是产业资本家和土豪，觉得钱是自己赚的，顺惯了，看谁都不顺眼，做事肆无忌惮。

    精忠报国的传统都能被穿大领都能被川大统领砸烂，至于什么荣誉责任、自我奋斗、悲天悯人、见义忘利等这些价值观更不知道糟蹋成什么样了。

    传统是一个社会的筋骨，维护着大家的互相认同，不直接产生生产力，但却是一个国家的灵魂。

    就像一个坏人，即使自己是小偷，他也不可能教自己孩子去做贼，他会希望下一代做个好人，川普干的事，就是反智和砸烂这些东西，所以拜登的竞选口号是:为国家的灵魂而战。

    夫妻两个，或者一大家子，都不爱了，光靠多收个三五斗，就能维持在一起吗？

    美国人更是知道，那个被川普破坏了英雄传统的麦凯恩，郁郁而终后老家亚利桑那的人民愤愤不平，直接把深红大州转蓝投了拜登，给了川普致命一击。

    外滩峰会发出的强烈信号:恢复传统，节制资本。成为全世界的共识，拜登说，他上台后的第一件事，就是重返《巴黎协定》，这是一个严重限制石化大资本家的绳索。

    所以小马的梦想:人类有史以来最大的一次上市，在纽约之外的地方定价。 没实现。

    反而是:人类有史以来最大的一次利益结构调整，在纽约之外的地方拍板。

    这段时间，为何中国的新能源之类都在涨，因为创新是现代社会的传统，为什么玩商业模式的都在跌，因为脚踏实地也是中国的传统。

    未来10年，大家要靠传统发展和安身立命，传统是什么，爹妈小时候教的东西。

    未来10年，大家也要靠传统赚大钱，是时候在自己擅长的领域、在自己一直想做又不敢做的事情、担心形式变化太快又举棋不定的事项上，下重注投资了:按闹分配的时代彻底结束，以后都要靠本事吃饭了。

    在其他人还在吃瓜迷茫时，你已经拨云见月，清楚的看清未来的方面向了。

    行易知难，认知就是生产力。'
