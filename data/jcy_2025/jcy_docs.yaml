    对于光和电，要敢持，敢看。

    有人说已经涨高了，后面还有16个硬科技etf刚发售完，大盘才刚刚1.9万亿。

    高峰期是3.5万亿日成交，走掉的1.6万亿回来一半也得有8000亿增量。

    新同学们可以看一下之前《三生万物》和《四类投资者》，再加班加点把文章看到6月份，这一轮牛市的来龙去脉，就全部了解了。

    很多事情，往往都误在频频动作，这无非是一种焦虑情绪。

    就像昨天有人焦虑液冷的龙2飞龙，今天不也险些涨停么。'
