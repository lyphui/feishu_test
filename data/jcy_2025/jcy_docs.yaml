    这点踩上了吗

    这一轮调整时我们讲的黄金坑是，

    算力租赁。

    年初，阿里，字节，腾讯等大厂说今年砸算力中心的开支是4000亿。

    资本市场怀疑，这故事真不真，所以新一轮错杀。

    昨天海南华铁30多亿的租赁大单，X公司其实是阿里。

    今天盘面上有人还将信将疑呢。

    有英伟达卡的那几家，我们精华和问答里讲过很多次了，

    挨个开始表现。

    你有英伟达卡或者910C，你就能大涨，你没有或者缺一点，还得洗一洗。

    有人说互联网大厂为什么要算力租赁啊，

    1，自己屯卡已经被禁运了，目标太大，买不了。

    2，从财务上说，如果买卡建算力中心，是一笔非常巨大的固定资产投入，非常影响财报和利润率。

    3，如果你被美帝发现，你自己没有购买记录，机房里一堆N卡，那是要挨制裁的。

    中式逻辑你懂吧，我不知情，我只是租。

    所以算力租赁的逻辑很硬。

    海南华铁昨天的电话会，

    说自己有拿卡渠道。

    说白了就是偷偷批条子、走S.

    总有神通广大的人，搞得定。

    这个就不展开了，行业内幕，不足为外人道也。

    要5nm的芯片，大王也有，不能在国内交货而已。

    不违背保密协议，能讲了让大家受益的，都会讲给大家。

    910c代表人谁？这个不赘述吧。

    买910c一定要多配液冷电源，华为热的厉害。

    它们的机会再调调也差不多了。'
