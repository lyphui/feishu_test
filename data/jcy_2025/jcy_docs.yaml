    分为5个阶段，

    1，概念阶段。

    2，产品样板阶段。

    3，局部业绩阶段。

    4，全面兑现阶段。

    5，稳定红利阶段。

    每个阶段，都是10年左右起步，

    现在大国的国运，连阶段1，人们都还不信呢。

    我们有生之年，看到阶段4的早期，就已经非常不错了。

