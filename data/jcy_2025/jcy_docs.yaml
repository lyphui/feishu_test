  文档内容正文: '三张技术分析的图

    电池一家，

    当时某位同学问到的蔚蓝，

    液冷/化工一家，

    有些同学持有的东阳光，

    光通讯/光纤一家，长飞。

    都是有代表性的板块。

    我们发现什么?

    1，整体都处于涨到高位后，要有一段时间盘整，消化获利盘和筹码。

    2，强势股不会跌破20日线，即使盘中剧烈调整也会拉起来，每每在10日线左右就有动作，说明主力惜售筹码或者护盘决心强烈。

    3，即使跌破20日线，也会形成一个箱体，它基本不会跌穿。

    4，带量突破箱体后，预示着下一轮上涨的开始。

    5，科技仍然强于其他板块，科技的新热点，悄然从英伟达转向谷歌供应链，从光模块转向光通讯，全光互联。

    当然上述不构成买卖建议仅为教学，是帮大家分析大盘和技术，以及什么叫“图形没有走坏”，震荡下，什么样的可以继续拿着。

    有兴趣会操作的同学可以套用，去看看还有没其他类似这种的，震荡就拿，跌破就走。

    低位看逻辑，图不重要，

    比如消费，食品那些，已经地上的死样子了，涨是迟早涨的，无非什么时候。

    它的逻辑，就是经济要起来，必然拉消费，这个理由重于其他一切。

    高位看图形，图形是有标准的因人而异，

    比如，

    -你风险承受能力很弱，一跌吃不下饭，那你破5日线跑路，你更适合过去定投ETF，

    -承受能力一般，你看到5日线下穿10日线跑路，

    -尚好，你看到20日线，高手可在此处介入反弹和做T，看错了不恋战。

    -比较强，你看到20日线能否站稳5日平台。

    看的时间尺度越小，你的盈利就越小。

    总体上，盈利大小和持股时间成正比。

    这里最科学的，是你根据自己的情况设定一个箱体，分钟，日，周都可，

    箱体，是对“状态”的一种维持，

    无法维持一种状态，视为有人抢跑了，止盈了，当然就需要修复，需要时间。

    当年突破一个状态，视为摆脱掣肘了，有新的阶段了。

