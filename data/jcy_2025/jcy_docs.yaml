    科技低位与AI应用

    国常会出了消息，

    “要深入实施”人工智能+”行动，核心是，

    1,大力推进人工智能规模化商业化应用，推动人工智能在经济社会发展各领域加快普及、深度融合。

    2,政府部门和国有企业要强化示范引领，通过开放场景等支持技术落地。

    3,要优化人工智能创新生态，强化算力、算法和数据供给，加大政策支持力度。

    古有互联网+，今有AI+。

    消息会加快高低切的速度，切向国产算力和Ai应用。

    整体上，

    算力-算法-应用构成了AI一条线的逻辑。

    A，算力，因为有海外向国产切的趋势，东芯应该没走完，没筹码的就别进了，寒王一般人玩不起，

