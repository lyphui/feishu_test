  文档内容正文: '谷歌链再梳理与机构抢跑（上）

    周末谷歌链再度热议，

    6月份讲过，谷歌的芯片叫TPU，目前它最新版本是Tpu7和8.

    一个服务器用64个tpu.

    -核心特点是用到了ocs交换机去搞光互联，ocs光交换机搞了十多年了，量不会太大，明年也就2万台的量，100亿的盘子。

    所以我讲它们只是四小龙。

    还有个有少量ocs业务的是凌云光。

    ocs里也是光模块上游有个器件是光隔离器，光库就做这个，它也做ocs整机，

    光隔离器上游有个关键材料是法拉第旋片，这个之前讲过，长期被日本住友等垄断，国产替代是东田微，明年整体缺口也比较大。

    有的你拿着，没有的你不要追，东田喜欢走破旗翻模型。

    -相对用量大的东西还是光模块。

    明年的谷歌用量大约1000万块，主力还是800G,部分1.6T.

    相对GPU用量少了，但毛利是英伟达的2倍。

    绝对主力当然是旭创，一半以上，后面是xys,只有旭创能做1.6T，它同时给谷歌供HBM存储

    （远见智存的东西）。

    索尔思（东山精密收购）也在给谷歌送样。

    谷歌跟旭创关系到什么地步，刘圣回国创业的A轮，是大王一朋友拉着谷歌创投过来投的。

    这里也有个给谷歌供货1.6t的光模块的，联特科技，量不大，只适合会玩交易的看。

    -再说到Pcb，第一大供应商是韩国ISU，叫做梨树，中国生产基地在湖南湘潭。能炒韩国股的代码告诉你,KOSPI:007660.

    国内第一大是沪电，大概占30%，深南，生益电子也有供。

    这里的胜宏是不看空的，它之前不干谷歌，不是

    谷歌看不上它，是它没产能，我们了解的信息，它现在的送样已经通过。

    谷歌用的pcb级别远没有达子高。

    -连接器，相比英伟达，谷歌在服务器之间用的铜缆更多，一个服务器用80根，铜链接包括MPO（光纤连接器），第一大供应商是博创，占比约30%.

    之前谈过，英伟达时代人们就没有充分认识博创，也没理解创始人夫妇减持，现在它作为谷歌连接器一供，中线逻辑更硬。

    铜链接，MPO的后排有鼎通，特发信息等，大约各自10%，涨法也是补涨。

    谷歌也是空心光纤的积极拥护者，全球领先是博创母公司长飞光纤。

    博创有了长飞的保供，毛利更高。

    沃尔通过安费诺间接给谷歌供铜缆。

    -液冷，主要的还是英皇，马来西亚的工厂相当产能供谷歌，

    英皇关系最好的是intel，合众国长子你倒是支棱起来。

    思泉新材和飞荣达也在谷歌送样阶段，通过问题不大。

    -电源，欧陆通送样，有信息讲已经通过，我们了解到，通过话会有8亿左右订单。

    二次电源模块，新雷能（中富电路做这块的pcb）.

    固态变压器还是金盘科技，伊戈尔等人。

    -tpu里有个小东西走涨价逻辑的是做芯片电感，细分龙头是铂科新材，同时也给AMD，英伟达供货。

    整个谷歌链的价值量排序和达链大同小异，先涨涉光的，再涨没光的，扩散式前后排涨法。

    -考虑到下周国产芯片的催化较多，摩尔线程等上市，

    可以看一下男方的修复，国产芯片的龙头还是是东伟达这哥俩，它们涨起来再加大盘放量，会惠及到瑞王等代表的soc和AI眼镜板块

    昨天有人问国产半导体打铁领域，龙头当然是中芯，先进制程弹性大的比如京仪，福晶，你看他们的走势比长电强多了，福晶还有光电子概念。

    （你仅作案例看，福晶的长短均线组相交向上且放量是否非常直观？直接一个跳空放量高开）。

    谷歌也有AI眼镜，这个部门会回归，我们下期再讲谷歌眼镜与谷歌AI智能体。

    仅为学习，一大堆祖训不赘述了。

    12月，机构将会再度进场，它们爱买什么？海外算力，国产芯片，储能链（北美电力），机器人。

    排名分先后。

    机构逐步归来

    看到福建概念走强，

    你就知道大盘整体没啥戏，

    知道主线是缩圈的。

    机构进场有什么信号?

    1，谷歌达链的双料龙1旭创，开始抢跑，

    2，国产芯片的寒王底下拉起来，soc代表的AI 眼镜大涨

    3，大单开始买进宁王。

    4，机器人继续扛着利空活跃。

    这就是我们早上讲的，机构4个方向。

    科技的两个etf，海外的159381/515880，国产的588200/710，

    有望逐步新高。

    题材股还能热闹几天，等平潭等连续跌停，主线就开始强力上攻。

    晚上看谷歌的表现。'
