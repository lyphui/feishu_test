  文档内容正文: "进入光的新时代\n本次光博会，大约两三百家公司已宣称要进入光模块，一场厮杀即将开始。\n涨幅凶猛的光模块，其实并无特别大的护城河，400G以下的技术含量并不高，其核心壁垒之一是海外供应商的商务关系它们不会轻易更换。\n\
    立讯这种巨头，好几次送样都不能突破。\n所以我们要盯着下一轮技术的方向，即、硅光时代，全光互联。\n硅光互联时代，包括OCS（全光交换机）、CPO与交换机（光电共封装）取代插拔式光模块；OIO（光引擎直接封装至GPU）取代柜内铜连接。\n\
    一、cpo全自动化生产和检测设备：萝卜特科。 \n目前，富士康，立讯精密找其下单进入光模块生产领域，可理解为全自动产线。\ncpo是“光电共封装”，将光模块与交换机芯片封装在同一基板上\n\
    它不是光模块，要封装。 萝卜之前专门做过介绍。\n杰普特，光纤阵列单元 (FAU)自动设备，你可以粗略理解为部分产线。\n杰普特的战略是“激光+AI”，同时也给光伏电池提供激光设备。\n\
    二、cpo交换机内部件。\n-微透镜和V型槽：炬光科技，\n它的主营业务是光学器件，构成激光雷达的主要部件，华为在早年突击入股。\n-光芯片/CW光源：\n\
    源杰科技，仕佳光子，华工科技。\n-PLC分路器/连接器/铜光互补：博创，同时给阿里供货400G光模块。\n三, OIO, \nOIO，是将光模块与GPU直接封装在一起，以减少信号传输距离、提高信号传输速率，\n\
    目前，主要还是博通，谷歌在搞，英伟达都慢了半步，华为有研发，搞通信起家。\n现在的交换机，是把光信号与电信号的交换，效率不够最大，将来要搞全光交换， \n\
    ocs交换机：腾景科技，\n萝卜会根据各家的要求匹配封装，就看他跟不跟得住。\n当然，对pcb的要求也会继续加大。 \n三、以上，只是技术路线的方向，目前的弹性并不如前排，光模块在进化到3.2T之前，CPO只是概念而很难实现，\n\
    也就是说，它们的业绩出来可能要一两年甚至更久，同时这些标的也在高位，还是那句话不追高，高手等待20日线附近站稳再看也来得及，大盘如果剧烈震荡，给55日线位置好极了。\n\
    上述，有光模块界元老，也是某上市高管的悉心指导和判断。\n中国光和通信的高地，是华中科大。\n四、当然，这并不是说易中天马上就要不行，他们的产能都还没有完全释放，三季报乃至年报甚至还有高峰，高位看图就可。\n\
    这三家里，中际旭创的技术是最全面的，也在cpo技术投入很大，1.6t光模块也无法证伪，资本市场也做了反馈。\n我们预期未来，先人一步，光还要能打好几年。\n\
