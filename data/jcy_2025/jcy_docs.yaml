    情绪

    全球市场下跌，生产队也没有上班。

    原因么，上午讲了，一次把情绪发泄完，总比每天钝刀割肉强。

    我们到底在怕什么？怕AI泡沫破裂吗？没有吧。

    英伟达的业绩在快速增长，AI确实在创造生产力。

    5年前你能相信汽车能自动导航？怕优秀公司不增长了吗？也没有吧。

    国外有机构甚至把旭创明年的业绩算到了300亿，折合现在的PE才多少倍？怕价格太高了吗？也没有吧，全球股市涨了多少，我们才涨了多少？怕中国的国运不行了吗？更没有吧。

    大船在下饺子一样的造，你根本不用担心洋人打进来。那你怕什么？唯一该怕的就是恐惧本身。

    其实你见多了，就习惯了。

    正如彼得·林奇说：“股市下跌没什么好惊讶的，就像明尼苏达州的寒冬一次又一次来临一样，只不过是很平常的事情而已。

    如果你有见识，当室外温度降到低于零度时，你肯定不会恐慌地认为下一个冰河时代就要来了。

    ”好公司打折、杀跌，要当成好事看，它们迟早会再一次创下新高。

    最后聊点具体的，如果下周反弹，可能会从哪里展开，还是我们讲过的两个方向：一个是科技里唯一的洼地AI应用，蓝标、360、易点天下之类的，带有AI营销和教育概念，今天表现还凑合；

    一个是新锐的谷歌系，谷歌链是今天科技里的唯一一根独苗，如果持有的是先遣图的品种，或者低点抄了它们，体感还应该算凑合。

    平潭、合富、海峡之类的跌停了，3800是经过关税战考验的支撑位，现在也差不多了。

    不就是回调么，何必搞得心事重重，好像没见过世面一样。事已至此，不如喝个下午茶吃点甜品让自己开心一下。'
