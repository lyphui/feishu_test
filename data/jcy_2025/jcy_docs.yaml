    学学亮哥

    指数好看，个股就难看了，胡椒面式的维个稳，上证还有点余力，其他的不忍睹。

    主要原因是，一鼓作气，再而衰，三而竭。

    这一轮大涨主要是信心修复和预期的涨，并没有基本面和业绩的支撑，通俗的说人们不信。

    而且小盘微盘涨太多了，几倍的比比皆是。

    咱们之前多次谈中证2000代表的小微盘，日月周线全是历史高点。

    我们举过例子，和女朋友吵架，最好是一次吵完，情绪发泄干净。

    放量下跌才洗盘充分，然后企稳。

    但这几天一直没有放量大跌，阴跌就还要跌。

    操作说我们讲过，搞短线，跌破5日平台就得走，容忍度大一点，跌破箱体也得走。

