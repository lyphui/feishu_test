    五日平台与箱体

    图一，站住了5日平台，主力在抵抗，拉出下影线。

    图二，不好意思，5日平台站立失败，盘中跌穿。只能继续向下寻找另一个平台。

    图三，你说我格局大，不看5日平台，那你看箱体，它构成了一个小箱体，切处于跳空线上，看成交量，下跌是缩量的，如果主力护盘意愿强烈，则不可跌破箱体，最多踩一下缺口，在此中间震荡，直至突破上影线。

    看5日平台，盘中跌穿就得走，图4讲过，它是典型案例。

    最后图5是某些同学的心理创伤股，

    你发现没有，每次5日平台跌穿你都得走，你不走，它立刻给你来个中大阴线，

    等你中大阴线割肉了，小子又给你来个旗型翻。

    查理芒格说，快乐的秘诀，是远离消耗你的人和股。

    在最近的调整期，在20日线附近反复折腾的，甚至死守不退的，都值得好好看。

    很多已经踩上了，明天就能观察出谁们收复20日线。

    ps，仅为案例教学，不构成建议。

