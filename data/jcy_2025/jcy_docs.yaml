    2，情绪的风向标，是券商，但券商太渣，弹性更大的是互联网网金融，最近调整也比较充分，它们是急先锋。开盘观察一旦市场有量，就可以介入前排和中前排。但注意，这个是高高手快进快出的路线，技术不行不建议。同学们看看有无ETF。

