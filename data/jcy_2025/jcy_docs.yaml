  文档内容正文: '买在状元及第之后

    昨天有个被大家忽略的消息，

    那个东哥背后的女人，鼎鼎大名的风头女王，今日资本创始人徐新，

    以约3亿美元价格拿下了字节跳动部分股权，对应公司整体估值达4800亿美元（约3.4万亿元人民币），

    超越SpaceX成为全球估值第二高的初创企业，仅次于OpenAl.

    老股权是国企的，所以转让要公开拍卖，起拍价3600亿美元，最终成交价较起拍价溢价超30%.

    徐新这次入场，算是“上车补票”，当年张一鸣找她要70亿，美金，她吓到了，说看不懂，这么大的公司还能这么快增长？

    现在今日背后的很多投资人，都是中国和全球的很多oldmomeny和长线资金，

    他们是不会在行情刚起步时入场的，只会在看到苗头，建立趋势后大笔投入。

    就像巴菲特买谷歌，你先证明你自己，证明过后我再投。

    很多人都喜欢“证明自己”的爽文，买入从寒门子弟到状元及第的刺激。

    但老钱不喜欢这种，年轻人那么多，谁知道谁跑出来？

    关键是，状元及第之后的故事，才更稳健，更成长，更有意义。

    这才是真正的“投资性投资”和“长线资本”。

    事实上也是，大王统计过中国所有状元，没有一个混得差的，各个后来平步青云。

    遗憾的是美国有很多，中国的绝大多数资本，都是短期行为的投机性投资，

    想着赚一把就跑的人，心就不诚，最后肯定拿不到最好的收益。

    这就是巴菲特讲的，市场总是错的。

    中国那帮8个月考核周期的公募

    --句话就能概括，竖子不足与谋。

    这些天完全被境外的A50指数带着走。

    现在，中国和全球科技界，也正在进行一场“投机性资金撤出”，“投资性资金买入”的过程，因此动荡在所难免。

    你看到的是涨高了，他看到的是确定性。

    想要成为超级有钱人，先拥有超级有钱人的视野和胸怀。

    然后，才能“心想事成”。

    因此，没有必要为短期的涨跌扰乱心神。

    你只用问自己一件事，你手里拿的公司，是不是

    已经“跑出来了”。

    这玩意不光是要业绩，还是要点天命的。

    领导拍着你肩膀说一句，

    小伙子，我很看好你。难道是一天，一月，一年？那不叫看好。

    最后讲两件小事，

    一个是美国某私募基金的朋友，问他看好谁，他说甲骨文，确定性的公司跌下去40%.

    马一龙那么桀骜不驯的人，对埃里森言听计从，别人这么大把年纪什么不缺，举债建立数据中心，那一定看到更确定庞大的东西。

    另一个，这笔老股，是中银投拿出来的，一个多年老哥是领导，当年他不太看得懂抖音的商业模式，问大王说一个整天看美女的平台有啥好。

    这你就不懂了，弗洛伊德说，看美女才是人类社会前进的终极动力啊。

    不光男人爱看，女人也喜欢看美女，不信你问问你们办公室的女孩子。

    孔子都说，食色性也。

    他很诧异，后来投了2亿美元，当时是2018年，估值750亿美元。

    现在7年赚了7倍。

    “老弟，投少了哇”。'
