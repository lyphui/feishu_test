- record_id: recutaVGmhQiC1
  文档标题: Vol.241104 从特朗普交易到哈里斯交易
  文档链接: https://h160bxy8czl.feishu.cn/wiki/MoJ0wRs5JiMUOtkXtUccr0fcnhe
  文档内容正文: '虽然美国大选还没有揭晓，

    但是很多人已经认为，特朗普没戏了，哈里斯在扮猪吃虎，并在摇摆州大幅领先。

    1，特朗普上:

    预期是，联俄制华，严厉封锁，与东大脱钩断链，

    利好卡脖子，自主可控，半导体，利空出海，红利，顺周期，赛道。

    2，哈里斯上:

    预期是，管控竞争，围栏博弈。

    利好出海，周期，赛道，利空半导体，所谓科技。

    利好出海是，生意还能做，不会加税，尤其是美国需要的小商品，比如保温杯，割草机之类。

    赛道的制裁能谈，因为美国订单预期，钢铁，大宗等，会有反弹。

    中国特色菜就是新能源、白酒、车，老外会觉得你有价值的，你的半导体之类，他们自个有。

    利空半导体是，硅谷的科技产品倾销东大，造不如买，买不如租。

    3，现实是:随着港股中芯国际的跌破位跌穿5日平台，预示着这一轮“特朗普交易”进入尾声，

    科技概念，普遍进入调整状态。

    但请注意的是，不管哈里斯还是川普上，两大确定竞争目标都不会放松。

    “人工智能与太空竞赛”。

    这是“紫禁之巅”的核心逻辑，他们调整，是受到热钱撤出半导体和特朗普交易的波及。

    4，之前的大热股和妖股概念会不会彻底死掉？答案是不会。

    短期剧烈调整后，垃圾彻底淘汰，比如北证50的一些不知所云。

    还有些概念会趁着大跌形成整理，tmt的主力资金会自救，又如重组概念是重大调整机遇，所以之前讲仓位不要重，慢慢搞他们，有的是跌停式建仓机会。

    那么，如果哈里斯真上了。科技和半导体会死吗？不会。

    吊诡之处在于，长线看，你最终发现哈里斯一样解不了多少科技封锁，那只是预期，

    哈里斯交易最终会还是个特朗普交易。

    5，总之，短线看，哈里斯概念最确定的，是出海板块，即“同花顺出海50”，-c的是保温杯，割草机，户储，-b的主要是叉车。

    择前排从之。

    11月8日之前，整个市场都是“乱纪元”的交易状态，盯好五日平台，不要在任何概念上太动心，不胡乱操作胜过任何操作。

    关键是要管控预期，赚了不走，搞的最后亏了想补，就很容易亏。

    念任何经都能成佛，哪一个领域都有预期。

    指数最稳，说三遍。'
