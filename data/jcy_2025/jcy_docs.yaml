    机构进入的都有前途，有二三波，游资主导的杂毛就未必了，我们依然看那两家。

    不是主线的不要上头，昨天猛拉今天猛砸也说不准。

    周末解读“雷天大壮”，忘记再次提醒谷歌符合语义的谷歌电源新雷能了，它同时也做卫星电源，明年扭亏是没问题的，折合pe约25倍，当然别追高啊。

    昨天3936的突破是假突破，因为没量，今天的压力位在3950左右，盘中急杀不要怕。

    不惧短线急跌

    今天在推文里讲过，因为5分钟k线的背离，可能有个急跌。

    那么策略大家都懂，大跌大买，小跌小买。

