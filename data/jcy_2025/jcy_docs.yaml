  文档内容正文: '源自感知，长于生产

    -关于男女之情的底层代码课

    感情是个非常复杂的东西，即使富贵贤人，也经常难以堪透迷障，

    这就是“人在走大运之前要过情关”。

    咱们群里也有一些星友是单身，感情有问题，甚至煎熬受苦，我们来做一些阐述。

    第一是大原则，一定要相信自己的直觉。

    重要的东西谈三遍。

    另一个生命或者环境，对你善意的，恶意的，不屑的，真诚的，还是虚伪的，

    直觉非常准确，而且能在极短时间内判断出来，

    没这个精度准度，人类早被淘汰了。

    所以，一定要相信你天生自带的防火墙和警示系统，直觉是人类进化300万年的高级传感器，也是高维世界对你的保护，

