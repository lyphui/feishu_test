    少吃

    今年是“体重管理年”，

    我们在吃上面有三大问题，

    一是主食太多。

    一大碗面，一大碗米饭，一大块馒头的把自己吃的很饱。

    蔬菜，谷物，优质蛋白摄入太少，不但很容易发胖，还容易得心脑血管疾病。

    二是吃的太饱。

    很多人吃饭就跟例行公事一样，到点了就吃，自己明明不饿。

    尤其是晚上，大鱼大肉的大吃一顿。

    你不饿，就说明体内的食物没有运化完毕，你的脾还没有腾出手来。

    继续供给食物，脾就会超频运行，运的多了，小则脾胃虚弱，大则胰岛素就出问题了。

    “若要小孩安，三分饥与寒”。

    适当的饥饿感和空腹，会激活肝和脾的“自检模式”，让相对负担轻松的血液完成循环，这就是网上讲的“断食16小时能激活细胞自噬”。

    你看长寿的老人，没有胖的。

    三是吃的过甜，过咸，过冷，过热等。

    这些都是中医讲的“肥甘、生冷、厚腻”，你晚上去应酬的酒局，基本把这些攒齐了。

    过食它们，就会伤及脾胃，脾胃失司，运化就会失调，人体气机不畅，各种问题丛生，最简单是脾不和则卧不安，睡不好，

    即便是小孩，一旦吃多了就成”积滞”，积滞日久，转化为疳。

    有些小朋友不爱吃饭，两筒鼻涕，学习注意力不集中，很多原因是吃的问题，与其教他考卷，不如调整饮食。

    女同学就更要注意少吃糖了，人体衰老的过程就是细胞糖化的过程，

    “黄脸婆”的说法不是没有科学依据，糖的原色是黄色的。

    男人的肚子大了，是内脏脂肪堆积过多，此时第一要务不是去跑步撸铁减肥，而是少吃，然后找中医调理脾胃。

    胖子的身体和心脏本来就压力大，再去撸铁，一过量心肌细胞会死很多。

    少吃，断食，注意搭配，

    三代才懂吃，意思是，

    三代我们才有了贵族认知：

    要严格的纠正一个意识：

    我们吃饭不是图饱的，

    我们吃饭是进行能量补充和健康管理的。

    所以每一次都要认真，每一次不能将就。

    食不厌精，脍不厌细。

    每一次吃饭都像给汽车在做保养，你的身体作为你所拥有最昂贵的豪车，能用劣质机油和大路货对付吗？

    这几天猛涨的小分子靶向药，老贵了，现在胡吃乱喝，将来就是给创新药厂创收。

