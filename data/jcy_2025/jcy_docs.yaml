    一周年的混沌期

    马上又是一年924，现在随着市场缩量，进入了主线晦暗不明的混沌期。

    还是拆开来说，

    科技，

    -海外板块，周末ocs热炒，而这是我们之前讲过的硅光方案，全光互联，以及谷歌系科技补涨。

    比如谷歌系pcb鹏鼎，沪电，交换机腾景， mems的赛威等，1.6 t和ocs是谷歌提出来的。

    那篇文章可以好好研究，车上的坐稳扶好，图没有坏继续拿，里面涉光的是最好的。

    没上的等科技震荡的较大调整或者盘中大阴线（-6%以上）时，分批次建仓。

    这里有个预期差，东田微，光隔离器有望突破日本住友垄断。

    -国内，在半导体设备，即打铁方向延伸，兵分两路，一块是光刻机，如果前排的波长，茂莱继续打高度，后面的维格之类都会继续，补涨理论。

    一块是中芯系，比如中科飞测，京仪装备，这里可以观察，如果台积电继续走好，陆基电中芯也会跟，

    那么etf的588710应该走势要比200好。

    -题材催化上，OpenAI与立讯精密，哥尔准备AI硬件设备，不用乱去看消费电子，利好端侧AI那几家，协创（还心概念），瑞王，乐鑫等。

    -另一个催化是特斯拉的审厂，t链机器人。

    -其他创新药，游戏之类的观点不变。

    没什么人注意游戏，游戏在悄咪咪的抱团，巨人打头，后面比如18倍的37互娱，散户买不起的吉比特。

    低位的，

    -另一个催化是特斯拉的审厂，t链机器人。

    -其他创新药，游戏之类的观点不变。

    没什么人注意游戏，游戏在悄咪咪的抱团，巨人打头，后面比如18倍的37互娱，散户买不起的吉比特。

    低位的，

    -反内卷继续看好风电，风机，塔筒。

    运达，金风，金雷等。

    -大消费，十一来临可以看旅游，

    -游资先行，走最好的是西域，图当然没有走坏，

