    念任何经都能成佛

    早上的文章，大家已经明白了主力资金的逻辑，那么它们在哪抱团？

    反复强调过的，

    抱团方向：海外算力，国产芯片，华为链，创新药，游戏。

    配置方向：机器人，反内卷。

    配置性方向意味什么，位置低，不流畅，但你“自我感觉”有安全感啊，迟早也能涨能起来，比如反内卷，养鸡的小明养猪的牧原今天都大涨，

    猪是谁买起来的？外资。

    抱团意味着什么？只要你拿着他们，尤其是前排和核心的品种，强者恒强。

    就比如说创新药的荣昌生物，bd大单各界不看好，砸到60多，现在80多。

    游戏，排头的巨人，冰川，华通，都是历史新高。

    排头更是轻易死不了，

    昨天的旭创，今天的天孚，一样是外资冲进来狂买，量化放大跟风，

    补涨的华为链有多猛大家也看到了。

    所以大家要知道什么？

    1，就算是轮动人家也在主线里轮动，高低切。

    2，就算是扩散人家也是在供应商和产业链里扩散。

    3，我们要有拿的住的能力，之前反复说的“配得感”。

    但凡在桌上，就不要因为你这个板块盘整，不涨，就急的不行或者焦虑割肉。

    往往是一段调整后，一个爆发就回来了。

    液冷电源没问题，说mgmt跌的时候有人惊慌失措，2天给你涨回来。

    又如AI应用，也是四大低位，因为GPT5不及预期大跌，我们讲那“两个半卖铲子”的，瑞声等，都已经收复当时下跌，继续又一轮上涨。

    你不可能同时拥有迈巴赫和自卑，

    你也不可能同时拥有：

    位置低、业绩好，不怕跌、天天涨。

    有些人为啥总亏，你想要同时赚钱和拿到情绪价值，

    那几乎不可能的，

    不是你拿不到，而是你情绪价值的阈值太小了，能接受事情的范围太小。

    非觉得跌是坏事，涨是好事。

    金刚经告诉你，凡有所相，皆是虚妄。

    涨跌都是空性的，你被它迷惑了，有时候跌是好事，调调更健康，涨是坏事，因为节奏打乱了。

    其实我就非常不喜欢小雅吹的那波液冷电源，慢慢涨多好，一锤子下去步伐乱了。

    你实在拿不住，自己懂自己，踏踏实实的去定投ETF，弄不好牛市走完，你发现自己还跑不过恒生科技指数。

    让东哥，雷布斯，马老师，小马哥等一大票人给你打工不好吗？你去阿里能不能混到P8？

    明年是马年，马字辈开始涨了，不排除有大妖股出来，先打个预防针啊，大家不要问，不擅长也没心思研究他们。

