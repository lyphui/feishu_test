  文档内容正文: "短期的反弹和数周内的走势 \n第一， \n今天有望迎来一个弱反弹，缩量的， \n中日问题，美联储降息，都在混沌状态， \n大资金们都是走一步看一步，\
    \ \n近期仍然震荡的概率比较大， \n大约一路磨到11月底12月初。 \n到那时机构的排名搞的差不多了， \n生产队也看出新风向了， \n大家该早期备战春季躁动了。\
    \ \n第二， \n-问题是，这个走势怎么走？ \nA方案：因为3800强支撑，上周3840左右，是短期压力释放的一个标志。 \n这里很可能有一个反弹，如果温和放量上去，村里呵护不断，比如到2.3-2.5万亿以上，那就继续向上看，\
    \ \n毕竟村里说了，防止大起大落， \n且16个硬科技ETF获得秒批，准备完成募集入市。 \n（AI基金前五大权重为旭创、新易盛、寒王、澜 \n起科技、金山办公）。\
    \ \n【问题是，如果这个反弹较弱，外围情况依然不好，这两天的科技反弹如果都软弱无力，极端走势将是什么】？ \n那就是周线级别调整。 \nB方案：之前讲过《三生万物》理论，\
    \ \n斐波那契数列的周： \n5,8,13,24,34. \n1，因为市场上周跌破了5，8，尤其是13周线3887点，就得去寻找21周线的强支撑。 \n\
    这个位置目前是3779左右，考虑到3731的标志 \n性位置，有可能盘中探到这个位置或者更低，去形成第一个底部。 \n2，形成后，会进行反弹，弹到5周线左右，比如3945附近，\
    \ \n3，然后继续下杀再洗，此时，中等概率再次回踩21周线，也就是3731附近，有较大概率去寻找一下34周线， \n目前，是3610左右。 \n4，那么你明白了吗？\
    \ \n杀到21周线拉上去碰5周线点位，再然后杀下来，继续回踩21或者去寻34周再拉起来。 \nW型双底踏实后，不可限量。 \n即： \n21→5,5→21/34,21/34→新高。\
    \ \nW底的第二个低点21/34，有可能粘合。 \n比如，3601就太低了，去年突破点的3674左右形成粘合，略微下探问题也不大，那时妥妥是吓你。 \n\
    我们把3800守不住和生产队不出力，外围不好的最坏情况也告诉你了， \n那么你已心里有数， \n你什么时候趁反弹卖，什么时候敢于抄，就应该知道了。 \n比如3731附近抄一波，3930左右卖掉这部分仓位，等再下到3731甚至3674/10左右，仓位提上\
    \ \n去，26年任务完成，等开车。 \n总之，记住这两张图， \n要么A: \n不再破3820（月线MA5），附近站稳，这里也是13周平台左右。 \n要么B,\
    \ \n21—5 , 5—21/34，21/34→新高。 \n当然，5，21，34，是动态的，点位因时而异。 \n第三，市场是结构性的， \n短期的几个策略，\
    \ \n-牛鬼蛇神什么海峡概念的要全部跑光， \n-目前依然看好的是什么，还是之前两的两个，【AI应用和谷歌链】， \n现在市场才回过神来看谷歌链，我们提前说了多久了。\
    \ \nAI应用里，依然是我们讲过的几个，蓝标，易点，省广等，本身也跟谷歌有合作， \nAI营销教育之后，有望扩容延伸到AI语料，长短期均线粘合的好好看，板块里一共没几家，不追高，机会多的是。\n\
    谷歌里除了其他，之前谈过腾景德科立赛微光库的ocs四小龙，图形没坏就继续拿着。 \n-11月21日，华为会召开AI大会，技术图形上，硬科技有看点的是华丰科技，站在34日线的边缘，低开或者砸一下比较好，跌穿78.85视为不行。\
    \ \n软科技上，万兴，几条均线相交，周五涨过了，回调一下比较好，在74.5这个附近震荡且不回补缺口视为有想法。 \n因赛的图看着也凑合， \n当然它们是博弈性机会，不能上头。\
    \ \n11月6日前跑了的，周五如果被吓的割肉走人的，今天反弹不是买入时机，有仓位的同学也是，不着急补。 \n待市场站稳这个平台，有向上收复的动作和量 \n\
    能，或者出现新主线再说。 \n超级高手们可以去关注一个题材，会打野的看。 \n乌克兰战后重建，有无异动。 \n北方国际，新疆，工程机械之类的， \n天塌不了，上升途中的调整，\
    \ \n科技，也依然会是主线。 \n今天的上涨压力位3887，想玩T的看这里附近。 \n问，盘中如何知道指数涨跌预期？ \nA50中国期指连续，慌乱的机构是羊群状态，完全被老外带着走。"
