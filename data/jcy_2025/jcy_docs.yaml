  文档标题: Vol.241105 四大正牌并购重组概念分析
  文档链接: https://h160bxy8czl.feishu.cn/wiki/XI8fw160Uis13tkguOPcX7Fhn0c
  文档内容正文: '1992年，IDG资本进入中国。中国的股权投资市场才开始萌芽，并长期以美元基金为主导。

    1999年前后，中国本土才出现了几个代表性的创业投资机构。

    创业投资是Venture Capital，真正的风险投资，是风投。

    早期的几个是，

    深圳的深创投、上海的上海创业、苏州的苏创投、北京的中关村创投。

    其他还有清华的清华创投，江苏的高投北京的联想等等。

    今天，大部分都混然众人了。上海创业反复被合并，今天是上海科创集团，早就不搞风投了，中关村变成替政府管引导基金的，联想基本不玩了，

    苏创投改制了，现在叫什么元禾，市场上剩下的只有深创投。

    深创投就是本土正经创投公司的旗帜，可能跟土壤有关，另一个半国有的创投，达晨创投，湖南出的钱，但总部在深圳。

    深创投的品牌叫“红土”，业内是响当当存在。

    说到并购重组，你得天天玩，有技术，手熟吧?你得有标的，能并进来吧?你得有团队有人马吧?

    全国手熟会玩的，也就北上广深等几个城市。

    由此再谈一下我们提过的四大并购重组企业，

    怡亚通，深投控是大股东

    中新赛克，深创投是大股东

    上海电气，大总包商上海电气大股东

    信达地产，信达投资是大股东。

    都是国有控股。

    深创投都要知道了，主营VC业务，他投的公司都要上市的，上不了，就得往一些地方装。

    深投控是深圳的金融科技(放贷)公司，产业园开发公司，资产管理公司，本地一些可以腾挪的，就能装。

    上海电气是赛道，他本身就是国内最大风电集团之一，担负去产能，去内卷的重任。

    信达大家都熟悉，地产界二舅，信达是四大AMC公司，主营化债，AMC有地产平台的，他独一份。

    东兴证券是东方资管旗下的，但东兴能并购人吗?不能。

    这四个非常典型，分别对应的是

    创投，平台，赛道，化债。

    趁哈里斯预期，跌停式建仓的上海电气短期没啥机会了，

    看深圳的两个，深创投就是主营并购业务的，投控的想象空间也存在，

    长期看，如果真要中央背债，化债，去买地方的不良，信达是主营，信达地产很正牌。

    但问题是，

    你如今130亿的盘子，太小了，连一个盘都接不住，你要去化债，没有3000亿起步的体量，你化个毛线。

    因而，这事太大，这牌迟迟没有启动，目前没有领导表态信达地产的事情，表不起，但你说债化不化?

    当然，市场上其他搞并购重组的概念和票还很多，咱们只能“正合奇胜”，挑最正经的出来。

    大王是干过并购重组的，有的同学们也做过，这活儿多难，相当于你把三块机械表拆了，扔地上重新组装起来。

    重组也是买东西，但它比购物难一万倍，这个业务逛进去，没半年出不来。

    以上，是我们讲贯穿的并购重组先几大优秀企业的逻辑，高位票调整，对他们也是观察和建仓的时机，至于操作也谈过金字塔建仓法了，高手们自己掌握。我们谈的一切，均不构成任何建议。

    这条线，依然是早期，处于陈胜吴广的阶段，谁是刘邦项羽，且不知道。

    目前的阶段，依然是TMT的修复、赛道哈里斯概念的蠢蠢欲动，以及紫禁之巅博弈美国大选及刺激落地。

    但逻辑么，你得提前思考率顺起来只有宏观的透彻把握，才有微观的气定神闲。

    总是有不少新同学和次新同学来问，今天搞什么?

    这句话翻来覆去无数遍了

    不高手的搞指数，但创业板指数。别去乱折腾，今天这局面，几个能涨过创业板指的?'
