    自我的创伤和内心的光明（下）

    在上篇中，我们从心理学角度讲过懂王和万斯，是被小泽激活了童年创伤。

    近几十年来，中国孩子的童年，不够圆满的很多，比如，

    加上成长中的放养，导致有些人的心理是不够圆满，乃至有创伤的。包括但不限于，熟悉、恐惧如下东西：

    被忽视/被否定/被打压/被排斥/被抛弃/被拆穿/被嘲讽/被控制，

    害怕冲突、害怕孤独、害怕饥饿、害怕失去、害怕指责，等等。

    内心当中有极度渴望的东西，

    又住着一个不能接纳的自己。

    这种情绪往往会让人有很强大向上和奋斗的力量，一定要出人头地，

    但到一定阶段，不圆满的自己就会暴露出来，有些人会碰到一个人，或者场景，激活自己的伤口，这就是情关和情劫。

    胖猫碰到夏竹跳江，苏享茂被玩的自杀，都是情关难过。

    马老师到处找玩蛇的骗子，拍各种视频歌曲，到最后峰会喷人，也是一路探索情关。

    马老师到处找玩蛇的骗子，拍各种视频歌曲，到最后峰会喷人，也是一路探索情关。

    马老师内心的执念是，

    被主流社会完全的接纳和认可。

    为什么成大事要过情关，

    你得先自我圆满才行。

    所以各位，如果你碰到一个让你痛彻心扉，反复内耗，揪心痛苦的人，事，或者环境。

    那个就是你的情关，让你反复纠缠。

    这时怎么办？

    1，不要怪对方，着急去吵架，去应激。

    而是静下来问自己，她究竟激活了自己什么创伤？你那个不想被发现的小我躲在哪？

    你恐惧和焦虑的是什么？

    你为何唯唯诺诺，不敢去吵架，提要求？因为你小时候提也没用，说了会挨打。

    特朗普为何要叫懂王，他迫切希望被看见被理解，他有真本事。

    有些人，为何一不回信息你就焦虑，你害怕的自己不被重视，不被坚定选择。

    发现创伤，其实就过了一半。

    有些人，为何在一个事情反复跌跟头，情关过不去，道理都懂就是出不来？

    因为人们，在熟悉的环境中会觉得“安全”，你是在把伤口反复撕开，重复童年的模式。

    很多反应强烈的情绪，并，那不是发，那是创伤心激。

    2，要么，你远离那个环境和人，不纠缠了，咱惹不起躲得起。

    真正的高手，是亏得起的人，买单离场，绝不含糊。

    否则你越搞沉没成本越大，走不了了。

    要么，再次你揪心和难受的时候，大胆把自己要讲的，想要的，表达出来，绝对不忍辱负重，不惯着对方。

    就是要“克服耻感”，付出没有错，你要求没有错，你是NB的，她不识货，算个毛线。

    失去是双向的，她都不怕，你怕个p。干他，赢一次，赢十次，赢麻了。

    你终究发现什么？安全感是自己给的，和对方毫无关系，这就是爱自己。

    3，多去接触让你感觉快乐，舒服，高能量的圈子和人，

    因为他们给了你心中未曾满足的期待，在源源不断医治你的创伤。

    最优秀恩爱的伴侣，其实就是你想象中，理想父母的样子。

    她给你打满了安全感，抚平了焦虑和恐惧。

    如果没有，你那就靠自己，痛苦感一起，你就按自己期望得到的感觉，静下来劝说自己，

    "xxx，你其实已经是成功人士了，你早就长大了，那些城隍已填平了，你已被坚定选择，你自己非常强大，你无需依赖别人，你是世界的中心”。

    和童年的自己握手言和，归来仍是少年。

    4，仅仅看见与和解还不够，你怎么完全治愈？

    用崇高战胜渺小，用高能覆盖低能。

    你读名著，看电影，背书，那些荡气回肠的东西，自己这点问题算什么？

    你去发现和回忆，自己做什么事情，会感到开心，感到充实，感到人被唤醒和激活？

    你做什么？激活了人性中最美好崇高的东西，比如敬业，坚持，豁达，慈悲，无畏，谦虚等等，能让你内心获得能量的。

    你真爱一个人不求回报，你山村支教而不为功名，那一瞬间的东西，就有不朽的东西存在。

    你抓住火苗，把它点旺，日日培养，最终把内心那些委屈，不公，愤懑，如热汤泼雪，狂风扫叶，一扫而光。

    烧掉自己的贪婪，恐惧，傲慢，急切，

    最终你哈哈一笑，当年你苦苦追求的那些东西，不过如此，一团残留的欲望和创伤而已。

    本来无一物，何处惹尘埃？

    当你内心中使命，责任，充实的光芒连成一片，就点燃了人生的终极意义，这就是“我心光明”。

    你此时的状态就是“谦”，因为你既无所畏惧，又乐观的相信和接受一切都是最好的安排。

    那就“自天佑之，吉无不利”。

