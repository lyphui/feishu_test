  文档链接: https://h160bxy8czl.feishu.cn/wiki/TeWFw93saii9TEkbmqZcHA72n4d
  文档内容正文: '在阿塞拜疆与亚美尼亚大战时，大王就觉得这是项庄舞剑，意在沛公，果然。没过几天，中国边上的吉尔吉斯斯坦出事，一群人攻占了白宫。

    阿拉伯之春，熟悉的配方，熟悉的味道，民主党和平演变的压轴曲目，胡汉三又回来了。

    亚美尼亚阿塞拜疆吉尔吉斯一线，是中国的西北，也是一带一路往欧洲的重要通道，美帝这招，不可谓不狠，但从另外的角度说，这一看就不是川普的手笔。

    正如今天大王在微信文章《强行出院的特朗普》一文所说，搞离岸平衡手搅动世界风云，其实是英裔擅长的东西，川普这些德裔，手法资源上都差很多。

    就如同很多搞实业的人认为做金融的是骗子，做金融的认为搞实业的是傻子，每个群体都是有自己基因和价值观的，不是白纸。

    就连刚出生的孩子，其实也写满了基因代码，后天的塑造远不如先天注定有效。海外不仅有唐人街，各种族裔也是集中居住的，只是大城市好点而已。

    那么美国在中国西北的闹事，究竟有何用意呢？大王认为可能有两个。

    第一，民主党和英国裔自己搞得，他们完全有那个能耐。拜登当年在参议院，就是主管中亚那一块的，当了副总统后，更是和乌克兰那边打的火热，拜登儿子在乌克兰明着拿钱，被川普搞了个电话门，其实希拉里，小布什都在前苏联东边那些国家拿钱，有深刻实力。

    搞乱了中亚，压制了中国的陆地通道，逼着两党把权利交给能搞定那个区域的拜登，是可能性之一。

    第二，是两党后面的大佬达成了妥协，决定改弦更张了，停止在东亚台海一带搞事，很容易擦枪走火得不偿失，而在中亚搞事，对中国牵制力度其实更大。

    中国有两个生死攸关的“联盟”，一个是东盟的10+1，这个是保证发展的，东盟是中国最大的贸易伙伴，一个是上海合作组织，这个是保证安全的。中国的西北，远比东南薄弱，中亚打烂了，民族纷争和宗教纷争起来，我们伸往欧洲的手受影响不说，靠陆权制衡海权沦为空谈，自己内部也会受影响，这个不展开了。

    西北不是东南，东南经济发达民众齐心，西北民族众多地广人稀，老美这招，不得不说很高。

    如果是两党背后勾对好了，那么川普得病住院就顺理成章了，而川普是根本不敢在里德医学中心待的，那是共和党已胡大佬麦凯恩的地盘，麦凯恩，布什的好朋友，布什家早和川普撕破脸了。

    怕被整死，川普只好抓紧出院，好歹白宫还有点控制力。

    那么，川普为什么不愿意和平交权呢？他坏了美国政坛的规矩，美国的政斗，是不能明面杀对方头目的。

    而川普呢，上台后被戴个“通俄门”的紧箍咒，他的反击是曝光了希拉里的邮件门，抖出了大佬们暗地支持isis的证据，又搞了个爱泼斯坦案，这是要断人财路和往死里整克林顿的节奏。

    而且，川普又把参议院大佬们(拜登为首)的乌克兰事件抖出了出来，还要把维基解密的创始人甚至斯诺登弄回来，基本是和背后的大佬们翻脸了。

    这就坏了规矩，到一定地步，是不能下死手的。你既然下了死手，那就必须死。

    大佬们有钱有权利，川普也不是泥捏的，他有民意，他不愿意做棋子，如果反杀了这一波，川普也是顶级豪门了，而且美国之前的政坛，也不乏有成功案例。

    一些人认为，大王的说法充满了阴谋论，其实马基雅维利早就说过，阴谋才是政治的常态，游戏规则就是不择一切手段，欧美可都是马基雅维修信徒。

    就连政治家族出身的大文豪罗曼罗兰也说，政治的背后，是金钱。你科赫兄弟有钱，川普有钱，凭什么妨碍IBM高通们去挣钱？你能用梦想号召他们忍6个月，忍一年，你能让他们4年不挣钱吗？

    4年任期1.2万亿美元的芯片进口额，还不值当买川普吗？制裁韭菜，到底是庄家急呢？还是韭菜急呢？

    话说德国人真是爱搞均贫富的那套啊，科赫兄弟要搞内循环，川普满嘴不离人民，大王忽然想起来，马老，就是德国人啊，基因使然，传统使然。改不掉的。

    综上，从台海闹事到中亚平衡手，体现了美国政策的巨大转向，而坏了规矩的川普，不管能不能上，都只会进一步激化美国的矛盾，但他管不了那么多了。

    对我们的影响是显而易见的，热钱都要避险，人民币升值，股市下跌后向上是大概率，一线强二线城市的贵重资产和科技资本市场，必然是前途无量的。

    我们还有很多要提高之处，但他们远比我们更烂。

    有时候，你不得不相信国运这种东西的存在。'
- record_id: rec7hQt7e3
  文档标题: Vol.10 王兴  马云 马化腾的恩怨
  文档链接: https://h160bxy8czl.feishu.cn/wiki/S2CawL0sniiDojkzS1tcHuqjnod
  文档内容正文: '之前黄生同学有问过美团、阿里、小米的模式，作为一个相对多知情一点的，来说几句。

    中国互联网界敢直接说马云的只有一个人，就是王兴。王兴看不上马云代表的那种文化。

    中国的互联网界，不是海归就是学霸，当年亚信科技的丁健，百度的李彦宏，新浪的茅道临，搜狐的张朝阳都洋气的一塌糊涂，就连马化腾，也是高考700多分的学霸，刘强东是人民大学的，雷军是高考状元。

    他们代表着专业人士和高级知识分子，洋的，马云是什么人呢？浙江土老板。

    马云一个高考复读生，还只上了个杭师大，很不上档次。而且，那会大家都是谈出身的，你是500强摩托罗拉出身，你是硅谷风投出身，马云出身土不拉几，杭州电子科技学院，杭电老师出身。

    跟人家天生就不是一路人，所以我们看马云和江湖各路人马能打成一片，很少跟互联网圈子的人合影，别看他规模大，他进不了那个圈子，哈哈。

    王兴什么人呢？高傲的学霸出身，高中直接保送上清华的，美国的博士。向来就是不为牛后的。

    王兴博士没读完就回来创业，美团之前创业大概三四次，最成功的一次是创办了校内网，后来卖了，陈一舟把它搞成了人人网，上市后估值80多亿。

    王兴一直都觉得自己很行，这是那一代海归的毛病，自视甚高，水土不服，还老看不上别人，还不接地气。

    直接造成的结果是王兴的美团在当年团购网的“千团大战”险些死，美团当时一大堆不接地气的博士高管，看不上最基层的劳动人民又想去搞地推，钱没了公司也快死了。

    说实话当时比美团好的团购网站不少，但王兴的圈子发生了作用，2011年，王兴跑去杭州找马云说了一箩筐好话，马云被拍的飘飘然，阿里那会其实资金也紧，但硬挤出了1个亿美元砸给美团。

    对手烧不过美团，自然节节败退，但马云对王兴最大的支持，是把中国供应商那票会玩地推的人马和模式基本全教给了美团，美团从此才有了会营销、地推、去城乡结合部扫街扫楼的基因，不然王兴你一天基层都没干过，怎么会和黑车司机打交道呢？

    因为看好美团，阿里的本地生活服务优先度排在在后面，对拉手的投资也心不在焉，结果，因为阿里的人在美团太多，影响了王兴的控制力和主导权，王兴很不高兴，想了个办法，把带队支援的头目，阿里副总裁，67号员工干嘉伟给挖过去美团当coo。

    不得不说，这对美团是步妙棋，商业模式又不是专利，干嘉伟都会，那些人马他也能使唤，王兴这么一招李代桃僵，直接破了阿里的控制力。

    当时中供系在阿里内部混得也不好，马云没想明白，不然，今天从送外卖到干二手房，哪有别人什么事呢？

    马云那会还没学会做自己，毕竟土老帽出身，也觉得500强好厉害，洋博士就是不一样，把百安居中国的总裁卫哲也挖去，想让他接班，其实是不可能的，阿里当时的文化，就是草莽英雄读点书。

    言归正传，王兴把干嘉伟挖过去后，马云捏着鼻子认了，大不了算个嫁妆，还是继续投美团，到C轮陆陆续续投了3.5亿美元。

    阿里的人一直都认为，美团是阿里系的，老干是嫁出去的女儿，阿里用了多少资源给王兴导流，最高峰时，阿里拥有美团15%股份。

    王兴一直坚持美团就是自己说了算的，2014年前后，阿里要求美团只用支付宝支付，翅膀硬了的王兴当然拒绝，凭什么？

    看到这种情况，腾讯自然趁虚而入，他的策略是互补，给钱，不控制，和阿里完全两个风格，王兴当然很喜欢，2015年，美团直接合并了大众点评，这等于投靠腾讯，2016年E轮融资，阿里不见了。

    一手养起来来的美团投靠了腾讯，阿里系觉得这简直是过河拆桥，义愤填膺之下他们甚至说动了不管时的蔡崇信，砸钱给美团对手饿了么，最后98亿美元全额收购。

    阿里人骂王兴忘恩负义，王兴说你马云也没好哪里去，生意归生意，你老想控制我，跟我谈什么交情？再说了，马云你搞支付宝，把雅虎和软银偷偷踢走，不也很脏吗？

    打心眼里，王兴这种海归学霸大牛有点真心看不起阿里，王兴专门在电视上有个节目，和一堆高考状元谈回味高考，这是针对谁，哎。

    江湖人于是都知道王兴看不起jack马，王兴也得了个三姓家奴的绰号。

    至于帮助美团起死回生干嘉伟，在美团被彻底边缘化，王兴封他为互联网大学校长，再往后，只能离职了。

    马云的湖畔大学开办后，马云专程去授课，题目是企业家精神与伦理。

    但那时，美团已经不可撼动了，阿里的本地生活不但一败涂地，而且自己的老巢电商，也有被美团偷袭的可能性，然而，大家都知道美团那点事，核心是三个清华的，王兴非常独。

    而为了帮王兴拉点声誉，素来不爱社交的马化腾，2017年，竟然也在乌镇互联网大会上摆了一大桌，让王兴坐第二位置，东哥在第三位置作陪。

    号称“东兴局"。

    腾讯大概持有20%美团股份，但小马哥聪明的地方在于，他不管事，决策权还是王兴的，对了，腾讯也是京东的重要股东。

    2017年中国互联网的格局，当时几乎要变成ABTJM。阿里、百度、腾讯、京东、美团。腾讯占半壁江山。

    阿里的人“忍辱负重"，终于在2020年把蚂蚁金服搞上市，中国互联网格局变成了ATM。阿里、腾讯、蚂蚁金服。阿里系三分天下有其二。

    但美团追上来也是很快的，1.5万亿港元，之前他的模式我们讲过了，他的规模优势和边际效应。

    过去，农民工进厂，给富士康打工，现在，年轻人进城，给美团打工。美团就是个超级垄断的托拉斯企业，还解决就业，技术含量，重要吗？

    最后，我们提一下中国互联网企业能有今天，至关重要的成功要素，固然是企业家的聪明才智，但更是中国的市场催生的，足够广阔，足够资本，足够各种折腾。

    而在大王看来，中国互联网企业折腾这么多年，也就办好了一件半事情是。

    半件事情是，银行不改变，医院不改变，我们就去改变银行，改变医院。

    一件事情是，阿里含辛茹苦搞出的阿里云。这简直不像阿里系搞出的事情，致敬王坚博士。

    从孙中山闹革命到中国进入数字经济时代，

    广东老板改变上个世纪。

    浙江老板改变这个世纪。'
- record_id: recP2VFv8s
  文档标题: Vol.9 定位战略，心智模式，营销学那点东西
  文档链接: https://h160bxy8czl.feishu.cn/wiki/EpROwCJ8AinCI9kXbNncs03Gnrc
  文档内容正文: '经典市场营销学的科特勒开创的，价格、产品、渠道、广告(也有翻为促销)，即经典的4p战略，核心出发点是什么呢？企业。

    所以当年的中国营销界一直是谈"广告为王"，CCTV标王大战，从三株口服液到秦池古酒，嗓门大你就赚钱。

    但很快大家发现，你广告打了，市场能力不行没用啊，终端没货，铺货，设计代理商机制可是个技术活啊。于是出现了"渠道为王"。

    你能把产品送到客户手上，你能占领小卖部的货架，你就是成功的。

    娃哈哈厉害就在于，你在新疆也能买到他的纯净水，王力宏代言。

    但搞渠道也不是什么难事，可口可乐联合利华，是渠道界的黄埔军校，大家学习呗，学不了，就挖人。

    那时候是500强职业经理人的黄金年代，呼风唤雨，专业的一塌糊涂，大王也很怀念那个年代，因为学习的氛围很浓厚。

    1969年，全球顶尖营销战略家艾尔·里斯和杰克·特劳特在美国《广告时代》和《工业营销》上发表了一系列文章，首次提出“定位”概念。他们认为，面对一个传播过度和产品越来越同质化的时代，要赢得消费者，企业必须让自己的产品独树一帜，在消费者心中形成独特的地位。

    很快渠道为王也学会了，到处都是同质化产品，怎么办？

    出发点要变了，变成客户。理论界出现了4R，4C理论，跟客户互动啊，维护关系啊，等等，没想到客户很刁钻，根本不买账的，你有补贴，就薅羊毛，你没补贴，拜拜。

    于是里斯和特劳特的《定位战略》横空出世，把定位理论引进中国，大王当年也是参与过一小下的，定位的原理很简单，不跟客户搞形式上的假互动，直接占领你的心智。

    定位理论认为，人们去买东西，买的不是浅层商品，而是深度需求，这种需求促进他下手的行为习惯，就是心智。

    客户买的不是品牌，品牌只是确定心智的符号。

    比如说的海飞丝代表着去屑，潘婷代表着滋养，飘柔代表着柔顺，百度代表着搜索，360代表着安全。

    品牌≠心智。品牌打造的目的就是形成心智，这对国内企业界的冲击是巨大的，到今天很多企业还理解不了。

    后来，各路大师跑去给霸王做了个战略，霸王的心智是"防脱"，又请了成龙，一下做到几十亿。再给加多宝做了个战略，心智是凉茶，一举从1亿做到200亿。

    客户喜欢简单、直接，干脆的东西，这样才能够理解成心智。拿美国的大选来说，川普给美国人的心智是"重新伟大"，一下就占领了美国老白男的心，相比之下，当年希拉里的的"坚定在一起"就显得空泛，没有共鸣。

    而今天，川普的口号是"保持伟大"，心智一脉相承，一个中兴统帅，改革者和引领者的形象跃然纸上，而拜登的"BBB"，"建设的比昨天更好"，不但不利于传播，而且显得老派陈旧，匠气十足，占领不了心智。

    有时候，如果不知道自己的定位是什么，一下没找到客户心智，就先给竞争对手定位。定什么？你不喜欢的东西扣他脑袋上就行。比如丰田＝断轴。

    川普率先给对手定位"老迷瞪"，堪称神来之笔。他也是70多岁的人了，肯定经常也犯困，自己肯定不想要这个形象，扣到拜登头上，大家就不会这么认为他了。

    几年来，川普各种出格举动，其实并不是做妖，一天发200个推特也好，蛮横不讲理也好，都是在强化和提炼自己，形成大众的品牌印象。

    他的做妖，就类似王老吉的红罐，后来改成金罐，反复强调自己的金罐。

    这对我们的启发也是很大的，要时刻明确自己的定位，自己是干什么的，自己擅长什么，自己做什么成本最低。然后再在你的领导、客户、乃至圈子形成一个心智，这个心智，就是"印象"。

    比如，小王教育口关系到位、小李在北京资源人脉丰富、小宋是理财专家、小张是营销高手、小马公司的家具都是领导去买的，小郑的餐厅公务宴请非常合适，小丁写的一手好方案...

    一句话，要把自己说清楚。以前我们在《底层代码:赚大钱》跟大家讲过，大人物和上面的圈层并不是什么有的，他们也有很多事情要办，而你融入的最好办法，是让他们的知道你擅长和能办某一类事情，进而形成资源的交换和互动。

    久而久之，你就在大家心目中形成了心智:你是做什么的。

    公司要组织一个重大项目组磕大客户，小张擅长营销，全单位都知道，调过来，工资加两级。

    市里某一个小领导家孩子想在省城上个私立高中，提着猪头找不到庙门，一打听大家都说小王在教育口关系熟，那就你了。一来二去，找你的人越来越多，你逐渐形成了一个"圈子"。有了圈子，你就能依靠资源的流动倒手挣钱了。这是另外的课题了。

    虽然，小王能办的事情很多，书法写的也好，其实不想做个专业跑学校的，但你背后的东西，属于晕轮和光环效应，别人得先知道你，才能深入去了解你更多的东西啊。

    就如同，人们通过空调认识了格力，后来发现他的电饭煲做的也挺好，人们通过冰箱认识了海尔，然后才发现他豆浆机也做的不错。

    营销的目的是占领心智，个人的发展要形成印象。每天，你都应该在强化你印象的路径上奔走，此所谓人间正道。'
- record_id: recXbAx155
  文档标题: Vol.8 底层代码系列  赚大钱的基础是堪破虚妄(上、中)
  文档链接: https://h160bxy8czl.feishu.cn/wiki/B25zwHfnkieSA7kA5ieclkgbnsR
  文档内容正文: '最早见到红星美凯龙的老板车建新，是很多年前了，那时候他还在开着红星家具厂，已经在常州开了一个家居卖场了，正准备搞大。

    那时候大王勉强算青年才俊，而老车是个农民企业家，于是交流的比较平等，大王就把当时不成熟的底层规则学说跟他一通分析，他既然要开店么，又连锁，大王告诉他全世界开店最成功的是麦当劳。

    麦当劳是卖汉堡的？不，它其实是个地产和金融商。麦当劳在街道和拐角处买下一对房子，或者租一大片自己根本用不了的物业，然后再开出餐厅，生意一火爆，当然附近房价和租金飞涨，它就是这么赚钱的。

    麦当劳赚钱跟汉堡有关吗？看似有，实际没有，高深着呢。

    在走时候，整个团队得意洋洋的告诉老车，嗯，啊，你要搞得这个家具卖场，等琢磨出跟家具没关系了，你就成功了。

    没想到老车果然非同常人，过了些日子，他说他想明白了，家具卖场的核心不是家居，而是卖场，他干的是房地产生意，特么跟家具一毛钱关系都没有。商业模式，跟麦当劳很像，很像。

    老车从此很推崇麦当劳，他要求自己的LOGO，前面必须带一个金黄色的M，大王明白，这是抄袭，哦不，致敬麦当劳的m型金拱门。

    中国家居卖场起步的年代，大家还真都以为自己是卖家具的，要给家具厂商良好的环境，招商很委屈求全，只有老车知道核心不是招商家居品牌，他基本不管这事。

    既然是商业地产，那么立足的本质，一是地段，二就是客户体验。

    地段上，老车后来去上海开了真北商场，然后又赶紧去北京等大城市圈地，算是占到了先机。

    客户体验上，买家具是为了满足对家的想象，必须高大上。老车请了日本的设计师，设计了外立面和形象，一下就把月星家居之类的甩出去很远，人们逛商场，扶梯都是错开的，找扶梯下楼很费劲，叫你转来转去，增加你逗留的时间和动线，但老车认为，客户体验至上，他要求的扶梯必须上下口都在一起，看不上，立刻就能下楼走人。

    红星美凯龙不收扣点和管理费，但是坚决要求统一收银，当时除了他没人这么干，不得不说，他们掌握了家具卖场的行业本质。

    他的行业本质是地产，核心资源是政府和消费者，真的跟家具一毛钱关系都没有。

    再后来，郎咸平到大陆忽悠，听说后四处提两句话，

    发现事物的本质，

    危机中寻找转机。

    老郎忽悠和提炼能力都很强，确实也不是一般人，但有两个大毛病，一个是没具体操作经验，一个是太好色又没品。但那是后话。

    老郎在这个基础上，破解了苏宁和国美帝国，都是弟弟干家电卖场，哥哥干房地产，弟弟压供应商货款提供现金流，哥哥搞房地产提供收益率。完美。

    再后来，我们又堪透了小家电行业，他的核心本质叫做品牌晕轮。

    小家电厂商必须搞一个很厉害的单品，比如，格力造空调厉害，美帝造电饭锅厉害，海尔造冰箱厉害，形成客户感知:哦，这个品牌造家电厉害。

    然后，他们再扩充生产线，造电饭锅，洗衣机等系列产品，客户会把在你优势产品上的认知，转移到你其他的产品上。

    说的通俗点，爱屋及乌。反正你其他的产品都是代工的，利润高到可怕。

    再再后来，就是地产行业，房地产看着是盖房子，但本质是融资能力。融100个亿，利率便宜1.5%就是1.5亿净利润，干死也挣不了那么多。所以只会干好产品，融资不行的绿城宋卫平、黄文仔的星河湾都退出市场了。

    要破解一个行业的本质，就需要了解那个行业最关键的要素。

    因此大王一再提出，赚钱，就是加工和出售廉价资源的过程。

    而你能了解或者持有的这个廉价资源，如果正好是那个关键要素，那就是风口上的猪了，雷军也很贼，不把话说透，从魅族那边坑走了一堆廉价要素。

    大部分赚大钱的事业，核心资源都是沉在水下的，其实没发量化，技术分析只能分析最表层的东西，那个根本不是核心要素。

    因此我们在内部开会时，会经常很深刻的问一句话:这家公司在卖什么？如果说出来的是商品层面的东西，那肯定不合格。

    我们也可以自己问问，我们公司，到底在卖什么？我们这个行业，他的本质是什么？我们抓住本质了吗？

    当然，隔行如隔山，大王堪不透的行业多了，比如省城转到地级市，地级市转到小县城的转运服务和支线物流，基本是黑白两道的天下。

    而推到股市，技术分析能看什么呢？过往成交记录，箱体震荡周期，在平时年景，有点作用那是在稳定与和平周期，一遇大震荡，技术模型立刻失效。

    最近涨疯了的光大证券，拿MACD金叉怎么看？高速公举测速仪只能测200公里/小时的汽车，低空飞过一架飞机，你怎么测？

    上市公司业绩、K线结构形态，跟股市上涨有关系吗？可以说一毛钱关系没有。股市上涨，就是因为天量资金的进入，你得分析资金来源和投资喜好才有价值，那么你知道大鳄们账上有多少钱，你能分析国家队的投资风格吗？不能，什么数据都没有。

    而且股市最重要的一个要素是人心，这是经济学和统计学界几百年都没法量化的东西，那怎么判断？干脆提了个理性人假设，玩赖，不判断了，西方经济学因此始终是一门瘸腿科学，马克思倒是把经济学代入了人的要素，变成了思想家。

    K线图不是体检报告，这是资本市场必须要破除的第一个虚妄。

    大部分我们认为的理所当然和决定性要素，其实并不是那样的。之前我们说过，投资界大佬们都爱读的《金刚经说》，无人相、无我相，无众生相。

    眼见不为实，才是迈开认识底层规则和赚大钱的第一步。所以马云之前， 天天神神叨叨的，就是要普及相信的力量。'
- record_id: reczNfFvwJ
  文档标题: Vol.7 后浪、前浪与壁垒
  文档链接: https://h160bxy8czl.feishu.cn/wiki/Cu4gwvCVYiJUuWkpeXEcs1uNnvh
  文档内容正文: '从来只有新人笑，有谁听到旧人哭。被后浪淘汰，是一种历史的必然，少数的人，融入后浪，唤做基业长青。

    前浪要想不被淘汰，只有两个壁垒和依靠，那就是资产和能力。

    这些年，大家感觉越来越难赚钱，是因为风格转换、行业轮动，能力迭代的太快，边际效益在快速衰减。中产以学历、能力积累的护城河越来越浅。当年，全村能出息一个大学生，本科生已经非常不错，现在，看大门的都要研究生学历。

    能力和学历是不好依靠的，他需要大量时间的积累，也需要《底层代码-赚钱》中，我们谈到的三个要素，得保证学到的是文武艺，还得会加工，最后要货卖帝王家或者最贵的一个。

    另一个就是资产。之所以是前浪，是因为有时间的加持。你要看自己用时间换来了什么。所有的动产、不动产、信用积累、人脉资源等，直接或者间接能换来钱的东西。

    而所有的资产里，只有两样是最值得我们关注的。一类是可持续产生现金流与利润的资产，比如你的工厂，生产资料，一类是可以拿去抵押或者增信，市场上换来现金的资产，比如核心地段的住宅、黄金，比如你的信用、口碑、人情。

    一些同学可能并没有工厂或者产业，我们主要来说可抵押和可增信的资产。

    对于可抵押拿去换钱的资产，我们投资和获取一定要选择大众认可的硬通货，太小众的东西难以抗风险，根本原因在于教育人们他很值钱的成本太高。

    硬通货，市场就那么几样，而且来回变换，我们之所以要时常保留年轻心态，和年轻人在一起，是要了解他们对硬通资产的看法。所谓的核心资产，都是有人愿意接盘的，如果没有交易对手，或者后浪认为他根本不值钱，乃至干脆买不起，核心资产就是一句空话。当年轰轰烈烈搞了多少文物交易所，古玩字画卖了多少，结果新的后浪根本买不起，掀了桌子不认可你这东西值钱，多少亿万富豪最后沦为纸面富贵。

    黑石的苏世民讲，资产的核心价值，是帮助你能够穿越周期。

    对于可以刷脸就能拿到的钱，-C的口碑和人情往往靠不住，关键时候要考虑从-B的机构纯信用拿到钱。也就是说，从现在起，你要培养自己在金融机构的信用和征信，不是说一分钱不借，而是有借有还，信用良好，根据他们的授信模型，倒着把自己包装成一个“脸面”很值钱的人:体面的工作、稳定的收入、强大的消费能力、中规中矩的借款用途、及时准确的还款习惯。成为金融机构的好客户。

    公司的一个部下A，大学毕业才2年，替另一个朋友装修家庭的朋友B，代买各种装修材料，刷信用卡支付各种账单，甚至为专门从银行借款了装修贷又还回去，林林总总来回回也就几十万在倒。等房子装修完，招行竟给予了20万的白金信用卡，建行主动其了一张8000元的信用卡。建行信用卡的审批难度，是业内最高的。

    也就是说，我们日常的所有工作，核心主题，和这个事要不要干，要围绕三个是否:

    1，这个事情是否有利于你抵押物的增长;

    2，这个事情是否有利于你信用的增加;

    3，这个事情是否有利于你核心能力提升。

    1＞2＞3，如果这三个不沾边，基本不要碰。

    而现实是，能力的衰减越来越快，有的行业前脚还烈火烹油，后脚一夜之间死掉，比如前两天风风火火的科技金融。

    另一个是，核心资产的价格和价值越来越难以稳定，环境变化之快，经常使人难以预料。北京五道口宇宙中心的学区房，十几平米根本没法住人，只有学区户口价值，很多人大几百万乃至上千万买一套给孩子上和个初中，想的很美好，等高中毕业后再卖掉，然而，学区房很快就会重新划分。

    上千万买个学区房，为何不花上千万移民乃至直接孩子送美国？对后浪来说，这种资产玩不起，那么我不玩了行吗？

    没有什么千秋万代，恒久保值的资产，价值这个概念都是相对的。

    在之前的文章曾经认真的强调过，普通人最“值钱”的资产就是孩子，孩子就是后浪本身，而且生的越多，边际投入其实是越低的。生儿育女，从来都是以量取胜，主席说，人多力量大，不是简单的加法。

    孩子这个宝贵的资产，是不用通过建立壁垒和苦心孤诣就能实现的，孩子本身，是所有运气产物中概率最高，收获最大的，而实际上，他的机会窗口也很有限，大家就年轻那么几年，如果有3个娃,这个壁垒在全国基本也是top5%。

    战胜后浪不如融入后浪，融入后浪不如制造后浪。古今一也。'
- record_id: recQDkxBI0
  文档标题: Vol.6 底层代码系列:我为什么看好一二线城市的房产
  文档链接: https://h160bxy8czl.feishu.cn/wiki/K4V9w6U2qiCimekActRcR5BLnXf
  文档内容正文: '从春节以来，大王即从各个角度支持和看好北上广等一线城市，尤其是东部强二线的房地产，原因在哪里？

    我们今天撇开通胀、人口、产业，那些都是表面，还原房地产的本质。

    房产是什么？是一种商品。

    商品的价格由什么决定？

    由它的价值决定。怎么决定？价格围绕价值上下波动。

    那么价值由什么决定呢？凝聚的无差别的社会劳动。

    很多所谓的专家说，房子不能吃不能喝，就是钢筋水泥，建造成本也就3500，凭什么卖3万，价格离谱，多少年看空。

    但你仔细想，你买房子是买砖头瓦块本身吗？你买的房子本身是地段，地段本身，国家投入了大量的配套，道路、学校、医院、轨交，这些都是要花钱的，都是凝聚了大量劳动的，而你有为它们直接支付价钱吗？没有。

    政府的公共投入，才是你房价的基础，你的房子，凝聚了大量政府组织的大量无差别社会劳动。这个无法抹杀。时间这个东西，谁也无法创造，从商品价值来说，他是人类社会最“值钱”的东西。

    房子200平米，凝聚的建筑安装工时300小时足够，但为了打造你这个区域，政府领导，贷款的银行，出图的设计院，干活的农民工，背后的工时几百万小时，分摊到你房子头上，你的房子凝聚的劳动时间。远远大于盖房本身的300小时。

    好的学区房为什么贵？百年树人。好老师并不是流水线生产的，配套起来的价值时间太长。

    在中国，我们买的房子，买的都是房子背后的劳动时间。

    美国的很多别墅，在风景秀丽的郊外，户型大又漂亮的木屋，还没有中国的房价贵，很多人说这个不合理，要看空，又错了。其实很简单，郊外没有什么配套，秀丽风景没有凝聚无差别的人类劳动。

    而中国的一二线城市，一是有钱，可以不断的通过规划(5年计划)，为一个个的区域投入价值时间，形成一个良性循环，所以一个个新区最后都起来了。

    更关键的是，是一二线政府动员能力强大，尤其是我为什么更看好二线，他们正处于上升期，上面要求紧，干劲十足，治理水平就高，治理水平高，就形成了社会效率。效率是什么，是对时间的节省。

    东北为何不行，办事难，本质是浪费时间太多，你跑一个事不走后门，100年总办下来了，但谁有那个时间？

    马克思说，人类一切的节省，归根到底都是时间的节省。那些干部们因为效率和治理省出来的时间，也组成了房产的附加值。

    一切节省归根到底是时间的节省，同样被硅谷钢铁侠马斯克奉若圭臬。我们看他的股价，巨幅拉升是从在中国建厂开始的。

    所以你要买房和选房很简单，

    一是看基础，开发商不能有问题。这个企业为了发展，凝聚的无差别社会劳动多吗？他们的品牌打造和口碑，背后都是社会劳动。

    二看保值和涨幅。这个小区，凝聚的人类无差别社会劳动(政府分摊出的公共配套)多吗？

    房子为什么抗通胀？你能印钱，你能印出时间吗？

    以上的核心，其实都是马克思经济学的基础理论，我们初中政治就接触过。老马是真正的大师，大师的特点，都是门槛特别低，看着特简单，很小年龄就能读，但真正弄懂又太难。

    每当经济危机的时候，西方就要把马克思拿出来研究一下，他们也知道，祖师爷才是撇去泡沫，能真正懂人性和经济的那个。'
