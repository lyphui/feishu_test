    《金刚经》智慧(1)照破山河万朵

    我们很多人都以为，

    佛家和道家是有神仙的，各种呼风唤雨，有求必应。

    恰恰相反。

    道家没有神仙，《道德经》5000字没一个谈神通广大，《易经》咱们也解读了，只有算法。

    道家讲，“大道无亲”。

    宇宙是没有那种儿女情长的，你去求它拜它，它就会对你好，照顾你，是妄想。

    大道只对谁好呢?

    “大道无情，常与善人”。

    善人，是遵循宇宙和自然客观规律的人。

    它开篇告诉你，

    “自强不息，厚德载物”。

    被清华拿来做校训。

    指望自己毫不费力，纯靠外界和外力就能躺平式的心想事成，这事，佛祖也想啊，他也做不到。

    他曾说，

    有人向河里扔祭品祈求今生来世幸福，而另一个人则躬身实践善法，后者才是真正走在正道之上。

    回到主题上，

    在公元前6-5世纪的尼泊尔，悉达多·乔达摩作为王子，虽享有荣华富贵，

    却敏锐地观察和共情到人世间的普遍苦难生、老、病、死，怨憎会，求不得等。

    为了帮助人们寻求彻底解脱这些苦难之道，他放弃了王位，出家修行，最终在裟椤双树下悟道，创立了佛学。

    佛学是什么？

    它是一种基于理性观察与实证的、旨在彻底解脱生命痛苦的【实践哲学体系】和【智慧教育】，

    是谈最高端，最深邃的，生命质量和人生意义的，解决最本源问题。

    有时候你的财富，事业，人际关系没做好，就是生命的能量和热量不够，不能力大飞砖、降维打击，仅此而已。

    释迦牟尼告诉我们几个终极的原理，

    第一，世界上没有神仙，也没有救世主，

    《金刚经》说，

    “若以色见我，以音声求我，是人行邪道，不能见如来。”

    你不遵循佛的规律，单纯希望上香拜佛就要祈求好处，是乱来，是不可能获得佛的回应的。

    第二，自力解脱才是根本之道，

    这套东西，在佛家，叫做“法”。

    《长阿含经》里，佛祖给弟子阿难说，

    “阿难！汝等勿生忧恼，我灭度后，汝等当以戒为师，依之而住，则余法不衰。”

    佛说我走了之后，那些教你们的“法”，才是你们永远的老师。

    法是什么?“世界观，方法论，工具包”。

    就像教员走了，他留下《矛盾论》《实践论》《论持久战》等世间屠龙之技。

    你要去躬行实践，不断提高。

    第三，你是一定的行的。

    在长期的苦难教育和打压教育之下，

    我们很多人对自己特别不自信，总想把一切寄托在外界身上，害怕自己上能行吗？自己就对吗？自己学能会吗？自己真的就能改变吗？

    能的。

    你看我们00后的兔牙同学，小宇同学，不就很厉害吗？

    为什么？零零后的包袱少。

    《华严经》说，“一切众生，皆有如来智慧德相，只因妄想执著，不能证得”。

    这里的如来是什么？既是佛，也是那个最真实，最本源的你，你身上本来就有佛性，你不需要求，修就行了。

    你的生命中，本来就是有财富，智慧，事业，成长的，只是你没有觉醒修炼，把自己蒙蔽了而已。

    就像你有一座宝山，却没有钥匙，没有铁锹，此时最重要的事不是去看别人山上的风景，是静下来好好学习修炼，零件都给你了，你要搓一台挖掘机出来。

    上面的整个法门，就是《金刚经》，

    由鸠摩罗什翻译，后来梁武帝的昭明太子，也就是写《昭明文选》的那位，进行了分段和整理，

    世俗一点搞投资的这些大佬们，葛卫东，邱国鹭等人办公室都放着，曹德旺每日要读。

    “金刚”在中文里是梵文“Vajra”的意译，它有两个核心特质，

    一是最坚固，能不被一切摧毁，自身无敌，

    二是最锐利，能斩断一切执著和缠缚，

    “金刚般若波罗蜜”意为“像金刚一样无坚不摧、能斩断一切烦恼、通向彼岸的终极智慧”。

    好了，到这里你已知道，佛教是无神论者，佛教是实践科学，

    它帮你做什么呢？

    让你这颗蒙尘的明珠发现世界和自我的真实，提高生命的维度，活力，质量。

    我有明珠一颗，久被尘劳关锁。

    而今尘尽光生，照破山河万朵。

    人生有一种最大的幸福，

    “今日方知我是我”。

    是为序，后面展开。'
