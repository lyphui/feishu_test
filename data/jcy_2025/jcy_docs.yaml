    无抗蛋天塌了

    盒马卖的无抗蛋被检出兽药残留超标。

    一个朋友经常买他们的还生吃，

    超标成分主要是地美硝唑和甲氧苄啶。

    地美硝唑是治疗家禽和动物滴虫病的，甲氧苄啶是抗感染的，用于痢疾杆菌和呼吸道感染等。

    无抗鸡蛋在生产过程中严禁使用抗生素，别说无抗了，哪怕正常的，动物没病你不能用。

    但很多商家为了“预防动物得病”和传染病，先给它们吃一堆药。

    这两个东西会严重影响人类的肝肾功能，致癌致畸，尤其是新生儿。

    早上我们说蛇皮袋放牛磺酸算好了，牛磺酸对动物算是好东西，

    蛇皮袋放阿莫西林、庆大霉素的你是没见过。

    管它有病没病，直接拌到饲料里扔水里，下手没个轻重的。

    我们当年看过之后，再也不投农业了。

    人类站在食物链顶端，也站在一切污染的顶端，

    所以各位，别人告诉你什么无抗蛋，无菌蛋等都可以生吃，别信他们，溏心蛋也不要吃，全部做熟再说。

    平时多锻炼身体，多喝水，多喝茶解毒，

    水也不能多喝自来水，买个净水机过滤。

    茶也不能乱喝，农药狂喷的多的是，明前茶可以，那会虫子没出来不用打药。

