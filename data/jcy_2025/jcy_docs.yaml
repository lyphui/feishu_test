    看下周吧

    药强科技弱，科技弱药强，

    科技目前只有光，mpo给光模块卖铲子，预期你的预期。

    好卷。

    此时，下周需要有人站出来，带大盘带量突破3450一线，没人站，就进入垃圾时间继续盘整。

    直到半年报前后。

    光引擎说了好几遍咋还有同学问

    TMT的主力在回补什么

    TMT的占比25%，处于艰难筑底期，

    1，根据美股英伟达和博通的技术路线，看PCB,PCB就胜宏和生益，和光模块（主要是1.6T），易中天太辰光，光模块的后续是光引擎MpO，卖铲那两家。

    目前看，量能不大，主力没有向更外扩散的趋势。

    2，量更大更坚决一点的，是回补游戏传媒，尤其是游戏，一脚踩AI，一脚踩新消费，游戏看谁？跟AI和IP挂钩的，比如巨人，冰川，游族等，同时还要结合，a，一季报业绩，一季报不差的半年报也不会太差，b，图形，走坏的不是上升趋势的不看。

    3，开始有人建仓Ai应用，比如蓝标，博瑞传播，宣亚等，看图形和量能就知只是派出了先头部队，仓位很小，这块领头的是青木，未来的AI营销，就是帮助你如何在腾讯，抖音，小红书等，更加精准获客和扩散，按照这个思路和业务模式去选择。

    美股的十倍AI股，基本集中在AI营销，AI保险，AI医药等。

    4，有些非TMT的主力，还在补创新药，他们踏空后抓紧买进，板块呈现了加速趋势。

    创新药当然没有到顶，但后续的波动会比之前大很多，要留意图形走坏，还能涨的，马照跑舞照跳。

    3450一线如果不能带量突破，红了就是诱多。

    ps，现在上面放开了一些口子，把中国的传统文化，如易经，养生，命理等，在国外平台大量传播，叫做“玄学出海”，研究，可以研究这块的受益，等到时候话题一起来事件一催化，就是一波涨幅。

    夕提问：

    请问大王，创新药今天是阶段性顶部吗？

