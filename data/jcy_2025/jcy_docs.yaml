  文档内容正文: '三浪起点，阶段4的先声

    《阿甘正传》说，人生就像一盒巧克力，你不知道关税和明天，哪个先来。

    本来在A点，也就是3月14日，三浪开始启动，懂王的外部因素，导致了4.3大跌。

    现在基本可以确定的，

    1，3040就是近期的低点，2024/1008以来最大的回调结束了。缺口1随时能补。

    2，国队通过11天的连阳告诉大家，他的操盘能力非常精准，缺口2不会去回补了。

    大盘下不去了。

    叠加昨天懂王班子的软话，关税战开始服软，昨晚美股和中概大涨。

    那么目前，大A的情况就是春寒料峭的“灾后重建”行情。

    1，低点已经出现，回调即使有，不会再太剧烈了。

    2，大盘放量缓慢，主线板块尚不明确。

    激进的同学们可以看多操作了，

    稳健的，依然可以等放量补缺或者站上3350以后，有新的板块站出来领跑全场，量能起码到11.2/1.3万亿吧。

    看点是什么？

    大消费和大科技。

    大消费：通常三个要点，嘴巴、汽车、地产，其他都涨过了，就剩地产。

    地产才是最大的刺激消费，你再看地产的板块，已经有量收复了4.3大跌。

    月底开会，可能又要启动新市民。

    （地产都脉冲性的，要注意注意）。

    当然消费里最有确定性的就是狗粮，去公园转一圈你就知道，数数小狗的数量。

    一只狗能活10几岁。

    科技：先锋可能是跌最狠的Ai软件，软件的概念排头是跨境支付。

    主力在下面三个领域抱团：

    MCU/SOC/AI 芯片。

    华为920可以关注了，目前谁能出来尚不知道。

    如果并非高手，等待市场走出量能，主线站出来也不迟。

    现在的市场就是理发三天丑的尴尬期。

    南院大王

    2025-04-23 15:23

