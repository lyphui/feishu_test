    大尺度看板块之二：大消费

    科技和消费，会成为上面的两手抓两手都要硬。

    在3-5年确定性方向，消费的分析如下，

    1，具有长期价值的是嘴巴股，这也是巴菲特的最爱。

    过去的嘴巴股是白酒，以后变成食品饮料。

    饮料的增速和空间远大于食品，食品太散，主要原因是，难出大单品。

    目前饮料能看的，

    就我们反复提过的东鹏饮料。

    一是产品可以，东鹏特饮是百亿大单品，椰子水和补水系列也在加速。

    二是渠道过硬，一路覆盖到乡镇市场。

    食品方面，我们不看人的了，太散，集中度太低，轮动又太快。

    前两年流行鸭脖，很快又流行魔芋。

    而且人口的数量在减少，人们追求健康也慢慢不吃零食。

    2，长期能看的是宠物食品，猫猫狗狗的增长率远超于人。

    宠物食品能看的，

    就是三家，中宠，乖宝，佩蒂。

    越来越多的人当了小狗的爸爸妈妈，撸毛可以减压，这个市场还很长。

    很多人都没有保险，猫猫狗狗是有医疗保险的。

    3，大面积能刺激人的消费和内需的，就是旅游，尤其是普通老百姓的国内旅游。

    两个菩萨的道场，

    普贤菩萨的峨眉山，地藏菩萨的九华山，

    都是超级ip和精神需求，无形价值不可估量。

    最近的k线也走的不错。

    以上只是分析消费的公司质地，并不是说马上就能就要买，市场如今缩量，总有大跌的空间和机会，给你分批次逐渐进入的机会。

    一

    时代变了，现在不少猫猫狗狗都是能上人的床睡觉的，

