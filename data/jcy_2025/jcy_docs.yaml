    据说，魔都的出生率，已经低于韩国了，

    孩子少了，人的情感需求不会变，

    宠物就会取代缺口，从罗马到日本都验证的过的事。

    国内现在宠物情况怎么样呢，有些同学可能不了解，

    2024年，“在编”宠物就有1.23亿只，超过日本的人数，

    同时还有总计约4000万只流浪的猫狗。

    宠物的意思，就是不能让受委屈，

    吃的比人好，喝的比人好，正常。

    国外很多超市里，专门有宠物饮用水，比人喝的贵。

    宠物的寿命通常10年以上，很多人家里的猫狗正直壮年，新生儿也没有计划生育，不用买车买房，

    所以这个赛道还能挺很久，参与它的最好方式是定投。

    其实最好的狗子，还是中华田园犬，

    老祖宗严选，身体好，适应强，不掉毛，体味轻，智商高，还护主，

    生病了会自己跑去找中药吃，

    然而，土狗不吃狗粮，不刺激消费啊。

    中华田园里有两种神奇的狗，

    一个叫五黑，全身黑色，据说有辟邪之功效，古人睡不好怕家宅不宁，会养五黑。

    五黑又叫唐狗。

    一种叫五红，全身都是红色，玄学意义打满，五红才是旺财原型。

