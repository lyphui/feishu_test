  文档内容正文: "当前市场格局与双轮驱动(2) 之大科技线\n一、首先再重温下市场的主体格局，\n一体两翼，双轮驱动。\n一体：大金融与权重，\n两翼：反内卷与高科技。\n\
    这两个交替上涨，形成牛市。\n你为什么要掌握这个，因为给上峰的报告和思路就是这样，不看地图，怎么打仗。\n二、一体的格局，\n目前，银行较高，保险属于补涨，稳健的谈过新华与做T思路。\n\
    券商更有弹性。\n但券商是渣男，弹性又小，看券商IT和金融科技即可。\n详见《金融反内卷》。\n二、双轮的格局，\n一轮反内卷已经讲过，以雅江为代表暂时降温，但注意不是退潮，主力可能切换到科技板块，匹配高低切。\n\
    科技板块核心又分为两个，\n海外算力和国产算力。\n1，海外算力目前处于中期相对高位，\n海外算力，以pcb、光模块为主，\n胜宏沪电代表的pcb，易中天代表的光模块(cpo)已经新高，\
    \ 二线补涨是谁?PCB 的景旺电子、东山精密，光模块的士佳光子、联特科技等。 \nPCB扩散到电子布和铜箔，光模块扩充到400G,50G, 如华工科技等。\n\
    海外算力处于鱼尾阶段，cpo更稳点，\n鱼尾多大？不知。可能比鱼头大。\n这个领域搞高低切炒二线补涨的请注意，龙头不能撂倒。\n目前海外算力板块链条内部相对低位的是铜缆，代表博创，太辰光，仕佳光子等。\n\
    海外算力当然高了，是不是长期高点，最多中期高点。 \n2，海外算力炒零部件，因为给英伟达供货，咱们没有芯片，国产算力的核心当然是芯片。\n国产算力芯片：寒武纪、海光、华为昇腾以及即将上市的沐曦、摩尔线程等等。\n\
    不会搞的, ETF588200.\n这是次世界算力大会励算的消费级GPU 出来了，东芯股份是其股东，线走的不错，如果过度高开就算了。\n里面有一个和各家关系都不错，当股东甚至成立合资公司的，弘信电子。\n\
    在底部盘整了一段时间，美中不足没有放量。\n华为的昇腾没有上市，概念股是大家都熟悉的拓维信息、常山北明，科泰为其做电源，华工科技做光模块，华丰科技做铜缆，以及吊车尾沃尔核材。\n\
    3，国产算力的另一个方向上智能体/应用有关的芯片，比如AI眼镜，智能座舱等。\n核心是SOC和MCU, \nSoC是瑞芯微、翱捷科技、芯原股份、乐鑫、恒玄、牟牟的意难平全志科技等，\n\
    这一轮的前排是炬芯科技，如果能调整到55日线的53.8且稳住，性价比更高。\n另一前排是泰凌微，为业绩炸裂，但波动太大，如果不跌破昨日收盘价的断层就还能看。\n\
    另一前排是泰凌微，为业绩炸裂，但波动太大，如果不跌破昨日收盘价的断层就还能看。\nMCU 的核心，是纳芯微、思瑞浦等，筹码结构没有soc好，但也跌了4年，存在未来空间，汽车芯片国产化率不到15%,未来迟早90%.\n\
    目前看，上周五主要流入的，是国产算力芯片，国产SOC 芯片，以及半导体设备。\n3，国产半导体设备的主要核心，是光刻机。\n其他该突破的都突破完了。\n光刻机几个，是福晶科技（确实有技术，但股性一般从不涨停）、张江高科、茂莱光学、波长光电（这个图形走的可以）等，\n\
    上周五光刻机有传闻，这几天好像证实了，光刻机预期可能没那么大，但整体处于地位依然有机会。\n之前谈沐曦它们上市我们讲过一个ETF科创设备，588710更为稳健。\n\
    4，以上的部分如果继续扩展，会到AIDC，也就是算力中心。\n它们同样处于低位，也经历了相当长时间的调整，\n代表作，奥飞数据，润泽科技，弘信电子等，同时受益于H20放开和国产芯片。\n\
    这里有个新锐亿田智能，以前家电现在也搞算力租赁，亿田用的谁的卡？燧原。\nAIDC需要云存储，国资云是铜牛信息，云赛智联，易华录等。\n目前从资金的流向看，\n\
    是国产算力芯片>系统芯片>半导体设备（光刻机）>>AIDC数据中心。\n会搞的同学按图索骥，不会的就喊那两个ETF，不要追高，分批次买入摊低成本。\n国产算力的切换才刚开始，有的是机会。\n\
    未完待续，Ai应用和机器人下期再讲。不然篇幅太长。\n布局了创新药、游戏、军工的，也不必担心，它们不算太高的位置。\n市场一步步走出来，掌握基本原则，不追风车找到自己的节奏至关重要。"
