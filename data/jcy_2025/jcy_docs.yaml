  文档内容正文: '从两融余额看短期波动

    这一轮市场的大涨，是由机构发动，但是由两融资金推动。

    目前，市场几路资金态势如下：

    -生产队在护盘，

    -外资在观望，

    -游资量化在乱搞题材和马字辈，

    -机构还在出货砸盘保排名，

    还剩一个两融，

    两融，已经成为影响市场走势的关键。

    两融若挺住或者继续加大流入，市场会上涨或者横盘，两融若跌了，市场还要因“去杠杆”，有一轮惨烈的下跌。

    之前谈过几次两融，我们再看几个案例，

    -旭创，我们看出融资余额是下降的，这是部分带杠杆的两融被杀的卖出了，

    然而，它的股价是横盘略带上升的，大概率说明机构开始买入，

    -胜宏，融资余额完全同步于股价，说明融资盘仍在抱团买入，

    它两融余额的高点在9月23日的172亿，当时股价已经下跌了，但融资还在进场，

    说明机构在高位把筹码派给了散户，如今它又跌到了143亿，但仍然占到胜宏流通值的6.47%，

    说明胜宏基本由两融控制，两融涨它涨，两融跌它跌。

    相比之下，两融占旭创的流通值是3.58%，说明机构资金占优。

    再看几个，

    -工业富联，最后一轮补涨的超级大票，两融和股价齐跌，证明机构还在疯狂出货，“后排”科技并没有企稳的迹象。

    -中芯，完全是被两融带下去的，现在还没有企稳，

    -源杰科技，当时也是大牛，两融被机构玩弄于鼓掌，那个大M型看到了吗，一旦你大买它立刻砸盘筹码卖给你，高峰时，每天两融有8亿，现在给杀到了6亿。

    现在波动烫平，机构掌握了局面，开始试探性买入。

    -德科立，融资余额拐头向上，但股价还在跌，这就可能是，

    1，主力在大力洗盘，2，机构在继续把筹码出给散户。

    这两种可能性都有，两融和机构随时空转多，多转空，这时他们看谁？就看龙头股。

    龙头涨，它们趁势跟上，龙头跌，它们趁势洗盘。

    现在科技的龙头就是两波人，旭创和胜宏代表海外算力，寒王和中芯代表国产算力，所有后排都看他们脸色。

    目前，两融依然保持在高位，大盘却不涨反跌，严重缩量，就是最大的风险，

    这有很大概率说明，

    机构还想把高位筹码砸给散户游资，利用市场的宽幅震荡和下跌击穿他们的杠杆，继续收集“带血筹码”。

    因此，科技的周线级调整依然不能说了结束，反弹只能先当反弹而不是反转看，主要的机会，如果你不想看老登的保险电解铝之类，

    机会只会集中在易中天胜寒宁这六家。

    或者略带偏颇的说，

    寒王中芯能稳，则科创能稳，否则继续跌。

    旭创胜宏能稳，则创业板能稳，他俩不稳所宁王也不支棱，还会继续跌。

    战场胶着的时候，空头和多头都会调集所有的力量在最核心的几个标的上厮杀，

    谁赢了谁再去通吃别人。

    如果你技术过硬又头铁，或者短期波动根本不在意，以旭创和胜宏的为代表的科技战场，参与方法是什么？

    你号跌我就上，比如-4%-6%挂上去抄底，一旦涨起来，比如+4%，+6%，立刻将抄底部分全部卖出。

    在没有放量大涨之前，不相信任何的反弹有诚意。

    而一旦维持不住这55日线的5日平台，立刻用跑的快的优势继续减仓。

    预期科技的调整在本月底结束甚至更早，

    彼时，4中开了，三季报该雷的也雷了，科技龙头的博弈也差不多到位了，

    两边韩国见面之前，可以把仓位加上去博缓和了。

    今天，很可能高开，还是那句话，有量拿着，没量逢高减仓，尤其是高位科技仓位过重的。

    大盘的震荡空间在哪里?3936-3800。

    ps，以上仅为学习不构成任何建议哈，新手菜鸟要多看保险和ETF。

    有人问两融数据怎么看，

    每个人的软件中都有两融总额和个股两融的数据，若不会找，同花顺app，点“大数据”，再点“融资融券”。

    今日看点，央妈是不是降息。

    争夺核心阵地

    科技即主线，主线即大盘，

    今天科技大涨的道理和技术都讲了，

    既然胜宏逆势站住5日平台，

    旭创在上周五拒绝回调，

    那就是有资金在科技核心阵地和空头battle，

    核心阵地守住了，才能去收复外围。

    今天的旭创是有量的，244亿成交额是10月15日的122亿整整两倍。

    它250亿净利润的消息，其实是带有内幕成分的，折合明年的pe16倍。

    16倍的AI不买，去买16倍的煤炭吗？

    有个不构成建议的估算，如果按40倍pe，它是不是应该市值1万亿？现在才多少？

    今天传出它330亿的小作文是不扎实的，1.6t其实没那么快，26年到不了，要2027。

    英伟达下一代的Rubin架构，会继续扩大光模块的使用量，反倒是pcb的增量没有那么大。

    因为资金聚焦核心阵地，所以后排品种只能是无量拉升，无量拉升是不能信任的，策略也跟大家讲过了。

    主桌女方，人气最高，

    同学们有没体会到，校花强者恒强。

    回到国产芯片，寒王的表现是超预期的，

    因为三季报环比下降了，

    当跌不跌则为强。

    但今天科技的抛压真是大，两融的头也是真是铁。

    前排决战即将决出胜负，进而影响后排的走势。

    决出胜负的标准是，旭创创出历史新高。

    今天大盘继续缩量，缩量到1.74万亿，10月7日的大盘成交量是3.4万亿。

    缩量一半，单从这角度看，回调也接近尾声了。

    但有意思的是，不少机构仍然在大量买进煤炭之类的老登来保排名，教员批评的小资产阶级软弱性。

    小登和老登，

    人生南北多岐路，君向潇湘我向秦。

    十五五规划与灯塔工厂

    灯塔，就是领先和标杆，

    灯塔国我们都知道的。

    灯塔工厂最早由世界经济论坛（WEF）与麦肯锡公司于2018年联合提出，在2025年因为大规模评选而火热，

    它是指在第四次工业革命技术，如人工智能、大数据、物联网、自动化等的应用和整合方面走在世界最前沿，并在提高效率和竞争力方面取得显著成果的领先和表率企业，

    它们被视为行业创新的灯塔，引领制造业向数字化、智能化和绿色化转型。

    全球灯塔工厂可以分为三大类，

    1.单一工厂灯塔，

    重点关注工厂或车间本身先进技术的应用，以及运营模式的管理。

    比如说蒙牛乳业，车间大规模使用智能决策到柔性自动化的设备，覆盖牛奶加工、包装和检测等各环节，大幅减少质量缺陷和经营成本。

    2.端到端灯塔工厂，

    不仅关注工厂本身，还会关注从工厂延展出来的上游和下游，即整个价值链的优化。

    比如海尔空调工厂，采用大数据、高级算法等，缩短了设计周期，加快了订单交付时间，让供应商的供货更加及时，减少等待和耗费。

    3.可持续灯塔工厂

    在满足先进技术应用以及规模化效益的基础上，更多地关注工厂在可持续性方面的技术用例和好的实践。

    比如，节能减排，全程使用绿色能源，公司履行ESG等。

    灯塔工厂，要就是要么你设备非常先进，把误差减少和效率提高到极限，要么你流程非常科学，整个链条高度精益，要么你绿色低碳，社会责任和客户服务值得称道。

    全球目前已经评选出200多家灯塔工厂，中国大陆地区以79家的总量占据全球42%，连续五年位居世界第一。

    其中，海尔有12家，富士康有8家，宁王有3家，三一重工有3家。

    今年9月，科技部部长阴和俊在智能制造峰会上明确说，灯塔工厂是十四五智能制造成果的集中体现。

    因为中国要推动制造业高端化、智能化、绿色化，数字化转型，

    因此，这一重大主线或将延续至整个十五五周期。

    中国的人工智能+，

    会Ai+产业，Ai+应用，一定是奔着挣钱去的，要去搞【AI赋能】，

    而不会像美国那样，靠openAi去玩左脚踩右脚。

    那么灯塔工厂利好谁呢？

    第一层是有灯塔工厂的那几家企业，海尔宁王等，但不会推动他们pe和业绩的显著提升。

    第二层是设备和改造供应商，比如汇川这种，去给企业搞智能化改造。

    第三层是弹性最大的，即工业软件和工业AI智能体，或将成为数字化、智能化转型的卖铲者人，因而最受益。

    其典型代表，是中望软件和鼎捷数智，

    然而，Ai应用作为Ai产业目前的最大洼地，主要问题是没有业绩，它是下半场，现在上半场的硬件和芯片还没有炒完，

    那可以先等他们杀出性价比再说。

    AI应用上将来必然要出10倍股的，具体是谁，时间还长，等市场筛选出来。'
