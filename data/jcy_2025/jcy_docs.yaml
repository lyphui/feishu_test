  文档链接: https://h160bxy8czl.feishu.cn/wiki/Ct7uwKod8iiGvIkINO0cvFG9nEb
  文档内容正文: '钱不是问题，问题是怎么花这个钱。

    12万亿推出来了。

    你要想拿到中央财政给的提额和专项债额度，得报批。

    蓝部长很精明，故意没讲拿钱的难度和流程，九九八十一难，那也不是给普通人说的。

    说白了，这钱可以给你，帮你背债，帮你新增举债空间，但是，你拿了钱干什么?

    如果答案不满意，上面可以不给。

    很多大省，在省一级，8月份就在研究报告事宜了。

    打报告肯定不能说，我拿钱回去，继续搞铁公基，修桥铺路，开玩笑。

    中心思想是搞产业，问题是，

    什么产业。

    某宏观经济大师，同时也是地级市发改负责人跟大王讲，目前新增方面，省里拟报告确定的三大方向，

    他认为也是上峰希望的三大领域是低空经济、商业航天、合成生物。

    我们不谋而合。

    合成生物，包含了一些农业和生物医药的范畴。

    因此，地方拿到新的举债空间之后，花钱要砸的领域，

    就是低空经济和商业航天。

    低空经济我们之前很久就讲过了，那会是万丰第一轮升浪。

    后面，地方政府会借助平台公司与产业搞联动，同时消化汽配、电池等方面的过剩产能。

    而商业航天，则是无论哈里斯还是川普上,

    都要跟东大竞争的两大领域之一。

    马斯克上台后，会在商业航天与东大既合作又竞争。

    关键词提示:

    低空经济，关键词是深圳，政策灵活，且大疆在那边。

    商业航天，国内两大主力是航天科技集团与航天科工集团，其中的航天科技集团主营干这个。

    另一个有技术储备的是中科院。

    跟他们有关系才行，

    在发改委眼中，整体几个大产业格局是

    1，低空经济:地方主导，上面给政策，

    2，商业航天:地方为主，中央大企业与技术为辅。

    3，半导体及A1:中央为主统筹，地方为辅。

    4，TMT:市场化为主，中央采购扶持为辅。

    5，房地产:中央管托，地方管举，

    6，合成生物:领导也有点头疼，不搞不行，搞了周期太长。

    家庭作业撒下去，低空和航天，同学们的受益标的可以研究起来了，在相应的调整后，他们还会有下一轮。

    稍后我们会着重讲几个。

    离火大运，上九天揽月。

    先理解逻辑，比上来就知道几个代码，要重要的多。

    各位同学们，如果有体质里面的，银行和大机构里面的，低空和商业航天的内容新闻，政策，时事之类的，要多看起来了。

    先发优势，领导觉得你未雨绸缪。'
