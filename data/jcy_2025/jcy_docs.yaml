  文档链接: https://h160bxy8czl.feishu.cn/wiki/BhKIweiNziuAo9k8UjWcA085nCh
  文档内容正文: '原创 南苑大王 鉴茶院 2025年07月14日 06:06 江苏

    01

    时至今日，

    整个大局的发展已经日渐明朗了，只是大多数人还蒙在鼓里，

    但作为专业人士，套用西红柿首富里的话说，

    国家队请收下我的膝盖，

    这是我见过最伟大的操盘！

    本文是上峰关于股、债、房地产，整个经济思路“全景式”、内参级研究，

    这是人类经济史上最伟大的乾坤大挪移，跟每一个人息息相关。

    在茫茫征途的星辰大海上，请根据海图对照你的坐标，选择你的策略。

    通篇干货，包含操作。

    02

    搞经济，就要钱，来钱最快的方式是借债，

    2001到2018年，东大借入世之机和城市化的进程，负债经营，狂飙猛进，一举创下让世界瞠 目结舌的奇迹。

    相信很多读者，人生的第一桶金和重大积累，都是那个年代实现的。

    但债终归是要还的，要启动新周期，需要干净的，轻装上阵的资产负债表。

    其实在2015年的“三去一降一补”、

    2016年的P2P专项整治开始，

    上峰就要求去杠杆、化债务，

    然而，因为种种内部的原因，外部的国际压力、

    工作在2020年的地产“三条红线”才正式开始。

    而经济的惯性却依旧向前，睿智如马老师，外滩峰会上想的还是“加杠杆”。

    然后，又因疫情等原因，纾困工作拖到了2023年。

    这期间，

    是国有金融部门、地方平台及商业银行、各大不良资产管理公司等，托住了整体的局面。于 是情况变成了，

    银行的债务、地方的债务、企业的债务、个人的债务，

    都到了不得不解决阶段。

    怎么办？化债。

    身处其中的我们，可能感觉“只道当时很寻常”，

    实际上，这场震撼世界的乾坤大挪移，一个环节想不清楚，一个次序搞出问题，都可能是天 崩地裂的结果，

    好在现在，已上了轨道、渐入佳境。

    03

    整个化债的“牛鼻子”是谁？很多人认为是地产，是城投，并不是。

    而是国有大银行，200万亿的资产是东大金融系统的稳定器和主权象征，

    国家对其，其实是负“无限连带责任的”。

    破局，是从拉国有大银行的股价开始。

    第一，都说银行资产差，坏账高，受地产拖累，然而，国有大行的底子扎实、股息率高、盘 子大、又能决定和影响指数。

    于是猛拉国有大行，你不买我就一直涨，涨到银行整个板块超过纳指100，形成结构牛市，这 时，踏空的机构、外资、牛散、包括量化，开始后悔，纷纷入场，

    但追太高的国有大行已非最佳，于是开始买入还在后排的各种股份行、地方城商行、农商 行。

    所以你看最近，那些偏远地区的小银行，走出明显加速态势，涨的热火朝天。

    醉翁之意不在酒，在乎山水之间也。

    于是，那些风险很高、资产很差，总规模超过100万亿，又严重关联民生的地方中小银行“定 时炸弹”，

    因为太多的纷纷买入，提高了市值、增加了股东、分散了风险，拆掉了引信。

    买入的人们，变成了“化债人”。

    这几年，你还见过像包商银行、河南村镇银行的暴雷事件吗？少了很多。

    银行化债成功。

    第二，在中央和地方层面，不用再去花太多资金去救助中小银行之后，这些腾出来的钱，卖 出去的股，就可以通过AMC模式、保险公司举牌等、上市公司混改等模式，

    以极低的价格，把地方优质的土地、水电等公共事业、在建楼盘、成熟小区、甚至城投公司 买下来。

    地方债化债成功。

    第三，中央和地方手里，因化债地方，都会握有大量的楼盘，这些项目很多都是现房，一部 分会出售，一部分会是新市民的“共有产权房”，更有相当部分，会以给出租给大学生和相
    对弱势人群。

    虽然回报尚可，但现金流怎么办？如何一把将未来几十年的收益全部拿回来？

    这时，稳定币登场。

    因为共有房和出租房，4%以上的资产回报是轻松的，大家又面临资产荒，于是搞出RWA（实 物资产数字化），以这些房产为标的，把每套房的收益权切成1000份，10000份，全世界都可
    以通过虚拟币来投资。

    哪怕你只有一套房0.0001的分红权，你也有4%的回报。

    稳定币的区块链特征，记账和确权的不可篡改模式，给你充分保障。

    比深房理不知道高到哪里去。

    房地产化债成功。

    第四，过去被绑定在地产动弹不得的资金腾出手来，就可以去投资产业和高风险资产，上面 稍微一引导，牛市就会到来，上市公司的市盈率拉上去，市值增加，债务不变，相当于做大
    了分母，企业的负债率变小，

    此时，“第一步”腾挪出来的银行资金又继续可以它各种贷款和展期，“第二三步”腾挪出 来的地方财政又给可以它各种财政补助和引导基金，企业的负债率和实际负债，会进一步优
    化。

    企业化债成功。

    第五，上市大企业化债成功之后，就可以一方面增加对中小供应商的支付能力，最终传导到 个体户、夫妻老婆店的现金流，一方面给工人涨工资，一方面搞研发升级，提高利润，给打
    工人增加劳动性收入。

    同时，又因“第三步”的股市牛市，人们的资产性收入提高。

    个人化债成功。

    所以你看近期，为何搞《中小企业支付条例》，要求车企6个月内必须结账，为何要求“反内 卷”，鼓励那些品牌和有利润的企业。

    都是为最难的居民部门化债，扫清路途。

    整个过程，并联传导、环环相扣、有序推进，

    完完全全的惊天布局和超级阳谋，你还没法拒绝。

    04

    到这里很多人可能会问，个人有什么对策？

    关键的是你要踩对节奏。

    1，如果你实在下手不了银行，还有上峰手中掌握的“机动力量”供给你选择， 保险资金总额度35万亿，有30%可投入权益市场，总规模可达10.5万亿， 目前投入4.4万亿，你算还有多少？

    保险本身，及股息超过4%的优质标的，都依然有长期机会。

    原因很简单。你存5年期存款利率多少？1.55%。10年期国债呢?1.65%.

    2，在高股息配置到一定地步后，资金迟早会往两个领域的制造业上投入，

    一个是有技术的大型企业，行业排头地位，经过多年市场和利润验证，而目前的市盈率并不 高，成长比较稳定，

    比如反内卷，大消费，技术大白马，海外算力的中国供应商龙头。

    一个是有前沿的高新科技，虽然还不赚钱，但很可能是星辰大海或者无限未来，具有爆炸前 途。

    比如创新药、航天航空、可控核聚变等。

    这个市场，终究是由那些利率很低的长线资金说了算的。

    所以，汇金、诚通、国新代表的国家队和直接影响的险资，

    很可能是采用5：3：2或者6：3：1的模式，去分投上述三个领域，

    以实现三个不同的目的，

    求稳、求进、求高回报。

    这里面，都有你搭车、埋伏、跟随的机会。

    借风之力，直上青云。

    本文已经谈的够多，个人如何运用之妙，存乎一心，在这几个重大节点中踩对节奏，欢迎扫 码加入年度十佳实力星球。

    从2015年到今天，很多人已经忘记了牛市是什么样子了，且行且珍惜。

    最后，用狄更斯的《双城记》结束本文，

    “这是最坏的时代，也是最好的时代；这是怀疑的时期，也是信仰的周期；这是黑暗的时刻，也是光明的季节；这是失望之冬，也是希望之春；人们面前一无所有，也应有尽有”。

    祝君生活在智慧、光明、幸福之城！'
