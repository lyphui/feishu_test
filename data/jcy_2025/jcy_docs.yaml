    8月中上旬阶段的节奏

    周末发生的事情很多，

    分成两个大板块。

    一是新藏铁路，顺手把雅下水电站给拉了起来。

    但我们还是那句话，

    能让你买进去的基本都是坑。

    所以并不建议参与，真要看的高手也就工程机械，比如柳工这种，也能受益乌克兰重建，8倍PE也不算高，上面在东南亚要不要也搞个大动作？

    另一个是宁王在江西的锂矿停产，

    我们之前讲“高科技与反内卷”的双轮驱动，

    现在最嘴硬的，也得把反内卷当回事了。

    当然利好碳酸锂，之前讲过多次，中矿天齐赣锋永兴，

    之前埋伏的今天等冲高就好。

    碳酸锂怎么玩？

    期货在6-12万波动，涨到12左右该抛，跌回7万多则吸。

    反内卷很难走主升单边路线，而是起起伏伏，大涨敢卖，大跌敢吸才是节奏，绝对不能追。

    今天，如果碳酸锂高开低走，那么反内卷就不流利，如果抗住，那就会扩散到，光伏，锂电，猪肉等等。

    二是高科技，

    世界机器人大会王兴兴说未来的需求是数百万台，

    机器人目前资金的扎堆，是轻量化材料， peek,MIM （金属注塑)等，之前我们在问答中提过。

    可以关注的是特斯拉技术方向，鸣志，兆威，雷利等代表的空心杯电机，图形和量能都不太行，放量大涨再向下调整后参与更佳。

    什么叫高低切，高位不能撂倒，

    PEEK如果跌了，机器人就得又盘整了。

    高科技的海外算力方向，是液冷/铜缆，尤其是液冷，踏空的资金恨不得将其搞成第二个PCB，但分歧也较大。

    从产业逻辑上说，液冷的空间巨大，从图形上说，比PCB光模块的涨幅如何?到中报期都不一定能释放，你得按年去看，

    核心代表是讲了多次的英维克，

    其余的，同飞，淳中，川环，高澜，分歧中的硕贝德等，技术强势的还有强瑞技术，同时具备机器人的MIM和液冷，据传也给英伟达送样，同时有反内卷，液冷，机器人，和旭创成立合资公司的是东阳光。

    依然提醒，不要追高，他们是进二退一的模式。

    整个N链中位置最低的就是电源，核心代表是麦格米特，欧陆通也在给英伟达送样，有的坚持下。

    其他科技板块的观点不变。

    有同学问到商业航天，太散乱就看华为即可，他们又在酝良航天军团，代表作上海瀚讯

    三，上周公布了CPI数据，消费微弱反弹，有大资金开始回流新消费。

    游戏依然没有结束，华通巨人等打开高度之后，后排才能补涨。

    中宠，乖宝已经基本稳住了局面，有预期差的是依依股份，20多倍PE在走补涨，可重点关注，或通过分批次的方法，把成本稳住在20日线位置。

    如今的一体两翼，一体是大金融护盘，特点是涨的慢，但是稳，

    两翼中的反内卷，是老公募，游资，量化主导，特点是起伏大，

    两翼中的高科技，是新机构，私募，新基金参与，特点是抱团，

    海外算力，创新药，游戏，军工，都是机构抱团的板块。

    抱团更容易走高低切的行情，比如创新药，从ADC双抗，一路到现在乐普医疗等代表的医疗器械，你看最近的几个医疗器械ETF，明显的资金放量。

    同时机构打造的港股创新药etf又接近20日线了。

    这几天日线出现顶背离，还是要多注意的，太弱太后排的要观察。

