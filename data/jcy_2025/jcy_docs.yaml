  文档内容正文: '胜宏的业绩和AI指引

    胜宏昨天的公告，

    按照很多机构的想法，不及预期。

    前三季度营业总收入141.17亿元，同比增长83.40%; 归母净利润32.45亿元，同比增长324.38%,

    然而，一季度利润9.21，二季度12.22亿，三季度净利润11.02，环比下降，且远不及上季度增速。

    这是大家认为 miss的根本原因，同比不行，不惊艳，对不起这个增速，利空。

    但现实呢？

    第一，三季报没有什么参考价值。

    我们在仕佳、寒王等“miss”的时候讲过，大公司通常不会在三季度接单和结账。

    在企业里待过的都有知道，大结算一年通常两次，年中和年尾。

    然而，99%的基金经理没有在企业里待过，大学毕业后写几年报告就去管钱了，跟他们讲不通这个道理。

    第二，胜宏的环比下降是客观原因。

    这一代英伟达是 blackwell架构，代表作是GB200/GB300，七八月时，是200向300的过渡，你要重新备材料，出订单，必然有一段波动期。

    未来是向好的波动，300系列的用量更大。

    第三，还是要看未来。

    美股的财报通常谈两个，一个是现在的业绩，一个是未来的“指引”。

    中国不谈指引，美其名曰不信画饼。

    但财报只代表过去你能看到什么？

    英伟达的指引是，下一代的Rubin架构，在PCB领域会用到M9级材料和新的背板，中板，价值量相对于现在GB300的2-2.5倍，光模块大规模用1.6T，价值量直接翻番。

    价值量提升之外，胜宏和旭创各自的占比份额也会提升，比如过去，达链40% PCB来自胜宏，下一代50%。

    第四，各种小作文是乱推业绩利润，不断加码，国际大投行对胜宏的预期，是本年度199亿营收，48亿净利润。

    这样看它已完成32亿，年底前达标没有问题，国内小作文非要定为55亿。

    野村对它明年的预期是290亿营收，75.9亿净利润，把它目标价定位390（这个390仅供参考啊）。

    这样折合现在的市盈率是39倍 pe，谈不上贵，国际通行水准。

    大A80倍的老登和概念一大堆。

    最后你还要看到什么，大厂纷纷在梭哈AI，昨天高通说自己要做AI200和250芯片，股价大涨11%，

    要做芯片就得用光模块 PCB等等那一串，你说看谁？

    目前校花们的主要问题，不是业绩问题，而是产能问题，加班加点的保交付。

    昨天大盘大家也看到了，尾盘疯狂扫货科技

    综上，低开不用怕。

    那如果小概率平开甚至高开呢？

    说明钝化，

    当弱不若则为强。

    今天的看点，

    是4000点生产队压不压盘。

    压盘

    4000点不会一蹴而就，

    这里要压压盘，让筹码充分交换，

    主力们也都想观望观望，美股七仙女即将出财报了。

    中午回落的重要原因，也是发文两岸关系，风偏高的外资直接砸港股，大A跟着跌。

    我们倒认为对岛子的这个文章是“攻势防御”，毕竟过两天见面了。

    pcb没有啥问题，今天也消化的7788了，后排的景旺方正比它贵多了都能大力补涨，要不是大盘不配合，它都红了。

    其实是很多散户和大部分机构都没有在4000点以上挣钱的经验，

    缺乏想象力。'
