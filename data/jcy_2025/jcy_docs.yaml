  文档内容正文: '商业航天的产业内幕和分歧

    作为最重要的支线，还是谈一下，之前希望大家去搞第二波，不是不懂，是因为太懂了。

    这个链条非常长，整个产业最简单的几句话跟大家梳理下：

    第一，整体的力量掌握在国家队手中，航天科技集团和航天科工集团，尤其是航天科技集团（注意不是科工下面的上市公司航天科技），即使外头的民营公司，基本也是这两家公司出去的人搞的。

    第二，整体大的部分分两块：火箭和卫星。

    1. 先说火箭：国家队主力用的是长征，来自航天科技的上海八院（之前科普文谈过），旗下上市公司是航天机电，九院的航天电子做配套；长征属于中型火箭，用的是液体燃料。航天科工旗下的叫做“快舟”，主打快速响应，是小型火箭，用的是固体燃料。中国的重型火箭是朱雀3，由蓝箭航天研发，3月可能复飞，昨天受到其IPO消息的刺激，产业链大涨；朱雀3直接对标猎鹰9号，是不锈钢壳体液氧甲烷火箭。后续还有星际荣耀、天兵科技等，目前蓝箭的火箭最重。

    2. 再说卫星：马斯克版本的叫星链，中国对标版有两个，北京的叫中国星网（注册地在雄安），上海的叫千帆星座，分别隶属于国务院国资委和上海市国资委，业内叫做“北有星网，南有千帆”。这两家对应的主供是中国卫星和上海垣信（主要供应同是翔讯），这也是之前一直跟大家谈的能入眼和机构关注的品种。

    现在的问题在哪里？

    一是蓝箭的朱雀3其实没有载荷能力，上面不能搭载东西，就是个空桶子火箭，能上天和能放卫星是两码事。

    二是挣钱的路子没想出来。马斯克的SpaceX能挣钱，主要是它可以卖星链服务，比如提供无线网络，这建立在美国和全球基建很差的基础上。但中国地面设施太强了，到处都是5G基站，大家的信号和导航都很好，怎么挣钱？欧美国家的单子，因为安全问题可能又不给咱们。所以前几年包括今年，我们去看商业航天公司，日子都比较难。大家熟悉的一些大公司就是赚不到钱才去干别的，比如景旺电子，早就做太空PCB，大头业务得靠英伟达和浪潮；干液冷的硕贝德，本来就有卫星天线，它是搞无线起家的；新雷能，正经的卫星电源业务干亏了，后来蹭上谷歌的服务器电源，明年能扭亏。

    第三，我们还是谈谈交易的问题。有些同学总是心痒，爱打野。昨天集体高潮后，今天很有可能会分歧，分歧后通常有两个方向：

    一个是继续蓝箭IPO催化的方向，主要是做结构件的超捷、做高温材料的斯瑞、做发动机推力室和3D打印的铂力特、搞传感器的高华科技、搞燃料的航天晨光等。一票牛散打造的通宇通讯、ST思科瑞和蓝箭、天兵等搞了创新中心，在海南。

    另一个是回归央企的科技集团系，毕竟现在运力紧张，发射不过来，那就是八院的航天机电和九院的航天电子。

    走第一个路径的可能性不小，真有人想玩一轮当年宇树机器人的映射行情呢？

    以上仅为学习参考，不要追高啊。稳健的可以等二波，真要打野也可以看一些涨幅不那么猛、有其他兼营业务、以机构主力为核心的标的，毕竟这行……

    机构返场，放量成交

    7连阳了，调整一下，更健康。

    因为时间已经不够，只能采用急跌式洗盘，没法再阴跌慢慢磨了。

    今天的主要特征是机构洗盘和扫货，中免、迪王都是游资量化不碰的品种。

    市场的主线前几天反复讲过3个：光、电、有色。

    放量的洗盘，都是好事。

    今天除了机构票，游资量化打造的已经涨不动了。

    之前有同学总担心自己上不了车，拜托，后面还有好几波，急什么。

    科技会起来的，等圣诞期间大家冷静想想，还是觉得英伟达靠谱。

    东大缺芯、西大缺电，永鼎是什么都踩上了啊，左手核聚变，右手光芯片。

    这就是“二波走势”，第一轮的核聚变完全由游资主导，涨了好几个月，回落后机构才进去。

    永鼎的BIAS已达55，跟上次高点差不多，下周不涨可以止盈部分了。

    楠楠提问：大王，您好。最近付鹏和李蓓都不太看好黄金的后市，付鹏说世界今后就不太动荡了；李蓓说有些央行已经开始出售黄金，黄金没那么热了。那么黄金还能投吗？它在资产配置中占多大比例比较合适？

    南院大王回复：听他俩说年都能够过错，前段时间他们大力看空AI和光模块，结果呢。黄金、铜、铝，短期看不到下降趋势。这几个就不是干实业的，根本没看到过去十多年，采掘业被视为傻大黑粗，矿老板纷纷转行，上游投资基本都停了，供给严重收缩。一旦世界不动荡、需求量扩大，它们除了涨价还有什么办法？

    斌：大王今天麦米为什么跌那么多呢？

    南院大王回复斌：跟着液冷一起洗

    胡福：大王，东田在投资者答复那里说自己不做法拉第旋片，啥意思？

    希望：看阳光电源一直不行，前几天卖了，买了博创，结果阳光电源大涨，博创大跌

    南院大王回复希望：成年人做什么选择题

    希望回复南院大王：都买？

    希望回复南院大王：大王，博创和长飞是不是现在会往下调整啊？

    House回复希望：都是好票，拉长点看

    闲闲巴巴：永鼎能涨到哪？

    一头小象：感谢大王，抢到了飞龙的今天低点

    小高回复一头小象：没钱了，有钱我也买

    莹桃小丸子：请问大王，杰瑞的逻辑也长期看好吧？

    南院大王回复莹桃小丸子：缺电的燃气轮机，机构爱看，也能搭上商业航天的叶片，乖离值快50要注意'
