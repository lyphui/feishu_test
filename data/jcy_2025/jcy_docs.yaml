    前期游资的老抱团品种机器人今天拉升，保安团先冲为敬，

    遗憾的是主力国队并未跟进，他们还想稳一把再说，手里拿的芯片和设备并未拉升，但人家也没过分砸盘。

    他们可能留着有生力量，趁宏观利好消息一起，来一轮大的歼灭战。

    由此更加坚定早上的判断，3040就是这一轮的底部。

    好的一面我们要看到什么？

    “机器人的大涨没有像以前一样，从其他板块抽血”。

    大科技和大消费的攻守组合，

    可以偏进攻了。

    当然，谨慎的同学依然可以继续观望，过了1.3万亿，放量补了缺口再说。

    喜欢技术的同学们越来越多，给大家讲一个最基础最高效的兵法：

    5日线上穿10日线，击鼓进军。

