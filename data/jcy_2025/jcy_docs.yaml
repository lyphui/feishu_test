    有华工的同学这下舒口气了吧，

    弹性大的光芯片早上回复了叶枫同学，就看源杰和仕佳。

    源杰很好， pe高了，

    仕佳有望打破lumentum垄断，

    更早讲的东田微，有望打破日本光隔离器垄断。

