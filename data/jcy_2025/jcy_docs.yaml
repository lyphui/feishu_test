    三河的故事

    整个城市的招牌被换成了绿色，严禁用红，很多人都不解。

    较大的一个可能性是，

    这领导的用神，要用木，所以喜绿，

    八字忌火，所以要禁红。

    就这么简单，为了仕途和个人能顺，听什么大师的意见把全市颜色给改了，很有可能。

    求神拜佛有没用？当然有。神佛是高维能量，共振，就是心诚则灵。

    玄学调整有没用？当然有用。天人合一，神清气爽。

    问题是，这些有个大前提，那就是发心得正。

    《易经》上来就讲，厚德载物。

    你不能光为了自个，损人利己，这有违天道。那天道能让你好？

    没看过那人的八字，他喜水木是很有可能的，之前一路高升，那时候金水都很旺。24年甲辰，参天巨木，他一下上了个台阶。

    忌火是实锤了，你把整个城市禁了红有啥用，大环境是乙巳年，火开始旺，20年离火大运开始，天道比人道厉害多了，你变成绿黄瓜也得挨克。

    我D就是红，你迟早栽在组织手里。

    本来应该谦虚谨慎，戒骄戒躁，安安稳稳的怂过这20年，最起码也得2026年丙午以后再说，非得嘚瑟，完了吧。

    所以各位，平时求神拜佛也好，发心祝愿也好，一定不能光想着自己，发心要宽广。

    哪怕是买个股票要念叨，也得发心，不光了为了赚钱，为产业发展尽分力，等真赚了钱，会去扶危助困，惠及众生。

    这才是念念不忘必有回响。

