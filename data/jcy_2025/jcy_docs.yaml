    3450一线

    3450一线是重点压力区，如果没有带量突破，基本视为诱多。

    大盘现在国队把握之下，掌握板块和踏准节奏很重要，以下是几个的分析，

    1，科技：重点是英伟达链和博通，主要看PCB到光模块再到其他的发散，领队得打出高度，发散不动，科技就要继续挨 打。

    但科技有个机会，这个不少巨头都开发布会，事件催化会走下。

    2，当前TMT的成交占比依然在25%左右，科技是低配的，底部是难熬的，但机构补仓， 一般会先从游戏传媒开始补，再加 上游戏本身涉及新消费，它是两头最不容易挨打的，传媒主要看《长安荔枝》的催化和版权资产。

    3，创新药：目前要不要调整，要。但是不是顶部。不是。 BD大单的故事还能讲，业绩还在释放。后拍那几个名单都公布 过。

    之前讲创新药是机构打造的牛市，之前连跌4年，他们这点涨幅是不满足的。

    有人觉得现在高了，你想想当年的光伏和机器人，机器人好几次月线砸阴了后面继续。

    这轮创新药的主要特点是没龙头，此起彼伏，对操作型选手非常友好，这个涨完吃那个，你看好不同公司的股性就行，有 的喜欢进一退二，有的喜欢退三大涨一。

    偷懒模式还是ETF，港股的药有业绩，A股的目前故事居多。

    4，可控核聚变。游资打造的行情，第一轮走完还会有第二轮，目前应该到了调整期，完了会继续。可以盯两个，合锻，中 洲，多少有点东西。

    5，稀土。主要是永磁，中重稀土等，它以前是反制逻辑，我卡你脖子，现在是涨价逻辑，谈好了我涨价卖。

    涨价逻辑要比反制好的多，毕竟有业绩。

    6，猪周期。旧的猪周期即将结束了，新的即将来临，现实可能要三季度，但你防不住二季度有人开始跑预期。猪涨之前， 鸡肉先涨。这个不用着急，可以趁大跌或者深刻调整再入。

    其他的都是一些小题材。

