  文档内容正文: '4000点附近的重要思考和策略

    昨天英伟达略涨，AMD+9%，

    大A是跟呢，还是不跟呢？

    现在大部分机构，基金和散户的看法，

    都是大A要来一轮高低切，

    靠消费和低位把指数拉上去。

    但问题有三个，

    一是，低位的很多东西没眼看，几百倍pe，亏损的一堆，你强逼着大家去买垃圾行吗？

    上上一轮，新能源切到半导体，上一轮，半导体又切到红利，那是本身这两个板块都能打，分化没这么大。

    现在差距太大了。

    二是，现在主线绑架了指数，

    易中胜+宁王≈创业板，

    寒王+中芯≈科创板。

    你硬叫机构不得扎堆，那大盘就得暴跌，

    那还怎么稳住指数要慢牛？

    三是，公募又不是神仙，

    当年市场37%的份额是它们的，现在只有7%,很多私募，游资的体量不比小公募小，

    你这一轮所谓的解决拥挤度过高，有人可以不听，你爱走走。

    大家可能不太了解公募的操作周期周期，其实一年掐头去尾8个月，

    过完年2月上班，3月等两会，4月研究，5月后知后觉，6月抱团拉升，10月甩货走人，保排名，真干活只有4个月，年年如此。

    中国股市如今的主要问题，

    是公募考核周期过短和好公司需要长期持有之间的矛盾。

    今年指数为什么起来了？险资的考核周期变成3年了。

    对此我们有如下的判断，

    1，这一轮的消化和调仓换股，不会那么剧烈，但震荡的时间会很长，直到筛出趴在里面的铁杆。

    2，低位的大消费之类会起来，但不会像过去那样替换主线，一部分资金会去洒洒水和博收益，但不会90度大调头，雨露均沾可以，逆袭难。

    3，因为较长的震荡，信主线的和信切换的两波

