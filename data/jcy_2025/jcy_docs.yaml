    密切关注高低切的趋势

    1，先以海外海外算力的为例，

    重温一下知识点，

    算力硬件的几个大领域，

    PCB、 光模块、电源、液冷、铜链接、交换机等，

    英伟达链的PCB高低切，现在带头是后排的铜箔，深南等。

    PCB大约进入尾声阶段，鱼尾多大不知道，主要风向看胜宏。

    光模块依然在前排继续走高度，中际旭创还在涨，因此太辰光之类都还缀在后排。

    整个算力板块内部，有往低位的铜缆，电源/液冷切的趋势，虽不非常明显，最典型是之前博创，今天的欧陆通和瑞可ì 这里依然要看市盈率，低市盈率和高业绩的更快。

    算力内部切的不是特别顺畅的原因，是pcb和光模块的业绩太好了，未经证式的消息，东山收购索尔思切入cpo后，今年 净利润20亿+。

    2，创新药也在往后排切，后排的是没怎么涨的BD预期和CRO企业，关于它的观点我们是一致的，行情未完，不会的就 ETF.

    3，大金融往低位切的，我们暂且定位保险，它买了一堆别人，又怎么能把自己搞下去？

    这几天，百亿级的证券基金，也就是专门入市炒股的，在不断备案。

    4，反内卷集团本身，也是高低切的一个巨像，因为分歧大所以不流畅。

    其他板块不——列举，都是前排高度后后排跟上，风向标不倒就舞线跳， ETf更稳。

    整个的环境，不要追高，等待轮动，以牛市的眼光来看这一轮。

