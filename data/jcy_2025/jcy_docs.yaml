    理解风格变化与后市

    散聊于以前各篇的，给大家总结

    1，恒生科技指数引领大A科技，恒科跌则科技跌，恒科涨则A科技涨。

    2，上证是国队主力和领导关注所在，保指数不跟恒科。

    3，市场分三大阵线，大科技（各种Ai算力机器人制造），大红利（银行保险电力高速煤炭等），大消费。科技和红利是跷跷板，消费间歇表现。

    4，目前指数随着科技的调整而调整，

    if，恒科跌，则A科技跌。

    if，这几天大A涨的是红利，则说明防守主导，科技仍要调整。

    if，这几天大A涨的是科技，则说明修复和反抽到来，仍是给你卖出手中杂毛的机会。

    品

    if，这些天消费开始表现，不着急多观察，有2家以上连续2天以上涨停则说明风气形成。白酒不会是这一轮消费主力，甚至还不如旅游谷子宠物新商超。

    if,各种什么核聚变题材轮动则说明量化活跃主力不在场，不建议参与。

    5,股市严重符合道的原理，物极必反，否极泰来，之前大科技成交量占市场40%,机器人概念占800家，则必然高位调整，调整到什么地步？

    TMT总体占比又回到25%左右。

    调整幅度呢？总体的ETF，也就是板块指数，大约在20%左右，个股就不一定了。

    6，近期就是看线阶段，5日平台和箱体，好好运用，不要有感情，你的纪律是最大的感情。

    7，减仓慢了或者犹豫了不重要，反思这次自己是犹豫了还是侥幸了更重要，后面机会仍然有。

    8，整体市场的长期态势，仍然是多头排列。'
