  文档内容正文: '百无一用是书生

    现在还有人说研究中国历史没用吗？特朗普已经学了很久。

    人性大同小异，规律循环往复。

    帝国的扩张和收缩，汉朝最为典型，

    产业革命带动全球化，大唐就是案例，

    作为唯一有连续记载的人类历史，中国有无数经验教训和大模型。

    不懂兴衰存亡，渺小个体将焦虑迷茫而看不清方向，大学和社会上教的很多东西，都是是谋生工具和牛马之学，

    作为一个生命，你很可能错过最精彩的时代浪潮与最幸福的内心觉醒。

    百无一用是书生，因为在以前，历史和兵法是禁书，心学则是门派传承。

    战略学，管理学，心理学，人家不教你。

    现在换了人间了。

