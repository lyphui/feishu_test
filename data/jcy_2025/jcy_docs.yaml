    高低位各得其所

    来复习下我们的总体逻辑，高低切。

    一、高位的海外算力，

    PCb，光模块。

    之前的观点一直是光模块比PCb稳，本质是产能还没爆发，早上也讲了天孚的产能4季度才释放，

    今天就表现出来，一样砸下去6个点，旭创就能拉回来，胜宏就不行。

    PCb的筹码松动了，性价比不高了。

    高位里的，相对低位铜缆和液冷，

    博创，太辰光，瑞可达，二线的长飞，兆龙等等，轮动无处不在，一个大涨过后就轮到另一个，

    当时错过易中天的同学，给大家点了太辰光，它也迟早要历史新高，瑞可达的补涨也很有成效。

    安费诺100多亿美元收购的康普cSs部门，就是干这个领域的。

    液冷，老朋友英维克，川环，同飞等，游资打造的龙头淳中，也给大家讲了，这里虽有分歧，后市依然看好。

    今天铜缆和液冷，表现好很多，因为低位。

    二、海外算力之外的两个大低位，

    低位1，国产科技

    低位2，非科技低位

    一、国产科技上三大不那么洼的洼地，

    a，第一个就是国产芯片，首看算力，

    之前讲了这轮龙头可能东芯，给了三次机会，世界算力大会一次，首阴回马枪一次，大盘调整一次。

    次看带算力概念的soc，芯原，翱捷，炬芯都态势向上。

    哪天东芯跑不动了，可能就交棒寒王。

    b，第二个是光刻机，张江，茂莱，波长，福晶等，表现达标。

    c，第三个AI应用，山寨figma万兴，政务大模型拓尔思等，全天保持强势，评价蠢蠢欲动。

    二、非科技低位

    反内卷和新消费。

    新消费里最确定的游戏一路新高，有业绩的巨人，冰川，华通等都讲过，基本没涨够，

    中排一点游族，宝通，更后排可看带点大模型概念神州泰岳20日线的机会。

    东鹏代表的提神饮料，中宠乖宝代表的宠物食品，旻卡龙，元隆雅图代表的谷子经济，水羊代表的医美等，

    前两天没人说消费的时候我们专门提到，参与的同学应该收获不错。

    看看小於儿这个直觉和择时，大赞。

    要问原因，就是两融杀进来，反正位置低。

    以上是全貌式的概览仅供学习，

    仍然告诉大家要注意的是，这轮牛市轮动特别快，一个板块最多连续涨3天，一两天反而是常态，不要追高，埋伏轮动，关注低位，不会的去搞etf，95%人最终跑不过它。

    不要怕涨，图没坏就在主升浪，

    不要怕跌，资金深度介入的领域没那快结束。

    今天就是个最明显的例子，光模块强力拉回来，国产半导体和AI应用就没大涨。

    今晚，压力又给到了总瓢把子英伟达。

    最后，恭喜东芯的同学们，4天8板精准上车，这新闻你们与有荣焉。

