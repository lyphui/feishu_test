  文档内容正文: '一起发动

    双轮驱动，每一轮都有动力，

    这就是牛市。

    科技轮子的主桌，易中天的强势再次让你体会到了吧。

    反内卷轮子的有色和电池，一早就猛拉。

    逻辑都有兑现的机会，这就是“念任何经都能成佛”。

    创新药，钦点的三个都很好，一个20cm，指数大涨5个点，

    牛市起伏非常剧烈，不追高是祖训，深V

    才是好机会。

    就像今天的电池设备，你真追进去性价比就很低，

    早上我们坚持说科技仍是主线，

    专门强调华为线仍要补涨图没走完，大盘杀到绿有没把握住低吸，起码你不能割肉吧。

    华为 PCB生益今天就比英伟达 PCB胜宏强，华为的两个光模块就更流畅了。

    熟练利用高低切原理和补涨理论，这一轮就能如鱼得水，

    比如 soc，瑞王都上天了，全志还在地上，今天狠狠补涨一下历史新高，牟局扬眉吐气，人生也是历史新高啊。

    今天，上面试图拉银行来稳指数的，险些拉出问题，

    明后天看点，要不要发动券商。

    但你懂的，咱们只观察券商而不碰券商，而操作弹性更大的。

    Hygge：大王，中际已经三倍了还没做过减仓，后续是否有什么指标能够判断抱团松动，是不是看换手率？

    爱骑风火轮的大肥 ：请教大工，最后一段我没太看懂。何为“拉银行拉出问题”？

    南院大王回复爱骑风火轮的大肥 ：拉银行看空经济

    lin回复Hygge：这位兄弟，你是来拉羡慕的吧恭喜

    上善若水：今天低吸了一点瑞王和寒王，抱着长期持有的态度

    南院大王 回复hygge：问的好，看TMT成交占大盘占比，45%才入危险区，目前40%.

    邱邱：问下大王，马上要9月3日了，要走的吗？

    南院大王回复邱邱：93后日子不过了吗？10月还有4钟会。

    双轮驱动的新局面与九月走势探讨

    还是一体两翼的谈法，

    第一，

    一体，大金融中的保险是主力资金来源之一，周五让大家涨停止盈，后续继续按照最好-2%左右看，+3%-4%左右T的方法网格，

    如何知道它可能跌或者涨的更多，看港股保险，港股比它弹性大。

    券商板块，再次强调它只是风向，弹性太小，可以看券商IT/金融科技，三家典型，指南，财趋，大聪明。

    券商拉一起，你看它，券商一砸盘，你可先走。

    第二，科技板块，

    周末阿里的业绩大涨，如果科技板块继续大涨，那么就会从其他地方继续抽血，

    这一轮的仓位不用做太大调整，最多是那些涨了几倍的你小部分止盈增厚安全垫。

    阿里做芯片利好国产芯片，供应商和华为高度重叠。

    而目前华为线没有看到结束的迹象，比如生益，光模块的华工，光迅，连接器的华丰，液冷的英维克等技术走势依然能看。

    如果撇开资本市场纯看受益，阿里 capex砸钱超预期最直接受益的是AIdC和云，如润泽，数据港、奥飞等，以及我们熟悉的弘狗等。

    如果算力普遍疲软，那就会缩圈，各种光模块 PCB只有核心前排的能继续看，

    资金很可能往机器人，创新药，半导体打铁设备上去切，周五已经出现端倪，大家要继续观察盘面。

    当时为什么说中不溜的看机器人，机器人一脚踩科技，一脚踩反内卷，很多公司的本质，都是“汽配”，比如最典型的拓普集团。

    机器人那几个讲过往前翻，菜鸟看的还是机器人etf。

    创新药依然是之前看好的几个，艾力斯，荣昌，迈威等，易方要看其能否在55日着站稳。

    这里有个简单的ETF，科创创新新药589720，科创芯片都上去了，药能不能补一下？

    当然大A的药没业绩，更稳健的是港股创新药ETF比如513780。

    如果畏高，那就是大A特色的cxo，凯莱英，康龙等，也调整了一段了，

    总之前排科技的算力Asic之类，能涨就继续拿着，随着9月消费电子旺季，依然看好soc/mcu的几个。

    科技当然没有走完，在震荡调整后，AI还会创造出更高的高度。

    第三，回到绝对低位的另一轮驱动，

    请注意，周一可能低位板块们就分歧了，但这绝对不代表它们是一日游。

    4000以及4000点以上，必须靠它们发力，这块是要高看一眼的，尤其反内卷。

    -反内卷，电池可能接棒光伏更强一些，电池最核心的就是宁王，弹性更大的是电池设备，比如先导之类，

    但电池上周涨的太高，如果没先手就要趁绿盘最好是较大调整后进，

    设备除了龙头更可关注带固态概念的，比如宏工科技等。

    这里有个预期差的是长阳科技，做固态和半固态基膜，我们了解的情况是它已经获得C厂，蔚来，松下等的订单，产能还没放量，光学业绩的亏空还要计提出清，但周五涨的太高，给一些调整或回踩一下20做左右更好。

    锂电的专门etf是159840。

    看两个，

    恒生科技etf，直接受益美联储降息和东大经济改善，这个多看。

    之前有人不看好恒生科技，你看阿里的业绩是不是爆炸？

    一个是有色板块，叫做资源LOF，160260，放水东西涨价，就这么简单。

    你要说有色里谁弹性最大，之前说过了，铜。

    以上仅为学习，不构成任何建议哈，

    总之，九月份的科技依然是主线，

    但关键词一定包括，“浓眉大眼”的大白马。

    杨雄：这信息量太大了

