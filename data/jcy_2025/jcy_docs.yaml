    踏空的资金与消费板块

    踏空的资金继续进场，

    一，踏空的机构，进的是海外算力，PCB，光模块等，这就是当时我们讲的，可能会“越长越便宜”，都觉得高了，我们会说它依然没完。

    基金小将们都是一群歇斯底里症患者，可太懂它们了。

    二，踏空的游资，牛散，量化，进的是国产算力，几个亿几个亿的扫进寒王，

    小作文只是催化而已，他们岂能不知，假的也给你买成真的。

    普通人如果上车晚了，也就是只能在这两大背景下搭一把车，

    海外算力低位与国产算力低位，

    a，海外算力相对低的，英伟达系是液冷/电源的环节，以及不高不低的铜链接，绰在最后排没什么存在感的交换机，之前讲的交换机彩蛋，锐捷网络和星网锐捷，不温不火，悄然新高了。

    b，国产算力相对低的，仍然是算力芯片，以及ASIC，算力东伟达打头，后面的算力关联ASiC，端侧关联ASIc(soc)等跟上。

    这里的ETF是老朋友，588200。

    还有一条平行线的华为算力，华为系电源液冷光模块pcb等等，之前也碎片式的谈过，其实涨幅也不错，先按下不表后面表。

    做过生意和外贸的都知道，老美的订单利润高结款快，国内的巨头一言难尽。

    下下个低位我们再搞昇腾384，有兴趣的同学自己先看。

    以上的板块和受益，挨个都有多次谈过，有疑惑同学们可以往前翻。

    三，回到消费，

    昨天公布的消费贴息政策，对现实促进大吗？

    并不大，3000块杯水车薪。

    但这说明了上峰的意志，所以对市场的预期是大的。

    那么消费今天能追吗？不能。

    量化当道，你能买进去的基本都有坑。

    消费的趋势呢？当然是有的。

    游戏>谷子经济>提神饮料/宠物食品。

    其他都没得看。

    这个低位板块也讲好些天，潜伏进去的今天如果涨的很高，有技术的可以部分做T。

    游戏和东鹏，尤其是游戏，是机构资金在里面抱团的，

    所以这两个涨的好，说明机构资金在源源不断进入，那就可以继续跟，

    如果幅度不大，说明游资量化兴风作浪，你很难玩过它们。

    今天如果消费虹吸的资金过多，你手里拿的抛压很大即将长上影线，懂技术的同学要懂得做T

    而对没仓位的同学可以在尾盘或者相对低点时刻建仓，再三强调，不要追高。

