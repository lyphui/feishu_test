  文档内容正文: 'AI的叙事继续

    昨晚美股的谷歌大涨6.3%创下历史新高，

    现在市值3.84万亿美元，突破4万亿美元迟早的事，

    谁说AI不能赚钱？

    下半夜Gemini3非常卡顿，人们觉得谷歌得买英伟达算力卡了，又把达子拉上了上去，

    几个关键元器件则一直都很强势，光芯片的lite（对应源杰等），大涨17%，光模块的高意（对应旭创等），大涨8.8%.

    -两大方向，谷歌链和AI应用会继续，

    谷歌链的ocs四小龙依然看好，要分一根弦注意

    乖离值和龙头腾景的问题，腾景目前BAIS值55，是否会向上次一样冲击121，要密切观察是否晋级，70是其中一道坎。蓝标也一样。

    Ai应用有望扩散，AI营销，AI传媒带头，后面的语料，数据，办公软件等，其中沾边谷歌的，软件，应用，代理商，更好，更值得一看，【视为谷歌链的扩散】。

    -选应用股注意几个要点，

    1，股性要好，过去3个月内有涨停或者大涨7%以上的经历，不能总是±3%4%的在那边磨，说明主力不痛快，你不喜欢磨叽的。

    2，技术要能看，5日线上穿8日线总要的，短期均线组最好和长期均线组相交向上，起码，5813这组，收复34日线，不能被它压制。

    3，最近的成交量明显放大，或者红柱长，绿柱短，上涨有量，下跌无量。之前帮大家选的蓝标和360就是，狂洗三天，都是缩量的（如图一）。

    4，多少看点财报，哪怕是亏的，净利润或营业额有无明显增长。

    整个板块没有太好的etf，简单粗暴的是软件龙头etf.

    -应用里稳健和长期能看的，就是我们反复讲的恒生科技etf，这里头基本都是应用，哪家企业不赚钱？

    有些人一直觉得恒科一直在跌啊，你就不是来做短线的，要么躺那边要么定投就是了，生产队在21年狂买银行，大家都觉得傻，然后呢？狂涨3年。

    最早靠房地产收租，然后靠银行收租，再然后腾讯阿里之类收租，就酱。

    我们给菜鸟新手们建议的主力，保险+恒科，本质都是巴菲特的精髓“买入垄断”。

    拿着AI收费站你着急什么？大象真跑起来不慢的。

    谷歌4万亿美元，阿里只有4000亿，这科学吗？

    谷歌有的阿里都有，阿里有的谷歌不一定有啊。

    以上讲的是中长线，看pe的，看产业的，不是每天一看跌了就慌的。

    -那么对短线选手呢？尤其是两三个月内总想要涨的时候在，跌的时候躲了的。

    从5日平台到重要均线到简易口诀，是走是留，道理讲过N遍了。

    那你就不能刻舟求剑，要随时看到风向切换的，得勤奋，得学习，得具备执行力，明明讲了11月要跑硬科技，再磨叽你6号前要撤，明明看得懂图也知道走坏了，犹犹豫豫好多天，又问怎么办。

    咋办呢？你就看这两天的反弹，

    如果硬科技在这种利好之下，仍然钝化，不涨，缩量上涨，甚至要冲高回落，那你就趁反弹减仓，比如减到4-5成或你舒服的位置，什么时候再接回来？长短均线组再相交向上。

    如果这两天上涨是有量呢？那你拿着啊。

    无量反弹减仓，有量上涨拿着，这个基本道理搞

    不明白，可把自己归入菜鸟新手那一类。

    趁反弹减仓有没卖飞的可能性，有的，你不还留着底仓吗？有没躲过大跌的可能性，也有的，你不空出了仓位吗？走你和留着都别后悔。

    看3年和看3个月的尺度是不一样的，不能既要又要严丝合缝。

    这轮反弹在什么空间你去做T?大约3820-3887左右震荡。

    -大A波动太大的主要原因，

    是A股基本是被机构和公募把持的，它们的主要问题，是视野太狭窄，阅历太欠缺，急躁肤浅，羊群效应。

    别说几个人经历过产业升级，去过硅谷，考察过英伟达，连杭州的城市大脑都没好好去过，阿里

    都没搞明白。

    他们只会胡乱抱团，把复联这种搞组装的炒到快50倍pe，它明年业绩能翻倍吗？

    结果为了跑路，泼水的时候好坏一起扔掉，造成很多错杀。

    我们还是那个观点，5-10年看，AI还是产业革命的早期，当年你要么没钱，要么没认知，要么没机会，错过了互联网革命，这一次怎么搞自己先想明白。

    说一个颠覆大家认知的真相，有些同学可能是知道的，

    中国最懂产业最懂技术最具实操经验的，不是那帮基金经理，什么投资人，

    而是发达地区的市委书记，各省的省领导。

    招商引资是地方第一要务，一把手必须精通，没有GDP和税收你吃什么。

    大王因为工作等关系接触过不少，书记们都是娓娓而谈，从国际布局，国内分工，产业特色，技术优势等方面讲的头头是道，脑子里有张清醒的大图。

    江浙沪和高科技就太多，大王有次接触个安徽的书记，他讲化工和材料学，谈硫酸钙晶须，论述怎么北交所挂牌，真是把我震撼了。

    回到大A，央妈昨天搞了1万亿的MLF增加流动性，董事长也跟懂王通了电话，今天的高开和反弹值得期待。

    现在还是牛市，亲。

    评论区：

    新王出世

    是不是果然冲到3887左右回落？斐波那契数列，自然界之理。

    谷歌链如何？ocs四小龙此起彼伏，拉完一个拉另一个。

    谷歌pcb沪电率先涨停，它也调了这么久了。

    谷歌的TPU不够还是需要英伟达，百花齐放，达链也继续。

    【校花校草谷歌链，肥水不流外人田】

    这就是产业决定中线，图形影响短期。

    我们举一个例子，

    -拿产业说，博创以前在达链是做铜链接的，被人们认为价值量不大，而且有减持，

    我们告诉大家，夫妻俩的减持是大股东要求他们退出，避免影响，轻装上阵，

    而且MPO在谷歌的真正价值未被发现，谷歌一起来，它也跟上。

    -拿技术来说，它是不是5日上穿8日线后，开始放量，然后上穿34日线？

    是否形成了买1，买2?

    -你再看量，什么叫有量拿着，11月14日的成交量11亿，到后面的几天常态保持30亿以上，21日收复34日线的成交量32亿，24日即使价格有所回落，量能也有40亿，你看他8月大涨的主升浪，日成交的也就40亿，这时担心什么呢？

    后面怎么收复？第一个压力位117，第二个压力位132.68，当然不会一蹴而就，震荡着来。

    文火同学抄底，这几天30%有了。

    产业，技术，量能，都讲了，其他的也参考这种

    案例，举一反三。

    佛教有名言，神通不敌因果，因果不敌智慧，在市场，就是K线不敌业绩，产业不敌趋势。

    很多人还看不清市场究竟在涨什么，产业趋势。

    《谷歌先遣图》可都谈包浆了啊。

    咱们影响了两个板块的设立，

    一个是“硅光集成”，一个是“光交换机”，与有荣焉。

    谷歌链的车，今天舒服了吗？'
