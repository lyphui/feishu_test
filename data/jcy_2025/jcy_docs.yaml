    支棱起来

    原来的研判：

    科技线内部，低位的是存储，半导体。

    不高不低的是AI芯片。

    盘子小弹性大那几个都熟悉，云天，翱捷，芯原等。如图一。

    他们的名字就很有情绪

    2.28日为什么告诉某同学，全志可以看，

    宏观上它做机器狗的芯片，属于主线。

    主要是技术，它稳在5日平台上，

    上影线很长，下影线也很长。

    这是一种“螺旋桨形态”，看不出直升机你把手机横放。（图二）

    说明虽然分歧很大，但主力护盘意图明显，随时会根据形势酝酿动作。

    况且，反正它平台又不跌穿，你怕什么。

    听到这，某些同学又要心里创伤了吗，哈哈。

    不懂的同学们看了58200么，可是给过你大绿盘机会的。

    全志这票所谓Ai芯片，是ASIC的一种，其实真正应该叫SOC.

    他们的大哥是瑞王。

    最新5日平台底部157.28.

    ps，仅为学习哈，不构成任何建议。

    鸣谢：恐龙同学。

    类似直升机走势，或者平台中，恰好处于缺口之上，又不跌破，在箱体中整理的Ai，机器人等，还有谁？'
