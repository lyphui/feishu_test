  文档内容正文: '南院大王

    2025-10-13 08:17

    面向下一阶段和四季度

    直接开门见山讲分析，

    第一，今天低开是必然的，大盘三个可能性，

    1，低开低走，杀出恐慌盘，这个概率小，双方都有点往回找拨了。

    2，低开，缩量拉升，比如拉个50点左右，突然下杀，恐慌放大砸盘，然后生产队进场护盘，这个概率最大。

    3，低开，放量拉升，反而不闷杀，直接快速V上去（盯好港股），尤其是之前的高位品种科技如达链高位大幅上涨，那就是生产队砸锅卖铁要反击西大给大家发红包（这个概率最低，不是没有）。

    上证会强于创业和科创的多。

    重要支撑位置在多少，3800左右，要抄也是那个位置附近，或者周二，或者分批次抄。

    其实猜大盘没有意义，

    【低开不割肉，有量能就不割肉】。

    【低开不是底，二次探底才是底】。

    第二，针对“操作型同学”来说，拿着不同品种人们的策略是不一样的，

    1，如果是拿着高位股，比如海外算力系列，消费电子系列，且跌破重要均线和平台的，反弹拉升不是加仓机会，是减仓机会。

    假如10.31的APEC会议谈的不错，又会企稳上涨，

    它们要调整，就是因为涨多了要消化。

    长线的业绩是有保证的，就比如旭创，26年业绩在210-270亿左右，

    你折算一下现在市盈率多少。

    2，如果是国产替代，自主可控，尤其是光刻机，半导体设备，图形尚未走坏，尤其是光刻机的，依然可以拿着，芯片和中芯系就看中芯国际，风向标，它扔你扔，他v你v。

    新能源之类也一样要调整，风电在里面稍微能扛下（如运达，金风，明阳）。

    主桌女方和部分男方高位股目前，短期碰到黑天鹅和海外下跌的一致性，周线级别的调整是较大概率，

    但你说它们走完了吗？当然没有，科技在调整完毕后，它们又有性价比了，然后又会创下历史新高。

    主线没有倒，只是需要歇。

    它们较大调整下来后，是机会不是风险。

    那问题来了，出来的资金去哪里？

    3，生产队会靠什么护盘？高低切怎么切换？

    你要看829那天，冲击3900是为什么失败的？

    生产队把银行保险砸下去了控温。

    这次护盘依然要靠大金融，那你可看新华，它也调整整整一个月了。

    之前为什么反复讲新手要配保险，勉强算是避风港，它股价涨了，你得到差价收益，它跌了，你有4%左右的股息率分红。保底4%，上面不封顶，这不好吗？

    4，那么弹性更大的题材上有什么切换？

    周末可能满屏都告诉你要去稀土，低位大消费之类，问题是稀土也涨太多了，老登股大多是垃圾，里面能看的并不多，-武的，工业方面两个，

    一个顺周期有色，化工。有色江铜北铜，金，核心是紫金，这都是说过多少回的，

    硬要找低点的有色，电解铝有神火股份，10多倍pe。

    化工，核心是万华。

    简单的有色50 etf，159652。

    一个是电力装备/智能电网，它们已经在中报体现出了业绩的反转，并且市盈率不高，在三季报行情可能很受益，如，我们讲过的特变电工，pe不高，且有新疆概念，AI变压器概念，海外业绩出现了拐点，再如平高电气，利润明显改善，且5，10，20，55日线粘合。

    许继电气，日，周，月均线多头排列。

    电网设备etf，159326。

    -文的消费，老生常谈，

    提神饮料，宠物食品，

    医美（就看弹性大的，水羊股份，女同学应该知道御泥坊）。

    猪，就是牧原和温氏（后者300）

    AI里软科技的软件和AI应用能不能走出来？尚不知，看资金的选择。

    5，20日的四中会，四季度的预期差要看谁？地产。

    没多少人敢给你讲消费的核心是地产，

    地产不起来消费都是隔靴搔痒，

    最优秀也最稳健的是滨江，它的业绩净利之类比同行好的太多，

    其他的新市民城投平台大家自己看，

    地产里唯一的20cm，特发服务。

    这些4中会前后可以看一个预期兑现。

    因为地产分歧比较大，所以绝对不追高，不给性价比不上。

    地产是主核的话，次核是谁？汽车。

    尤其是整车厂商。

    未来一段时间，市场会进入无主线状态，传统行业会占优，其余的包括什么石油，燃气，铁路，可控核聚变之类的，会乱舞一阵子，

    然后等到黑天鹅的消化，

    再迎来新的主线。

    有没有更简单的，恒生科技etf如果猛砸。那是出现黄金坑，

    也不用急着马上下手，等情绪宣泄一下最好。

    投资的过程，本身就是一个决策的过程，决策中什么时候你最容易犯错？

    慌乱的时候。

    所以【不要慌】，就成为这几天的核心指导思想，从容操作，宠辱不惊。

    那过些天呢？

    那时你回头再看， 原来3800也是低点。

    江风渔火对愁眠

    今天的走势，就是早上说的方案2，

    先低开拉升，看一下成色，

    然后下杀，制恐慌，

    生产队再入场轻轻一拉。

    如果你今天上午，

    -开盘没有割肉，

    -在3850前后，高位减仓女方主力，

    -再趁-3%左右的创业板，部分仓位加了男方或者打铁eft，

    那么，就已经是非常非常合格的操盘手。

    实际上你能做到其中一个，

    就跑赢90%的散户。

    因为你摒弃了恐慌贪婪的“情绪影响”，

    开始变得宠辱不惊，实事就是。

    光刻机和半导体设备风雨中飘摇，

    但它依然是市场的主线。

    之前几个拿了光刻机的同学那个慌啊，真是问的人都烦了。

    今天缩量，

    生产队并没有花太多钱，

    预期明后天村里继续发力。

    那时候主线才会继续加强，

    还是观点，你科技等11月再跑。

    中芯华虹，588200/710之类就不讲了，

    今天有没再次验证你跑不过etf？

    当时说江丰是供高手看的，

    为什么？

    从24年11月，到25年9月中旬，

    长达10个月的横盘，一个涨幅怎么够？

    你要真论杯柄，它就是一个超级大的杯。'
