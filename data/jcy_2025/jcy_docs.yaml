  文档内容正文: '分化和抄底方法

    市场的主线是科技，

    科技的新王是谷歌，

    谷歌ocs四小龙内部会分化，

    谷歌硬件今天也会分化，

    谷歌Ai软件能不能起来，就看今明天了，

    择善者强者从之。

    没赶上的怎么办？看下一次抄底的机会。

    通常说怎么抄底？

    1，强势股在20日线左右会反弹，这时的调整是日线级的，大约调整3天，震荡幅度大约6个点，激进的同学可以试探，抄起来之后，破5日平台就得卖，

