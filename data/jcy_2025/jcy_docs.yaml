  文档内容正文: '关于华工说两句

    关于华工（华工科技），说两句：

    昨天华工披露的业绩其实已经很好了——一个季度盈利4亿元，同比增长40.9%。在A股市场上，能达到这个业绩水平的公司有几个？它只是不够“惊艳”，被一众PCB（印制电路板）企业的表现比下去了而已。不过PCB领域的机会，咱们老早就反复提醒过大家了吧。

    现在看华工的市盈率（PE）也就45倍，谈不上贵。

    关键是什么？华工是华为最大的光模块供应商；而且华中科技大学是华工的股东，华中科大在国内通信界是什么地位？那是“扛把子”级别的，不然你以为武汉光谷是怎么来的？

    再说说华工科大（华中科技大学）在华为的地位：任正非当年是说服了华中理工大学（华中科技大学前身）的郭平，才开启了华为的自主科技创新之路。目前华为有三位轮值董事长都来自华中科大，分别是胡厚崑、徐直军、孟晚舟。孟晚舟上学时，有那么多学校可以选，为什么偏偏选华中科大？至于华为中基层有多少华中科大校友，就更不用多说了。

    所以你说华工将来会缺业绩、缺利润，会没有持续增长吗？

    1.6T光模块领域，旭创是不能卖给华为的，只能由华工来做。虽然华工现在做800G光模块都还觉得吃力，但怎么办？多投入、多攻克技术难关呗。

    还有个新闻大家没注意到吗？华工公告称，“全资子公司投资华工未来基金49%的财产份额”，而这个基金链接了华工科技中央研究院、九峰山实验室、光谷实验室、科研院所、高校等资源，重点发掘AI人工智能、机器人、医工融合、低空经济及产业链上下游等领域中的投资机会。这不就是照着“十五五”规划的方向来布局吗？

    所以有什么好慌的呢？当然，这不是买卖建议——有的同学可以参考这些分析，有的可以借鉴思路，市场上值得关注的好标的还有很多，不用只盯着一个。

    你说华工为什么涨不过旭创？这就像“校花”和“系花”的区别，各有优势，不能要求一个标的既具备A的优点，又有B的长处，还要有C的潜力，哪有那么完美的？

    现在大家都在谈1.6T光模块了，咱们早在6月6号就聊过这个方向了。

    互动交流（按时间排序）

    靠什么拿下4000

    靠什么拿下4000点？

    此前市场存在分歧、陷入冰点的主要原因，是大家对“靠什么拿下4000点”存在疑问。

    大多数公募基金、机构及主播都认为，需要通过“高低切”（高估值板块向低估值板块切换）、“雨露均沾”（资金分散布局多个板块），依靠顺周期板块和大金融板块发力才能拿下4000点，进而引发一轮疯狂的大调仓。但这个答案其实是错误的。

    上层并未理会这种思路，就连监管层里的一些人也会错了意。这也是此次不提“金融强国”的主要原因——你们的格局和高度还跟不上。

    之前跟大家讲过一个消息，新同学可能不太清楚：上一轮地方债务置换中，财政部一期拨付了2万亿元，你们以为这些资金是给了云南、贵州等缺钱的地方吗？恰恰相反，60%的资金流向了东部地区，仅江苏一省就拿到了3000亿元。

    上层的思路是“救急不救穷”，通过龙头地区带动后排地区的决心已经非常明确，把钱给低位（发展潜力有限）的地区，反正也发挥不了太大作用。

    鉴于今天可能会放开机构净卖出限制，且很多人踩错了市场节奏，这几天市场震荡可能会特别剧烈，涨跌幅度都会很大。相信看到这里，你已经知道该持有什么、该坚持什么了。

    今天的市场看点，在于代表“科技自立自强”的“寒王系”（某科技相关板块/标的）与代表“高水平对外开放”的“旭创系”（某外向型产业相关板块/标的）谁能有更好的表现。这两个方向都有催化因素：一个有10点召开的说明会，另一个有24-27号的会谈。

    那么，券商板块要不要先“支棱”（活跃）一把呢？

    强者恒强

    当你知道：

    你的选择是：

    A. 还是怕（不敢入手）；

    B. 扶一把（趁机布局）。

    “涨多了就要跌回去，跌回去就要涨上来”——这是典型的认知误区，是不懂行的博主和机构用来忽悠你的说法。

    涨跌互现、均值回归，只针对“好学生”（优质标的）。比如“校花”，本来能考100分，前几天因为和爸妈吵架发挥失常跌到80分，下次考试大概率还能涨回100分；但如果是个“学渣”（劣质标的），平时就考50分，怎么可能涨到100分？均值回归是“校花”这样的优质标的才有的机会，轮不到“学渣”。

    早上为什么还有调整？咱们之前也说过，是因为很多机构手里拿着一堆“杂毛”（非核心标的）和“老登”（传统板块/落后标的），这次调整是“调虎离山”，目的是让你交出科技板块的筹码——这其实是再次给你上车前排核心标的的机会。

    论预期：“旭创”（某科技标的）的业绩内幕、“考题底子”（业绩支撑逻辑）早就提前透给你了；

    论技术：“胜宏”（某科技标的）在55日线站稳5日平台，再加上PCB板块的利好刺激，之前也分析得很透彻了。

    为啥“老登”彻底不行了？你看昨天的公报，有提到传统产业，有说要怎么发补贴吗？基本没有，就八个字：“量力而行，尽力而为”。说白了，“老登”别添乱就行了，要想获得支持，得凭真本事，别谈什么预期和概念，这些都不会给。

    大家以为“老登”的核心是什么？是房地产和城投平台啊，要是真炒传统板块，最后迟早会落到这些领域。但上层是真的厉害，你得佩服这份决心和魄力——救房地产和城投平台，算不上真本事；敢不救这些领域，硬推自主创新，才是真本事。

    最后要表扬一下Amey同学：科技板块大跌那几天，她“赌性坚强”，梭哈了易中天ETF（代码159381），甚至把孩子的压岁钱都拿去布局恒生科技板块。这相当于在淮海战役血战大王庄时，把自己的通讯员、双需班、医疗兵、马夫、警卫连都派上去支援，这份决心和魄力，怎么可能不赢？

    大家有没有发现，群里的小姐姐们都很猛，杀伐果断、定力强，哪怕“寒王”（某科技标的）跌到1200元也能听劝不卖——谁说女子不如男！

    今天谷歌TPU（张量处理单元）的新闻才广泛传播，而我们早就提前聊过谷歌产业链了，昨天还专门给了调整机会，上车的朋友开心吗？

    现在“男方”和“女方”双向发力：“旭创”创了新高，就等“寒王”再超越茅台了。

    你说后面涨什么？再次参考今年4-8月的行情——机构回过神来会重新加仓科技板块，它们一天买不完，大家可以慢慢看。

