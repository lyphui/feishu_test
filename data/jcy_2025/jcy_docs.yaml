  文档内容正文: '9月高低位态势及切换研究

    昨天的文章，我们谈的是9月全局，其实管道到10月也没问题，宏大的叙事需要多读几遍。

    今天我们多谈点微观层面的，操作级。

    第一，

    目前市场的高位和抱团是什么?TMT。

    TMT是科技(Technology)、媒体(Media)和通信(Telecom)三大领域英文首字母的缩写。

    高吗？高。目前占到市场总成交40%，今天可能41%了。

    那是不是顶？暂还不是。21年新能源接近50%，机器人48%，年初deepseek45%。

    它目前还没冲顶，冲顶阶段才是最疯狂的。

    科技板块是确定的主线，即使周末人们认为要切换，我们依然认为是主线。

    科技板块版图，

    高位是海外算力和国产芯片。

    国产芯片原本是“四大低位”，现在涨了上来。

    1，海外算力

    “主桌女方”，易中天作为代表，带动一系列二线品牌，供应商和扩散。

    二线品牌比如之前谈过的联特。

    再如各种液冷电源，也是跟着抱团大部队的，光模块歇菜了，它们只会跌的更惨。

    高位看图形，图形没有走坏继续拿着，

    走坏标准为，直线大跌10%以上或者跌停，跌破5日平台、5日线下穿10日线、跌破20日线后3天内无法站稳。

    以上几个，结合45%的方向，即对应不同风控标准和安全垫。

    2，国产芯片，

    目前进入分化，补涨，扩散期，

    核心代表，是紫禁之巅的龙头被关注后，后面两家接棒。

    国产科技的核心当然是涨芯片，先把CPU，NPU，DPU那些涨完。

    etf不赘述了吧。

    补涨是扩散到二线ASIC，芯原，云天它们之类的，这里的同学们要注意，毕竟它们不像易中天有业绩，要会高抛低吸，猛涨几天要懂止盈。

    扩散是扩散到打铁的半导体设备等，设备里的前排是谈过的光刻机（可搜前文），打铁代表中芯国际，etf大家也知道。

    3，高位里的“相对低位”还有什么？

    -补涨-华为系算力（目前仍聚焦在PCB光模块的领域，涨的次序类似海外算力因华为在通讯领域优势，也重视交换机）。

    华为算力那些玩家谈过多次。

    -Asic的延伸，即soc/mcu芯片，其实兼备消费电子，现在它们也逐渐起来，不那么低了，只是相对华为低。

    -AIDC。这个是目前，“硬科技”里最低的，但因为前面没涨完，过来的资金一直不多。

    之前谈过高低切的原理，

    高低切，不是说女方切到男方，一轮切到另一轮，而是说板块内部会自己切。

    宁肯照顾自己人都不便宜外人。

    4，绝对高位板块有可能切到哪里？

    -创新药，看好及etf讲过。

    -机器人，同上，我们讲的领头荣泰，拓普都表现不错，有个20cm的是震裕。

    如果以大为美，就是汇川，可能慢点。

    -新出现的科技热点，涉及到算力。

    创新药一直是机构抱团，机器人身位略偏后。

    有国队操盘，目前我们看到的情况，是之前的那篇文章“健康的上涨”。

    高位≠风险，低位≠收益。

    高位里的切换比较平滑，绝对高位到绝对低位里的切换也比较平滑。

    第二，

    绝对低位的看点，

    1，电池大白马，弹性是固态，

    2，消费大白马也谈过多次，

    3，化工，看大白马万华就行了，你胆子大看液冷制冷剂。

    4，有色，就看铜，新能车，人工智能都要大量用到铜，金铜比，现在历史低位。

    绝对低位，对操作选手来说，逢低入你最多搞1-2个就行了，仓位可以有，不能过大。

    绝对低位是你的“配置方向”，用来盯着市场，对冲下跌，或者给你搞后路的。

    如果风险偏好比较低，那是要加大绝对低位板块的配置，毕竟是趋势所在。

    极保守的另当别论了，同时稳的etf不少。

    到时候有没到顶有没剧烈切换，我们会提醒大家的。

    ps，仅为学习，不要总问来问去白马们都是谁，再可请参考前文《大资金在买什么》。

