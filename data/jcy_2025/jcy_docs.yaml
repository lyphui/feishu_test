  文档内容正文: '中长短和超级均线的应用方法

    这是当时一篇价值若干百万的原创智慧，给大家的分享，国外的有些量化机构，就是把这个拿去操作市场的。

    既要又要，是人的本性，

    其实我们已经讲过了5日10日线上下穿，强势股的20日线反弹，55日攻势线，60日线走熊等，普通人用就够了。

    5日平台用于核心龙头股和etf非常好用。

    奈何有些人，既希望搞产业投资，又希望搞些操作，希望1+2，既要第一种，也要第二种，

    尤其是喜欢看那些不那么充分博弈的，不是龙头和后排的，补涨的，就把当年我们给老外的技术课程讲给大家。

    之前讲过154超级均线有同学是知道的。

    首先，大家要明白斐波那契数列，这是人们观察自然得出的规律，窥见的高维世界密码。

    比如，树木在第一年长一根枝条，第二年新枝条休息，旧的又长一条，第三年，新旧一起萌发。

    这就是(1,1,2,3)。

    道生一，一生二，二生三，三生万物。

    这个数列，是后面的一个数字，是前两个数字之和。

    第二，

    我们在股市中最短的周线是5日线，

    那么，5的斐波那契数列就是，

    5,8,13,21,34,55。

    1，看到这里，你是否明白了大王讲的，为什么强势股会在20日线出反弹？其实更精准的是21日线。

    2，在此之前，机构看牛熊的标准是60日线，其实包括现在也是。

    大王在2015年前后时，给机构讲课和大力主导的是55日线，当然原理没有告诉他们，很多机构稀里糊涂就用了。

    3，那么我们已经明白了，

    5日线，热门与否，

    20日线，反弹与否，

    55日线，攻守与否，

    60日线，牛熊与否。

    4，根据斐波那契，我们设置6个均线，

    （5，8，13）（34，55，60），

    5这组，叫做短期，55这组，叫做长期。

    均线设置会吧？

    第三，设置完后，你再看个股。

    1，长线组和短线组向上粘合时，发生了什么？是不是开始上涨？

    一旦长短均线组相交且形成向上趋势，34日线是否长期成为支撑？

    牛市时，大盘是不是可以击穿20日线，但在34日线却轻易不击破，要么大阳，要么大阴，要么长下影线？

    有没人告诉过你34日线的秘密，这是生产队级别的。

    现在的上证是不是这样？

    你再拿几个大牛来看看，比如特变，阳光？再如，超级大牛安费诺？

    2，当跌破长线组时，发生了什么？是不是步入下行通道，熊市时，是不是被34日线牢牢压制，价格上沿顶着它走？

    如图，是2023年的上证，又如，今年34月的英伟达？。

    3，当短线组拐头向上，突破34日线且和长均线组几乎相交时，是不是买1位置？当和5560日相交，是不是买2位置？

    4，34日线（绿线）是不是起到了警戒风向标的作用，先于上涨而拐头向上，先于下跌而拐头向下？

    5，对于博弈没那么充分的个股来说，是不是一旦击破了34，就容易往55日线去，而强势股通常在55日线会反弹，这个区域是不是就成了博弈式抄底区域？

    6，是不是越强势越优秀的票，越是线条清晰，长短均线组距离分明？越是弱势的越杂乱无章？

    是不是上升途中的票，你根本不需要任何操作，直到短均线组下穿34日线？

    是不是下跌趋势途中的票，也不需要任何买入和救它，尤其是55日线站不住跌下60的，直到短均线组再次上穿34日线扭转趋势？

    用了这两组线，你发现是不是能看的东西很少？有些人总是希望操作的非常精准，操作能赚中小钱，真让你赚大钱的是选股，选股比操作难100倍。

    相信很多同学看了这两组均线，再对照下自己拿的和大牛股，已经能看出很多问题了，可以把心得发出来。

    涉及到学习学习内容，早点发，

    未完待续，

    同学们自己研究，先有感性认识。

    三生万物，超级均线组理论与实战（中）

    再发一遍看看，

    早上你已知（5，8，13）短期均线组和长期均线组（34，55，60），

    当长期均线组呈拐头向下的趋势时，

    通常是下行通道，这时候会被34日线压制，这时候不能进，也不能补仓。

    1，见图一，

    寒王在绿框位置（写1的地方），长期均线组下降，常期在34日线以下，这时候不能买。

    什么时候可以进？图一（写2）的地方，短期均线组拐头向上，上穿了34日线，又重叠了长期均线，这时候买1买2是买点。

    2，两个均线组金叉向上后，通常会迎来主升浪，这时候基本不操作，操作会卖飞。

    3，等它一路向上，直到真正跌破第一个5日平台，比如寒王的1595。

    4，跌破第一个5日平台就要减仓，待到20日线以后，可以博一下20日线的反弹，通常都会反弹成功。

    5，20日弹上去后，通常会做双头然后再下降，直到再跌破一个5日平台，这时20日线挡不住，会直奔34日线以下去。

    6，34日线以下，55日线以上，是“博弈抄底区域”，图一，（写3的地方）。

    如果这时平台站不住或者跌破60，视为抄底不成功。

    龙头股一般不会给你跌穿，甚至不往55去。

    7，55日抄起之后会继续反弹，直到反弹后上升的5日平台跌破，再一次跌穿34，去寻找55甚至60。

    图一中写（3）的地方。

    8，这时候有修复需求的，博超跌反弹的，就会入场，客观造成两个均线组往重合方向走，这里又形成了买点。

    今天的典型案例，是天孚，见图二。

    6条均线几乎相交，

    寒王也差不多。

    各位发现没有，冲到一个头部位置，5日平台稳不住之后

    -先是跌破20日线拉一下，

    -再是跌破34日线拉一下，

    -拉起来再跌破34日线探的深一点。

    三卖三买，基本是三重底。

    尤其是在34-55日这附近形成一个w双底。

    目的是什么，筹码充分交换，

    最后等两个均线组的价格都差不多了，5日8日和55日的价格差不多，就是粘合。

    也就是大家成本都差不多了，想走的走了，不想走的不走了。

    就可以决定下一段走势了。

    【大部分散户都是在这里出问题的，跌下20买了，赚了，加仓，没想到跌下34，又卖，结果55反弹，再买，结果又跌到60】。

    （请注意，强势龙头，通常在跌下34以后，不一定搞W型双底的，它的显著特点，是第一次跌穿34日线后，会给你拉到一个超越前期高点的位置）。

    很多弱势的双底扛不住，就得去60日线下方建立抵抗阵地，形成一个小箱体了，如果这都不行，长期均线组直接拐头向下，就得周线一级时间修复了。

    那么，如何知道主力在顶部什么位置出货，什么位置又会来试错抄底呢，

    请在软件里“指标参数设置，找到“偏离度指标”, BIAS, 统一设置成, 55, 55, 55。

    有些聪明同学看BIAS线，

    已经看出问题了。

    你再拿其他强势股看看，有谁在均线粘合，有谁在一路向上。

    周末有时间的同学可以多研究研究，把你看好的框一框，

    明天跟大家讲乖离与机构买卖逻辑。'
