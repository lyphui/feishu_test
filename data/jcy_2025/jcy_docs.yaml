  文档标题: Vol.251109 三生万物 (下)超级均线与偏离值的应用
  文档链接: https://my.feishu.cn/wiki/X5eDwIPDoiqer3kuSRnc0CBmndb
  文档内容正文: '南院大王

    2025-11-09 11:17

    中国佛教有八大流派，

    -禅宗没那么多讲究，谈顿悟的，放下屠刀，立地成佛，

    就像产业投资流。它不看k线，做的是不断去弱留强，越来越聚焦几个核心股，完整走完一个牛市周期或者长期拿住。

    -简单纯粹的净土宗，就念一句“南无阿弥陀佛”就能成佛。

    这就是我们讲的，新手菜鸟流，保险+etf的定投，真要在5日平台上操作，就是站稳拿着，跌破走人。

    真准备进阶搞个操作个股，5日线上穿10日线击鼓进军，5日线下穿10日线鸣金收兵。

    -律宗讲究严格的清规戒律，看起来难，学会了程式化，成就也会高，就像我们讲的均线组流派，也是日常讲的操作流，喜欢抓一段主题的，做t的。

    我们已经学会了看超级均线来决定中长期走势，

    比如迪子，被长期均线组压抑，死活无法突破34日，没必要看，它也会连累汽车板块。

    那么，

    如何怎么看主力机构的买卖逻辑和方法呢？

    看乖离值。

    它也叫偏离率，这是现在的价格，和市场充分博弈（或者天道规律）的公允价值之间的偏差。

    通俗点说，我们就是看现在的价格，与55日价格的偏离率。

    偏差越高，说明越失衡，进入超买。

    偏差越低，说明越回撤，进入超卖。

    1，一般来说，那种图形是长短均线金叉向上的，图形还算干净的，相对好一点的优质公司，偏离率多少就算高呢？

    50。

    一旦接近超过50后，且跌破5日平台，且前排龙1涨不动了，即可止盈或者卖出相当部分。

    机构通常在这个位置就开始半仓卖出或者轻仓。

    比如液冷里面，飞荣达，还算可以的，二线补涨，乖离值53就开始回调。

    2，那么行业里的龙头呢，什么时候该看了？

    偏离值呢？100。

    这就是前排和人气带来的溢价。

    同样是液冷，英皇是老大，它可以到偏离到102。

    那么，若你拿的龙1，在乖离接近100时，在市场分歧时，一旦跌破5日平台就要止盈部分或者减仓。

    有些七八十的呢？不跌破，你就继续拿着，比如dfd之类的锂电材料，已乖离71了，但从不跌破5日平台，那可能奔着100去，跌破你再走人。

    3，前后排的差距你可以再看，做芯片的紫禁之巅，寒王龙1，偏离值可以到118，海光乖离

    芯原呢？乖离到79。

    也就说，龙1极限乖离到100，龙2在70左右，后排补涨在50左右。

    你看到还有很多乖离20，30就跌下去的，线本来就很乱，说明做多力量不强，不适合长拿。

    4，有什么调整的规律吗？

    通常，强势的龙头股会在跌到一半，比如乖离从100降到50时，有一波抄底的人，有个反弹，再向20-30%乖离又高了，抄底的卖出，继续降值。

    或者你通俗理解，第一次乖离值过高，跌破5日平台你止盈后，下一次的机会是20日线左右炒一次底，如果拉升拿着，跌破5日平台后继续卖出，等它再一次跌破34到55附近。

    （这条不建议操作基础不佳和手不快的参与，如果龙1乖离值超过100且跌破5日平台，基本说明主线风格切换或者暂歇）

    5，如果你拿的品种，乖离值已经变成负数了，说明超卖，如果它同时在60日线前后站稳5日平台或者有一个小箱体，

    且长短均线组有粘合趋势，那么可以试错性买入了，如果这时，这个位置附近还是筹码峰集中区域，安全性更高。

    以天孚为例，高峰期也是乖离120的大牛，前几天跌到了-6.9说明严重超卖，

    且155块前后，已经是其筹码峰最后的阵地，再跌就得去寻找120左右的支撑位，主力趁着传言先拉起一下。

    上升与否先不说，颓势止住了。

    当然，上述只是纯技术的均线，一个东西的涨跌，是多种因素的结果，比如政策，资金，消息等多方面，

    还是那句话，操作流，

    就不能一根筋刻舟求剑，催化层出不穷，多空随时转变，买错正常，卖飞光荣，

    关键是心态不能乱。

    道天地法将，考虑的要素越多，决策越科学。

    类似于这种，长短期均线金叉向上，乖离值不到20不高，能不能大走出来呢？看产业催化和龙1带动了。

    其他类似的图，同学也可以找。

    以上所有仅为教学，均不构成建议啊，多看几个，自一目了然，以后会自动参与交易了。

    还是那句话，念啥经都没能成佛，啥流派最终都能赚钱，只要你稳住不横跳。

