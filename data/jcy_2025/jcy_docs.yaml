    93之前是慢牛

    昨天的几个大事，

    一是好几个上市公司的高管被留置，

    批量出来，就代表这只是开始，要集中整治。

    二是天风小雅被窗口指导，她连夜把群给解散了。

    无一不透露上面的意图，要慢牛。

    不然这么搞下去，市场放量到3万亿，会冲击3800点，走疯了又一地鸡毛。

    确实要指导一下，比如小孙，她一个电新研究员，不去搞固态电池，天天在群里吹AI，

    大王好容易给后面大家发掘的液冷，小雅上周各种狂吹，搞的集体高潮，本来的慢牛节奏给乱了。

    那后面会发生什么，进一步的高低切，

    高位依然扛着，但有部分止盈资金会往低位继续切，

    低位有哪些，系统性的之前多篇谈过，这里零散的谈几个，

    比如，

    -国产芯片不高不低但位置靠前，ASlc那些老玩家们都知道，内部也逐渐有资金进入低位，

    这里的etf老生常态588200,

    国产AIDC不算高吧，被骂成弘狗的弘信，讲它低是2字头，现在3字头，还补上了缺口，这轮AIDC带头的看似是协创，同行的还有奥飞，块头看似大点的润泽等等，

    -华为线不算高吧，这也是最近的热门，新老玩家圈子探讨过多次，有个不那么贴合但还行的etf560360。

    -AI应用不算高吧，GPT5 不及预期后，几个核心在20日线都拉了起来，如果中报的雷期再过去， Ai应用不能说一马平川，起码会还有一轮大行情。

    这就是为什么新手菜鸟更建议搞ETF,Ai 应用这轮调整，如果那时候你拿的是我们说的软件龙头ETF，你起码8个点的利润。

    -消费更不高吧，白酒食品之类当然有机会，但长线价值不大，那么游戏，谷子经济等，是必然要起来的，你见过哪轮牛市不带消费的。

    昨天港股ppmt的业绩很好，这两天游戏新消费之类按理要表现一下。

    机器人不算高吧，轻量化涨过了，电机和减速器还在低位，作为一个未来5-10年才能兑现的东西，它的EtF更适合定投。

    -反内卷就更不高了吧，比如阳光电源，捷佳代表的光伏等，昨天工信部还开了个高规格的会，阳光电源的逆变器，也是有机会进算力中心的。

    之前我们讲倒车接人的机会，这些低位板块之所以低，都是因为有些瑕疵，中报过后，它们起来才会带着大盘一路上涨，

    不然新进入的资金去哪？

    我们还是那句话，看高做低，

    高位看图形，低位看逻辑，

    高位图形没有走坏，你就继续拿着，

    低位逻辑只要存在，它就迟早有机会。

    不然新进入的资金去哪？

    我们还是那句话，看高做低，

    高位看图形，低位看逻辑，

    高位图形没有走坏，你就继续拿着，

    低位逻辑只要存在，它就迟早有机会。

    如果你说，你属于新手菜鸟，连图形都不会看，什么叫跌破支撑位，跌破5日平台不知道叫什么，MaCd绿轴也不知道意 思，那就踏踏实实去搞ETF，90%的人跑不过指数。

    同样我们为何也不建议新加入的同学就问东问西，各种买入，你起码花3天时间，把文章，问答等的内容一直看到6月初，

    看到这轮机构驱动的牛市究竟是什么逻辑。

    而不要着急忙慌，各种摇摆恐惧。

    你差那点时间和沉淀吗，3天能走完的牛市不叫牛市，3天能跌死的股票也不是龙头，你想买有的是时间。

    既然上面要的是慢牛，那你就得给自己调一个慢赚的预期，

    这才哪到哪，我还没给你讲牛市多暴跌呢，大盘跌10个点你受得了吗？

    4.7 号不是跌7个点吗？

    没给你说就算21年的光伏，也曾经跌了一整月，龙头 -30%。

    更没给你说，存款搬家才刚刚开始，美联储还没降息，东大还没降准，最大的那个利好，10月那个大会没来呢。

