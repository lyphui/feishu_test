    量价关系与几个案例

    所有的价格，本质都是量能的最终反应，

    是量能运动的结果。

    所以，量在价先。

    今天量能在1.7万亿，

    高峰期是3.5万亿，已经不到一半。

    所以这个角度说，量能已经接近见底。

    如果未来几天能到1.6甚至1.5更好。

    后面的价格即使再波动，也差不多了。

    最后讲两个《三生万物》的案例，

    一是太辰光，经历了4周以上的调整。

    11月25日，5日线上穿8日线，量能25亿，相比最近8亿9亿成交2.5倍以上，明显放量，

    11月26日，昨天，盘中收复34日线，放量到28亿，

    今天大涨，主要也受到科技催化，太辰光是康宁的一供，间接供货谷歌，

    另一个长飞光纤也差不多，25日，收复34日线，也有谷歌光纤概念。

    讲这个并不是要大家追高去买，而是学会看买点抄底结构的几个要点，

    一是图形，得走出样子，

    二是量能，不能太小，最好比低点盘整期高2倍以上，

    三是要有空间，最好调整出了部分上升空间。

    四是要有催化，有信息有政策，市场的注意力吸引了过来。

    所以各位，当热点切换过来，前排龙头打开了高度，你又下不了手，可以看技术图形和量能，博一下预期。

    或者提前看好有关图形和储备，一听到较大的消息或者政策，手快动起来。

    同学们学会了吗？

    可以再看什么呢，创新药。

    有些已经图形有点端倪，

    但量能不太够，看先走出来的。'
