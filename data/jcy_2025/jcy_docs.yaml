  文档链接: https://h160bxy8czl.feishu.cn/wiki/JuSpw2hAMia0eJkKj3BcEXx5n6g
  文档内容正文: '总有人找大王说，

    搞点什么项目，发发财。

    现在全世界最大的项目是什么？

    西气东输，西电东送，西方资本到东边套利。

    你把这几件事情连起来看，

    1，美联储降息后，东大推出系列吸引资本的动作，股市大涨。各路人马有了“中国资产错失恐惧症”。

    2，美联储忽然说自己有点后悔了，不应该降息，甚至重返加息。

    3，日本也不配合了，岸田撂挑子了，石破说日元不加息。

    于是:

    4，石破在大选中丢掉国会，日本央行重新表态，考虑加息。

    5，美国非农就业人数大跌，预期11万，实际只有1万，降息的变的非常迫切。

    6，美国军方表态，不支持川普。

    伦敦，日本，HK，是全球外汇交易的重大市场和热钱通道，英国外相访华，中日货币互换，都报道的非常低调，

    外国人投资A股的限制大幅放开，他们第一站在哪里？通常是HK。

    还有一个大家没有关注的新闻，

    这条路径你可以理解大佬们的操作，

    2024年10月10日，巴菲特再度于日本发行债券，当年发行的日元债总额达到5451亿日元，创历史新高。

    他发日元债的目的是什么？

    抵押债券，换出日元。

    换了干吗？买了点日本股票，比如五大商社，但已经买的够多，没有显示增持。

    那他赚了吗？

    巴菲特在美元比日元1:120时，买入日本股票，

    日元跌到1:160，巴菲特亏40块汇率差价。

    那点股票增幅，还赶不上汇率贬值。

    各位，发债是要评级，要抵押，要风控的，巴菲特不能拿刷脸发债。

    巴菲特日元债的抵押物，是他在的美国资产。

    你可以理解为，巴菲特抵押美债、美元存单等，换出日元。

    所以，日元升值，美元贬值，大A和港股下跌砸出空间后，老巴就能一鱼三吃:

    1，通过日元升值或者RMB升值，吃一道汇率差价。

    2，换出RMB或者港币进入资本市场，吃一道资产升值。

    3，还入在本国借入的美元抵押或者贷款，吃一道本币贬值。

    到10月20日前后，巴菲特已经连续多次抛售苹果和美国银行，手里捏着3250亿美元的现金。

    折合人民币2.3万亿左右。

    巴菲特在这次大选中说，他谁的队都不站，

    这就是美国中间派的想法。

    不管你俩谁上，都别碍着我赚钱。

    局都布好了，只能按进度走。'
