    七月的科技继续回归

    今天是半年报最后一天，之前银行为什么加速，周五为何回落？

    很多公募和机构为了业绩满一下仓，然后再回调，按照募集说明回归本业。

    同时银行也要分红了，当下股东，拿完红利就跑。

    所以今天看谁还在涨，看谁被卖出，基本决定7月方向。

    因为懂王即将访华，彭博讲500亿刀半导体大基金三期要落地，因此科技有往继续归来。

    1，海外算力链，依然看好，直到中报。两边外贸缓和了，

    还是看PCB、光模块和电源。

    之前是PCB较猛，前排的胜宏生益涨过后，后排的景旺，东山之类补涨，光模块依然有机会，易中天他们1.6T、800G、 400G 的涨，后面各种200G,50G
    的都在涨，

    被资金同时关注到的是电源，海外以欧陆通为代表，国内的是科泰电源和中恒电气等，趋势有，不够明确。后备的是液 冷。

    目前的前排高度虽然已经涨了3-50%左右，但高度并未完全打开，打开后看延伸，这块要盯盘，前后排和几个板块是轮动 的，今天这个涨六七个点，明天那个涨五六个点。

    2，国内的科技，主要集中在半导体设备，考虑到摩尔线程，盛合晶微等都未上市，科创半导体etf588710可能更贴切。

    进一步就是国产算力的板块，华为的光模块是华工科技，电源是科泰，其他的同学们自己挖掘。

    同时，谷歌的TPU开始给openAi供货，TPU即中国一直努力的ASIC方向之一，ASIC芯片是老朋友了，代表就是寒王、芯原 那么几家，有望熬出头。

    博创同时也为ASIC搞光芯片封装，广合科技为其做PCB，锐捷网络做交换机。

    国产纯正TPU概念是没上市的中昊芯英，科德教育和浙数文化有投资它，但目前没看到资金介入迹象。

    总之从中报角度，N系海外算力的业绩可靠性更佳，虽然弹性可能已经略小。

    稳定币今天可能要部分调整，美股的circle跌了，但整体肯定没走完，它是个政策和情绪催化。

    其他板块可参考前文。

    不用太担心大盘，30年季线上升趋势，15年收敛结构的末端。

