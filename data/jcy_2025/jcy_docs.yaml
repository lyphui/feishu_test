    健康的态势与下一阶段判断

    早上讲了3条路线，93要稳，

    于是生产队今天选高低切的（2），

    保险上来都给你拉涨停了还看出要怎么要承接么。

    这里先温习下一体两翼，双轮驱动理论，

    一体：大金融（银行/保险/券商）

    两翼：高科技与反内卷/大消费。

    过去，

    长期靠高科技在走，再拉会吸血不健康，

    所以今天的选择是高低切，

    一体的保险搭台，

    拉起了之前讲的两个绝对低位：反内卷与大消费。

    操盘也很漂亮，

    高位的，低开拉上去，

    低位的，平滑涨起来，

    高位的代表天孚，继续猛涨，

    低位的代表之一宁王，“不服寒王”。

    当时我们坚定看好宁王，讲了两个逻辑，

    “它非常低估，仅20倍pe，比港股便宜30%，且韩国LG50倍”

    “它不超越10月8日高点，怎么叫牛市呢”?

    后来又补了一个，

    “外资在大量买入大白马”。

    这背后就是逻辑，

    我们一再很大家讲最核心的，就是逻辑。

    包括创新药，这几天杀成什么了，昨天我们坚决的说没问题。

    之前说，中不溜就看的机器人，尤其有特斯拉概念的，有同学埋伏几天，也起来了吧，荣泰早早涨停，拓普也非常不错

    那么后续会发生什么？

    1，双轮驱动，

    另一轮（绝对低位）的动力可能强一点，推动指数上行。

    反内卷，大消费之前谈过多次。

    其中亮点，是前文讲过的外资喜欢的大白马，可以往回翻。

    当年有记忆的同学，请想起“核心资产”。

    2，科技会停吗？

    不会，有往机器人，创新药上切换的趋势。

    其余的算力等，只要不是太垃圾没业绩，不用再问来问去，调整几天，它就又上去了，逻辑没有变化，牛市并未走完。

