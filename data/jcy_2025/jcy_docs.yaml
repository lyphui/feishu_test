    反内卷

    昨天晚上收到好几个邀请码去开会，据说机构一晚上开了20几个反内卷会议。

    我们用最卷的方式反内卷。

    在股市上的反内卷是什么原因？

    我们提过的索罗斯反转：当逻辑反转的时候，最差最烂的板块先反弹。

    最卷最惨的是光伏，所以它先涨。

    涨不涨跟业绩没关系，涨的是预期。

    那它不会是一日游，不会。

    是不是反转？也不是。

    叫做超跌反弹。

    为什么反转不了，当年的钢铁煤炭是国企，现在光伏是民企。

    那会有地产外贸，现在有啥？

    反内卷如果成为一条支线，甚至同花顺出一个“反内卷50”，就会从光伏扩散。

    卷的领域都有啥，光伏，锂电，玻璃，汽车，水泥，化工等等。

    昨天讲的风电，卷界排前三。

    所以，如果你缺乏技术和手速，不建议去搞光伏，真反弹也不会一天结束，反而可以等支线起来看扩散。

    或者踏踏实实看中报业绩板块。进群加微信：2818363845

    或者某券商首席跟大王讲的，发电更稳在力推的是核电，还不如看核电钢。

    下一步反内卷可能的进程是什么？

    各省纷纷召开反内卷的会议，然后你再看该省的反卷公司。

    这种地方响应，正是我们昨天说的“基本盘”，不是自己人谁愿意卖力给你做事，

    你要反卷，就得管人家吃饭就业，难的。

    去产能能惨烈到什么地步，中报概念跟大家提的牧原，各省财政，城商农商行在背后挺着，上市公司几百万头的杀猪，烧钱烧了4年，中小养殖户缩减了60%，大龙头雏鹰直接死了。

