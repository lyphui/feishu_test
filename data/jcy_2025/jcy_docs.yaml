  文档内容正文: '先贤的智慧看11月有利板块

    昨天美股科技也涨不动了，

    美光之类的存储也大跌，

    丙戌月即将结束。

    戌，是火的墓库，硬科技新能源休息了。

    11.7-12.7日，

    中国历丁亥月，

    今年是乙巳年，月份里又有个亥，

    巳亥相冲，水火剧烈冲突。

