    只有充分交换筹码，才能酝酿下一次机会。

    后面当然可能还有余震，甚至不小，但是大的这个阶段性调整差不多了，盘整盘整，又会上去了。

    5，但要过于担心后市吗？不需要，一次出清和跌完是最好的，市场最怕软刀子割肉的阴跌。

    这次跌，出清那些摇摆的，看空的，心理素质不行的，

    否则，人家凭啥带你富贵呢？你都不坚决。

