  文档内容正文: '南院大王

    历史新高

    新华又新高了。

    从第一次提它啥也不干稳稳15个点。

    你还不用担心它暴雷。

    市场的上涨，主要是由那些体量很大，成本很低，而又耐得住时间的资金决定的。

    在全世界它都是保险。

    之前的银行是险资买上去了，股息率跌到4.0%左右，它们肯定要买自己，这就是保险上涨的长期逻辑。

    回到大盘，双轮驱动切到科技，PCB有记忆和筹码能涨很正常，没有套牢盘又业绩炸裂。

    主力就是后排的景旺东山等，昨天有同学问的鼎泰弹性很不错，今天胜宏一涨，你就知二线肯定要跟，电子布和铜箔也会继续。

    因为有之前的同学埋伏，所以我们会讲 海外算力即使中期高点也不是长期高点。

    新同学再追PCB就不划算了，明天看CPO 和铜缆有没机会。

    位置更低的当然是国产算力，低位的不再下跌，就云酿着向上的，力量，

    市场就是在：

    -PCB前排/后排/零部件，

    -光模块前排/后排，

    -海外算力的前排（前者与铜缆电源液冷交换机。）

    -海外算力与国产算力之间切来切去。

    当天埋伏了没收获正常，

    念任何经都能成佛。

    别学永信，五行坚定。

    海外算力，游戏，军工，创新药，都是机构打造的牛市。

    后面3个ETF不比你折腾个股收获小。

    更稳健的不还有保险和创业板ETT.

    新华是标准的波浪理论123,

    另一个金融科技也是，

    美中不足的是，它受券商的影响很大，券商如果齐头并进，大面积飘红，他的弹性一定是最强的，这时就拼手速了。

