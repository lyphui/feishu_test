  文档内容正文: '早上忙别的事情没看盘,今天的下跌可以预计,毕竟昨天该涨不涨则为弱。

    然而,市场放量快2000亿,这是好事,说明很多散户或者机构扛不住卖了,杀出恐慌盘大家才能继续轻装前进。

    放量,也说明有承接盘了,买的人和卖的人看问题角度不一样。

    下午如果放的更大一点更好,比如放量到3000亿,4000亿。

    吵架这种事,一次性吵完最好,磨磨唧唧的最烦人。

    情绪过后,大家才能恢复理性。

    你对象强烈情绪和急火攻心的时候,什么事都不做反而不是最差的选择。

    不要冲动,冲动是魔鬼,有多少人是和当年自己很爱的人大吵一架分手,然后又后悔的。

    后面等大盘企稳即可,如果你拿着好公司不用过于担心。

