  文档内容正文: '等待19日

    周末的整个消息面是偏利空的，

    美股不景气，Ai泡沫论盛行，一大堆减持，

    和本子这一出，

    影响本就首鼠两端的大资金。

    于是，很多人普遍看空。

    这种环境利好什么？各种题材概念，海峡军工。

    对日battle,

    可能要比对美battle的时间要长。

    还是来说说几个产业，

    -锂电与材料，

    宁王的黄世林减持100多亿，

    都认为这厮是逢高套现，

    他21年起就不怎么管事了，干啥去了，搞储能，亏了一堆，拿钱去继续干储能。

    储能已经是新的一个风光储周期，

    替代的是过去的新能源车。

    我们认为，宁王之类的砸下来，

    会是又一个黄金坑的机会。

    先观望两天，等它们企稳。

    电池etf很多，只要持仓没有比亚迪均可。

    可以关注的是562880.

    -出来的资金可能去哪里，

    弹性大的，可能会是之前讲的pcs，你百度或者查下就知道，上能，盛弘那几家。

    求稳的，大概率是那三家光伏，其中以TCL中环带头，毕竟第二增长曲线是半导体。

    图形上，光伏大的票长期均线组向上，趋势并没有破坏。

    储能为什么是一个新周期，昨天隆基正式收购了苏州精控就是证明，

    其实早年我一直想把精控卖给CATL.

    今天观察pcs和光伏，就能看出资金的态度。

    这里依旧能看有磷矿那两家，

    云天化，兴发集团。

    不光是它们的磷酸铁锂能做储能，

    日本的磷肥90%都是进口。

    至于国联水产，高手们自己看。

    -还有同学们关心的科技，

    最大的问题是集中度过高，

    本轮最高是从9月24日的41.32%,

    11月14日大约在26%左右，

    起码也是风险释放进程过半了吧。

    就看11月19号左右的“中考日”。

    真要是当强不强则为弱，跌破中期均线组，操作流玩家你大不了先走来年再战。

    巴菲特等人都在大举买入谷歌，既有卡又有应用，还有生态，它可能领涨新一轮硬科技。

    之前谈过国内最像谷歌的，就是阿里。

    -鉴于4000点上下反复拉锯，有仓位的可以继续空着观望，

    会玩同学可以去搞创业板50etf上证50之类，大幅低开是机会，大跌2-3%在尾盘时都是机会，分批买入，拉高或者反弹一把卖出。

    这不让暴涨暴跌吗，套利的机会。

    虽然利空较多，但不用过于悲观，被几百枚核弹头描着的是本子而不是咱们，

    已经一米大八个的小伙了，心里上总要成熟起来。

    既然涉及到日本的问题，

    用教员当年的理念解释，最妥当不过了。

    既不会亡国，也不会速胜。

    最终的胜利终将属于我们。

    不知道有什么好恐慌的，

    难道现在比1937年还差？

    拥挤度进一步降低

    8月27号日，

    市场成交额31970亿，TMT板块日成交额1.39万亿，约占当天市场总成交额的44%.

    现在TMT板块日成交额大约5900亿，约占当天市场总成交额的29%.

    TMT,9月24日机构持仓占比41.32%，11月14日大约在26%左右，

    拥挤度，集中度的问题，双40%的问题，不能说完全解决，起码进程过半。

    后面就看谁是产业资金谁是投机资金了。

    我们在9月下旬讲谷歌链有接棒英伟达链之势，

    周末消息爆出来巴菲特建仓谷歌，

    老巴是看懂了Ai平台是新时代收费站。

    今天科技反击的龙头也是谷歌链，尤其是ocs交换机。

    如果周三英伟达业绩不错，谷歌和达子双料供应商会带动修复。

    会不会炒新不炒旧，不知道，

    但是，又到了新能源占比超过30%，拥挤了。

    机构们真累，切来切去。

    现在的创业板，

    要么涨宁王系，要么涨英伟达系，

    要么跌，你选一个？

    其实你拥不拥挤，一点都不关企业价值的事。

    今天游资打造的噱头股另当别论，

    军工冲高回落，说明机构资金已经逐渐对题材不感兴趣了，你说它们会去哪？'
