    说是2000年0时0分，出生的姑娘，心源性猝死，忽然就没了。很好的人，可惜啊。

    这种八字都不用看，千禧年之交，如此大的能量切换和时刻，   一般人担不住。

    所以啊，过的洒脱一点，

    80多年的景区旅游，要好好体会，

    可以认真，不要较真。

    留三分贪财好色，以防与世俗格格不入，剩七分一本正经，以图安分守己谋此生。

    露三分茫然无措，以瞒天地人泯然于世，

