  文档内容正文: '谷歌系延伸与入口之争（下）

    上周谈端侧给小丸子讲，可以查一下AI眼镜的最近催化。

    华为：

    11月28日，华为陪聊机器人开售；

    字节跳动，

    12月10日，AI手机预计发布；

    理想汽车，

    近期发布AI眼镜，备货20万；

    12月底，

    三星、百度、360等AI眼镜发布；

    昨天出现端倪的，是AI眼镜代表端测，本质还是一场“入口争夺之战”。

    当年有小度音箱，现在有AI眼镜。

    AI眼镜/手机叫做端侧AI,

    整体是板块是整机，模组，芯片。

    整机是给字节代工的中兴通讯等，其他的如博士眼镜，

    模组，比如给华为代工的广和通，福日电子等。

    会玩可以在这两个领域里继续扒拉，会延伸到屏

    幕，音频，电池，比如沃格，汇顶等。

    鹏鼎之前一直挨打，现在为什么有起色，它是消费pcb.

    绕不开的芯片是soc，不会搞前两个，你在这条路上看图，观风埋伏下也行，soc大家都很熟悉了，瑞王，中科蓝讯，恒玄，乐鑫，润欣等。

    soc里的博通集成最先涨停，它是字节合作伙伴，还有一个是移远通信。

    我们认为，整体后续很可能往AI智能体的方向去延伸，

    看图就行了。

    今年的跨年龙，盲猜一下，要么是AI语料要么是AI智能体，就像当年每日互动那样。

    当然现在还没出来，可以先观望。

    谷歌要跑过英伟达，靠芯片是不够的，它必须吧什么眼镜，玩具，手表之类的全搞上，才能把应用落到实处。

    谷歌当年做过眼镜，放弃了，现在刚刚重新恢复眼镜部门，大A之前和谷歌关系不错，有合作的是两家，水晶光电，环旭电子。

    环旭是在大陆上市的第一家电子类台资企业。

