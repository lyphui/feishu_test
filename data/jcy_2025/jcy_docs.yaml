  文档内容正文: '《金刚经》智慧2：前生500次的回眸

    很多人对中国历史上最为著名的女皇帝武则天存在误解或者偏差，单存认为她纯是靠女色权谋上位，大家也不想想，在男权鼎立的社会，一个人女人要获得朝野的尊重和认可，那得有多高的能力，情商，胸怀，智慧。实际上的武则天，是一个超一流的战略家，军事家，政治家，美女只是她的表象而已。

    那她做了什么呢？

    对外先是解决了东北华北的心腹大患朝鲜，设立了安东都护府，这是隋炀帝和唐太宗都没有办到的事情。

    然后又击败分化了西突厥，夺回了安西四镇，重设安西都护府，把势力伸进中亚。

    对内打击了关陇集团代表的各种豪强贵族和既得利益集团，素清了正治风气，培育了中产阶级和技术创新，任命了娄师德、狄仁杰等代表的大量寒门子弟。

    武则天还首创了面试制度，这就是“殿试”。

    当然，她因为要处理的问题太多，因用力过猛，猛打方向盘而被时人诟病，

    但是在她的时代，唐朝的规则进行了确立，模式进行了更新，疆域达到了巅峰，为后来的开元盛世奠定了基础。

    有兴趣的同学往前翻《神龙年间故事》。

    为什么提起武后呢？

    她曾经为一本佛经写序，

    “无上甚深微妙法，百千万劫难遭遇。

    这是多么精妙深邃的理论啊，是一百一千亿年都难以得到的机遇，今天是多么的荣幸听到此经，我愿意学习并付诸实践，真诚希望体会到佛陀告诉我们的真正义理。

    是哪本经书，让全天下最有权势财富地位的帝国皇帝动容?

    《华严经》。

    这是佛陀成道后讲的第一本经书。

    里面谈了什么?

    谈了宇宙的起源和规则，核心有三条，

    一是“缘起性空”。

    宇宙是一个客观的存在，它并没有造物主，一切事物，包括“我”，都没有独立、不变的本质。

    一切的起源都是客观的，无神的，这世界没什么必须的，永恒的，长久的东西。

    别说是人，就连星球，宇宙在内，都有“成、住、坏、空”四个阶段，它不以任何意志为转移。

    所以各位，要体会到“无常”，你的人生，感情，股票，都不是确定的，

    都有“酝酿，主升，下跌，沉寂”的四个阶段，一轮轮的反复循环。

    “空”是什么，空不是没有，空是可能性，是不确定性。

    不确定性，才是最大的确定性。

    第二是“因缘合和”。

    那事物为什么会发生？人和人为什么会认识？股票为什么会涨停?

    一切都是由无数因素“和合”而生，股票要涨，恰好是资金，情绪，业绩，预期，大盘等多种因素共振的结果

    都是有条件的。

    这个世界不存在不依托“条件”而单独存在的东西，其本性是“空”的。

    你执着什么呢？分手了不要悲伤，你们相爱的条件没了，下跌了也不要难过，看看那些“因缘”还在不在。

    因缘是啥？你当初买入的逻辑。

    所以，我们在星球里讲最大的价值并不是受益概念，而是思考模式和方法论。

    第三是“法界互摄”。

    宇宙产生后，其中的一切现象诸法，互为缘起，互相影响，形成一个无限互相关联、相互含摄的整体。

    就像一张由无数宝珠结成的“因陀罗网”。

    最庞大的宇宙包罗万象，而最微小的事物又体现了宇宙的所有本质信息。

    一片树叶里也有万物的内核，里面的分子原子，构成了世界，运行的规律和宇宙别无二致。

    大盘包含了影响了所有股票，但最小的一只个股，也包含了大盘的所有信息，你从一只随便的煤炭股里，也能看出产业向背，周期循环，经济兴衰。

    看到这里，你是否已经体会到了，这和你初中就学过的课本异曲同工，

    唯物辩证的法的核心：

    联系理论、发展理论、对立统一理论。

    具体到我们大家，

    也是在这张“因陀罗网”上的，

    清华教授蔡铮曾经说，

    也是在这张“因陀罗网”上的，

    清华教授蔡铮曾经说，

    我们所有人身上的粒子，都源自于45亿年前一颗行星爆炸的产物，“累生累世”是存在的。

    我们重来世间，再度相逢，可能是我们几千万年前就曾经认得，

    要么是分子式没有配平，要么是电荷的正负还没有相等，要么是尘埃还未落定，

    前世500次的回眸，换来今生的擦肩而过，

    我们还有未了的情，未断的缘，未竟的业，未忘记的念想，才来人间又走一次，

    这就是“缘分”。

    宇宙和自然是无情的，而众生有情，

    有情人珍惜缘分的最佳方式，

    就是活在当下，

    满目山河空念远，

    不如怜取眼前人！

