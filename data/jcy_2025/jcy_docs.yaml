  文档内容正文: '中登崛起--AI电力的分析与演进

    小登老登混战，中等崛起？？

    电力设备的逻辑是北美缺电，东大变压器的概念，我们是10月13日专门讲过，发掘阳光电源这个概念则更早。

    目前，电网这条支线在不断走强，能不能接棒主线，不知道。

    涨的太迅速太快了，不追高，但是你得知道全貌。

    关于电网的5个环节，价值量如何，知识的部分放在隔壁的低209课。

    我们直接谈5个环节的受益，双向结合食用效果更佳。

    目前，走AI数据中心SST固态变压器这个概念的，是阳光，特变，以及同学们在评论区讲的金盘，新特，京泉华等。

    目前已经有了向国内电网延伸的苗头，

    分别的受益是，

    1，发电，

    五大发电集团及中核、三峡，等。

    绿电，隆基代表的光伏，金风，运达等代表的风电，风电的塔筒整机之类前文有。

    2，输电，

    核心设备，

    -国电南瑞（控制保护系统），

    -许继电气（换流阀），

    -平高电气（GIS组合电器），

    -特变电工（变压器），

    -中国西电（变压器、开关），

    -四方股份（变压器，升压站）。

    出海公司更强，变压器价值量更大。

    3，变电，

    与输电环节高度重叠，有国电南瑞、许继电气、平高电气、特变电工、中国西电、思源电气等。

    4，配电，

    恒华科技、宏力达、映翰通、良信股份等，国电南瑞、许继电气等也比较综合。

    5，用电，

    主要是储能，

    海兴电力、林洋能源、炬华科技、三星医疗、海等搞的是智能电表，

    美国更需要储能，阿特斯，海博思创，通润等。

    后面会带动鹏辉，亿纬，国轩，宁王等电芯企业。

    低Pe的，出海的，业绩同比和环比增长的更好。

    这个板块如果起来，

    涨的模式是什么？龙头带动后排，

    很可能是先炒输变电，再炒配电，再炒用电，最后炒发电。

    等价值量最低的发电厂大电厂涨完了，

    合影，散会。

    晚盘对照参考的美国同行是谁？

    伊顿（ETN）。

    产业没有问题

    AI产业链这一轮被杀，是机构们出货保排名，也是大家看到校花们“三季报不及预期”。

    那明年及不及预期？

    美国同行给出了答案。

    Lumentum(LITE)昨天出了25年一季度的业绩，同比涨105%,股价大涨多少呢?23%。

    LITE这是咱们讲过美股值得看的公司吧，它做什么？光芯片。

    直接对应的是校草源杰，能覆盖的是仕家。

    它在电话会中怎么说，

    “最令我们意外的是客户的需求几乎触达一切，FAU、窄线宽、光模块，所有元器件都在环比上行。

    若一定要找个最好的，光模块的环比贡献会最大。展望未来，供应链仍是一个挑战，但需求确实广泛而强劲。”

    再看光模块厂商，coherent它公布的25年一季报，是同比增长774%。

