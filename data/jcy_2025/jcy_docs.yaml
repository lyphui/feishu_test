    马斯克终于有点开窍了

    今天谈点底层规则类的东西。

    马斯克和懂王结合，

    为什么我们一开始就不看好？

    因为马斯克没有“催收能力”，

    他无法保障自己的利益，

    以为天天讨好，待在一起，努力做事，就能保持影响力，有点幼稚了。

    它只有付出的权力，是否兑付，兑付多少，完全掌握在懂王手里。

    不平衡的关系迟早翻车。

    马斯克现在的钱，权，影响力，懂王根本不需要，赶走是必然的。

    你那点黑料，根本形不成”催收”。

    啥叫催收能力？刘邦你是皇帝，大舅哥掌握着长安北军，樊哙也听吕后的，她说话就算。

    罗马首富克拉苏能催收凯撒，人家自己有八个军团。

    现实里最简单的，村里的宅基地，村长若你分配不公平，七八个亲兄弟随时找上门。

    姚广孝知道自己催收不了朱棣，帮夺天下后继续当他的和尚。

    范蠡知道自己催收不了越王勾践，灭吴后直接润了。

    还是我们那句话，

    你创业也好，你谈恋爱也好，你和大佬合作也好，但凡你付出很多东西的，要么你有催收能力，要么你有止损能力。

    否则，

    借出去的钱就当没了，

    送出去的礼物别就当归零。

    这个世界上，上档次的人很少，你真以为都跟各位星友一样啊。

    之前有不少同学要跟大佬合作，

    大王的建议是，如果你真有能力和技术，

    不要去他公司上班，不要给他当小弟，

    因为你这是把规则和分配权给了他，

    你最好的方式，是自己注册个工作室，小公司，签合同，活一样干，叫大佬当甲方，你得有自己的基本盘和势力，再想跟别人合作，哪怕再小，你也能出牌博弈。

    马斯克当年最应该干的事情是什么？

    要么在懂王上位后急流勇退，

    要么拜登和懂王两不相帮，

    组建一个“第三党”，自己说了算的那种。

    有个这个，你手里才有选票，真正坐上牌桌。

    马斯克刚刚回过神来要单独组党，有点晚了，但懂王却有点真怕了，真弄成了，这是有势力人马的催收。

    对于你和普通的俗人来说，

    最长期的关系，

    它不是取决于，

    “你做了什么事”，

    而是取决于，

    “你还能做什么事”。

    学到了么同学们。

