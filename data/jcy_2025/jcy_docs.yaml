    第一，

    想必大家都感兴趣的是，昨天大好的日子，谁砸盘？

    之前我们有精华讲过市场上的几路资金，生产队，努力护盘。

    -机构/公募，限制大额卖出。

    一游资/高净值人群，一天哭了两次。

    -外资，继续买。

    谁在砸？量化。

    量化没有感情，不讲爱国，模型跌破了就跑，谁跑的快谁亏的少。

    更关键是什么，量化手里，一水的全是杂毛，90%以上是100亿以下的小微盘。

    大王曾看过一个量化的持仓，70只垃圾，从没听过，一个光都没有。

    因为我们已知主线是科技且以大为美，小微盘早就跌破了支撑线。这个在隔壁进阶课早就讲过，量化明白后就一个字跑。

    第二，

    那么市场修复的路径会是什么？

    假修复是拉银行电力石油等高股息，指数好看，成长玩完。

    真修复是拉主线，主线是谁？

    主桌的一对新人。

    尤其是主桌女方的海外算力，易中天以及那条

    线上的延伸，已经说出茧子了。而且易中天昨天被纳入富时A50.

    会玩的同学，在海外链继续看。

    女方的etf是159363，只适合“风险偏好及收益偏好极高”的同学。

    最佳进入方式是趁大跌和冰点，

    如果今天继续砸盘，即“基金重仓”指数今天开盘继续砸，砸到极致恐慌，你再看。

    前天有同学板上抄液冷核心，略早，但还好。

    2，华为线同上，光模块是核心。

    3，风险及收益偏好处于“较高”，是国产芯片，科创芯片的etf就不讲了。

    4，如果是中等偏好，就是我们讲的创新药和机

    器人，手法一般的etf，专门篇幅谈过不展开。科创和港股创新药，抱团目前仍然抱的很紧。

    第三，绝对低位谁在跑出来

    有色，光伏等都不错，

    电池在不断跑出来，电池的两个分支，一个固态电池，一个储能，

    尤其是带出海概念的储能。

    阳光之外，比如我们熟悉的同花顺出海概念，德业，图形走的不错，19倍pe并不贵，

    其他的同学们自己发掘。

    风险偏好偏弱，创业板50和恒生科技etf要多看，很多人都跑不过指数。

    昨天课外作业光伏设备转型半导体或者Ai的，有一家值得关注，

    罗伯特科，关注起来，光伏完全红海一般般准备剥离，主要是它收购的FiconTEC堪称半导体卖铲子，是英伟达的上游。

    这是当年中欧关系好才买入的，搁现在基本不可能。进群加微信2818363845

    罗博目前在询价转让，基本是20个交易日的7-8折，而且又涨了上去，目前图形也走的一般，如果给20日线的支撑站稳，则更好。

    总之，较大概率，是今天调整基本完整，市场继续震荡向上，3浪4还没有来。

    也有较小概率，是大盘砸下来，放量大跌，这是好事，过去你喜欢的那些校花校草可以腾笼换鸟了。

    以上仅供学习，不构成建议哈，

    总之，无论上涨还是下跌，都要有量，量在价先。

    会打野的同学，不要忘了看券商指数。

