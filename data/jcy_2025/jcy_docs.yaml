  文档内容正文: "人心思涨\n现在的市场是三个分支，\nAI应用，锂电（材料），消费。\n修复中的是科技。\n重点说下锂电。\n昨天满屏大涨，\n你要知道逻辑是什么，已经不是汽车，不是固态。\n\
    而是储能，储能催化是AI电力。\n储能用什么电池，低端的甚至垃圾的，二手的。\n这里的6F/VC,你没上车就不要追了，\n还有谁在调整后能看，\n磷酸铁锂材料。\n\
    储能电池基本都是铁锂电池，当然将来可能是纳电池。\n高端的铁锂材料就那么几家，给大家讲过了。\n谁目前还不是特别高？磷。\n云天化，湖北宜化，兴发集团。\n\
    我们在一线了解的情况，是铁锂电芯已经有了短缺的态势，电芯就4家。\n最好的当然是宁王，没有短板。\n港股有个中创新航，当年的蜂巢。\n海博之类的很猛，它也是没电芯的。\n\
    今天锂电还会冲，但不建议追高，市场没有量，等调下来再说，\n市场目前还没聚焦磷酸铁，激进的可以小仓位试探性的先去观察磷。\n其他的观点不变，锂电的一致性太高，说不定AI应用有市场的反馈。\n\
    科技的修复今天就看国之重器，打铁英豪，陆积电，中芯的带头作用，\n昨晚它的三季报，\n营业收入171.62亿元人民币，同比增长9.9%，环比增长6.9%，创单季度收入新高。\n\
    归母净利润达到15.17亿元，同比增长43.1%，环比增幅更是高达60.64%.\n这说明利润在上涨，先进制程在不断扩产。\n为什么长线上，我们不太看好摩尔线程之类的产业机会，只看好它们的交易性机会？\n\
    它们没有陆积电的产能啊。\n搞芯片不是有技术就行，那也是做生意，该喝的酒，该唱的歌，该搞定的甲方，\n评论区：\n晨居：最近各家新能源汽车都缺电芯缺的厉害啊\n\
    南院大王 回复 晨居：储能会挤占铁锂电池\n吃相好看：预计12月降息可能性减弱，美股先跌为敬。\n估计大A也是难受。\n小龙：有小道消息说可能要换村长了，怎么看？\n\
    南院大王回复小龙：小作文丧心病狂，人家在法国访问\n林鑫回复小龙：说明要涨的势头阻挡不了了。\n只能造大窑\n天心月圆 ：那些既能搞技术，又能陪唱歌，陪喝交杯酒的真的是天赋异禀\n\
    南院大王回复天心月圆：书读明白了就啥都会了\n腾讯的三季报启发\n第三季度营收1928.7亿元，同比增15%，预估1888亿元， \n上年同期1671.93亿元；第三季度净利润631.3亿元，同比增长19%，预估558.8亿元，\
    \ \n这是大超预期的节奏， \n11月25日，是阿里的中报，预期就算外卖大战不好，指引也会非常不错。 \n这说明什么？\n第一，大象可以跳舞，大公司发展的速度和质量越来越高，它和小微企业组成哑铃模式，中间的中不溜企业最难受。\n\
    就像有人问宁王1.2万亿高不高，我们回复是不高，也就折合2000亿不到美金，在全球科技公司里排不上号。（当然不说现在要你追啊，大涨得消化）。\n阳光也一样，最近要消化前期的涨幅，消化完还会上去（不是让追高啊），毕竟它只是550亿美元的小卡拉米。\n\
    第二，全世界最优秀的AI应用必然在中国，因为其他地方没有这么大的统一大市场和把价格打到9.9的公共服务。\nChatGPt因为回答法律问题会影响美国律师的生意，现在这方面基本上给停了。\n\
    目前，腾讯的活跃账户有14亿，而全球拥有手机的用户是57亿， 套用《军火之王》里的话说，现在任务是怎么让另外33亿人用上微信，给腾讯充值\n第三，美股的七仙女在纳斯达克，中国的真·科技巨头基本都在港股，\
    \ \n不要光看到农伟达在涨， \n你更要看到， \n今年截止11月上旬，南向资金今年净买入1.3万亿港元，累计净买入5万亿港元。\n阿里，腾讯等印钞机企业现在市盈率也就不到20倍，比大A那些公司不知道好到哪里去。\n\
    有人说普通人怎么躺平蹭上这些大牛，讲了啊，恒科指数，最近它们的调整，是一系列不可抗拒的超级宏观事件影响的。\n消费复苏，必然是阿里腾讯等这些平台企业复苏，\n\
    因为它们现在本质是收费站，赚收租生意的，有了人工智能后，收费站的效率更高的。\n生产队和大资金，最喜欢收租生意了。\n问题来了，\n腾讯阿里们赚了大钱，做什么事情最讨上面欢心，上面希望它们去做什么呢？\n\
    猫一天狗一天\n大盘没什么好讲的，\n市场没量，大家观望，\n你又不让大涨大跌，\n只能情绪和趋势切来切去。\n等待期的大A毫无主见，被老外的A50直接带崩。\n\
    纳指即将回踩一下55，60线，周一17号，预期周二18日就有人要试探性博弈英伟达财报。\n大A重要的科技基本也在34或者60日线盘横等着了。\n都这会了，就熬着等结果出来，好好过周末吧。\
    \ \nBob：好的，我加仓英皇，是不是有点太着急了，大王 \n南院大王回复Bob：当然算急了，最多你19号 \n白天加一点，20号T出去。 \n水镜：4000点收费站拆了建，建了拆，果然油水多，哈哈。\
    \ \n南明星尘回复水镜：利好建筑行业 \n水镜回复南明星尘：哈哈，没毛病，配点微盘 股。 \nA*露露小姐|珠宝*：像极了过去的中国移动，来回打都收费。"
