    新消费基本是不行了，毕竟没业绩。游戏还好，两头吃得上。

    后面的策略可以是，看准时机和量能，

    跟着科技抱团的一起抱。

    一个人打架和1万人打仗是完全不同的，

    你可以身段灵活，随时切换，

    1万人你要撤，瞬间根本撤不下来。

