  文档内容正文: '想象力

    昨天GTC大会，

    黄仁勋勾勒了一个AI未来的宏伟蓝图：6G、量子计算、机器人、自动驾驶，并和诺基亚，奔驰等展开一系列合作赋能。

    英伟达暴涨4.98%，突破200刀，历史新高，市值到了4.87万亿美元，同时微软也突破4w亿。

    之前我们就讲过，中国很多机构和散户的核心问题是缺乏想象力，

    既没有用信念战天斗地的魄力，

    也缺乏用科技改天换地的想象力，

    看到宏伟蓝图，

    上来先视为左脚踩右脚的骗子，

    不是喜欢摁计算器吗，英伟达宣布在手未履行订单5000亿美元，

    超过A股所有公告订单额。

    这还不算完，OpenAI还宣布，所有AI基础设施建设总规模略超30吉瓦，总投资额约1.4万亿美元。

    超过了中国去年规上企业利润的总和。

    老登们是没戏的，因为老登当年创业，是穷的，逼的，活不下去了死马当作活马医才干的，发愿基本都不高，不乏坑蒙拐骗，给自己求个富贵，历史有局限性。

    而小登们衣食无忧，就是揣着狂热的兴趣和决心，要活着就是为了改变世界的。

    要问利好谁，当然是主桌女方，尤其是前排的核心品种，未来3年的饭，人家已经全部给你喂完了，只会不断超预期。

    光模块pcb的那一串链条和延伸，不用赘述了吧。

    那么，如果极小概率，

    它们竟然都不涨了，反倒是军工，题材，各种牛鬼蛇神起来呢？

    那就叫做“钝化”，说明大资金们憋着坏招或者因不可抗力，对未来严重悲观了。

    真那样你该且战且退考虑本年度止盈了。

    ps，不要被这排小字吓住，所有的战略都要包含对“极微小概率”的考量。

    喊着利好兑现，止盈走人的人们越来越多，战略要藐视，战术上要重视，预留一根弦要绷着。即使这些发生，也只是影响波段，而不改大的趋势。

    外头有各种所谓的龙头战法，真正的龙头，从来都是这些改变世界的科技巨头，和极客与怪杰们。

    高≠贵，低≠好，K型分化大家学多久了，

    没有垃圾回归，只有强者恒强。

    总体上，坐等今天的科技收获，以及再次突破4000吧。

    4000最多棋到中前段，只是新的起点。

    族谱单开一页

    今天还是科技，新能源的性价比和印钞机属性众所周知，

    大盘在换个法儿的博AI的预期，

    即“东大缺芯，西大缺电”。

    这两天炒的概念叫做“sst固态变压器”。

    其实没啥意义，搞电的核心技术在一帮子中登手里，咱们讲过的特变，平高等等，电网设备 etf创下新高。

    游资们喜欢炒的是金盘科技之类的，我们没跟大家讲，是因为问过硅谷的兄弟，它们倾向于找大公司合作，电这种东西，轻易不会乱来。

    弹性大的是咱们讲了很久，“族谱单开一页”的阳光电源。

    再给新同学们温习下逻辑，

    1，它本身市盈率不高20来倍，

    2，自己就是搞电的，对AI变压器那些很熟。

    3，海外的开拓能力很强，品牌人才够用。

    4，光伏和储能业务就非常不错，哪怕AI做不起来，也不会影响大局。两头通吃。

    这种有第二增长曲线的就非常不错。

    市场量能远远不够，既要保住科技大票的富联（这哥们自己要搞液冷了），又要维持电力新能源，又还要拉pcb，铜箔和电子布要冒烟了，

    光涨了几天了歇下很正常，

    不然三季报出来咋拉，而且尾盘时刻，资金又冲进去抢了点光学光电子，比如直线拉了天孚。

    今天好在于，午后的主力们把军工要博悲观预期的势头打下去了，很好。

    一真拉券商，券商it就立刻反馈，文丞相其实三季报一般，这就是当弱不弱则为强，搞券商it拼的是盘中手速。

    拿了pcb和阳光新能源的同学们开心了吧，没白坚持吧，这就是高≠贵，强者总是很强。'
