    未雨绸缪之低位板块-宠物经济

    （类似1990年代的白酒）

    宠物经济，是我们发掘的两大“绝对低位”中，新消费的核心板块之一。

    这是亚洲宠物展考察过后的给大家的分析。

    有些同学可不知道，现在东大4岁以下小孩的数量，没有宠物多。

    母婴的尽头是宠物，这个赛道会长期兴旺。

    宠物经济的发展会分为三个阶段，

    一是宠物食品，高频刚需，

    二是宠物玩具，衣物，猫舍，

    三是宠物医疗，针剂，医院等，

    猫狗的寿命都很短，基本上看病费是它购买身价的N倍，猫狗疾病保险的“增速”超过人的保险。

    猫狗住一次院，那花费，呵呵呵。

    因为宠物的门槛很低，消费者也不讲什么品牌，所以整个宠物经济完全处于江湖混战阶段，长期有看头，会沿着上述三个次第展开。

    几个领域核心代表，

    1.宠物食品，中宠，乖宝，佩蒂。

    佩蒂以前主营咬胶，玩具等，今年以来转型主粮，成绩可以有预期差。

    乖宝的毛利，营业额，都是行业第一。

    2,宠物用具，核心是依依股份，它是全球尿垫的第一大生产市占商，并且收购了广州源博医药11%的股份，准备进军宠物医疗。

    天源宠物在搞AI猫舍等，这个要观察。

    3,宠物医疗能看的是两家， 一个瑞普生物，主营宠物疫苗，尤其猫三联疫苗可以国产替代，更控股了控股瑞鹏宠物医院，超2000家门店，形成医疗闭环。

    另一个是回盛生物，主营做兽药，切入宠物赛道轻车熟路，有宠物创新药的概念。

    以上讲这些，并不是要大家立刻去买宠物板块，而是讲，它们属于绝对低位，迟早起来，供给风险偏好极低的同学配置，尤其是中报过后如果有较大调整更好。

    更关键的是，

    虽然它们目前不是主流板块，

    但同学们要关心的问题是，

    -当国产芯片和海外算力都涨完了怎么办？

    -当高位板块都已经处于超买后怎么切换？

    当市场处于防守状态，涨银行(而非券商)时，有谁可以打野和避风头？

    -大消费必然是要起来的，当它们补涨起来后究竟看谁？

    我们必须要未雨绸缪，提前有数，知道下一步，下下一步要涨什么，资金可能往哪里去，才能气定神闲，有备无患。

    所以宠物经济这张牌，值得我们长期关注，没事就看一眼。

    众所周知，我们从来都是不自喜欢追涨的，而是埋伏在必经之路上等风来。

    ps，乖宝的“麦富迪”在天猫主粮排第一，有同学买过吗？

