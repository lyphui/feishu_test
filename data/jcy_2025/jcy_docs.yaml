  文档内容正文: '怎么个涨法

    两边在马来西亚谈的非常不错，冲击4000就像一层窗户纸，依然是主桌的天下。

    会谈直接利好主桌女方，

    即光模块pcb代表的达链，

    明年海外的所有需求将集中在800G，以及一定的1.6T。

    -800G的主要玩家是旭创，新易盛，

    剑桥，规划产能300万只，汇绿生态，子公司规划产能180万只，这两个是代工，利润低，但有后排交易价值。

    按xys年产800万只800G的市值，剑桥和汇绿该值多少?(这个仅供高高手算这个账)

    -1.6t的主要玩家是旭创，xys没法直接供货，是代工，利润低一半。

    其他人代不了，忽悠。

    说1.6t从600万上修到2000万是忽悠，需求大约1200万。旭创大约拿40-60%，其他各家分分。

    -1.6t的主要问题是光芯片产能不够，目前主要由美国的博通(AVGO)和Lumentum(LITE)供货。

    光模块后面还要上升到3.2T，延伸到汽车领域等，死不了过剩不了的。

    -目前我们从两融和筹码结构能看出，光模块机构多，pcb散户多。

    PCB的龙头胜宏依然能打，在Rubin时代没看到衰退，有预期差的是沪电，

    沪电是谷歌的主供，在东南亚的是自己直接设厂，胜宏是并购，更激进。

    pcb需要的铜箔，电子布等前文有讲，自己去翻。

    光模块pcb涨完了才轮到后面的铜缆液冷电源等，

    -主桌男方，是再一次踏空了市场的机构和两融在周五下午大幅买入，

    涨法同理是扩散补涨模式，芯片看寒王芯原，设备看中芯。

    两边谈的非常好，再多想一步有预期差是谁?

    协创。

    协创是目前几乎唯一能拿到英伟达B30的厂商了，如果放开英伟达卡，他最受益。

    但这个逻辑能稍有点长，三季报可能不及预期，

    稳健的过了再看，你硬要先参与，不要跌破147.8。

    同样利好的还有新能源尤其是电池，真谈好了这个也会放松出口，就看阳光宁王足够，阳光还有AI变压器概念。

    更稳健是两个etf，159381和588200，

    男女方既要又要，还不想错过存储周期，中韩半导体etf。

    新手菜鸟还是恒科。

    祖训不追高啊，

    随时观察新主线的启动。

    评论区：

    叶枫：cohr和lite都是核心环节啊，激光芯片及分立材料价需求怎么样?

    南院大王回复叶枫:也就EML芯片和大功率CW激光器芯片最紧缺，核心还是老外，国内的源杰领先点，pe很高，仕佳的又刚才小规模释放。

    顺势而为：左手pcb右手光模块，8月份没敢上的这边调整后打满了

