    腹式呼吸，气定神闲

    老规矩周末谈风花雪月和国学养生。

    经常撸铁的朋友都会有感觉，你做完力量训练后，明显感觉小腹收紧。

    各种健身教练都告诉你，“收紧小腹”。

    目的是什么？启动”腹式呼吸”。

    我们日常，是口鼻呼吸，属于“短行程”，脏器含氧和外界的交换不充分。

    腹式呼吸是让横膈膜上下移动，属于长行程，

    1，排出更多沉积二氧化碳，提高心肺功能。

    2，激活副交感神经，有助于放松身体和心情，缓解紧张情绪，降低压力和焦虑感。

    3，升清降浊，促进消化与改善脾胃功能，降低腹压与改善血液循环。

    4，增强核心肌肉，改善体型结构，提高免疫力。

    那有什么方法可以快速激活腹式呼吸？

    答案是站桩。

    网上各种教程满天飞，都没给你说，它的目的是进行长时间相对舒适的腹式呼吸。

    那么你往前推就简单了，不要在姿势上抠字眼，以姿态让你明显感觉到“腹式呼吸”为准。

    那么你往前推就简单了，不要在姿势上抠字眼，以姿态让你明显感觉到“腹式呼吸”为准。

    很多人都不会做一个髋骨前屈的动作，迈克尔杰克逊有示范。

    双手抱球的目的是什么？打开横膈膜，让空气往下沉。

    纯粹明显的这样呼吸方式很累很耗能，所以大多数人站桩一开始几分钟都有站不住住，时间长了满头汗。

    腹式呼吸，你会明显感觉到小腹有一个点提供原动力，那就是健身教练说的“核心”，也就是”丹田”。

    呼吸到脐，寿与天齐，

    气沉丹田，百病不生。

    百练不如一站，

    当然我们讲的站桩很入门，纯粹是奔着挑息法去的。

    你自我的感觉越下沉越舒服，姿势越正确。

    吴燕妮的北欧挺，你一看就知道她在用哪吸气，核心强的可怕。

    这个时代是一个浮躁的年代，

    很多时候你决策失误，最主要原因是大脑的供氧量不够，影响思考与判断。

    站桩能让你静下来，全身心感觉到自己与天地能量的交换，强化自己的配得与成就感。

    身康财稳，心静贵运顺。

