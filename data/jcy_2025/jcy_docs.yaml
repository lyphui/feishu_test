  文档内容正文: '宗氏娃哈哈的一线生机

    节日内传出消息，

    宗馥莉心腹严学峰被查了，

    严是宏盛的生产总监，职业生涯基本紧跟宗馥莉，2024年才是宏胜饮料集团华南区域总经理，2024年7月就安排进入娃哈哈集团核心管理层。

    媒体说，这位宗馥莉的核心副手，被指控将浙江桶装水业务从合资公司剥离，以2.75元/桶的“代工价”转移至宏胜系企业，再以7元终端价销售。

    宏盛每年利润40多亿，娃哈哈集团的净利润才几千万。

    新闻的表述是，

    “上城记委将立案通知书发送给集团D委，宣布对核心成员严学峰涉嫌违纪进行审查，并明确未经记委同意，不得批准其出国、辞职、晋升或办理退休手续”。

    有些懂行的同学应该能看出门道，

    措辞并不十分严厉，属于区里管理，没有提级管理，也没有异地办案，且是发给单位，甚至都没有搞强制措施，最多监视居住。

    这就说明，严尚有挽救余地，有点敲山震虎，就看大小姐怎么应对。

    而正确答案是什么？

    “按宗老板的既定方针办”。

    老宗走前，很可能是安排了大量的利益分配，人情往来，架构约定的，

    小宗连弟妹的方案都能推翻，其他的可想而知，严学峰很可能只是外界督促其“步入正轨”的提醒而已。

    那么宗小姐会翻然悔悟，长袖善舞，力挽狂澜的把一切拉回来吗？我们不得而知。

    但有几个规律性的原理我们要记得，经济上，

    1，越是进入门槛低的行业，越缺乏技术含量。

    2，缺乏技术含量的产品，是没有护城河的，其规模只越依赖于渠道建设和品牌惯性。

    3，渠道建设的核心是人情关系而非规章制度，

    品牌惯性的核心是创始人口碑而非数字管理。

    说白了，有核心技术的公司，你可以拽拽的不用搭理人，如果没有，你必须伏低做小，上善若水。

    问题是，这个世界上太卷，而天才又太多，有核心技术的黄教主都会跑到中国来敬酒，而你一个卖水的…

    政治上就更简单了，

    教员讲过两句经典的话，

    1，谁是我们的朋友，谁是我们的敌人，是革命所要考虑首要问题。

    2，什么叫政治？就是把敌人搞得少少的，把朋友搞的多多的。

    前面的底层代码级分析，

    先主的一片苦心。

    提问：

    大王好，能否说说一下哇哈哈大小姐，以及她是如何稳住局面掌控哇哈哈的，面对矛盾，做了哪些值得我们学习的，谢谢！

    南院大王回答：

    她哪有稳住和掌控局面？抱复也好，出气也好，搞得宗庆后所谓的清誉和人设尽毁，这才是娃哈哈最宝贵的资产好吗。再加上几十亿美元的境外资产转移，很可能让杭州国资也没办法装鸵鸟，被迫出来去履行大股东责任，这是品牌，声誉，经营，股权，团队的全方面危机。

    这故事告诉我们，改g者千万不能自以为是，意气用事，而要慈悲为怀，徐徐图之，否则自毁长城，掉进陷井。断三J信托基金这事，弄不好是别人怂恿她干的。

    如今的宗，一无基本盘团队，二无强力的公婆家，三无大股东地位，沸反盈天，内外皆敌，给我们更多的是经验教训。农夫山泉，怕是要涨了。

    提问：

    大王，个人情感之路很坎坷，几度崩溃，两次缘分都不太尽人意，这一次我是前两天分了，我自问从未想愧对她，奈何自己实力不足，这想请大王闲暇之余帮我看看，指点一二，万分感谢，1993年12月14日早上快日出的时候出生（可能是6点左右吧）

    南院大王回答：

    跟实力没关系，你可能是个非常执着的人，很多事非要“明知不可为而为之”。错了，90%的精力要用于筛选，10%的精力拿去相处，好的缘分和感情，都是“得来全不费工夫”的，好的人一开始就让你感觉很好很旺很舒服，不好的一开始就让你别扭，让你累。要相信自己的直觉，不要去强扭那个瓜，不要去玻璃渣里找糖吃，谁对你好你加倍，谁对你坏你让谁滚。她觉得你配不上她，我们还觉得是她配不上你呢。真诚，回馈，责任，都是人性中非常美好的东西，有些人天生就没有，她又怎么给得出来呢？谈恋爱，不好就换，不要执拗，像看股票一样筛选，白马就在灯火阑珊处等你'
