  文档标题: Vol.5 底层代码系列:赚钱和赚大钱(中)
  文档链接: https://h160bxy8czl.feishu.cn/wiki/WutqwGP2biBeZUk1OWxctO7anyh
  文档内容正文: '这两天两个刷屏的事件是，老罗直播和瑞幸造假。

    我们再来重温一下底层规则:赚钱就是加工自己最容易获得的资源，出售变现的过程。

    最容易获得，意味着最廉价，老罗最廉价的资源是什么呢？他的段子，他的人设，类似伶人。大家带点戏谑的看法围观。

    这种资源廉价到他往那边一坐，感觉就是段子。

    但老罗其实并不喜欢这个人设，跟耍猴的一样被围观，他内心的梦想是做企业，产业报国，所以去造手机。

    老罗在造手机领域能获得最廉价的资源吗？不能。供应链极其昂贵。

    锤子手机失败其实不是管理问题，管理才能浪费多少成本，30%足够，老罗自认为自己是网红，其实只能在营销领域获得一些资源而已，而且并不廉价。

    小米当年也是这样。雷军很聪明，他先是忽悠了魅族，魅族是极其擅长获得廉价资源的，老板黄章经常睡办公室。然后又找了摩托罗拉的周光平，周掌握了巨大手机行业的供应链资源，刷脸就是钱。

    所以，你要值钱，拿高薪，一定是在某个领域能够获得丰富的廉价资源。说远了。

    老罗是去搞直播为什么能成，他搞段子几乎没成本，其他的团队，得养人，写文案，花钱，效果还不一定出得来。

    所以，当一种巨大的资源廉价到你本身就是它，你就很值钱。所以木桶理论是不对的，人的发展，就是要把自己的优势资源发挥到极致，成本低的想不到。

    再看瑞幸，因为掌握了我们说讲的这个代码。这个公司就是一个倒着走的公司。一开始先把所有的结果规划出来，为了满足这个结果，倒推步骤和做法。

    所以瑞幸烧补贴根本不怕，这个早就计提了，一开始就是奔着确定目标去的。短短17个月就上市了，与其说这是一个公司，不如说这是一个发财项目。

    第三次再来重温一下底层规则:赚钱就是加工自己最容易获得的资源，出售变现的过程。

    瑞幸既然是倒着走的，肯定先研究哪里出售变现最好赚钱，美国的纳斯达克。

    再看他们最容易获得的资源，陆正耀刘二海本来就是干投资的，风投圈的热钱很容易弄，而且没有5倍以上利润不想干。

    最后看加工本身，瑞幸的ceo钱治亚是干吗的？以前神州租车的运营经理。踏实、考验过，能干活，没什么灵气，但会按部就班完成目标。

    金枪鱼再便宜，也得好厨师加工，让钱治亚搞这个资源加工最合适。

    钱治亚也很清楚，他这个优势，在别的地方也就那样，但在瑞幸能卖个好价钱。她也懂底层代码，所以很拼，好好干。

    因此，我们在想要赚钱，尤其是大钱，或者创业的时候问自己三个问题:

    1，这个基于的资源，是自己最廉价能够获得的吗？

    2，自己的加工方式，是最有利于把资源加工好，最科学的吗？

    3，变现有找一个出价最高的地方吗？'
- record_id: recwKVlwwY
  文档标题: Vol.4 底层代码:关于赚钱和赚大钱(上)
  文档链接: https://h160bxy8czl.feishu.cn/wiki/X0aOwNvCeiWLrOkO0R9cg991n1f
  文档内容正文: '人们是怎么赚钱的，赚钱的本质是什么？

    赚钱就是加工资源并卖出的过程。

    这里的资源包括什么呢？能力、信息、生产资料(如原料、开工厂，开公司)商业机会等。

    如果你获得的资源并便宜，和别人一样，市场售价都差不多，那么你的赚的就是辛苦钱。

    举例说，银行贷款就是资源，房地产商动辄融资几十亿，但信贷资源并不向民企倾斜，央企融资利率4%，民企10%。融十个亿，民企地产商要比央企成本高6000万。这可是净利润，你要卖多少房子才能赚的过别人？

    所以要赚大钱，就要找自己资源富集的领域。人人都有自己的社会关系，你要琢磨自己获得什么资源比别人便宜，比别人直接，比别人效率高，并且不断的去挖掘和巩固他。

    除了真心关系和亲情的社交，我们的社交基本都是为了开拓和稳固资源关系用的。

    请注意，这个资源一定是你不经意或者多年维护下来的，如果是现找的，就需要较好的交易条件或者短时间密集的刺激。

    然而很多人没有太多资源，或者临时来不及，上班，那就是加工自己的能。

    但能力提升并没那么快。不是朝夕之功，那么赚大钱有且只有两个方式，一个是跳槽，把能力卖一个好价钱，学成文武艺，货卖帝王家。

    第二个是把自己的能力降维打击。找一个竞争对手远远不如你的领域，比如说农民。

    过去，养猪和杀猪的都是农民，没有什么科学的方法，忽然出现一个大学生，他把管理学和统筹学运用的淋漓尽致，大家都知道肉摊子切肉是很有技巧的，客户要一斤，卖肉切一斤一两，还给添头。你要是一下切一斤半，肉就废了得重切。

    这个大学生还开了杀猪学院，竞争对手谁也没这个能力。最后他一路生意做大，竟然收购了汇源果汁。

    这人就是北大杀猪男。

    大王的基金投资了个公司，他们做电动车的充电芯片，能力是快充，充电速度快30%还很安全，但汽车充电桩领域，这个企业太小了，才几千万规模，竞争对手都是特斯拉的供应商，你怎么搞得过人家？

    很快找到一个优势散发区域，那就是小区电瓶车的充电桩，但竞争对手基本都是农民，那些桩没有统一规划，动不动起火，被我们这个公司冲进去打的没有还手之力，做物联网系统很简单，形成充电云也很简单，但农民不会做。

    所以一个城市一个城市的拿下订单，和汽车充电桩比起来，这个很low，很低级，但好的地铁站出站口停车场，一年下来电瓶车充电毛收益就达百万。

    我们不歧视农民，上溯几代大家都是农民的孩子，这里仅作为一个比喻。

    所以，我们要去琢磨。

    1，自己能够获得最便宜的资源到底是什么，有哪些，我们去搞刷脸就行，别人搞起来门难进，脸难看，事难办？

    2，自己一个领域的什么能力，是可以拉出去屠杀别人的？我们做起来非常容易，成本很低，别人做起来非常难受甚至根本不会？'
- record_id: recwgdZbQ2
  文档标题: Vol.3 底层代码系列:工资、应收账款和经营
  文档链接: https://h160bxy8czl.feishu.cn/wiki/L7dbwcLHhiUWKNknjMmcAcq2nn3
  文档内容正文: '个人是需要经营的，企业也需要经营。个人经营最头疼的问题是工资，企业经营最头疼的是应收账款。

    应收账款是什么？大家立刻就能回答，就是客户欠自己的钱。这只是会计概念啊。卖东西收钱难道不是天经地义吗？为什么欠着？

    我们很多人会说这是行规，大家都这样，更多的人说，如果不给欠账，生意没法做。但是，你去买个LV的包，去买辆奔驰，为什么不能欠账呢？

    应收账款，其实是产品竞争能力不足的表现。(请读三遍)

    你的产品或者服务，没有好到要客户必须给你现金。

    我们的大部分的企业，是把应收账款作为一个促销手段在用。

    应收账款，本身就是打折销售。6个月账期，就是打9折。5%的财务成本，5%的理财或经营收入。

    应收账款，就是把客户的风险转嫁到自己身上。地产商和4S店经营风险已经非常大，所以他们坚决不准你跟他拖应收账款。

    这就是应收账款的本质。

    而为什么要说到工资呢？你仔细想想，你的工资是否也是应收账款呢？一个月账期。

    你的劳动，为何不能现款现货，或者先款后货？是否某种意义上体现了自己竞争能力还不太足呢？

    你拿到的工资，是否其实上也是9折呢？早年间，职业经理人圈里，要求一次性支付1年，乃至3年工资的也有人在哦，大王当年也是第一批的发明和实践者，亲测有效哦。

    问题是，我们开这个口，把握在哪里呢？是不是我们的努力方向呢？

    应收的碎片化存在，就导致了很难经营，大部分难以升阶，比如说，一个月给3万工资，年底的结余有15万就不错了，因为存不住。

    而反过来，上来要求打9折，支付30万的全年薪酬，一下买套小房子，每个月咬咬牙，不也这么过去了吗？年底的结余，当然远远大于20万了。

    经营的底层逻辑，就是永远要尽量把收益留给自己，把风险转嫁给别人。穷人，是因为没本钱，而缺乏风险转嫁思维呢，还是因为缺乏风险转嫁思维，而没本钱呢？

    思维训练结束。说策略吧。

    企业的应收账款怎么搞？大王团队当年投过一个公司，做上市公司保千里的生意，订单额很大，他觉得这就是好生意。

    错了，在经营的角度，不是客户越大越好，大客户不一定是好客户，疫情后谁能活多久谁也不知道，现金流好、支付条件好才是好客户。

    所以，企业尽量不要把应收作为促销手段，很多痛苦的生意其实不做也罢。大客户，小订单，多频次，高周转才是好生意。

    最后，宁肯打折，也要争取先付款或者短账期的条件，一来二去，客户的习惯不就被你培养了吗？

    老板和高管们得想想，你的经营风险，可以转嫁给谁呢？转嫁给银行，当然成本最低了！

    那么对个人来说呢？大部分人存不着钱，不就是因为总是化整为零吗？不知道钱花哪里去了。

    经营个人财富，最当然要化零为整。能不能一次性的3年支取工资，进而购进资产呢？能不能向公司借款或要求支付一个整年工资，付一个首付呢？

    一下拿1年工资，是不是积小胜为大胜呢？

    很多公司都有购房基金和可借款额，大胆借入，这和穷没关系啊。

    如果公司要提拔，两个后备人选，一个欠公司款30万，一个不欠款，公司肯定提拔谁呢？

    以此类推，把这个思维方法延伸出去，又是另一方天地啊。'
- record_id: recrBwXVpT
  文档标题: Vol.2 风险、收益、眼见为实
  文档链接: https://h160bxy8czl.feishu.cn/wiki/SjxPw96XViZiMfkalxecOTqgn9g
  文档内容正文: '风险、收益、眼见为实

    今天周末，谈点轻松的课题。

    人们常说，风险和收益成正比，如果收益越大，那么风险越大。

    这个所谓真理，大王在学习时就怀疑，后来搞金融，风险控制部门经常谈到这个看似真理的东西。

    大王并不认为是这样的。

    如果我们重回2008年的四万亿，大家肯定有多少钱都拿去买房，如果重回2015年的去库存，借钱也要买房。收益是很大的，风险大吗？

    又如，昨天美国出现的吵爆天的新闻，两党的不少议员在2月27日就把自己的股票甩卖光了，那会是高点，都赚了大钱，收益很高。就金融来说，有风险吗？

    因此，底层的代码很简单:

    收益只与信息的占有量有关。

    如果你全知全能，知晓信息，开了全地图，你肯定能赚。

    掌握的真实信息越多，你赚钱的概率越大。知道的信息越少，你的风险就越大。

    在中国的股市上，大部分炒股是亏的，和你的技术没有关系，因为你根本不知道上市公司的真实信息。

    所以，收益越大，风险越大，是用来糊弄老百姓的，真让所有人知道这个东西，稳定很不好搞。

    大王的星球在2月28日起就让大家不要上车，因为我们也掌握了一点这个信息。

    普通人搞明白真实信息的最大问题是，无效的内容太多，我们很难筛选，来源真真假假，我们很难判断，而一些更机密的，要去发掘、研究和判断。

    消息，距离信息的质量还差的很远，信息距离判断趋势也差的很远。

    而以上都是反人性的，因为一般人只相信眼见为实。但这个眼见为实，都是他们故意让你看到，你才能看到。

    人类社会今天如此精密，已经发生的事情，通常没有什么利润和空间了，都说要靠趋势或者叫未来挣钱，却没有人告诉大家说，那些都是没有发生的事，这个需要思维训练，眼叫不为实才行。

    爱因斯坦1940年代说光线不是直线传播，这和我们的肉眼观察与想象完全不一样，后来证明空间竟然是弯的。佛经上说，佛观一杯水，八万四千虫，2000年前肉眼看不到，没有显微镜发明，你能相信吗？

    马云在1998年就说生意未来都放在互联网上做，08年又说会放在手机上做，12年又说大家都要在手机上办公了，我们觉得这怎么可能，直到出现个盯盯。

    小胜靠德，是因为存量市场很确定，利润空间有限，我们只能谨小慎微。大胜靠天，是因为增量市场很不确定，我们得摸准趋势和时机。

    赚小钱，眼见为实，赚大钱，眼见为虚。

    举个例子，小胜是牛顿力学，大胜是爱因斯坦力学。

    所谓的暴富，先是思维训练。佛经那么厚，好几百部都是教你眼见为虚的训练。那些传承了几百年的大家族，其实最珍贵的就是这些东西。

    到最后，大胜反倒不比小胜有风险。那个后续我们专门再说。

    所谓虚实结合。'
- record_id: recP7biepM
  文档标题: Vol.1 呼风唤雨:管理、领袖与权力的来源
  文档链接: https://h160bxy8czl.feishu.cn/wiki/JlxswGXcSi3JWVkOk2PcAPSfnub
  文档内容正文: '呼风唤雨:管理、领袖与权力的来源

    管理要靠什么？靠能力吗？并不是，管理靠的是权力。能力只是权力的一部分。

    为什么有的人，明明是上面任命的领导，是局长，是处长，是总经理，是总监，但说话没人听，下面阳奉阴违。

    为什么有的人，普通职务一个，却能呼风唤雨，影响一大片？

    就得说说权力是怎么来的。

    权力的第一个来源是组织赋予权。即上头任命你做总经理，任命你做处长，等等。孔子说，名不正则言不顺。这个权力有用吗？没大用，只是门槛。

    权力的第二个来源是奖惩权。你能够用KPI和工具扣他绩效，罚他工资。威胁他。也能够给他发福利，弄好处。这个权力有用吗？很有用。

    但是，每一个领导手里的资源毕竟是有限的，不可能长期的给，人会皮掉，也不可能所有人都给。小惠未遍，民弗从也。

    权力的第三个来源是专家权。你在某个领域或者公司与组织的运行，干活最好，专业度最高，或者最能解决事情，你就是真正的专家，和职称学历并没关系。

    任何一个团队都是因为目标而存在的，而专家权，必须是领导的首席能力，要么自己最会干，要么自己最知道应该怎么干，这就是专家。

    很多公司的老板都是首席销售员，很多单位的头头最了解游戏规则，都是专家权。所以，要掌握。

    第四个权力是典范权。领导毕竟只有一个人，要发动所有人，就不能只在游戏规则和KPI的框架下带人。就必须有人格魅力。

    所谓的人格魅力，物质上要给大家带来好处，哪怕是小礼物和纪念品，不然大家跟着你干什么呢？

    精神上，要有人性的优点，勇敢、公平、勤奋等等，你自己知道的良好品质都往自己身上加，控制自己，不断训练和实践。精神上的引领强大了，就是理念，人都是需要方向的，很多人，其实追随的是信仰，物质并不是第一位。

    6070年代，大家跟着大队支书拼命的修水库，那会也没什么物质，不就靠精神引领吗？

    所以你发现，很多团队里，有的人很普通，但是他能影响别人，原因就在于此。

    在组织行为学和政治学的角度看管理，管理根本不是德鲁克说的计划、组织、领导、控制。那个，很科学，但是小道耳。

    管理就是权力。

    组织权＜奖惩权＜专家权＜典范权。

    典范权中的人格魅力到了一定地步，你就是领袖。

    这就是管理的干货。'
