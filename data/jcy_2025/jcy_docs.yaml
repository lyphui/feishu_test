  文档内容正文: '新一代游资很多是抖音战士们，

    战士们很多在10月8日涨停板打板买进科技后，很快被接下来一周内剧烈的洗盘搞蒙了。

    让新手理解牛市多暴跌，忍受巨大的回撤有点难，以前根本就没考过，

    很多人在图1的地方割肉了，

    剩下的一部分，在图2接受连续一个礼拜的不涨，也这也前也不考，磨人行情怎么办。

    又有很多人在图2地方割肉了。

    结果今天机构发力，把8号的同学们彻底解放了。

    市场上最重要的，从来不是眼力，而是心力。

    正确的做法，是分批次分波段介入，y同学做的就不错。

    你成倍的放大自己，然后了解自己，克服自己，成就自己。

    别人上来教你什么抓龙头，搞代码，大王喜欢上来给大家讲逻辑，讲心力。

    建议指数，是让你不要上来就太深刻的面对自己，亲你拿捏不住的。

    相信很多同学都有一个感觉，

    能让你赚钱的一直让你赚钱，

    让你亏钱的票一直会让你亏钱。

    原因在哪?你在他们身上比较熟悉，能找到盘感。

    最后是个思考题，隔壁读书会听了会更深刻，

    1930年代，钢铁工业是高科技，英国人制裁老美的钢铁，决战产业是特种钢。

    股票大作手利弗莫尔观察伯利恒钢铁，用了6周时间，从35涨到95，一直按兵不动，

    然后98进去130卖出，

    现在又有人，恰好又要用6周时间涨到95，这个产业恰好是风口浪尖了，那人恰好是龙头，大家也熟悉。

    问题来了，

    它会突破100么?

    它会再来个100+30%式的利式上涨么?

    甚至，还有人和它一样么?

    ps：不是超级高手且有底仓的了解学习下即可，仅为学习不构成任何建议。'
