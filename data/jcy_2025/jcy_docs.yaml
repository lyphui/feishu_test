  文档内容正文: '5万亿美元及一些AI预期差

    第一，先看xys的业绩。

    第三季度净利润23.85亿元，

    高盛预计是28.5亿，净利润40%，环比+20%，很不及预期。

    如果按明年140亿利润，对应pe28倍，倒也不贵。

    其实你不能线性外推，走势可以参考胜宏。

    三季报不重要，亲们，

    况且他有个5万亿美金的爸爸，你选不选择原谅它？

    xys和胜宏，会不会成为“原谅双雄”，你俩谁会成为“原谅龙“？

    第二，

    xys不及预期的原因是什么？

    他们在昨晚9.30开了电话会，说海外大客户使用VMI（虚拟仓）模式，货先发到仓，只有客户真正提货那一刻，收入才能入账。

    客户没点确认，所以不能算收入。

    问题来了，给不给-6%左右的低开。

    我们由此延伸开去，如此大的光模块需求，上游光芯片的产能可能不够。

    光模块目前有两种，EML方案和硅光(CW)方案。

    EML经过英伟达认证的，100G的是博通，Coherent(高意),三菱住友,lumument、迈洛斯，可以做800G光模块。

    200G的仅有，博通，lumument，它们能做1.6t的，

    所以当时yoyo问，美股有什么公司可以看，大王回复是Lumument(LITE)和安费诺。

    这几天LITE一口气涨了快20%。

    老外很懒，真产能不够是大概率。

    旭创能起来，是它能拿到EML的产能，而且cw硅光的量起的比较快，硅光是未来的趋势，利润也高，

    光芯片国产替代的龙头是谁？源杰。

    源杰的CW和EML均已通过了旭创的认证，200G的在试图取代博通。

    它的估值高是有道理的，今年有望扭亏为盈，明年放量，且在美国开了工厂。

    源杰最近有点透支，31号发三季报，如果雷一下就好了。

    仕家光子要打通整个产业上游，CW不像源杰这么垂直，Eml芯片有望突破lument的100G方案，整体进度不如源杰快，什么时候经过验证尚不知道。

    这两天，就看资金要不要冲进去这两家博一下情绪，如果有，就说明这逻辑有人愿意看和等，如果没有，就等性价比时刻。

    国产替代拉长了看，只是时间问题。

    昨天有新闻再次验证了我们27号讲的又一层预期，英伟达N卡可能再进中国，这回是B30，最受益的是谁咱们也谈过了。

    他昨天利润也公布了，当然不及预期。你懂的。

    第三，美股盘后，谷歌出了财报，三季度非常炸裂，三季度营收1023亿美元，全年资本开支930，都是大超预期。

    谷歌链都懂吧，不知道自己搜。

    这里谈一个产业里的预期差，外面不熟悉，存储确实紧缺，但是能用到AI服务器的，江波龙之类都是炒作，长鑫也不行，

    国内的HBM谁突破了呢？远见智存，替代美光和三星，参与的是中天精装，中天是东阳国资和浙江国资转型AI的平台之一，投了不少半导体。

    包括FCBGA，HBM等等，但现在那些公司都还没盈利，所以中天的股价和走势完全是哈垃圾，可以先关注上，等筹码洗干和到了阶段再看。

    2023年成立的公司，它就给谷歌供货HBM，为啥有面子？它通过光模块龙1供的啊，你以为校花只干CPO吗，这就是业内极少数人才知道的真内幕了，大家不要外传。

    今日看点，大盘整体是不是又习惯性的高开低走，

    几十年了，机构们一直这样，没头脑和不高兴，泪目了。

    不及预期

    市场今天勉强原谅了胜宏，

    因为毕竟原谅过一次，

    胜宏现在是“原谅龙”。

    原谅这种事，有第一次就会有很多次。

    今天是再次尝试原谅xys。

    然而大家信心不足，大盘也不配合，

    一些资金准备收盘后原谅旭创。

    旭创不需要你原谅，

    它真不及预期才好了。

    市场的走势，完全是在博弈韩国见面，

    午后大家的认为是，

    不及预期，狂拉稀土，

    直接杀出了一波恐慌盘。

    真不知道有什么好怕的，

    白宫官媒说的很直接，

    “以前我们觉得G7改变世界，现在觉得要靠G2”。

    大局已经这样了，

    短时间进进退退重要吗？

    思想钢印啊，真不是一天能去除的。

    董事长以前对金融口的没好脸色，不是没理由的。

    你分量在这了，就得有自己的体面。

    如图，是懂王在空军一号上的专访，你看出利空了吗？

    旭创不需要你原谅

    2025年第三季度实现营业收入102.16亿元，同比增长56.83%；

    归属于上市公司股东的净利润31.37亿元，同比增长124.98%

    高盛预计中际旭创三季度净利润将实现113%的同比增长，净利润30个亿。

    这个数据超越预期，中报才39亿，三季度31亿，淡季赚了快半年的钱，

    现在总利润71.3亿，完成高盛、花旗、JPM三家机构最新一致预期102-110亿元没啥问题（原78-80亿元）。

    关键是，旭创账上还有100亿存货，这都是可以去卖钱的。

    龙1就是龙1，它和2，3的差距远不止一个身位。

    同样的还有源杰，第三季度营收为1.78亿元，同比增长207.31%；净利润为5962.89万元，同比扭亏为盈。

    以为他今年扭亏呢，三季度就扭了。

    硅光时代，看来源杰是绕不过了，LITE和高意的市盈率也很高，四五百倍，成长快啊。

    公司大了可能遇到瓶颈不要紧，一定要有第二增长曲线，

    宁王的第二曲线是机器人电池和固态，

    阳光的第二曲线是AiDC的配电业务，

    旭创的第二曲线，是把国内的液冷电源HBM卖给北美大厂，全面全球化做光产业。

