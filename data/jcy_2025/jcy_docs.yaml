  文档内容正文: '买预期卖现实

    美联储昨天如降息25个基点

    符合预期，没有惊喜，

    今天有没大聪明买预期卖现实？

    很可能有，方法大概率是冲高回落。

    降息的受益板块是什么？

    黄金，有色等，有些资金已经提前跑了。

    更直接更大的受益呢？

    是我们一直说的恒生科技。

    首先是港股是国际市场，美元来的方便，

    其次是HK这几年才是跌的更凶的，

    别说房产和股市了，连人口都流失不少，

    否则也不会那么多高才优才计划。

    所以修复是先住HK的市场。

    那今天如果冲高回落呢？

    在冰点或者尾盘时刻，

    恒科指数是那些没有上车或者错过的同学，又一个倒车接人的机会。

    但抄的方法不建议一把梭哈，之前有一篇《倒金字塔式买入法》，可以去搜索学习。

    那你说大A呢，又要走一轮映射路线，

    总体跟着恒生科技走，

    再过两个月呢回头看，很多人不一定跑得过这个指数。

    利弗莫尔和金字塔买入法（上午提到的）

    注：这是隔壁进阶课的升级版。

    这一轮，有些同学踏空了，有些人还没进场，很多人可能焦虑的是，怎么买？

    你可以明天就买，因为后天还有人进，新人要9号才能入场，明天的局势是“空中加油”，进去的位置，反正不舒服。

    你也可以等到暴跌再买，它不可能永远涨，熊市多长阳，牛市多暴跌。

    读书会里面有利弗莫尔的《股票大作手回忆录》，里面谈到他的买入法：

    第一，先买入20%总仓位，

    如果跌了，亏了，你买错了，下跌10%立即止损。

    此时，你只亏了总仓位的2%。

    2%你不肉疼吧？

    第二，假设买对了，也就是它在涨，

    上涨10%立即加仓20%，

    再上涨10%立即再加20%，

    最后一次直接加40%，将胜利成果扩大。

    第三，只要没有跌到-10%就持有，

    一旦跌10%立即将仓位全部卖出，如果你非常稳健和谨慎，可以选-8%卖出。

    然而，大A向来只有疯牛，很少慢牛，所以，首次买入20%还是30，40%，取决于你的心理素质和承受能力。

    新手入场，可以搞指数，如创业板ETF，科创50ETF或者行业类的芯片游戏etf等。

    然而，对于老手，亏损承受能力强的，要去搞股票的，喜欢去博一下，那么，

    有个方法，金字塔买入法。

    上来拿3-50%的资金买入，上涨10%时，再用30%的资金加仓，同类再干20%。

    当然还有倒金字塔式加仓，越跌越买，比如跌10%-20%，再买20-30%，再跌10%，再买10-20%，这个在下跌时期适用。

    最后倒金字塔的那个尖，要设定成关键支撑位，比如3xxx点。

    间隔比例多少，根据市场情况灵活把握。大部分都不会在一天内完成。

    利弗莫尔说，

    华尔街没有什么新鲜事。投机与山丘一样古老。无论今天股市发生什么，以前都发生过，以后还会发生。永远不要担心你买不着。

    “而我总是，

    在任何领域，交易领先的股票——表现出最强趋势的股票”。

    冲高回落

    太正常了，昨天40个亿压盘券商，就是国家队不想让涨太快。

    回落无所谓，该t的t，该抄的抄。

    我们要看到什么？

    主桌男方的崛起，

    -紫禁之巅线，延伸到Asic分支，寒王代表的Soc，到中芯，中微，飞测等代表的打铁的半导体设备。

    -华为线，华工，华丰科技等都创下新高，光迅，生益等都在走修复。

    -另外的机器人线，拓普，三花等核心t链都没受什么影响。

    当弱不弱则为强，

    后面看继续看它们就行了。

    恒生科技也给了-2%多的倒车机会。

    整体界定为假摔，不影响中期路线。

    机构的打法就是抱团，

    抱团的力量有多强，这是给大家讲过的游戏案例（不是购买建议啊，谁让那会300多你不看），抱到天荒地老，有些散户一手t都做不起。

