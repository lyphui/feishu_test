    两会期间的调整行情

    很多同学都可能焦虑，

    我们大概分析一下，

    本来就适值主线涨到高位，又遇到主力逢会要跌并跟美股走的思想钢印，

    1，纯蹭概念没实力和业绩的，会走A杀，能躲尽量躲，你比如乱蹭机器人和AI边角料的。会里刚刚打了东方集团，就是信号。

    2，市场依然会走高低切行情，科技线内部切到存储，半导体，科技线外部切到光伏设备，固态电池，大消费的宠物，商超白酒。

    3，对于操作选手来说，如果你拿的是主线，这几天会有修复行情，中小修复稳住，较大修复减仓，因为调整没这么快结束。

    4，还是要留有仓位，稳在4-7成，看个人情况，大涨敢卖，大跌敢买，行情不像你想的那么悲观，最近是会做T选手的良机。

    5，不会打野的不要乱打野，省的两头挨打，你等着就行，科技依然是主线，长期看上涨刚刚开始。

    6，可以看黄金坑机会，就是拥有英伟达显卡的算力中心和算力租赁。

    最近这段时间恰好布局。

    贴一段，昨天deepseek交流会的内容，

    “我想说deepseek短时间给各位领导解套了，至少不会完全空置算力，但是25年甚至26年来看，把大家带入了技术迭代的陷阱，因为deepseek加速了算力中心技术淘汰，2年淘汰一轮卡。

    先拿N卡来说，只有Ada和hopper架构的支持FP8, 下一版本FP4, 国产卡来说95%, 不支持FP8,如果大家认可deepseek给产业带来的机会，那么意味着认同deepseek的技术路线，Fp8和fp4是deepseek走的核心技术路线，

    但是与在座的各位的智算中心选型不一样，意味着大家建设的绝大多少智算中心不符合deepseek引领的大模型浪潮”。

    啥意思呢？我们之前好几天讲烂了的内容。

    普通的IDC不是AIDC，大模型越聪明，越需要英伟达的高端显卡，而且淘汰的速度非常快，如果你没有提前屯到N卡，你的算力租赁就是虚的。

    你有910C也行，910C产能严重不足。

    PMI已经回到枯荣线之上了，不慌。

    群里好好研究N系算力中心和租赁吧，之前我们也谈过几个。

