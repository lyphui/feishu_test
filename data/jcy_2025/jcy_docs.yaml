  文档内容正文: '会有反弹，后市判断

    市场一直需要一个放量下跌，

    有没关税战都一样。

    昨天的历史时刻，是宣泄了情绪恐慌，

    纯技术上看，调整到位且超过预期。

    因此，反弹就会到来。

    昨天那种大跌今天不会再出现，前期热门的板块和活跃的，会再有表现。

    甚至有的活蹦乱跳大涨特涨。

    但有个前提是，它们真有东西，昨天在不停自救，不是那种一早趴板上不动的。

    反弹不会一蹴而就，也不会一两天结束，更不会天天弹，所以这里会形成一个复杂的，锯齿状的底部结构。

    弹的时候，之前跌破5日平台不走，跌破箱体依然不走，依然心怀侥幸的同学们，

    仓位太重的，

    仍然是边打边撤降仓位的机会。

    因为弹完极大概率还要有一跌。

    原因在于，

    上述是微观的，我们还要看宏观的。

    懂王已经说，如果你不取消34%的加征，他要再加50%.

    按照我们这边的脾气，总要给你再反制回去。

    这就是神仙打架了，后面再加码会加到什么？

    相互禁运、检查货船、撤回机构、互不承认货币支付属性、扬言没收对方境内资产…

    直到航母对峙，

    手痒要操作且有技术的，最佳的方案是行业类ETF搞到快跌停的时候，冲进去捞1-2成仓，再趁隔日修复或者高开卖出(附案例问答)。

    一个大家都懂的道理是，县大队区小队，是基本不参与主力决战的，

    最多派精兵上去放两枪，截个辎重啥的，

    这就是轻仓的艺术。

    存人失地，人地皆存。

    ps，长线怎么看？依然坚决看好，

    连中国的年轻人都不想进厂拧螺丝，

    过惯好日子的美国人就更别想了。

    现在连华尔街日报之类以前反华的媒体都说对东大有利，反而是自己人吓的不能自理。

    有人又冲进火场吗

    上午很忙只好7点多就发了文，看了眼好像高开一度涨3个点。

    那就是减仓的机会，

    央行今早说，必要时向汇金公司提供再贷款，也就说，他现在觉得还没到必要时候。

    各路土司部队和绿营兵先消耗消耗敌人的主力再说。

    主力团都没下决心打，

    武工队去凑什么热闹，

    凑热闹你也轻仓去凑内需啊，或者ETF 尾盘捡尸。

    再说一下市场的节奏，

    1，本来就要跌，因关税由头大跌（已发生）

    2，反弹，形成复杂底部，有些人忍不住再进去了（进行中ing）

    3，再一轮，甚至更猛烈杀跌，把这些人也埋了。

    4，调整完毕，大涨。

    你得活到4啊。

    这段时间折腾，不已经大概知道谁是好公司了吗，

    有执念干嘛呢？

    东西大双方刚开始扇巴掌大赛，目前都处于认为对方会倒的阶段。

    主力团都没有出手，不是因为他们小气，而是因为要防守的战线太长，

    而且后面还可能有更猛烈的攻击，他们得那时候再上。

    尾盘有资金扫了科技

    这两个板块，都是游资活跃，而国队感觉量化不多的领域。

    还有深海科技，纯粹是游资被量化割完，量化被懂王击垮。

