  文档内容正文: "春季躁动地图\n从主线和支线展开。\n一、主线三个分支：光、电、有色\n（一）光\n算力领域主要是看光芯片、二线光模块和业绩/涨价领域。光芯片目前的头牌是永鼎，逻辑我们也都知道，光模块分EML和CW两种，源杰只是做CW光源，Lumument也只是做EML芯片，鼎子是啥都能做。易中天进入疲惫期，得剑桥之类的二线涨上去，它们才显得不贵。PCB本身目前承压，但材料环节有涨价需求，之前谈过再复习下：CCL对应生益科技，HLVP4对应铜冠/德福，石英布对应菲利华。2026年是算力硬件的利润凸显，2027年，材料的利润将会凸显。算力其他板块能否走强，依然看液冷气氛，液冷目前的风向就看英皇。\n\
    （二）电\n依然是北美缺电的逻辑，重点看SST固态变压器和储能。相关标的有金盘、伊戈尔、京泉华等，要说最稳健和市盈率低，那还是阳光。东方日升的太阳能板可搭载在太空展开，主打超薄HJT，也能搭上商业航天。国产算力今天是有催化的，字节采购华为的升腾芯片，直接最利好的是华丰科技（华为是其单一最大客户），后面还有华为光模块相关的华工等。至于是否当强不强，你懂的。\n\
    （三）有色\n机构的仓位是不够的，铜之类涨高了，还有哪些标的？之前讲过的钴（刚果金管控，盛屯矿业是代表）、锡（华锡有色，注意不要跌破34日线）、铝（神火、云铝），碳酸锂也是紧平衡状态。这三个板块，之前都有谈过，因为主力都有布局，因此是轮动模式，往往这个大涨后可以看另一个，另一个处于缩量和小平台模式（比如好几个十字星）的更好。主线目前的重要逻辑，是“量价齐升”。\n\
    二、三个重要支线：商业航天、机器人、消费\n（一）商业航天\n叠加春季躁动，跨年行情中弹性可能更大。但我们不需要去追上天的妖股，看SpaceX供应商系列中具有涨价能力的标的即可，这是机构喜欢的品种。国产供应商利润有限，还得看海外市场。相关标的：\n\
    1. 应流股份：在北美缺电板块讲过，主要做燃气轮机叶片，擅长高温材料，也为猛禽发动机提供核心铸件。\n2. 派克新材：既做可控核聚变的真空室，也为猎鹰9做箭体结构件，市盈率和乖离值都不夸张，上周五收上影线，周一、周二如果能洗两天，出现下影线更好。\n\
    3. 新雷能：谷歌二次电源+卫星电源，险些ST，明年利润扭亏，2026年PE不到20倍。\n4. 超捷股份：做高强度紧固件（可理解为卖螺丝），单箭价值量3000万以上，同时供应马斯克的猎鹰和中国的蓝箭，但目前乖离值太高（110），待调下来后再看。\n\
    5. ST思科瑞：带帽原因较特殊，2022年虚增营收约996万元、利润约700万元，虽是ST品种，但属于20cm标的，有1.47亿营收和800多万利润，没有退市风险，文昌是很好的发射基地（适合擅长打野的投资者关注）。\n\
    6. 中国卫星：机构和游资共同打造的头牌，乖离值目前70，可能要奔着100去。\n7. 上海瀚讯：机构偏爱的品种，拉长时间看有补涨可能性，上一个杯柄的位置是30块。\n\
    再次强调，今天不是追商业航天的时候，成交占比都快到市场20%了，而且美股不跟马斯克的SpaceX，可少量配置观察仓，等待今天、明天的分歧。该板块必然是有二浪、三浪的。\n\
    （二）机器人\n有宇树IPO的催化，长盛轴承出现了长短均线组相交的回踩买点结构。擅长打野的投资者，如果这两天随大盘有调整或者不错的低开，可以小仓位博弈一下，跌破77的双底是抛弃线。更稳定的还是特斯拉的三家Tier1：拓普、三花、浙江荣泰。三者均是回踩买点结构，拓普没量可放弃，荣泰和三花逢调整后可以伺机低吸，赚一票就走，当然也有可能赚不着，跌破34日线需及时止损。\n\
    （三）消费\n就看免税龙头中国中免，最为稳健，不跌不买，其弹性较大的标的可关注前期涨幅较大的品种。\n局面正发生变化\n \n勉强的九连阳，各家对春季躁动都有自己的理解。\n\
    \ \n一、商业航天：分歧阶段看核心逻辑\n \n到这个阶段，就得看谁有真东西了：\n \n1. 要么是真股东：蓝箭的股东有金风科技和鲁信创投，鲁信持股不到1%还连板，金风的主营业务本来就很厉害。既然当年的和而泰能靠摩尔线程的股东身份连续走强，金风再弱也该板几个吧。\n\
    2. 要么真有业绩：比如SpaceX链，今天应流急杀给了机会，派克也是资金流入；至于超捷，属于敢死队的龙头战法标的。\n \n二、机构主力：仍聚焦光、电、矿\n\
    \ \n核心逻辑就是有业绩、盘子大。你是否已经忘了主线领头的是光芯片和谷歌链？源杰证明它还是“校花”，剑桥之类的二线光模块涨了之后，其他“校花们”就显得不贵了，这一点之前反复说过。\n\
    \ \n谷歌OCS相关标的，普遍已经快到34日线了，这个位置缩量再收些十字星盘整一阵，又会迎来机会。\n \n国产芯片方面，摩尔和沐曦的估值对比下来，显得寒王更便宜了，这个道理讲过很多回。之前有同学嫌大同不够涨，但没看到它也不跌啊，这还不好么？况且技术上呈现长短均线组的紧密粘合状态。\n\
    \ \n记得当时谈摩尔等人时，我们说过：这个世界上要赚钱，该喝的酒、该吃的饭、该唱的歌一个都少不了，寒王明显多陪领导吃过五年饭。要进步，该走的路一步都少不了，认知和能力提高积累之后，更多的财富就会显化出来。各位加油，同学们每天在群里积德行善也算是一种积累。\n\
    \ \n至于其他“校花们”，今晚看英伟达的反馈。\n易经第35卦晋（上下）：职场升值教科书\n \n上一卦是“雷天大壮”，既然已经学成出师，体格壮实，又顺势而为，那么就应该往上走了。往上走，就是“晋”。\n\
    \ \n晋：康侯用锡马蕃庶，昼日三接。\n象曰：明出地上，晋。君子以自昭明德。\n \n康侯是周王的弟弟，他采用多种手段使庶民的车马增多、生活繁荣，一天之内多次被周王接见。这就是一颗新星和红人冉冉升起啊。这个卦的意象，上卦为离，离为日；下卦为坤，坤为地。“太阳照大地，万物沐光辉”，君子看到这种景象，知道自己应该光明磊落，趁势而行。\n\
    \ \n晋升大家都喜欢，问题是怎么操作呢？\n \n初六：晋如，摧如，贞吉。罔孚，裕，无咎。\n \n象曰：晋如摧如，独行正也。裕无咎，未受命也。\n \n\
    人想要往上走的时候（晋如），总是会遇到阻力，被人打压或排挤（摧如），这时候你很委屈，别人也不信任你（罔孚）。咋办呢？要像大地一样宽厚，不要去争辩，不要去硬碰硬，保持心态平和，做好自己的本分。因为你有的是充裕的时间，才能还未能被大家广泛承认，这就是“未受命”。\n\
    \ \n职场和生活中，收获都是水到渠成的，甚至是无心插柳柳成荫的。你越是想强求什么，越是得不到什么。如果全单位的人都知道你急切想上个正科、副处之类的职位，你估计好多年都上不去。《人民的名义》里，祁同伟所有的问题就一句话：“老师我太想进步了”。太想，就是太急。祁厅输在了心态上。\n\
    \ \n沙瑞金这个外来户血拼地头蛇汉大帮，最不应该急的反而是祁厅这个公安厅长。他是缉毒英雄出身，有免死金牌，还掌握强力部门，谁赢了不都得用他？\n \n六二：晋如，愁如，贞吉。受兹介福，于其王母。\n\
    \ \n象曰：受之介福，以中正也。\n \n晋升的过程，就是解决愁苦和问题的过程，你会受到高层领导（比如王母）的祝福和赏识。你做的事情是堂堂正正的，领导提拔你也是堂堂正正的。\n\
    \ \n很多人总觉得，溜须拍马、送礼就能上去，可哪个有水平的领导会给你重任？最多给你个无关紧要的副职。一方诸侯、中层正职、核心高管之类的职位，都是给有本事的人准备的。管理者是用来解决问题的，上面真的缺你那三瓜俩枣吗？\n\
    \ \n大王曾有个朋友，当了好多年副行长都没上去，总觉得自己是不会卡位、没有跑关系送礼。大王告诉他，你要看看你们总行、分行头疼什么？他说是普惠金融和小微业务，这苦活累活没人干。那你干不就行了？后来他从最擅长搞小微业务的泰隆挖了几个人，跑到各种批发市场和五金城放贷，晒得黝黑，第二年就升职了。\n\
    \ \n六三：众允，悔亡。\n \n象曰：众允之志，上行也。\n \n得到大众的认可，悔恨就会消失。大家都支持你，你还会上不去吗？要晋升，不光上面要有贵人支持，还得有下面的群众基础，这样路才走得稳。\n\
    \ \n现在的很多晋升都要公示、搞民主评议、分别谈话，就是看底下人的意见。组织是一个整体，领导层看人都会综合考虑，尤其看重民意。更关键的是，组织需要你做事，你得在内部拢得住手底下的人和同事，在外部让客户和服务对象没有大意见，这才说明你既有智商，又有情商。\n\
    \ \n我们都知道“南京彭宇案”，那句“不是你撞的，干嘛去扶”，搞得社会风气一度倒退，没人敢扶老太太了。当时的法官是王浩，那时他31岁，南大法硕毕业刚四年，是鼓楼法院最年轻的审判员，院里正把他当后备副庭长培养。但他这一判，引发了汹汹众怒，照片、住址、车牌被网友扒了个底朝天，有人给他寄冥币，往他家门口泼红漆。后来他从法院调到了街道司法所，变成了事业编，连续18年多次考试面试，哪怕笔试第一，都未能再回到体制内。\n\
    \ \n群众基础太差啊，哪个领导愿意冒舆情风险提拔他？其实这也侧面反映了王浩根本不会做人，当时这种问题，随口问两个老法官，人家给指点一下，他也不会害人害己。\n\
    \ \n九四：晋如鼫鼠，贞厉。\n \n象曰：鼫鼠贞厉，位不当也。\n \n鼫鼠是一种传说中的大老鼠，它会飞、会跑、会游、会挖洞、会爬树，但每一样都只懂皮毛，没有一样精通。如果你像鼫鼠一样能力不足，那么即使坚守正道也会有风险。\n\
    \ \n自己得知道自己是吃哪碗饭的，德不配位，最后吃亏的是自己，要么背锅，要么沦为牺牲品。古代的很多隐士，皇帝请他出山做宰相为什么不做？因为自己缺乏班底和政治势力，出去在朝堂的尔虞我诈中肯定会被玩死。\n\
    \ \n所以各位，如果你已经是高管了，轻易不要跳槽，要跳就带着团队人马去。\n \n六五：悔亡，失得勿恤，往吉，无不利。\n \n象曰：失得勿恤，往有庆也。\n\
    \ \n悔恨消失，不必计较一时得失，大胆前行就会有喜庆。如果情商、智商都具备，也被提拔上去了，你当领导最重要的是什么？是能容人、能容物。\n \n不要纠结于眼前的蝇头小利，不要纠结于一城一地的得失，要敢于放权，敢于用人，敢于承担风险。很多普通人做了管理者之后，最大的问题就是心态扭转不过来，不会“转身”，还是当下属和普通人的思维，缺乏“高位者认知”。\n\
    \ \n你已经从一个具体做事的人，变成了定调的人、裁判的人、分蛋糕的人、担责的人。方向对了，重要节点抓对了，就不要过于在乎细节、硬抠毛病，把所有人捆得死死的。中国的很多企业，老板搞得像幼儿园看孩子一样，恨不得一分一秒都让员工替自己干活，这是不会当领导。\n\
    \ \n上九：晋其角，维用伐邑，厉吉无咎，贞吝。\n \n象曰：维用伐邑，道未光也。\n \n晋升到了极点，宛如高居兽角尖端，宜于征伐外部的邑国以建功，你的光芒还未普照到他们呢。这个路径虽有危险，但可获吉祥，不致招致咎害，要守持正固，预防遗憾。\n\
    \ \n内部的潜力挖完了就要干什么？就要去外头寻找增量，去扩张，去开发更大的生存空间。我们的很多企业，就喜欢内卷，互相打价格战，而不敢去外卷，这与我们民族的精神和血脉是不符合的。\n\
    \ \n你看中国的版图，尧舜禹时期在山西的黄河拐弯处，周代拿下了中原、山东，秦代修了灵渠、拿下两广，汉代拿下云贵、越南，唐代拿下辽东、西域，清朝改土归流拿下新疆、川藏，一路全是扩张。\n\
    \ \n在舒适区的时候，在感觉快油腻的时候，一定要积极拓展第二增长曲线，百尺竿头更进一步，还有很多人、很多地区没有享受到你荣光的照耀呢。\n \n这里开个玩笑，有个朋友当时在一个国有集团公司负责金融板块，新来接手的总经理是从体制里调来的，以前混科室的，收缩的意愿很强烈，而董事长再过两年就要退了，他过来问该怎么办？当时给他看了一卦，正是这个爻。建议是“维用伐邑”，抓紧铺摊子、扩张业务，把以前慢悠悠的事情加快进度。\n\
    \ \n后来他果然又发起了两个私募，自己负责的板块还引进了一个民企上市公司的战略投资人，搞了几个众创空间，又是招人又是增资，搞得很红火。两年多后，董事长退二线，总经理接任一把手，开始全面收缩，其他条线和二级公司的负责人都被收回总部大楼上班，成了“小媳妇”，被衙门文化搞得苦不堪言。而这个朋友，因为摊子太大、事情太多，外面还得考虑影响，别人根本接手不了，于是继续当他的总经理。\n\
    \ \n当然，那时候提前一再叮嘱他要“贞吝”，各项措施都要抓铁有痕、踏石留印，合规合法问题要做得很硬。集团和国资委过来审计了两次，都圆满过关。现在这朋友的“一方诸侯”当得扎扎实实，反而还具有了“统战价值”。\n\
    \ \n到最后，总要有自己的影响力和基本盘，而这一切都建立在你的公正光明和大局为重之上。\n \n总之，这一卦告诉我们，晋升的时候不要着急，要步步为营，不要纠结一城一地的得失，不要把个人私利看得太重。趋势来的时候，一切都是挡不住的。\n\
    \ \n从玄学角度说，如果“雷天大壮”利好的是电力和航天，那么“火地晋”就利好科技、传媒，甚至地产。玄学寓意，有没有神火股份、东方日升？（最后一句仅供一笑哈）"
