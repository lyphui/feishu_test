    寒王业绩分析

    实现营业收入11.11亿元，同比增长4230.22%；归属于上市公司股东的净利润为3.55亿元，上年同期为亏损2.27亿元，实现扭亏为盈。

    42倍增长啊。

    业绩实属炸裂又能赚钱，那么，市面上说它不值一文的观点不攻自破。

    我们再看财报，应收款大幅增长，对应四二季度大量的现金流，这部分转化为收入的估计5亿以上，存货创历史新高的27.6亿，仅这些货值，  Q2 的营收预期就是30亿级别。

    预付款9.73亿，这是给给晶圆厂的定金，通常，预付是20-30%左右，那么，这又会转化为合计3-4倍的营收。

    又是3-40亿。

    如果运气好，今年的营收突破100亿。

    OpenAI现在不赚钱，按今年年底算，

    23倍市销率，

    寒王开始盈利，现在市值28倍ps似乎也不突兀了。

    之前我们还讲过他的产业逻辑，不光是算力芯片，还有汽车，子公司行歌科技7mm的L4级自动驾驶芯片Q3流片，2026年量产，这是第二增长曲线。

    如果加上良率提升，2026年300亿营收80亿利润是可期的。

    折合现在的市值，“仅”30多倍市盈率。

    对比下海光，大家认为不怎么泡沫，

    2024年，19亿净利润，3000亿市值。

    现在寒王2800亿市值。

    这个19亿的业绩，快的话寒王4季度就能达到。

    不构成建议啊，股价爆发性增长的机会过去了，业绩爆发性增长期，只是没有那么刺激了。

    之前他大跌那天，所有人看空的时候，我们有《寒王不会死》。'
