  文档内容正文: '看谁更硬朗

    昨天的大跌几乎是必然的，

    TMT的占比达到40%，必然震荡加剧，

    上周专门发过《贯穿牛市的整个格局》，

    科技绑架了指数，一跌就会稀里哗啦。

    跌了以后的格局呢？谈三点，

    一是高位内部切换。

    绝对高位内部，自己也是有低位的，会进行高低切。

    机器人创新药不赘述了吧，

    机器人就看特斯拉链的，前几天位置舒服，今天就不合适了你得等，

    机器人etf说长期能看保持不变，

    创新药的几个依然看好，两个etf都不错。

    今天看寒王代表的国产芯片的修复。

    二是科技内部缩圈。

    昨天你发现什么，质地更好的公司，跌的少，跟着补涨的和后排的杂毛，跌的多。

    比如，光模块就跌的少，交换机就跌的多，因为门槛和技术含量不一样。

    海外算力里头，

    旭创就跌的少，剑桥就跌的多。

    旭创50倍pe跌的少，天孚86倍多跌一倍。

    华为线里头，

    华工就跌的少，光迅就跌的多。

    华工40倍pe，光迅70倍，当然不一样。

    所以后面的科技，肯定要修复，但修复后你要知道，缩圈了。

    要看核心的，要看龙头的，要看有技术的，要看PE合理的，要看更扛跌的。

    科技的每一个题材最多看1-2个龙1龙2,

    当然也不是说跌停的都是垃圾，

    而是那些杂毛，后排，涨的慢的，涨的晚的，硬拉关系概念的，该扔了。

    尤其是，那些小盘，微盘，市值太小，行业没有统治力，或者技术不突出的，推沟里。

    你有没发现，那些杂毛，往往涨的时候涨的慢，跌时候少不了。

    如果你都不知道自己手里拿的品种，核心和龙头是谁，你就不适合炒股，适合etf.

    就像你在班上学习，你不知道学习委员和班长是谁，岂不尴尬。

    精兵简政是为了更好前进拉涨，现在的科技还不疯狂，科技还是主线，不用怀疑。

    那些从科技杂毛中流出来的资金去哪？

    去了核心，部分切去副桌，

