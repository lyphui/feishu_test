    八旗兵打仗的时候一般自己先不上，倾向于先发挥绿营兵的主观能动性，然后他们再冲进来奠定胜局。

    只要有有生力量近来就是好的，继续看反弹，看试图构筑五日平台的科技。

    到今天已经2天，它们的特点应该包括：

    1.昨天不是跌停板，或者板上曾经积极自救，

    2.今天红盘开局，或者收盘跌幅2%以内。

    3.有收出长下影线者最佳。

    这代表其中的主力试图稳住阵脚。

    一个票里面最大的主力，其实不是游资也不是量化，

