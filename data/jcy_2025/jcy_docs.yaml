    宗馥莉终究辜负了一片苦心

    HK法院的判决里透露了几个关键信息，

    a，宗庆后给3个子女各留7亿美元信托是真实意愿，

    b，宗馥莉明知此事，和宗庆后签署了协议，后面还和3兄妹续签，明确会继续把18亿美元充值到21亿。

    c，大小姐后来“对他们几个充满敌意”，不但关停了杜建英系的一些工厂，而且从信托中转走了钱。

    -你说宗庆后真缺3亿美元把信托充满吗？一人留6亿，完全成立好行不行，当然行。

    -你说宗庆后难道不知道宗馥莉对他充满意见吗？当然知道，人的直觉太灵了。

    -你说宗庆后难道不明白小宗一上台，会立刻对娃哈哈大刀阔斧，对元老派开刀整顿吗？当然知道。

    宗庆后是在几十年中商海中杀出来的，小宗那点想法怎么瞒得住他？

    之所以故意在信托的事情上留个“活扣”，其实是留给宗馥莉最后的遗产和筹码，

    1，杜建英是留给小宗的“外戚”和暗棋。

    小宗要对元老派搞腥风血雨，所有人只会看笑话和利益，但杜建英不会，

    一是几十年的感情在，对娃哈哈对老宗，她都有很深感情。

    二是21亿信托没有充满，她不能让宗馥莉倒。

    最关键的是，杜建英当过财务总监，熟悉公司情况，有经销商资源，又有一票人马和工厂，几个孩子也在娃哈哈实习过，关键时刻，是能拉出来打仗的。

    杜建英系，是制衡元老派的兜底筹码，

    21亿信托，是宗馥莉制衡杜建英的武器。

    把3亿美元充满，最多3-5年时间，那时候，宗馥莉基本摆平局面顺利接班了。

    宗庆后走时，很可能也对杜建英”托孤”了，否则，她不会在宗馥莉清洗她工厂股权的时候无动于衷。

    2,信托计划是对淬炼继承者的“试金石”。

    外界批评宗馥莉很独，不讲感情，绝不是无中生有，老爸又岂能不知？

    但做零售的，就是要跟方方面面打交道，

    宗庆后故意留下信托缺口，实为考验女儿协调复杂关系的能力，培养女儿胸怀与权谋的最后一课。

    而3个异母弟妹，是多好的试金石。

    大家长的位置交了，信托的权限给了，怕宗馥莉口头答应反悔，临终前专门加道保险，签署了《委托协议》。

    老宗总觉得，毕竟血浓于水，不至于闹到撕破脸皮吧？

    当时我们曾经讲过，宗小姐真要有格局，完全可以请杜建英当顾问，几个兄弟姐妹来当副手，一起来推动娃哈哈的规范化，国际化，把事业做的更大，

    这才是“人主之资”。

    然而她做了什么，迷恋大小姐光环，沉迷复仇叙事，搞的老爸清名毁于一旦，托孤大臣反目成仇，治理结构生死存亡。

    其他的经销商，关键人物会怎么想？

    -宗馥莉连血缘弟妹都容不了，还能容我们吗？

    -宗馥莉连签了协议的18亿都敢违约，还有什么不敢说了不算？

    宗馥莉如此不懂人情世故和道理，真的敢替他做事，为她出力，帮她打招呼吗？

    -宗馥莉连血缘弟妹都容不了，还能容我们吗？

    -宗馥莉连签了协议的18亿都敢违约，还有什么不敢说了不算？

    -宗馥莉如此不懂人情世故和道理，真的敢替他做事，为她出力，帮她打招呼吗？

    这才是对娃哈哈最大，最致命的冲击。

    这家企业，两代负责人的信用完了，没人敢真信你了。

    宗馥莉这件事我们看出了什么，

    一个领导者，对下一任，最后的一课和期待，

    一个老父亲对女儿最后的，无言的，絮叨的爱，

    一个老皇帝对新家长，各种苦心孤诣，费尽心思的安排，

    结果呢？各种自以为是，自毁长城的事，我们见得太多太多了。

    各位，不要觉得学了点管理知识，懂了点规章制度，你就会管理了，

    认知世界的规律，拥有自己基本盘，趁着历史的大趋势，以慈悲之心，配合时间的力量徐徐图之，你才能终将改变世界。

