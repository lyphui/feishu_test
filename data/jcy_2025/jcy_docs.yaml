    基本盘和管理班底

    今天来谈个底层规则系列的。

    前几天同学问关于”权力”的问题，今天也有人新做了领导不知怎么下手，

    很多同学都是管理岗位，以后迟早要当很大领导，或者将来可以高薪跳槽去新的平台。

    你要考虑一个问题，你为什么说话不好使？你的队伍为何执行力不强？

    你如何拿到最大利益？

    书上告诉你是什么制度建设，什么规章，培训，激励，谈判技巧。

    不是的。

    一，本质上，你要有自己的政治班底和基本盘。

    陈胜吴广起义为什么失败了，他们没有自己的基本盘和干部班底。

    陈胜派武臣去进攻河北，武臣自己当了赵王，派周市去进攻河南，他自己私自立了一个魏王。

    陈胜狂怒，但没有办法，关键时刻没人救，自己也被车夫杀了。

    刘邦项羽为什么成了，刘邦有沛县子弟，什么萧何，樊哙，项羽有8000子弟兵。

