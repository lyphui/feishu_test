  文档内容正文: '周五揭晓

    昨天盘后说再调查英伟达，都是马德里谈判，博弈手段出牌而已，英伟达几乎没调整，周五两边董事长将通电话，预期应该会乐观。

    关注两个变化，

    一个是谷歌新高，美股的AI将由谷歌带一阵子，谷歌走的是ASIC路线，国内代表就寒王它们，谷歌的供应商，PCB是沪电，光模块是旭创，光纤是长飞。

    这里不建议新手和没底仓的去追，20日线观察再说。

    一个是谈好后，美联储降息，然后打开我们的降息和消费刺激空间，之前讲过，消费刺激，先看旅游，再是汽车家电，然后才是酒。

