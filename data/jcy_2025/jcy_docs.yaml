    科技板块的下一阶段推理

    科技今天会碰到分歧，

    分歧的意思是，昨天拉的太猛，又没有主线，大家要观望一下。

    1.先涨的是PCB，  虽没太多技术含量主要产能在中国，资金先炒他没毛病。

    PCB当然没走完，拉太猛要分歧下再继续向上。

    2.PCB 继续，同时会打开其他板块的空间，

    目前是光模块和电源/液冷。

    光模块已进化到1.6T阶段，就中际旭创能干，专供英伟达，且不准卖给华为。

    其他是新易盛和天孚，太辰光等。

    华为系的光模块是华工正源，母公司是华工科技，国内400G的就够用。

    3.算力目前的改善目标是，降低功耗和提高速率，突破方向是高密光纤连接器，易中天当然是总成，天孚略领先，里头带点卖铲概念的是，博创科技和致尚科技。光模块升级成光引擎。这个概念叫做MPO.

    4.目前的预期差是，deepseek的R2据说已经出来，在日本媒体做了报道，有人说是谣言，但英文原件是有的，

    突破提升很多，成本更低，加入图文声像处理系统。

    那么利好的是AI数据和Ai应用，应用那么多，有两个应该绕不过，  一个是有图片产权的视觉中国，  一个是搞声音处理的海天瑞声，其他的同学们自己发掘，侧重是卖内容数据给DS.

    Ds这个更深，毕竟很多人还不知道。

    5，创新药是机构打造的行情，现在只是调整，当然是没有走完的，它是一个缩小版的机器人行情，就想想机器人当年涨了多久吧。

    6，最简单方式，还是看港股映射，盯好方向标，做自己熟悉股性的。

