    重要：整个牛市中长短期的格局分析

    昨天包括寒王，东芯等好几个公司都进行核查，这是一个风向。

    大家都怕太高了出问题。

    那么今天，就会出现几种情况，

    第一是，科技板块在大幅低开后上涨，或者直接涨，或者跳水后再涨上去。

    那么，科技的主线依然要往上，

    那就会继续发生08年、15年、21年的事情，主线板块持续从其他领域抽血。

    这几天的苗头非常明显，易中天寒王之类疯狂涨，其他的是结构熊。

    第二个可能是，科技跳水后出现了切换。

    高低切会切到哪里？我们之前讲的绝对低位板块。

    其他板块是接不住这么大资金的。

    即大消费和反内卷。

    大消费的核心是白酒，因为体量大，我们看好的是东鹏代表的提神饮料，水羊等代表的医美，以及宠物食品等。

    反内卷是谁？有色（有色直接受益于美联储降息），化工（比如一些大白马），光伏（硅料，玻璃，设备等），电池，以及猪，等。

    等到绝对低位也全部高了，它们涨完，牛市就结束了。

    第三个可能是，绝对高位的，科技跳水或者下跌后，绝对低位的板块也跟着跌，拒绝进行高低切。

    那么大家就会一起跌的稀里哗啦，低位比高位跌的更惨。

    于是发生牛市多暴跌，主力重新入场进行下一轮。

    如果跌的太狠太冷，国队就会进场稳住指数，灾后重建。

    具体出现哪一种？不知道，

    如果按照（1），越涨高位越从低位吸血，累积的“获利盘出逃”的风险就越大，迟早发生（3）。

    今天，有可能出现（3），但考虑到93要素等，盘中进行各种调整，整体稳住局面的概率更大。

    93后就不知道了，（3）迟早要来，想都不要想，避免不了的，就像感情越深的情侣，越是会吵架，甚至撕了结婚证。

    好了，大盘分析完了，对我们有什么启发？

    1，你要看到目前的科技板块，尤其是海外算力和国产芯片板块，就是主线，这几天主力并没有砸盘的意思，尤其是两融和外资还在买买买。

    因此，主线板块猛烈杀跌后，会进行，“调整，巩固，充实，提高”的下一轮，继续涨的更高，

    让当时割肉的人再度追进去，这就是散户亏钱的主要原因。

    真到那时，反而是没有上车人的机会，所以你急什么，谁都能等到自己牛市暴跌。

    2，大王之前把宴会分成了，抱团板块和配置板块，仓位你自己安排，

    你要看到配置板块，是迟早能起来的，但因为他们有瑕疵，所以走的不流畅，资金流入的方式是一轮轮的震荡。

    3，问题来了，大聪明们如何能把握暴跌和拉起的节点，甚至趋涨避跌做T，

    看什么? A50不管用，融券也不管用。

    答案是可转债，转债是T+0的，弹性更大。

    软件里专门有，转债指数。

    大盘未涨转债先涨，大盘未跌转债未跌，你盘中看它就行。

    地图，思路，操作，已经非常清楚了吧？

    如果你说看不懂整不明白，那说明还要学习修炼，更适合指数ETF。

    当然，整体上不用过于担心，生产队会尽量控盘，要慢牛，风格不至于非常激烈。

    最后，考虑到今天是七夕，又是周五，国队很可能要稳一下，雨露均沾。

    因此，就今天和这几天的情况来看，抱团没那么快瓦解，但可能形成“挤出效应”，

    即：在科技板块内部进行高低切。

    比如，国产芯片转到给芯片打铁的半导体设备，华为等。

    海外算力从光模块切到后排的二线及连接器等后排那一串，服务器，AIDC等，

    尤其是叠加目前的消费电子强势，AI端侧的模组芯片等，大家都很熟悉他们，比如瑞王，博通，恒玄，移远、乐鑫，以及MCU的那两家。

