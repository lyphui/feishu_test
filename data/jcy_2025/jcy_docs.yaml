    好端端的机构抱牛

    碰到大盘调整，H20的后门问题，两边谈判的结果不是非常理想，关键是PMI又跌了，打断反弹势头进行调整。

    但我们看到什么，

    1，海外算力链依然在抱团，

    pcb，光模块的后排零部件等，依然可以补涨，碰调整并未深跳，

    但此时，如果没有筹码再搞他们，就不划算了。

    有资金切到了算力链的低位，液冷电源开始表现了，英维克，麦格米特，高澜，川环，欧陆通，科泰等，老朋友了。

    目前看，液冷比电源强。

    GB200和300全液冷，也符合产业趋势。

    要看海外算力链，可以在调整后看看液冷电源了，pcb崩掉之后它俩会不会单独走行情，要观察，如果行，那就可以走一段。

    3，铜链接有些分化，鼎通历史新高，瑞可达补涨，其余几个有调整，但我们认为还没走完。

    4.国产半导体依然集中在算力芯片，东芯要翻倍的架势，当时世界算力大会就主要看个它的图能看，没上车的只能目送。

    海外算力要往国产算力切，如果硬这么看，寒王就属于低位，有点冷笑话。

    5.今天异军突起的是AI应用，其实一直在涨，但因缺乏龙头没有过多关注，拓尔思，万兴科技，蓝标的图能看，但也不用上头。

    6.军工依然曲折向上，菲菲图形没有走坏，不会看图的那就属无缘，无人机继续看好。

    这是上证的第一次中大阴线，如无意外，明天要来个修复。

    八月，在高低切中迎接新王诞生。

    市场就是个机构抱团牛，我们就看谁在抱团，然后跟上。

